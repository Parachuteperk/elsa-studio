Quote reviews exactly as written, use first name and platform only, ask permission first, and recheck the counts on posting day.\n\n---\n\n## ★7 · Fri Nov 13, 12:00 pm · Facebook only · Long-form Facebook post\n\n**Goal:** Facebook skews older (a common pattern, not checked for her page), so this one speaks to mothers of the bride and anyone who wants the whole booking process in one place.\n\n**Caption:**\n> **Mother of the bride? Here's how booking bridal hair and makeup works.**\n>\n> If your daughter just got engaged, here's everything in one place:\n>\n> 1. **Send an inquiry** with the wedding date, the getting-ready location, the time everyone needs to be ready, and roughly how many people want makeup and hair. We reply within 24–48 hours.\n> 2. **Get your quote.** Bridal packages are $1,125 (Radiant), $1,365 (Timeless) and $1,685 (Royal), and each includes a trial. Bridal party makeup and hair is $280 per person, or $140 for makeup or hair only. Travel is $100 per artist.\n> 3. **Hold the date** with a signed contract and a 50% non-refundable deposit.\n> 4. **Final headcount** is due 8 weeks before the wedding, and the balance is due 30 days before.\n> 5. **On the morning,** we come to you: home, hotel, or venue.\n>\n> Rated 5.0 on Google and The Knot, and The Knot's Best of Weddings in 2024.\n>\n> Send us a message or visit makeupandhairbyelsa.com/contact to check the date.\n\n**Hashtags:** #DFWWedding #MotherOfTheBride #DallasWedding\n**Visual:** [PHOTO: real bride with her mother getting ready, both have given permission]\n**CTA:** Message the page, or the contact link\n**Confirm first:** whether mothers are priced as attendants ($280). The site only says \"Attendants / pre-wedding glam.\"\n\n---\n\n## ★8 · Fri Nov 13, 7:00 pm · Instagram + Facebook · Package carousel (offer/CTA)\n\n**Goal:** Get bookable inquiries using real, published prices. No discounts.\n\n| Slide | Text |\n|---|---|\n| 1 | \"Radiant. Timeless. Royal. Your bridal beauty, planned.\" |\n| 2 | \"**Radiant · $1,125** · Bridal trial · Mini facial and massage · Wedding-day makeup and hair · Body glow · 1-hour touch-up · Luxury bridal kit\" |\n| 3 | \"**Timeless · $1,365** · Everything in Radiant · Plus engagement-session makeup and hair · The package most brides choose\" |\n| 4 | \"**Royal · $1,685** · Everything in Timeless · 2-hour touch-up · A second look after the ceremony\" |\n| 5 | \"Bridal party: $280 per person (makeup + hair). Travel: $100 per artist.\" |\n| 6 | \"To book: inquire → contract → 50% deposit holds your date.\" |\n| 7 | \"Check your 2027 date. Link in bio.\" |\n\n**Caption:**\n> Three packages, one goal: you, at your most beautiful, still completely yourself.\n>\n> Radiant ($1,125) covers your trial and wedding day, with a mini facial, body glow, a 1-hour touch-up and a luxury bridal kit.\n> Timeless ($1,365) adds makeup and hair for your engagement session. It's the package most of my brides choose.\n> Royal ($1,685) adds a 2-hour touch-up and a second look after the ceremony.\n>\n> Travel is $100 per artist. Bridal party services are $280 per person.\n>\n> Tap the link in my bio to check your date.\n\n**Hashtags:** #BridalPackages #DFWBride #DallasBride #2027Bride #DallasMakeupArtist #BridalHairAndMakeup #MakeupAndHairByElsa\n**Visual:** Each package slide gets one real look photo: [PHOTO: Radiant bride], [PHOTO: engagement-session look], [PHOTO: ceremony look + second look].\n**CTA:** Link in bio → /contact/\n**Left out on purpose:** the $175 fee to request Elsa personally, until she decides whether to keep it. Before posting, fix the \"$530 starting price\" on The Knot and WeddingWire, so brides don't see two different starting prices.\n\n---\n\n## ★9 · Sat Nov 14, 10:00 am · TikTok · Native talking-to-camera video\n\n**Goal:** Test TikTok with a quick, low-production video that sounds like Elsa talking.\n\n**Shot list:** [VIDEO: Elsa talking to her phone in natural light, about 20 seconds, one take]\n\n| Time | Elsa says | On-screen text |\n|---|---|---|\n| 0–2 s | \"Three things to tell your makeup artist before your wedding.\" | \"3 things to tell your makeup artist\" |\n| 2–8 s | \"Your ready-by time. Everything is planned backward from it.\" | \"1. Your ready-by time\" |\n| 8–14 s | \"Where you're getting ready: the light, the parking, the space.\" | \"2. Your getting-ready location\" |\n| 14–20 s | \"How many people want makeup and hair, even a rough guess.\" | \"3. How many people\" |\n| 20–22 s | \"That's how your morning stays on time.\" | \"DFW bridal hair and makeup · Booking 2027\" |\n\n**Caption:** \"Your wedding morning runs on these three answers. DFW bridal hair and makeup, now booking 2027.\"\n**Hashtags:** #WeddingTok #BrideTok #DFWBride #WeddingPlanningTips #BridalMakeup\n**CTA:** Website link in profile [CONFIRM it's active]\n\nThese three points are questions her own contact form already asks, so the tip is grounded in how she actually works.\n\n---\n\n## ★10 · Sat Nov 14 · Instagram Stories · Behind-the-scenes sequence\n\n**Goal:** Show the work the client doesn't usually see. If Elsa has a wedding that day, post this after the event, never while it's happening. If not, film packing her kit.\n\n| Frame | Visual | On-screen text |\n|---|---|---|\n| 1 | [VIDEO: kit open, brushes laid out] | \"Packing for a wedding morning.\" |\n| 2 | [VIDEO: cleaning brushes] | \"Every brush cleaned, every time.\" |\n| 3 | [PHOTO: touch-up kit for the bride] | \"Every bride goes home with a touch-up kit.\" |\n| 4 | [VIDEO: loading the car] | \"Then we come to you.\" |\n| 5 | [PHOTO: finished look, permission on file] | \"Worth every early alarm.\" |\n| 6 | [PHOTO: Elsa teaching] + link sticker | \"Holiday gift idea: a Self Makeup Masterclass. $250 · 4 hours · one-on-one, at your home.\" |\n\n**CTA:** Frame 6 link sticker → /makeup-and-hair-classes/\n**Rules:** No client addresses, venue name while the event is happening, or faces without permission. Save frames 1–4 to a \"Behind the Scenes\" highlight, or to \"Start Here.\"\n\n---\n\n## 11 · Sun Nov 15, 4:00 pm · Instagram Collab post + Facebook · Vendor collab\n\n**Goal:** Feature a real wedding together with a vendor who was there, so the post appears on both accounts.\n\n**Setup:** Use a real wedding with real vendor credits, such as [WEDDING: the April 18 spring wedding]. Send an Instagram Collab invite to [PHOTOGRAPHER @HANDLE]. If [VENUE] isn't a co-author, tag it in the photos. One Preston Events, from the open house, is another candidate if that relationship is confirmed.\n\n| Slide | Visual | Text |\n|---|---|---|\n| 1 | [PHOTO by PHOTOGRAPHER: bride portrait] | \"A spring wedding at [VENUE].\" |\n| 2 | [PHOTO: makeup detail] | none |\n| 3 | [PHOTO: hair detail] | none |\n| 4 | [PHOTO: bride with her party] | none |\n| 5 | [PHOTO: the full day] | \"Photography: [PHOTOGRAPHER] · Venue: [VENUE] · Hair and makeup: Makeup and Hair by Elsa\" |\n\n**Caption:**\n> [BRIDE FIRST NAME]'s spring wedding at [VENUE] was everything we love: natural, soft, and completely her.\n>\n> Thank you to [@PHOTOGRAPHER] for capturing it so beautifully, and to [@VENUE] for a perfect setting.\n>\n> Planning a wedding like this one? Tap the link in my bio to check your date.\n\n**Hashtags:** #DFWWedding #SpringWedding #RealWedding #DallasBride #DallasWeddingVendors #MakeupAndHairByElsa\n**CTA:** Link in bio\n**Permissions needed:** the bride's photo permission, the photographer's usage rights, and the vendor accepting the Collab invite. Don't call it a \"partnership\" unless both sides have agreed to one.\n\n---\n\n## Before anything goes live\n1. Confirm that she's booking 2027 weddings.\n2. Confirm all prices on the Services page are current.\n3. Fix the $530 starting price on The Knot and WeddingWire.\n4. Elsa decides on the $175 personal-booking fee.\n5. Check the Google and Knot review counts on posting day.\n6. Get permission for every client photo and review quote, and a parent's permission for anyone under 18.\n7. Confirm the TikTok profile link works.\n8. Clear or replace every [BRACKET].\n\n**Score: 8/10** against Glossier's plain, warm product copy. All the facts are real, the pricing and booking steps are clear, and the voice stays consistent. It loses points because the real photos and videos don't exist yet, the posting times haven't been tested, and the full week is more work than the agreed schedule. **PASS**, once the checklist is done and real assets fill the brackets."}],"videos":[{"category":"Training","slug":"reply-to-a-bridal-inquiry","title":"The 3-minute inquiry reply","length":35,"purpose":"Make the first response clear and personal.","scenes":[{"seconds":7,"visual":"Warm ivory inbox graphic with a new inquiry card.","text":"Start with her date.","voiceover":"First, read the wedding date and getting-ready location."},{"seconds":9,"visual":"Simple checklist appears beside a bridal moodboard.","text":"Date · location · ready-by time","voiceover":"Check the ready-by time and roughly how many services are needed."},{"seconds":10,"visual":"Clean draft reply on a phone; no real contact details.","text":"Warm, clear, personal.","voiceover":"Acknowledge the bride, ask for any missing details, and explain the next step."},{"seconds":9,"visual":"Finger taps a checked box labeled reply sent.","text":"Record the reply time.","voiceover":"Then actually send your approved reply and mark it in your tracker."}],"prompt":"Minimal editorial motion graphic of a fictional bridal inquiry workflow: warm ivory, espresso ink, muted dusty rose, elegant flat UI-like paper cards with no real website UI, no names, no logos, no private data. Gentle close-ups of hands writing a short checklist. 9:16 vertical, clean negative space reserved for subtitles. Four visual beats in 35 seconds. No embedded words; add captions and voiceover in editing.","location":"videos/reply-to-a-bridal-inquiry.mp4"},{"category":"Training","slug":"film-a-wedding-morning-reel","title":"Film a 15-second honest review, whatever her experience."},{"seconds":8,"visual":"Stylized simple calendar turning to day 10.","text":"One reminder is enough","voiceover":"If appropriate, send one gentle reminder later, then stop."},{"seconds":7,"visual":"Warm thank-you card and a single flower.","text":"Never offer rewards","voiceover":"No incentives, no pressure, no asking only happy clients."}],"prompt":"Premium flat-lay video in warm ivory and blush: small thank-you card, unbranded smartphone, calendar, neutral silk ribbon, no real logos or platforms, no real review screenshots. Four beats in 30 seconds, gentle movement, vertical 9:16. No text rendered in footage, reserve center area for editorial captions, no testimonials or ratings invented.","location":"videos/ask-for-an-honest-review.mp4"},{"category":"Training","slug":"your-daily-dashboard-routine","title":"Your 10-minute dashboard routine","length":35,"purpose":"Teach the simple daily operating rhythm.","scenes":[{"seconds":8,"visual":"Minimal abstract dashboard cards sliding into place, not a screen recording.","text":"First: check inquiries","voiceover":"Start with new inquiries and anyone waiting for a reply."},{"seconds":9,"visual":"Small checklist card with two checked items.","text":"Next: follow up","voiceover":"Work through follow-ups that are due today."},{"seconds":9,"visual":"Editorial content card with image placeholder and checkmark.","text":"Then: approve a post","voiceover":"See what is scheduled and whether its assets and words are ready."},{"seconds":9,"visual":"Progress ring reaches complete on a warm blank background.","text":"Finish: mark it done","voiceover":"Check upcoming commitments, mark what you actually completed, and close the day."}],"prompt":"Minimal 9:16 abstract product-education animation using warm-ivory cards, charcoal labels added only in post, dusty rose selection accents, a checklist, calendar and small progress ring. This is illustrative, NOT a fake capture of the real dashboard. Four measured scenes totaling 35 seconds, no invented product capabilities, blank cards with negative space for subtitles, silent output.","location":"videos/your-daily-dashboard-routine.mp4"},{"category":"Inspiration","slug":"the-natural-bridal-mood","title":"The timeless bridal mood","length":35,"purpose":"Inspire understated, personal bridal styling.","scenes":[{"seconds":8,"visual":"Soft ivory satin, pearl pins and a delicate flower on a clean surface.","text":"Soft, not hidden.","voiceover":"The most beautiful bridal look can still feel like you."},{"seconds":9,"visual":"Gentle color tiles: warm rose, taupe, soft brown, cream.","text":"Warm skin · gentle definition","voiceover":"Start with the feeling you want, not a trend you have to follow."},{"seconds":9,"visual":"Anonymous close-up of a brush touching an empty palette.","text":"Details make the mood","voiceover":"Think luminous texture, thoughtful color, and beautiful balance."},{"seconds":9,"visual":"Simple editorial moodboard arranged on white.","text":"Save what feels like you.","voiceover":"Keep the images that sound like your personality. Bring them to your trial."}],"prompt":"Art-directed bridal inspiration flat lay, vertical 9:16, quiet fine-art editorial style in cream, soft taupe and warm rose. Satin, pearl pins, hand-tied ribbon, understated makeup brushes and abstract color chips. No human faces, no invented client results, no business logos or endorsements, no readable text. Four gentle 8–9 second visual beats totaling 35 seconds; leave room for later typography.","location":"videos/the-natural-bridal-mood.mp4"},{"category":"Inspiration","slug":"one-look-three-content-ideas","title":"One look, three story ideas","length":32,"purpose":"Turn existing approved work into multiple useful posts.","scenes":[{"seconds":8,"visual":"A single generic beauty color palette placed inside three blank editorial frames.","text":"One look. Three posts.","voiceover":"A beautiful result can tell more than one story."},{"seconds":8,"visual":"First frame spotlights a brush and skin-tone swatches.","text":"1. The finished detail","voiceover":"Show what makes the look feel personal."},{"seconds":8,"visual":"Second frame adds three handwritten-style blank lines.","text":"2. The practical tip","voiceover":"Teach one thing you discussed while planning the look."},{"seconds":8,"visual":"Third frame contains clean calendar and CTA placeholder.","text":"3. The invitation","voiceover":"Invite brides to inquire. Use real photos only with approval."}],"prompt":"Elegant flat-color editorial storyboard, vertical 9:16, three gallery-mat layouts unfolding from one simple fictional bridal moodboard. Ivory, espresso and muted rose with varied compositions. Depict generic styling details rather than real client makeup results; leave image placeholders blank for Elsa to swap in real approved photographs. No generated logos, words, people or customer reviews. Four eight-second scenes, silent.","location":"videos/one-look-three-content-ideas.mp4"},{"category":"Inspiration","slug":"the-power-of-a-small-post","title":"A small post still counts","length":25,"purpose":"Encourage sustainable consistency rather than volume.","scenes":[{"seconds":6,"visual":"Small single photograph frame on a warm desk.","text":"Keep it simple.","voiceover":"Not every post needs a dramatic production."},{"seconds":6,"visual":"Phone, one elegant image placeholder, two short blank text lines.","text":"One image","voiceover":"Choose one real detail worth sharing."},{"seconds":6,"visual":"Calm calendar card with one marked day.","text":"One helpful thought","voiceover":"Add one useful sentence your next bride might need."},{"seconds":7,"visual":"Editorial card placed into a row of finished cards.","text":"Consistency is enough.","voiceover":"Publish when it is approved, then get back to the work you love."}],"prompt":"Quiet motivational 9:16 vertical editorial microfilm: blank photo print, unbranded phone, simple calendar, a single ivory-and-rose social post mock card. Flat neutral light, minimal movement, no fake platform interface, no text or logos in generated frames. Four gentle scenes totaling 25 seconds; clean empty space for added message and voiceover.","location":"videos/the-power-of-a-small-post.mp4"},{"category":"Inspiration","slug":"beautifully-you-not-a-trend","title":"Beautifully you, not a trend","length":30,"purpose":"Reinforce the brand approach without fake transformations.","scenes":[{"seconds":7,"visual":"Neutral textured fabric and a row of soft shade swatches.","text":"Your taste first.","voiceover":"Your bridal look should start with your own preferences."},{"seconds":8,"visual":"A small collection of varied hair accessories and neutral ribbons.","text":"Choose the details","voiceover":"Maybe softly swept hair. Maybe a polished twist. There is no single right answer."},{"seconds":8,"visual":"A sketchbook with simple abstract lines, no portrait.","text":"Talk it through","voiceover":"Use your trial to explore what feels comfortable and confident."},{"seconds":7,"visual":"Warm still life with a small handwritten-style empty card.","text":"Still yourself.","voiceover":"Timeless does not mean identical. It means recognizably you."}],"prompt":"Beautiful contemporary bridal still life, 9:16 vertical video, styled ribbons, minimal pearl hairpins, neutral swatches, sketchbook of abstract nonhuman shapes, soft daylight. No real clients, faces, before/after comparisons, brand names, or claims of actual Elsa work. Four quiet visual movements totaling 30 seconds, no embedded lettering, subtitle-safe negative space.","location":"videos/beautifully-you-not-a-trend.mp4"},{"category":"Back to business","slug":"reenter-at-your-own-pace","title":"A new chapter, your own pace","length":35,"purpose":"Normalize a thoughtful return to bookings after baby.","scenes":[{"seconds":8,"visual":"Soft morning daylight across a closed planner and a simple flower.","text":"A new chapter","voiceover":"Coming back to your work can be exciting and complicated."},{"seconds":9,"visual":"Planner with a few lightly marked blocks, most space open.","text":"Start with what fits","voiceover":"Choose a schedule that makes room for your life right now."},{"seconds":9,"visual":"Hands close a tidy beauty kit and set a notebook aside.","text":"Small steps count","voiceover":"A few well-chosen commitments can be better than saying yes to everything."},{"seconds":9,"visual":"Calm editorial studio table with sunlight and open negative space.","text":"You set the pace","voiceover":"Your business can grow without asking every day to look the same."}],"prompt":"Warm thoughtful 9:16 still-life video about returning to creative work after a baby: open unbranded planner, sparse calendar blocks, closed makeup kit, soft morning window light, simple flower. No infant or mother depicted, no medical guidance or emotional promises. Four scenes of 8–9 seconds totaling 35 seconds. Premium subdued bridal editorial look, no text or logos, spacious safe areas.","location":"videos/reenter-at-your-own-pace.mp4"},{"category":"Back to business","slug":"protect-your-weekends","title":"Protect the dates that matter","length":32,"purpose":"Help Elsa set booking boundaries before accepting requests.","scenes":[{"seconds":8,"visual":"A blank monthly calendar in warm ivory with a few empty squares.","text":"Choose your days","voiceover":"Start by deciding which dates you truly want to work."},{"seconds":8,"visual":"A few calendar squares receive soft rose marks.","text":"Block personal time","voiceover":"Protect time for family and rest before other commitments fill it."},{"seconds":8,"visual":"A small inquiry card appears beside the calendar.","text":"Then check availability","voiceover":"Every new request gets a real availability check, not an automatic yes."},{"seconds":8,"visual":"Planner closes gently; one clear appointment remains.","text":"An intentional calendar","voiceover":"Your schedule should  yes","length":30,"purpose":"Provide gentle language for declining unsuitable work.","scenes":[{"seconds":7,"visual":"Blank inquiry card rests beside a calendar with no empty weekends.","text":"Not every date fits.","voiceover":"Saying no to an inquiry can be an act of care for the work you accept."},{"seconds":8,"visual":"Hands write a short reply on cream stationery without legible words.","text":"Be warm and direct","voiceover":"Thank them for reaching out, then explain that you cannot take that date."},{"seconds":8,"visual":"A neat card with open decorative margin appears.","text":"No invented promises","voiceover":"Offer an alternative only if it is real and verified."},{"seconds":7,"visual":"Calendar and beauty kit on a peaceful desk.","text":"Protect your best work","voiceover":"You can be kind, professional, and clear at the same time."}],"prompt":"Elegant gentle 9:16 short film with an anonymous warm ivory inquiry card, calendar showing fully booked slots as abstract marks, clean stationery and an unbranded makeup kit. No real bride, names, dates, client information, fake referral partners, or generated words. Four restrained beats totaling 30 seconds; premium muted rose and taupe, subtitle-safe space.","location":"videos/you-can-say-no.mp4"}]}</script><script>'use strict';

// Escaped, small Markdown renderer: preserves original content without loading any external script.
function inlineMd(t){let e=esc(t);e=e.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');e=e.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" rel="noreferrer noopener" target="_blank">$1</a>');return e;}
function renderMarkdown(input){let lines=String(input||'').replace(/\r/g,'').split('\n'),h='',buf=[],type='';function flush(){if(!buf.length)return;if(type==='para')h+='<p>'+buf.map(inlineMd).join('<br>')+'</p>';if(type==='ul')h+='<ul>'+buf.map(x=>`<li>${inlineMd(x)}</li>`).join('')+'</ul>';if(type==='quote')h+='<blockquote>'+buf.map(inlineMd).join('<br>')+'</blockquote>';if(type==='code')h+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';if(type==='table'){h+='<div class="table-wrap"><table>'+buf.filter(x=>!/^\s*\|\s*:?-+:?/.test(x)).map((s,i)=>`<tr>${s.replace(/^\||\|$/g,'').split('|').map(v=>`<${i===0?'th':'td'}>${inlineMd(v.trim())}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')+'</table></div>';}buf=[];type=''}
for(let ln of lines){if(ln.startsWith('```')){if(type==='code')flush();else{flush();type='code'}continue}if(type==='code'){buf.push(ln);continue}if(/^\s*---\s*$/.test(ln)){flush();h+='<hr>';continue}const hd=ln.match(/^(#{1,6})\s+(.*)$/);if(hd){flush();h+=`<h${Math.min(3,hd[1].length)}>${inlineMd(hd[2])}</h${Math.min(3,hd[1].length)}>`;continue}if(!ln.trim()){flush();continue}const row=ln.match(/^\s*[-*]\s+(.*)$/);if(row){if(type!=='ul'){flush();type='ul'}buf.push(row[1]);continue}if(ln.startsWith('>')){if(type!=='quote'){flush();type='quote'}buf.push(ln.replace(/^>\s?/,''));continue}if(/^\|.*\|\s*$/.test(ln)){if(type!=='table'){flush();type='table'}buf.push(ln);continue}if(type!=='para'){flush();type='para'}buf.push(ln.trim())}flush();return h;}

function applyClick(action,node){const id=node?.dataset.id,plat=node?.dataset.platform;
 if(action==='tab')return goTab(id);
 if(action==='learn')return goLearn();
 if(action==='back-learn'){tab=previousTab;return render()}
 if(action==='post'||action==='task'||action==='lead'||action==='decision'||action==='video'||action==='source'||['tasks','add-task','add-lead','templates','add-transaction','transactions','scenario','scenario-table','weekly-review','milestones','decisions','milestone','settings','weekly-metrics'].includes(action))return openPanel(action,id);
 if(action==='close-panel')return closePanel();
 if(action==='task-toggle'){
  const t=(state.tasks||[]).find(x=>x.id===id);if(!t)return;t.completed=!t.completed;t.completedAt=t.completed?new Date().toISOString():'';save();render();if(panel?.kind==='tasks')renderPanel();return;
 }
 if(action==='save-task'){
  const form=$('#task-form');if(!form?.reportValidity())return;const title=$('#task-title').value.trim();if(!title)return notify('Enter a task title');const old=(state.tasks||[]).find(t=>t.id===form.dataset.id);
  const date=$('#task-date').value;if(date&&!validISO(date))return notify('Enter a valid date');
  const t={id:old?.id||uuid(),title,date,owner:$('#task-owner').value,priority:$('#task-priority').value,notes:$('#task-notes').value.trim(),completed:!!old?.completed,completedAt:old?.completedAt||'',createdAt:old?.createdAt||new Date().toISOString()};
  state.tasks??=[];if(old)state.tasks[state.tasks.findIndex(x=>x.id===old.id)]=t;else state.tasks.push(t);save();closePanel();render();notify(old?'Task updated':'Task added');return;
 }
 if(action==='delete-task'){
  if(!confirmAction('Delete this personal task?'))return;state.tasks=(state.tasks||[]).filter(x=>x.id!==id);save();closePanel();render();notify('Task deleted');return;
 }
 if(action==='posts-reset'){filters={scope:'all',platform:'all',type:'all',source:'all',status:'all',day:'all',search:''};return render()}
 if(action==='scope'){filters.scope=id;return render()}
 if(action==='scorecard-week'){const n=Number(id);if(!Number.isInteger(n)||n<1||n>CAMPAIGN_WEEKS)return;scorecardWeek=campaignWeekStart(n);return render()}
 if(action==='lead-filter'){leadFilter=id;return render()}
 if(action==='strategy-section'){strategySection=id;return render()}
 if(action==='video-filter'){videoFilter=id;return render()}
 if(action==='post-platform'){platformSelected[id]=plat;return renderPanel()}
 if(action==='copy-post')return postCaptionCopy(id,plat,'full');
 if(action==='copy-caption')return postCaptionCopy(id,plat,'caption');
 if(action==='copy-hashtags')return postCaptionCopy(id,plat,'hashtags');
 if(action==='copy-storyboard')return copyToClipboard(getPost(id)?.raw||'');
 if(action==='copy-video-prompt')return copyToClipboard(VIDEOS.find(v=>v.slug===id)?.prompt||'');
 if(action==='copy-template')return copyToClipboard(TEMPLATES[+id]?.[1]||'');
 if(action==='save-post-schedule'){
  let d=$('#post-date').value,t=$('#post-time').value,scheduled=$('#post-scheduled').checked;if(!validISO(d)){notify('Choose a valid date');return}
  return updatePost(id,{date:d,time:t||'Time flexible',scheduled});
 }
 if(action==='save-caption'){
  const p=getPost(id),po=PO(p);if(po.platforms[plat]==='Posted'){notify('Already published. Original publication history is preserved.');return}
  let v=$('#caption-edit').value,overrides={...po.overrides,[plat]:v},approved={...(po.approvedCaptions||{})};delete approved[plat];return updatePost(id,{overrides,approvedCaptions:approved,status:'Draft'});
 }
 if(action==='save-review-checks'){
  const p=getPost(id),po=PO(p),a=$('#assets-ok').checked,b=$('#claims-ok').checked;return updatePost(id,{assetReady:a,claimsOk:b,approvedCaptions:(a&&b)?po.approvedCaptions||{}:{},status:a&&b?po.status:'Draft'});
 }
 if(action==='post-ready')return updatePost(id,{status:'Ready for Review'});
 if(action==='post-skip')return updatePost(id,{status:'Skipped'});
 if(action==='post-approve'){
  let p=getPost(id),po=PO(p);const blockers=blockerList(p,plat);if(blockers.length){notify('Approval blocked: '+blockers[0]);return}let approved={...(po.approvedCaptions||{}),[plat]:getCaption(p,plat)};return updatePost(id,{approvedCaptions:approved,status:'Approved'});
 }
 if(action==='post-publish'){
  let p=getPost(id),po=PO(p),platforms={...po.platforms},approved=po.approvedCaptions||{};
  if(platforms[plat]==='Posted'){if(!confirmAction('Remove the published marker for this platform?'))return;delete platforms[plat];return updatePost(id,{platforms,status:'Approved'})}
  if(!Object.prototype.hasOwnProperty.call(approved,plat)||approved[plat]!==getCaption(p,plat)){notify('Approve this exact platform caption first.');return}
  if(blockerList(p,plat).length){notify('Publication blocked: review checks or questions still outstanding');return}
  if(!confirmAction(`Confirm ${plat} was actually published outside this dashboard?`))return;
  platforms[plat]='Posted';let all=p.platforms.every(x=>platforms[x]==='Posted');return updatePost(id,{platforms,status:all?'Posted':'Approved'});
 }
 if(action==='save-lead'){
  const form=$('#lead-form');if(!form.reportValidity())return;const ob=Object.fromEntries(new FormData(form).entries());const old=state.leads.find(l=>l.id===form.dataset.id);let stage=ob.stage;
  const contractSigned=!!form.querySelector('[name="contractSigned"]:checked'),depositConfirmed=!!form.querySelector('[name="depositConfirmed"]:checked');if(stage==='Booked'&&!(contractSigned&&depositConfirmed)){notify('Booking requires signed agreement and required deposit confirmation');return}
  const cleanNum=n=>n===''?'':Math.max(0,Number(n)||0);
  const item={id:old?.id||uuid(),name:ob.name.trim(),createdAt:ob.createdAt,eventDate:ob.eventDate,location:ob.location,readyBy:ob.readyBy,services:ob.services,source:ob.source,stage,contracted:cleanNum(ob.contracted),collected:cleanNum(ob.collected),firstRepliedAt:ob.firstRepliedAt,quoteSentAt:ob.quoteSentAt,follow3At:ob.follow3At,follow10At:ob.follow10At,contractSigned,depositConfirmed,detailsConfirmed:!!form.querySelector('[name="detailsConfirmed"]:checked'),availabilityConfirmed:!!form.querySelector('[name="availabilityConfirmed"]:checked'),notes:ob.notes,bookedAt:stage==='Booked'?(old?.bookedAt||DATE()):''};
  if(item.firstRepliedAt&&stage==='New')item.stage='Contacted';
  if(old)state.leads[state.leads.findIndex(x=>x.id===old.id)]=item;else state.leads.push(item);
  save();closePanel();render();notify(old?'Inquiry updated':'Inquiry added');return;
 }
 if(action==='delete-lead'){
  if(!confirmAction('Delete this inquiry reference and its manual tracking details?'))return;state.leads=state.leads.filter(l=>l.id!==id);save();closePanel();render();return;
 }
 if(action==='save-milestone'){const note=$('#milestone-proof').value.trim();if(note.length<8){notify('Add a short verification note before completing');return;}state.milestones[id]=true;state.milestoneEvidence[id]={note,by:$('#milestone-by').value.trim()||'Elsa / Aaron',date:DATE()};save();closePanel();render();notify('Fix marked complete with evidence');return;}
 if(action==='reopen-milestone'){state.milestones[id]=false;save();closePanel();render();notify('Task reopened');return;}
 if(action==='save-decision'){
  let value=$('#decision-answer').value.trim(),by=$('#decision-by').value.trim();if(!value){notify('Enter a confirmed answer first');return}
  state.decisions[id]={value,by:by||'Elsa',date:DATE()};save();closePanel();render();notify('Decision saved; related tasks remain open');return;
 }
 if(action==='financial-tier'||action==='financial-scenario'){if(action==='financial-tier')state.settings.financialTier=id;else state.settings.scenario=id;state.settings.scenarioWeddingCount=null;state.settings.scenarioAov=null;state.settings.scenarioOther=null;save();return render()}
 if(action==='save-scenario'){
  if(!$('#scenario-form').reportValidity())return;state.settings.scenarioWeddingCount=+$('#scenario-weddings').value;state.settings.scenarioAov=+$('#scenario-aov').value;state.settings.scenarioOther=+$('#scenario-other').value;save();closePanel();render();notify('Custom gross-revenue assumptions saved');return;
 }
 if(action==='reset-scenario'){state.settings.scenarioWeddingCount=null;state.settings.scenarioAov=null;state.settings.scenarioOther=null;save();return renderPanel()}
 if(action==='save-transaction'){
  if(!$('#transaction-form').reportValidity())return;const value=+$('#tx-amount').value;if(!Number.isFinite(value)||value<=0)return notify('Enter an amount above zero');state.transactions.push({id:uuid(),date:$('#tx-date').value,kind:$('#tx-kind').value,amount:value,note:$('#tx-note').value});save();closePanel();render();notify('Actual amount recorded');return;
 }
 if(action==='delete-transaction'){if(!confirmAction('Delete this manually entered record?'))return;state.transactions=state.transactions.filter(t=>t.id!==id);save();render();return renderPanel()}
 if(action==='save-weekly'){
  const w=scorecardWeek,old=state.metrics.find(x=>x.week===w);if(old)old.notes=$('#weekly-notes').value;else state.metrics.push({week:w,notes:$('#weekly-notes').value});save();notify('Weekly reflection saved');return;
 }
 if(action==='save-weekly-metrics'){
  if(!$('#weekly-metrics-form').reportValidity())return;const w=scorecardWeek,m=state.metrics.find(x=>x.week===w)||{week:w};for(const [id,key] of [['ig-reach','igReach'],['ig-visits','igVisits'],['web-clicks','webClicks'],['google-clicks','googleClicks']]){const x=$('#'+id).value;m[key]=x===''?null:+x;}state.metrics=state.metrics.filter(x=>x.week!==w);state.metrics.push(m);save();closePanel();render();notify('Weekly platform metrics saved');return;
 }
 if(action==='export')return exportState();
 if(action==='import')return importState();
 if(action==='save-goal'){const value=+$('#annual-goal').value;if(!value||value<=0)return notify('Enter a positive annual goal');state.settings.annualGoal=value;save();closePanel();render();notify('Annual goal saved');return;}
 if(action==='reset-local'){
  if(!confirmAction('Reset this device’s progress, saved leads, and edits? Export a backup first.'))return;
  if(!confirmAction('Final confirmation: erase local records on this device?'))return;
  state=defaultState();save();closePanel();render();notify('Local dashboard records reset');return;
 }
}
document.addEventListener('click',e=>{const node=e.target.closest('[data-action]');if(node){e.preventDefault();applyClick(node.dataset.action,node)}});
document.addEventListener('change',e=>{
 const node=e.target;
 if(node.matches('[data-check-day]')){if(DATE()<CAMPAIGN_START)return;const t=operationalDay();state.daily[t]??={};state.daily[t][node.dataset.checkDay]=node.checked;if(t===CAMPAIGN_START)state.daily[t]['launch'+node.dataset.checkDay]=node.checked;save();render();return}
 if(node.matches('[data-check-launch]')){if(DATE()<CAMPAIGN_START)return;state.daily[CAMPAIGN_START]??={};state.daily[CAMPAIGN_START]['launch'+node.dataset.checkLaunch]=node.checked;save();render();return}
 if(node.matches('[data-filter]')){filters[node.dataset.filter]=node.value;const r=$('#post-results');if(r)r.innerHTML=renderPostResults(filteredPosts());return}
 if(node.id==='post-week'){weekStart=thisWeekDay(node.value||CAMPAIGN_START);render();return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='post-search'){filters.search=e.target.value;const r=$('#post-results');if(r)r.innerHTML=renderPostResults(filteredPosts())}
 if(['scenario-weddings','scenario-aov','scenario-other'].includes(e.target.id)){const w=+($('#scenario-weddings')?.value||0),a=+($('#scenario-aov')?.value||0),o=+($('#scenario-other')?.value||0);const res=$('#scenario-result');if(res)res.textContent=USD(w*a+o)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel)closePanel()});
document.body.innerHTML=layout()+'<div id="detail-root"></div><div id="toast-root" aria-live="polite"></div>';render();
window.__ELSA_TEST__={DATA,POSTS,VIDEOS,FIN,CAMPAIGN_START,CAMPAIGN_END,PHASES,campaignDayNumber,campaignWeekNumber,currentCampaignWeek,campaignWeekStart,campaignWeekEnd,operationalDay,state,getPost,PO,filter:filteredPosts,blockerList,renderMarkdown,DATE,openPanel,closePanel,goTab,goLearn,render,save,exportState,restorePanel:renderPanel};
</script></body></html>
