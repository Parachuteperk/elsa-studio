 Prepare a short lead summary.\n7. Flag date availability as Unconfirmed until checked against the authoritative calendar.\n8. Draft an appropriate response using the approved business templates.\n9. Create an approval task for Elsa.\n10. Record the final outcome only after it is verified.\n\nDo not mark a wedding as Booked until the signed agreement and required deposit are confirmed.\n\n# FOLLOW-UP WORKFLOW\n\nReview open leads for scheduled follow-ups.\n\nBefore drafting a follow-up:\n\n1. Check whether the client has replied.\n2. Check whether the wedding is already booked.\n3. Check whether the lead was closed or declined.\n4. Check whether the client requested no further contact.\n5. Check whether the date or quote has changed.\n\nPrepare follow-up drafts only for eligible inquiries.\n\nAll external follow-ups require approval before sending.\n\n# PAYMENT AND CONTRACT WORKFLOW\n\nUse only verified invoices and approved contract terms.\n\nDo not calculate or request a deposit from an uncertain quote.\n\nDo not mark a payment received unless the authorized payment system confirms it.\n\nFlag missing payments and upcoming deadlines for Elsa's review.\n\n# WEDDING PREPARATION WORKFLOW\n\nFor confirmed bookings:\n\n1. Track the event date.\n2. Flag the eight-week headcount deadline.\n3. Flag the thirty-day balance deadline.\n4. Prepare a proposed artist timeline when service counts and availability are available.\n5. Flag missing information.\n6. Prepare appropriate bridal preparation emails.\n7. Request approval before any message is sent.\n\nNever change the booking or promise additional services without Elsa's approval.\n\n# REVIEW WORKFLOW\n\nAfter a completed service, prepare an honest review request when appropriate.\n\nInvite all eligible clients consistently.\n\nNever:\n- Offer incentives for reviews.\n- Ask for a particular rating.\n- Invent a testimonial.\n- Discourage negative feedback.\n- Ask only clients believed to be happy.\n- Send repeated requests after a client opts out.\n\nPrepare public review replies for Elsa's approval.\n\n# SOCIAL MEDIA WORKFLOW\n\nUse approved authentic photos and footage.\n\nDraft:\n- Instagram captions.\n- Facebook adaptations.\n- Google Business Profile updates.\n- Reel scripts.\n- Content calendars.\n\nNever claim that Elsa visited a business, worked with a particular client, received an award, or completed an event without verified support.\n\nNever generate fake client reviews or represent AI-generated beauty images as genuine bridal work.\n\nNothing is published without human approval.\n\n# VENDOR OUTREACH WORKFLOW\n\nUse verified professional contact details and legitimate public information.\n\nDo not invent relationships or previous collaborations.\n\nPrepare personalized introductions and appropriate follow-ups for approval.\n\nDo not disclose a client's private details without permission.\n\n# DAILY SUMMARY\n\nPrepare an internal summary containing:\n\nNEW INQUIRIES\n{count and lead IDs}\n\nAWAITING APPROVAL\n{tasks}\n\nFOLLOW-UPS DUE\n{tasks}\n\nUPCOMING WEDDING DEADLINES\n{tasks}\n\nPAYMENTS REQUIRING VERIFICATION\n{tasks}\n\nSOCIAL CONTENT READY FOR REVIEW\n{tasks}\n\nMISSING INFORMATION\n{questions}\n\nURGENT ISSUES\n{issues}\n\n# WEEKLY REPORT\n\nSummarize verified records:\n\n- Inquiries received.\n- Qualified inquiries.\n- Quotes sent.\n- Contracts signed.\n- Deposits confirmed.\n- Weddings booked.\n- Contracted booking revenue.\n- Completed wedding revenue.\n- Average wedding booking value.\n- Inquiry-to-booking conversion.\n- Lead source results.\n- Artist capacity.\n- Outstanding administrative tasks.\n\nSeparate booked future revenue from money actually collected.\n\nIf data is unavailable, display Unknown rather than inventing a value.\n\n# ERROR HANDLING\n\nIf an integration fails, stop that workflow and report the failure.\n\nIf data sources disagree, do not choose one silently.\n\nIf a calculation depends on an unverified policy, do not finalize it.\n\nIf a client message is ambiguous, flag it for Elsa.\n\nIf a task requires an unavailable permission, mark ACCESS NOT VERIFIED.\n\n# SUCCESS STANDARD\n\nYour job is to make the business easier to operate without taking control away from Elsa.\n\nPrepare accurate work.\nKeep records organized.\nProtect client privacy.\nEscalate uncertainty.\nRequire approval before external action.\n\n### Implementation note\n\n**[Q] Confirm whether Grok Bot can actually use scheduled execution, email integrations, spreadsheet access, and calls to ChatGPT or Claude in Aaron's intended environment.**\n\nThe instruction set does not establish those capabilities.\n\n**[I] If a connector cannot perform a task safely, Grok Bot should prepare the required draft and hand the action to Aaron or Elsa.**\n\n---\n\n# 6.7 Elsa's Daily 20–30-Minute Administrative Routine\n\n**Bottom line:** [I] Elsa should review decisions, not spend her day hunting through inboxes and spreadsheets. Aaron and Grok Bot should prepare a single daily summary containing everything that requires her attention.\n\n### Recommended schedule\n\n**[A] Proposed routine: 25 minutes per workday.**\n\n| Time [A] | Owner | Task |\n|---|---|---|\n| Before review | Grok Bot | Prepare internal summary, drafts, deadlines, and approval tasks |\n| Minutes 0–5 | Elsa | Review urgent inquiries and event issues |\n| Minutes 5–12 | Elsa | Approve, reject, or edit inquiry replies and follow-ups |\n| Minutes 12–17 | Elsa | Review upcoming wedding deadlines, staffing, and payments requiring verification |\n| Minutes 17–22 | Elsa | Approve prepared social or review-response drafts |\n| Minutes 22–25 | Elsa | Resolve exceptions and assign anything requiring follow-up |\n\n**[E/A] 5 + 7 + 5 + 5 + 3 = 25 minutes.**\n\n**[I] This is a workload target, not a guarantee.** A high-volume inquiry day, client dispute, or event emergency may require more time.\n\n### Aaron's parallel routine\n\n**[A] Proposed additional workload: 15–20 minutes on operating days.**\n\n| Task | Responsibility |\n|---|---|\n| Check integration failures | [I] Confirm new inquiries are being captured |\n| Review draft quality | [I] Ensure Grok Bot has not invented prices, availability, or customer details |\n| Check approvals | [I] Verify approved actions were executed correctly |\n| Maintain tracking | [I] Resolve duplicates and data problems |\n| Escalate exceptions | [I] Send operational decisions to Elsa |\n| Prepare creative | [I] Coordinate drafts for later approval |\n\n### What Elsa should see\n\n**Example daily summary — hypothetical, not actual business data [A]:**\n\n```text\nMAKEUP AND HAIR BY ELSA\nDAILY OPERATIONS\n\nDate: {today}\n\nNEW INQUIRIES\n{number_of_new_inquiries}\n\nNEEDS YOUR APPROVAL\n{number_of_approval_tasks}\n\nURGENT\n{urgent_issues_or_none}\n\nUPCOMING WEDDINGS\n{confirmed_event_dates_and_tasks}\n\nPAYMENT STATUS\n{unverified_or_overdue_items}\n\nSOCIAL\n{drafts_ready_for_review}\n\nQUESTIONS\n{items_needing_elsa_decision}\n\nBUSINESS HEALTH\n{brief_summary_from_verified_records}\n```\n\n**[I] The summary should link to the actual supporting records rather than copying sensitive client information into multiple systems.**\n\n---\n\n# 6.8 Weekly 45–60-Minute Management Routine\n\n**Bottom line:** [I] The weekly review should identify where revenue is coming from, what is blocking bookings, and whether the team can fulfill upcoming work. It should end with specific decisions rather than a long report no one uses.\n\n**[A] Proposed routine: 55 minutes.**\n\n| Minutes [A] | Topic | Owner | Decision |\n|---|---|---|---|\n| 0–10 | Lead volume and conversion | Aaron | [I] Identify unanswered inquiries and lost-booking reasons |\n| 10–20 | Bookings and revenue | Elsa / Aaron | [I] Review booked revenue, collected cash, and direct costs separately |\n| 20–30 | Team and calendar | Elsa | [I] Confirm upcoming staffing and capacity |\n| 30–40 | Marketing | Aaron | [I] Select next week's topics and review lead sources |\n| 40–50 | Vendor relationships | Elsa / Aaron | [I] Approve suitable introductions and follow-ups |\n| 50–55 | Decisions and assignments | Elsa | [I] Assign owners and deadlines |\n\n**[E/A] 10 + 10 + 10 + 10 + 10 + 5 = 55 minutes.**\n\n### Weekly report template\n\n```text\nMAKEUP AND HAIR BY ELSA\nWEEKLY BUSINESS REVIEW\n\nPeriod:\n{start_date} to {end_date}\n\n1. INQUIRIES\nNew:\nQualified:\nResponded within target:\nStill awaiting response:\n\n2. BOOKINGS\nNew confirmed weddings:\nContracted revenue:\nDeposits verified:\nUpcoming completed-service revenue:\n\n3. SALES\nQuotes sent:\nBookings confirmed:\nLead-to-booking conversion:\nAverage booking value:\n\n4. OPERATIONS\nUpcoming weddings:\nArtist conflicts:\nHeadcount deadlines:\nBalance deadlines:\nOpen client issues:\n\n5. MARKETING\nInstagram-origin inquiries:\nFacebook-origin inquiries:\nGoogle-origin inquiries:\nDirectory-origin inquiries:\nVendor referrals:\nOther or unknown sources:\n\n6. PROFITABILITY\nRevenue earned:\nArtist payouts:\nTravel cost:\nOther direct costs:\nEstimated contribution:\nMissing expense records:\n\n7. NEXT ACTIONS\nAction:\nOwner:\nDeadline:\nApproval required:\n```\n\n**[I] Use \"Unknown\" when a metric cannot yet be calculated.**\n\nDo not present missing figures as zero.\n\n---\n\n# 6.9 The Simplest Tracking Setup\n\n**Bottom line:** [I] Begin with one spreadsheet containing a limited number of linked worksheets. Keep calculations deterministic, maintain one authoritative source for booking and payment status, and avoid paying for multiple overlapping systems until the workflow is tested.\n\n## Recommended spreadsheet structure\n\n**[A] Initial configuration: six worksheets.**\n\n### Worksheet 1 — LEADS\n\nExact columns:\n\n```text\nLead_ID\nInquiry_Received_At\nClient_First_Name\nEvent_Date\nVenue_or_Location\nServices_Requested\nMakeup_Service_Count\nHair_Service_Count\nLead_Source\nLead_Status\nAvailability_Status\nAssigned_Owner\nFirst_Response_At\nQuote_Sent_At\nQuote_Total\nNext_Action\nNext_Action_Due\nLast_Contact_At\nBooked_At\nRelated_Booking_ID\nClosed_Reason\nNotes_Minimized\n```\n\n### Worksheet 2 — BOOKINGS\n\nExact columns:\n\n```text\nBooking_ID\nLead_ID\nEvent_Date\nVenue_or_Location\nPackage_Name\nBride_Service_Revenue\nAttendant_Service_Revenue\nJunior_Service_Revenue\nOther_Service_Revenue\nElsa_Personal_Service_Fee\nTravel_Billed\nOther_Approved_Charges\nContracted_Total\nAgreement_Signed\nDeposit_Required\nDeposit_Confirmed\nBalance_Due_Date\nBalance_Confirmed\nHeadcount_Deadline\nFinal_Makeup_Count\nFinal_Hair_Count\nAssigned_Artists\nTimeline_Approved\nWedding_Completed\nReview_Request_Status\n```\n\n### Worksheet 3 — EXPENSES\n\nExact columns:\n\n```text\nExpense_ID\nExpense_Date\nBooking_ID\nExpense_Category\nExpense_Description\nAmount\nPaid_To\nPayment_Status\nReceipt_Reference\nApproved_By\n```\n\n**[I] Use category values that separate artist pay, travel, supplies, processing, advertising, software, and overhead.**\n\n### Worksheet 4 — CONTENT\n\nExact columns:\n\n```text\nContent_ID\nPlatform\nContent_Type\nTopic\nSource_Asset_Reference\nMedia_Permission_Confirmed\nCaption_Draft\nFact_Check_Status\nReview_Status\nApprover\nScheduled_Date\nPublished_Date\nPublished_URL\nReach\nSaves\nShares\nProfile_Visits\nWebsite_Clicks\nAttributed_Inquiries\n```\n\n### Worksheet 5 — VENDORS\n\nExact columns:\n\n```text\nVendor_ID\nVendor_Business\nVendor_Type\nContact_Name\nPublic_Business_Email\nWebsite\nRelationship_Status\nSource\nLast_Contact_Date\nNext_Follow_Up\nReferrals_Received\nBookings_Attributed\nContracted_Revenue_Attributed\nNotes\n```\n\n### Worksheet 6 — APPROVALS\n\nExact columns:\n\n```text\nApproval_ID\nCreated_At\nRelated_Record_ID\nAction_Type\nProposed_Action\nDraft_Reference\nSupporting_Source\nAssigned_Approver\nApproval_Status\nApproved_At\nApproved_By\nExecuted_At\nExecution_Result\nError_Details\n```\n\n### Why this structure works\n\n**[I] The worksheets answer distinct questions:**\n\n| Worksheet | Business question |\n|---|---|\n| Leads | Which inquiries need attention? |\n| Bookings | Which weddings are actually contracted? |\n| Expenses | What does serving each wedding cost? |\n| Content | What is ready to publish, and what results did it produce? |\n| Vendors | Which professional relationships generate referrals? |\n| Approvals | What has been approved, and what has actually happened? |\n\n### Recommended technical rules\n\n- **[I]** Use a unique ID for every lead and booking.\n- **[I]** Do not count a lead twice if a customer submits multiple forms.\n- **[I]** Do not classify a wedding as booked without a signed agreement and confirmed deposit.\n- **[I]** Separate contracted future revenue from recognized revenue and cash received.\n- **[I]** Never infer payment status from an email alone.\n- **[I]** Store the original event date and any approved date changes.\n- **[I]** Record timestamps with their timezone.\n- **[I]** Use protected fields or permissions for financial data.\n- **[I]** Back up the spreadsheet and maintain a change history.\n- **[I]** Store client contact details in the authorized communication system, not in AI prompts.\n\n---\n\n# 6.10 AI Rollout by Revenue Tier\n\n**Bottom line:** [I] Add automation only when it removes a measured administrative problem. More software is not inherently better; a small, reliable system is more valuable than an elaborate one that creates extra work.\n\n## Stage A — Around $100K Annual Revenue\n\n**Focus:** [I] Reliable inquiry handling and basic reporting.\n\n| Add | Why |\n|---|---|\n| Lead tracker | [I] Prevent inquiries from disappearing |\n| Draft inquiry replies | [I] Reduce repetitive writing |\n| Follow-up reminders | [I] Keep eligible leads organized |\n| Wedding deadline reminders | [I] Prevent missed headcount and balance deadlines |\n| Simple weekly dashboard | [I] Establish accurate operating data |\n| Social caption preparation | [I] Maintain consistent publishing without increasing Elsa's writing workload |\n\n**[A] Trigger:** Use this stage immediately as the initial operating setup, regardless of actual revenue.\n\n**Do not add yet [I]:** Complicated multi-platform automation, autonomous customer communications, or expensive software without proven need.\n\n## Stage B — Around $200K Annual Revenue\n\n**Focus:** [I] Team scheduling, profitability, and repeatable lead generation.\n\n| Add | Why |\n|---|---|\n| More detailed artist calendar | [I] Reduce staffing conflicts |\n| Service-by-service profitability reports | [I] Identify profitable booking patterns |\n| Structured quote preparation | [I] Improve pricing accuracy |\n| Vendor relationship tracker | [I] Measure referral results |\n| Approved content production pipeline | [I] Maintain regular marketing |\n| Better contract and payment status integration | [I] Reduce repeated manual verification |\n\n**[A] Proposed operational trigger:** More than 40 active future bookings or 10 qualified inquiries monthly, sustained across two consecutive months.\n\nThese are proposed thresholds, not measured current conditions.\n\n**[I] The trigger should ultimately depend on administrative workload and error rates, not annual revenue alone.**\n\n## Stage C — Around $300K+ Annual Revenue\n\n**Focus:** [I] Multiple-team coordination and stronger financial control.\n\n| Add | Why |\n|---|---|\n| Independent team schedules | [I] Support simultaneous weddings |\n| Formal artist assignment workflow | [I] Clarify responsibilities |\n| Booking profitability by team | [I] Compare delivery costs |\n| More detailed cash and revenue reporting | [I] Prevent confusion between deposits and earned income |\n| Standardized quality review | [I] Maintain service consistency |\n| Controlled operational access by role | [I] Protect records and reduce accidental changes |\n| Exception alerts | [I] Surface schedule conflicts, overdue payments, and missing approvals |\n| Scalable customer management software if justified | [I] Replace spreadsheet limitations only after they are demonstrated |\n\n**[A] Proposed trigger:** Confirmed overlapping weddings require independent teams, or the existing system produces repeated scheduling, response, or financial errors.\n\n**[I] Do not wait until revenue reaches exactly $300K if these operational problems appear sooner.**\n\n---\n\n# SECTION 7. ROADMAP, KPIs & QUESTIONS FOR ELSA\n\n**Bottom line:** [I] The next 90 days should establish accurate business records, improve inquiry conversion, and make essential administrative work repeatable. Elsa should not commit to new advertising, additional artists, or major software expenses until the business can measure the results.\n\nThe roadmap below brings together the website, social, pricing, funnel, and automation recommendations from all five replies.\n\n---\n\n# 7.1 Final 30/60/90-Day Roadmap\n\n## DAYS 1–30 — FIX THE FOUNDATION\n\n**Goal:** [I] Establish accurate information and reliable inquiry handling.\n\n### Week 1 — Confirm the Business Rules\n\n| Done | Action | Owner | Acceptance criteria |\n|---|---|---|---|\n| ☐ | [Q] Confirm primary business phone | Elsa | One approved public number or a deliberate no-public-phone policy |\n| ☐ | [Q] Confirm published business hours | Elsa | Google, website, and social information agree |\n| ☐ | [Q] Confirm accepted payment methods | Elsa | Deposit and balance methods are documented |\n| ☐ | [Q] Confirm travel calculations | Elsa | Each service type has an approved travel rule |\n| ☐ | [Q] Confirm artist roster and availability | Elsa | Current capacity can be checked |\n| ☐ | [Q] Confirm personal working capacity | Elsa | Monthly wedding/class availability established |\n| ☐ | [Q] Confirm current booking and payment software | Elsa | Authoritative records identified |\n| ☐ | [I] Create a business information reference | Aaron | Approved prices, policies, and contacts in one place |\n\n### Week 2 — Repair the Website\n\n| Done | Action | Owner | Acceptance criteria |\n|---|---|---|---|\n| ☐ | [I] Implement new homepage headline and CTA | Cursor | Mobile page shows service, location, pricing, and inquiry action |\n| ☐ | [I] Add package starting-price information | Cursor | Published $1,125 starting price appears clearly |\n| ☐ | [I] Rewrite Services explanation | Cursor | Package inclusions and à la carte options are distinguishable |\n| ☐ | [I] Standardize travel and payment language | Elsa / Cursor | Website matches approved policy |\n| ☐ | [I] Add permanent `/home/` redirect | Cursor | Old page redirects to current homepage |\n| ☐ | [I] Correct H1 headings and metadata | Cursor | Each core page has appropriate headings and metadata |\n| ☐ | [I] Investigate robots/sitemap access | Cursor | Search Console access and sitemap behavior verified |\n| ☐ | [I] Test the contact form | Aaron / Cursor | Test inquiry arrives correctly |\n\n### Week 3 — Establish the Sales Process\n\n| Done | Action | Owner | Acceptance criteria |\n|---|---|---|---|\n| ☐ | [I] Create the six tracking worksheets | Aaron | Records, statuses, and permissions configured |\n| ☐ | [I] Record outstanding inquiries | Aaron | Open leads have an owner and next action |\n| ☐ | [I] Approve inquiry templates | Elsa | Available/unavailable responses approved |\n| ☐ | [I] Approve follow-up templates | Elsa | Follow-up schedule and suppression rules documented |\n| ☐ | [I] Create approval queue | Aaron | External actions cannot proceed without approval |\n| ☐ | [I] Identify the authoritative calendar | Elsa | Date availability has a trusted source |\n| ☐ | [I] Test reminder calculations | Aaron | Eight-week and 30-day deadlines calculate correctly |\n\n### Week 4 — Repair Public Profiles\n\n| Done | Action | Owner | Acceptance criteria |\n|---|---|---|---|\n| ☐ | [I] Correct The Knot pricing | Aaron / Elsa | Price corresponds to the relevant service |\n| ☐ | [I] Correct WeddingWire pricing/contact information | Aaron / Elsa | Published information confirmed |\n| ☐ | [I] Align Facebook business location | Aaron / Elsa | Location matches approved business base |\n| ☐ | [I] Confirm Google's booking-button destination | Aaron | Action leads to the correct inquiry process |\n| ☐ | [I] Rewrite Instagram bio | Elsa | Service, location, and next action clear |\n| ☐ | [I] Prepare pinned Instagram posts | Aaron | Elsa approves authentic media and claims |\n| ☐ | [I] Begin weekly reporting | Aaron | First baseline report completed |\n\n### Day 30 Decision Gate\n\n**[A] Proposed completion standards:**\n\n- 100% of incoming inquiries are recorded.\n- 100% of open inquiries have an assigned owner.\n- Booking status is based on verified agreements and deposits.\n- The website's core inquiry process works.\n- Prices and payment rules are consistent.\n- Major public listing discrepancies are corrected or documented as unresolved.\n- AI-assisted drafts require human approval.\n\n**[I] If these conditions are not met, finish them before moving into more aggressive marketing.**\n\n---\n\n## DAYS 31–60 — IMPROVE CONVERSION\n\n**Goal:** [I] Make more of the existing inquiries valuable while reducing repetitive administration.\n\n| Done | Action | Owner | Acceptance criteria |\n|---|---|---|---|\n| ☐ | [I] Launch Reviews page | Cursor | Genuine review links and approved excerpts |\n| ☐ | [I] Launch package comparison content | Aaron | Three pricing tiers clearly explained |\n| ☐ | [I] Begin regular social schedule | Elsa / Aaron | Approved content published consistently |\n| ☐ | [I] Prepare review invitation workflow | Aaron | Neutral requests with opt-out and duplicate controls |\n| ☐ | [I] Prepare wedding deadline reminders | Aaron | Internal reminders created from verified booking dates |\n| ☐ | [I] Prepare bridal tip-email drafts | Aaron / ChatGPT | Elsa-approved content ready for applicable clients |\n| ☐ | [I] Begin vendor outreach | Elsa / Aaron | Genuine personalized introductions recorded |\n| ☐ | [I] Establish source attribution | Aaron | Lead sources identified or explicitly Unknown |\n| ☐ | [I] Begin direct-cost tracking | Aaron | Artist, travel, supplies, and processing separated |\n| ☐ | [I] Review package selection | Aaron | Actual booking mix calculated |\n| ☐ | [I] Calculate preliminary AOV | Aaron | Uses actual contracted wedding values |\n| ☐ | [I] Review artist scheduling | Elsa | Upcoming conflicts identified and resolved |\n\n### Day 60 Decision Gate\n\n**[A] Proposed measures:**\n\n- At least 30 qualified inquiries recorded, if actual demand permits.\n- Inquiry response time measured.\n- Follow-up completion measured.\n- Initial booking conversion calculated.\n- Actual artist payout assumptions replaced where records exist.\n- Social-origin inquiries identifiable.\n- Review invitations handled consistently.\n- No unapproved customer communications sent by AI.\n\n**[I] If fewer than 30 qualified inquiries have occurred, report the actual smaller sample rather than delaying measurement or claiming a statistically reliable conversion rate.**\n\n---\n\n## DAYS 61–90 — DEVELOP REPEATABLE GROWTH\n\n**Goal:** [I] Determine which services and lead sources can support profitable expansion.\n\n| Done | Action | Owner | Acceptance criteria |\n|---|---|---|---|\n| ☐ | [I] Review lead-source performance | Aaron | Qualified leads and bookings by source |\n| ☐ | [I] Review actual wedding AOV | Aaron | Verified average from completed or contracted bookings, clearly distinguished |\n| ☐ | [I] Review contribution margin | Aaron | Direct costs allocated consistently |\n| ☐ | [I] Review available team capacity | Elsa | Future wedding slots and artist assignments documented |\n| ☐ | [I] Evaluate classes as a growth channel | Elsa / Aaron | Revenue compared with time and delivery costs |\n| ☐ | [I] Evaluate referral outreach | Aaron | Replies, referrals, and bookings recorded |\n| ☐ | [I] Review social content | Aaron | Inquiries and bookings considered alongside engagement |\n| ☐ | [I] Evaluate pricing tests | Elsa | Decision based on conversion and profitability |\n| ☐ | [I] Evaluate additional artist demand | Elsa | Capacity and financial gates checked |\n| ☐ | [I] Evaluate advertising readiness | Aaron | Acquisition-cost limits calculated from actual contribution |\n| ☐ | [I] Prepare updated annual revenue plan | Aaron | Uses actual performance instead of default assumptions |\n| ☐ | [I] Confirm next operating priorities | Elsa | Written decisions with owners and deadlines |\n\n### Day 90 Decision\n\nThe final review should establish:\n\n| Question | Required evidence |\n|---|---|\n| Are inquiries increasing? | [I] Recorded inquiry counts by source |\n| Are more inquiries becoming bookings? | [I] Conversion data |\n| Are bookings profitable? | [I] Revenue minus actual delivery costs |\n| Is Elsa working within her desired schedule? | [Q] Her confirmed capacity and actual hours |\n| Can the team take more weddings? | [I] Verified artist availability |\n| Are classes worth expanding? | [I] Revenue, direct costs, teaching hours |\n| Should prices change? | [I] Conversion, utilization, and profit evidence |\n| Should advertising begin? | [I] Lead economics and available capacity |\n| Is a second team justified? | [I] Confirmed same-day demand and staffing |\n\n**[I] The output should be an evidence-based operating decision, not merely a list of completed marketing tasks.**\n\n---\n\n# 7.2 KPI Dashboard — Exact Formulas and Targets\n\n**Bottom line:** [I] Elsa needs a small set of numbers that connect daily activity to financial results. The dashboard should distinguish new inquiries, confirmed bookings, earned revenue, collected money, and owner profit.\n\nThe following targets are proposed tests [A], not verified current performance.\n\n| KPI | Formula | Target [A] | Data source | Frequency |\n|---|---|---|---|---|\n| **Qualified inquiries** | Count of inquiries meeting approved service and eligibility criteria | Establish actual baseline, then test growth | LEADS | Weekly |\n| **Inquiry capture rate** | Recorded inquiries ÷ received inquiries × 100 | 100% | Form notifications and LEADS | Daily |\n| **Inquiry response time** | First substantive reply timestamp − inquiry timestamp | Median ≤4 business hours | Inbox and LEADS | Daily/weekly |\n| **Lead-to-booking rate** | Confirmed bookings ÷ qualified inquiries × 100 | Test 20%, 35%, 50% | LEADS and BOOKINGS | Monthly |\n| **Quote conversion** | Bookings from quoted leads ÷ quoted leads × 100 | Establish baseline | LEADS | Monthly |\n| **AOV — average order value** | Total contracted wedding value ÷ contracted weddings | Test against $2,948.75 model | BOOKINGS | Monthly |\n| **CAC — customer acquisition cost** | Attributable acquisition spending ÷ acquired customers | At or below 20% of contribution per booking | Marketing costs and BOOKINGS | Monthly |\n| **Review rate** | New reviews ÷ completed weddings × 100 | Test 20%; do not incentivize reviews | Review records and BOOKINGS | Monthly |\n| **Review request coverage** | Eligible clients invited ÷ eligible completed clients × 100 | 100% | Review tracker | Weekly |\n| **Artist margin** | (Revenue from team-performed services − artist pay − directly attributable artist costs) ÷ team-performed service revenue × 100 | Test ≥30% | BOOKINGS and EXPENSES | Monthly |\n| **Wedding contribution margin** | (Wedding revenue − directly attributable wedding costs) ÷ wedding revenue × 100 | Test ≥25% | BOOKINGS and EXPENSES | Monthly |\n| **Revenue per Saturday** | Contracted Saturday wedding revenue ÷ Saturdays with booked weddings | Test $2,900 | BOOKINGS and calendar | Monthly |\n| **Peak-date utilization** | Booked available prime-date team slots ÷ total available prime-date team slots × 100 | Review capacity at 80% | Calendar and BOOKINGS | Monthly |\n| **Lead source mix** | Qualified inquiries from each source ÷ total qualified inquiries × 100 | 100% assigned a source or Unknown | LEADS | Monthly |\n| **Revenue by source** | Contracted revenue attributed to each source | Establish baseline | LEADS and BOOKINGS | Monthly |\n| **Artist schedule conflict rate** | Confirmed unresolved staffing conflicts ÷ booked events × 100 | 0% unresolved | Calendar and BOOKINGS | Weekly |\n| **On-time headcount rate** | Bookings finalized by deadline ÷ applicable bookings × 100 | 100% | BOOKINGS | Weekly |\n| **On-time balance rate** | Balances received by contractual deadline ÷ balances due × 100 | 100% | Payment records | Weekly |\n| **Owner hours** | Elsa's recorded business hours | Remain within Elsa's approved schedule [Q] | Time log | Weekly |\n| **Owner take-home estimate** | Earned revenue − modeled expenses, before personal taxes | Establish verified baseline | Financial records | Monthly |\n\n### Clarifications that matter\n\n**[I] Contracted revenue is not the same as cash collected.**\n\nAn agreed wedding booking may have a signed contract and deposit but still have an outstanding balance.\n\n**[I] Cash collected is not always the same as revenue earned.**\n\nDeposits for future services may require different accounting treatment from completed services. Elsa's bookkeeper or accountant should confirm the correct treatment.\n\n**[I] Lead-to-booking rates should use a consistent time window.**\n\nA bride who inquires near the end of a reporting period may book later. Track inquiry cohorts so monthly conversion is not distorted.\n\n**[I] Review rate is not review-request coverage.**\n\nRequesting reviews from every eligible client is a process goal. The number of clients who choose to leave reviews is outside Elsa's control.\n\n**[I] A high revenue-per-Saturday figure is not sufficient if artist costs or service complexity make the booking unprofitable.**\n\n---\n\n# 7.3 Sample Monthly Dashboard\n\n**[A] The following is a hypothetical reporting example, not Elsa's actual results.**\n\n| Metric | Illustrative month [A] | Interpretation [I] |\n|---|---:|---|\n| Qualified bridal inquiries | 20 | Demand is being tracked |\n| Confirmed bookings | 7 | Provides a conversion calculation |\n| Lead-to-booking rate | 35% [E/A] | 7 ÷ 20 × 100 |\n| Average contracted wedding value | $2,948.75 [E/A] | Uses the modeled Base AOV |\n| New contracted wedding revenue | $20,641.25 [E/A] | 7 × $2,948.75 |\n| Completed weddings | 5 | Separate from newly contracted bookings |\n| New public reviews | 1 | Review activity recorded |\n| Review rate | 20% [E/A] | 1 ÷ 5 × 100 |\n| Advertising spending | $0 | No paid campaigns in this illustration |\n| Paid CAC | Not applicable | Cannot divide advertising spend by zero acquired customers |\n| Inquiry source completeness | 100% [A] | Every lead has a source or Unknown |\n\n**[I] Do not mix the seven newly contracted bookings with the five completed weddings when calculating earned revenue or review rate.**\n\n---\n\n# 7.4 Questions Elsa Must Answer\n\n**Bottom line:** [I] These questions are the missing information that prevents the report from becoming a reliable operating plan. Elsa should answer them using current business records wherever possible; estimates should be labeled until confirmed.\n\nEach question is designed for a short, one-line answer.\n\n## A. MONEY\n\n| # | Question [Q] |\n|---|---|\n| M1 | What was total gross revenue during the most recent completed 12 months? |\n| M2 | How many weddings were completed during that period? |\n| M3 | How much revenue came from weddings, classes, and other services separately? |\n| M4 | What is the actual average contracted value of a wedding booking? |\n| M5 | How many bookings used Radiant, Timeless, Royal, or à la carte pricing? |\n| M6 | What percentage of brides requested Elsa personally? |\n| M7 | What percentage of qualified inquiries became confirmed bookings? |\n| M8 | How many qualified bridal inquiries arrive in an average month? |\n| M9 | What are the actual payment-processing fees by payment method? |\n| M10 | What were total annual business operating expenses? |\n| M11 | How ner take-home versus owner labor\n\n**Severity: Critical**\n\n**Problem:** [A] The financial scenarios do not assign a separate labor expense to Elsa for personally performing bridal packages or teaching classes.\n\n**Exact fix:** [I] Before making scaling decisions, calculate profit both with and without an explicit cost for Elsa's working time.\n\nThe reported take-home numbers are pre-tax estimates under the stated assumptions, not necessarily earnings from a business that could operate without Elsa.\n\n### 3. Artist capacity versus package appointments\n\n**Severity: High**\n\n**Problem:** [I] The capacity tables primarily count wedding-day service assignments. Bridal packages may also require trials, engagement appointments, extended touch-ups, and second looks.\n\n**Exact fix:** [I] Build an appointment-level schedule for each package, including all dates, service hours, travel, and preparation time.\n\n**[Q] Confirm which artist provides each included appointment.**\n\n### 4. Travel charges versus actual expenses\n\n**Severity: High**\n\n**Problem:** [A] The revenue model assumes all billed travel revenue is consumed by travel-related expenses.\n\nThe actual arrangement is unknown [Q].\n\n**Exact fix:** [I] Reconcile travel billed, travel paid to artists, travel reimbursed, and other travel expenses for completed bookings.\n\n### 5. The meaning of \"Elsa personally\"\n\n**Severity: High**\n\n**Problem:** [V] The website permits a personal request for an additional $175.\n\n**[Q]** The supplied facts do not establish which package appointments Elsa personally performs for that charge.\n\n**Exact fix:** [I] Confirm the scope of the fee before calculating artist payouts or Elsa's required hours.\n\n### 6. Revenue booked versus revenue earned\n\n**Severity: High**\n\n**Problem:** [I] Earlier scenario calculations use annual gross revenue without modeling the timing of deposits and wedding-service delivery.\n\n**Exact fix:** [I] Track contracted future revenue, cash received, and revenue earned separately.\n\nAsk Elsa's accountant to confirm the appropriate treatment.\n\n### 7. Website and listing location\n\n**Severity: Medium**\n\n**Problem:** [V] Facebook identifies Colleyville while the site and wedding directories identify Bedford.\n\n**Exact fix:** [Q] Confirm Bedford remains the correct business base, then align listings without exposing a private residential address.\n\n### 8. Business phone numbers\n\n**Severity: Medium**\n\n**Problem:** [V] Google displays (682) 292-8407; WeddingWire displays 832-305-1450; Elsa's own site does not publish a phone.\n\n**Exact fix:** [Q] Confirm the approved public number and whether the website should publish it.\n\n### 9. Google hours versus website structured data\n\n**Severity: Medium**\n\n**Problem:** [V] Google lists 8 AM–5 PM daily; website structured data lists 9 AM–5 PM.\n\n**Exact fix:** [Q] Confirm actual customer-contact hours before aligning both.\n\n### 10. The Knot and WeddingWire starting price\n\n**Severity: High**\n\n**Problem:** [V] Both list $530, which does not match any identified website service price.\n\n**Exact fix:** [I] Verify what each directory's price field represents, then use the appropriate verified service or package price.\n\n### 11. Package savings\n\n**Severity: Medium**\n\n**Problem:** [V] Radiant advertises $200 savings, but the two independently priced core services establish a $50 difference [E].\n\n**Exact fix:** [Q] Obtain the underlying itemized value calculation before repeating the full savings claim in new marketing material.\n\n### 12. Payment-method disagreement\n\n**Severity: High**\n\n**Problem:** [V] The FAQ lists several payment methods but elsewhere restricts the balance to Venmo or Zelle.\n\n**Exact fix:** [Q] Confirm actual deposit and remaining-balance policies, then update all communication templates and website content.\n\n### 13. Booking CTA terminology\n\n**Severity: Medium**\n\n**Problem:** [V] Instagram says \"Book Here,\" but the verified destination is an inquiry form.\n\n**Exact fix:** [I] Replace the wording with \"Inquire about your date\" unless a genuine instant-booking system is introduced.\n\n### 14. Website schema placeholders\n\n**Severity: High**\n\n**Problem:** [I] Reply 1 supplied JSON-LD containing `{PRIMARY PHONE}`, `{EXISTING_BEAUTYSALON_ID}`, and proposed service-area locations.\n\n**Exact fix:** [I] Do not publish the example unchanged. Confirm the business identifier, remove or replace the phone placeholder, and verify service-area coverage.\n\n### 15. Automation access\n\n**Severity: Critical**\n\n**Problem:** [Q] No email, calendar, payment, website, or social account integrations have been confirmed for Grok Bot.\n\n**Exact fix:** [I] Verify each connection and permission before enabling its corresponding workflow. Keep external actions behind human approval.\n\n### 16. Conversion rates and marketing effectiveness\n\n**Severity: High**\n\n**Problem:** [Q] Actual inquiry-to-booking rates, advertising costs, and social conversion metrics are unavailable.\n\n**Exact fix:** [I] Collect real data before increasing advertising, restructuring pricing, or making hiring decisions.\n\n### 17. Financial model selection\n\n**Severity: Medium**\n\n**Problem:** [I] The Base scenarios use Timeless as a representative booking, while the actual package mix is unknown.\n\n**Exact fix:** [I] Replace the single-package assumption with a weighted average calculated from real Radiant, Timeless, Royal, and à la carte bookings.\n\n### 18. Timing of follow-up messages\n\n**Severity: Low**\n\n**Problem:** [I] Reply 3 described the seven-day follow-up as occurring after either the previous message or the original quote, which could produce inconsistent scheduling.\n\n**Exact fix:** [A] Standardize on the initial substantive response or quote as the reference timestamp: first follow-up at 48 hours, second at seven days, final at 14 days. Suppress follow-ups when a client replies, books, declines, or opts out.\n\n---\n\n## F9. Fabrication Check\n\n| Requirement | Result |\n|---|---|\n| No invented street address | **PASS** |\n| No invented client names | **PASS** |\n| No invented reviews | **PASS** |\n| No invented testimonials | **PASS** |\n| No invented awards | **PASS** |\n| No invented staff names | **PASS** |\n| No invented historical revenue | **PASS** |\n| Hypothetical revenue clearly labeled | **PASS** |\n| Hypothetical operating costs clearly labeled | **PASS** |\n| Unknown artist compensation disclosed | **PASS** |\n| Unknown business software disclosed | **PASS** |\n| Unknown personal working capacity disclosed | **PASS** |\n| AI access limitations disclosed | **PASS** |\n| Customer-facing actions require approval | **PASS** |\n| All identified source inconsistencies resolved | **NOT YET — requires Elsa's answers** |\n| Financial feasibility independently verified against actual records | **NOT YET — no internal data supplied** |\n| Technical website changes implemented | **NOT YET — recommendations only** |\n\n**[I] No real-world changes are claimed to have been completed by this review.**\n\n---\n\n# FINAL BUSINESS RECOMMENDATION\n\n**Bottom line:** [I] Elsa should build a business that grows through a trained team, stronger revenue per wedding, referrals, and disciplined administration—not through adding more personal appointments to an already demanding schedule.\n\nThe next decision should be based on actual business data, not another marketing campaign.\n\n## Recommended Order of Execution\n\n| Priority | Action | Why it comes first |\n|---|---|---|\n| **1 — Critical** | [Q] Obtain real revenue, wedding-volume, artist-pay, and capacity information | Determines whether the financial targets are realistic |\n| **2 — Critical** | [I] Establish the lead and booking tracker | Makes conversion and future growth measurable |\n| **3 — High** | [I] Fix website pricing clarity and the inquiry process | Helps existing prospects understand the service |\n| **4 — High** | [I] Implement approved inquiry drafts and reminders | Reduces repetitive work and missed follow-ups |\n| **5 — High** | [I] Align Google, Facebook, The Knot, and WeddingWire | Eliminates avoidable customer confusion |\n| **6 — Medium** | [I] Establish sustainable social publishing | Maintains awareness using authentic work |\n| **7 — Medium** | [I] Build genuine vendor referral relationships | Creates another potential source of qualified leads |\n| **8 — High** | [I] Measure contribution profit by wedding | Prevents unprofitable growth |\n| **9 — High** | [I] Evaluate hiring, pricing, or advertising only after the data is available | Reduces financial and operational risk |\n\n### Financial direction\n\n**[I] The $100K annual model is the most defensible initial planning scenario given the available evidence.**\n\nThe Base example uses:\n\n- **32 weddings annually [A]**\n- **$2,948.75 modeled AOV [E/A]**\n- **$6,000 in additional annual revenue [A]**\n- **$100,360 total gross revenue [E/A]**\n- **$36,201.20 estimated pre-tax owner take-home [E/A]**\n\nThese are not predictions of Elsa's current business.\n\n**[I] If Elsa is already generating more than $100K, use her existing performance as the baseline and evaluate the next profitable growth tier instead.**\n\n### Automation direction\n\n**[I] Start with Grok Bot preparing work, Aaron managing the system, and Elsa approving external actions.**\n\nGmail and Google Calendar can be connected to ChatGPT for account-linked email and scheduling workflows, subject to Elsa's permission and verification of their access. Neither connection is assumed to be active, and no workflow should depend on an unverified integration.\n\n### Final verdict\n\n**Overall expansion readiness: NO-SHIP until core financial and capacity information is verified.**\n\n**Operational foundation: SHIP the website fixes, lead tracking, communication templates, and approval-controlled automation plan.**\n\n**[I] The most valuable immediate deliverable is a reliable picture of what each wedding earns, what it costs, how many inquiries it takes to book, and how much of Elsa's time it requires.**\n\nWith those numbers, the business can choose a credible path toward **$100K, $200K, or $300K+** without mistaking higher revenue for higher profitability.\n\n**END OF REPLY 5 — COMPLETE FIVE-PART REVIEW.**"},{"id":"chatgpt-campaign-1","name":"chatgpt-campaign-1.md","content":"# MAKEUP AND HAIR BY ELSA\n# COMPLETE SOCIAL MEDIA CAMPAIGN PLAN\n### Bridal Beauty Relaunch & Engagement Season 2026–2027\n\n**Campaign:** *Timeless Beauty. A New Chapter.* [I]  \n**Launch:** November 9, 2026 [A]  \n**Initial campaign:** November 9–December 6, 2026 [A]  \n**Engagement-season extension:** December 2026–February 2027 [A]  \n**Primary market:** Dallas–Fort Worth [V]  \n**Platforms:** Instagram, Facebook, Google Business Profile, TikTok\n\n**Campaign objective:** [I] Generate qualified wedding inquiries that convert into profitable bookings, while rebuilding consistent visibility following Elsa's return from maternity leave.\n\n**Evidence key**\n\n| Label | Meaning |\n|---|---|\n| **[V]** | Verified in the supplied research |\n| **[E]** | Calculated from verified prices or stated assumptions |\n| **[A]** | Proposed target, scenario, or test value |\n| **[I]** | Recommendation or inference |\n| **[Q]** | Information requiring Elsa's confirmation |\n\n---\n\n# 1. CAMPAIGN STRATEGY & REVENUE GOALS\n\n**Bottom line:** [I] Build the campaign around the $100K annual revenue model first. The objective is not maximum followers or viral views; it is getting the right brides to inquire, understand the packages, and reserve their dates.\n\n## 1.1 The $100K Revenue Target\n\nThe business review established this Base scenario:\n\n| Metric | Target |\n|---|---:|\n| Annual gross revenue | **$100,360 [E/A]** |\n| Weddings annually | 32 [A] |\n| Average wedding value (AOV) | $2,948.75 [E/A] |\n| Annual wedding revenue | $94,360 [E/A] |\n| Classes and additional services | $6,000 annually [A] |\n| Monthly average wedding bookings needed | 2.67 [E/A] |\n| Annual qualified wedding inquiries at 35% conversion | 92 [E/A] |\n| Average monthly qualified inquiries needed | 7.67 [E/A] |\n| Estimated pre-tax owner take-home | $36,201.20 [E/A] |\n\n**AOV = average order value:** The average total amount contracted for one wedding.\n\n**[I] Important:** The financial model is hypothetical. Elsa's actual existing revenue and bookings remain unknown [Q]. The campaign must support the business's real baseline rather than assume it is starting from zero.\n\n## 1.2 What Social Media Should Contribute\n\n**[A] Proposed first-year attribution target:** Generate 25% of the modeled wedding bookings through the combined Instagram, Facebook, Google Business Profile, and TikTok campaign.\n\n| Metric | Calculation | Target |\n|---|---|---:|\n| Total annual wedding bookings | Business model | 32 [A] |\n| Campaign-attributed share | 32 × 25% | **8 bookings [E/A]** |\n| Campaign-attributed wedding revenue | 8 × $2,948.75 | **$23,590 [E/A]** |\n| Qualified inquiries required | 8 ÷ 35%, rounded up | **23 [E/A]** |\n| Average inquiries required monthly | 23 ÷ 12 | **1.92 [E/A]** |\n| Weddings from other channels | 32 − 8 | **24 [E/A]** |\n\n**[I] This keeps the plan realistic.** Social media supports the business; existing customer referrals, wedding directories, vendor relationships, and other discovery sources continue to matter.\n\nThe 25% attribution share is a proposed target, not evidence of Elsa's historical marketing performance.\n\n### Campaign attribution rules\n\n**[I] Count each wedding once.** If a bride discovers Elsa on Instagram, visits Google, and then submits the website form, do not count that as three different leads.\n\nRecord:\n\n- First known discovery source.\n- Source immediately preceding the inquiry, if known.\n- Client-reported source.\n- Confirmed booking outcome.\n\nWhere attribution is unclear, record **Unknown** rather than guessing.\n\n## 1.3 First 90-Day Campaign Goals\n\n| KPI | 90-day target | Why it matters |\n|---|---:|---|\n| Qualified campaign inquiries | 6 [A] | Tests whether digital content produces relevant leads |\n| Confirmed campaign bookings | 2 [A] | Tests conversion into actual business |\n| Modeled contracted wedding revenue | 2 × $2,948.75 = **$5,897.50 [E/A]** | Connects marketing to revenue |\n| Lead response | Internal target of 2–4 business hours [A] | Reduces avoidable response delays |\n| Inquiry source tracking | 100% recorded or marked Unknown [A] | Makes attribution measurable |\n| Instagram feed posts | 36 [A] | Establishes consistency |\n| Facebook feed posts | 36 adaptations [A] | Reuses content efficiently |\n| TikTok videos | 12 [A] | Tests discovery using existing footage |\n| Google Business Profile posts | 12 [A] | Maintains consistent local-business communication |\n| Review request coverage | 100% of eligible completed clients [A] | Creates a systematic review process |\n| Vendor introductions | Up to 60 personalized messages [A] | Tests relationship-based acquisition |\n\n**[I] Two bookings from six qualified inquiries imply approximately 33.3% conversion [E/A].** This is close to the 35% planning assumption, but a sample this small cannot establish a reliable long-term conversion rate.\n\n### What success looks like after four weeks\n\n**[A] Initial test goals:**\n\n- Publish the planned content consistently.\n- Track at least two qualified inquiries attributable to the campaign.\n- Record profile visits, website clicks, direct messages, and Google actions.\n- Identify the most useful content topics.\n- Record actual bookings without assuming that an inquiry becomes a sale.\n\n**[I] A month with no bookings is not automatically proof the campaign failed.** Wedding planning involves decisions that may extend beyond the reporting period.\n\nHowever, consistently weak inquiries or poor conversion should trigger changes before increasing content production.\n\n---\n\n# 2. CAMPAIGN CREATIVE DIRECTION\n\n**Bottom line:** [I] Use Elsa's return as a personal reintroduction, not a dramatic rebrand. The campaign should feel warm, calm, premium, and personal, with authentic bridal work providing most of the visual impact.\n\n## 2.1 Campaign Concept\n\n### **TIMELESS BEAUTY. A NEW CHAPTER.**\n\n**Main message:**\n\n*Some things change. Beautifully. Our love for natural, timeless bridal beauty remains the same.*\n\n**Supporting message:**\n\n*Because your Natural Beauty is Timeless.*\n\n### Why this works\n\n| Element | Evidence | Campaign use |\n|---|---|---|\n| Founder return | [V] Elsa announced her return after having baby Apollo on October 17, 2026 | [I] Reintroduce Elsa and her business |\n| Established experience | [V] Career began in 2013 | [I] Reinforce continuity and experience |\n| Signature style | [V] Natural and flawless; \"feel like myself\" | [I] Center the campaign on confidence and authenticity |\n| Team model | [V] Artists selected and trained by Elsa | [I] Reassure clients that the business is team-supported |\n| Bridal packages | [V] Radiant, Timeless, Royal | [I] Connect the emotional story to actual services |\n\n**[I] This is a continuation of the October 17 return announcement—not a claim that Elsa has only just returned.**\n\n## 2.2 The \"Back From Baby\" Relaunch\n\n### Three-part rollout\n\n| Stage | Message | Visual |\n|---|---|---|\n| **1. Personal reintroduction** | [I] \"A new chapter, the same love for what I do.\" | Authentic Elsa portrait or approved working footage |\n| **2. Reintroduce the team** | [I] \"The beauty experience you've come to know is built around a team.\" | Actual artist work and approved team images |\n| **3. Return to bridal inspiration** | [I] \"Your wedding-day beauty should still feel like you.\" | Natural bridal looks from the real portfolio |\n\n### Recommended relaunch caption\n\nA new chapter. The same love for what I do.\n\nAfter welcoming our baby, I'm finding my way back into the beautiful world of bridal hair and makeup—and I'm so grateful to be here.\n\nBecoming a mom has brought a new chapter into my life, but one thing hasn't changed: my love for helping women feel beautiful, confident, and completely themselves.\n\nAt Makeup and Hair by Elsa, our approach has always been about enhancing your natural beauty, never hiding it.\n\nI'm excited to continue sharing the work I love, the beautiful moments we're part of, and the talented team behind our bridal beauty experiences.\n\nTo everyone who has supported this journey, thank you.\n\nAnd to the brides planning their next chapter, we'd love to hear your story.\n\nExplore our work and inquire about your wedding date through the link in our bio.\n\nBecause your Natural Beauty is Timeless.\n\n#MakeupAndHairByElsa #DFWBrides #DallasBridalMakeup #NaturalBridalBeauty\n\n**Approval requirement [Q]:** Elsa must approve how much of her motherhood experience she wants to share.\n\n**[I] Do not make her child a recurring marketing subject or require baby photographs.** The business and authentic bridal work should remain the primary focus.\n\n### Relaunch visual direction\n\n| Component | Recommendation |\n|---|---|\n| Photography | [I] Real bridal portraits, Elsa at work, authentic preparation moments |\n| Color palette | [A] Warm ivory `#F7F2EB`, charcoal `#292623`, soft blush `#E9D5CF`, muted taupe `#AB9888` |\n| Typography | [I] Elegant, readable headlines with straightforward body text |\n| Video editing | [I] Natural motion, clean cuts, restrained transitions |\n| Voice | [I] Warm, calm, confident, personal |\n| Graphics | [I] Minimal text overlays and genuine portfolio imagery |\n| Avoid | [I] Heavy filters, fake transformations, invented testimonials, exaggerated luxury claims |\n\n**[I] The proposed colors are creative suggestions, not verified existing brand colors.** Elsa should approve them before implementation.\n\n---\n\n# 3. CONTENT PILLARS\n\n**Bottom line:** [I] Organize content into repeatable categories that answer customer questions. Every post should either demonstrate real work, explain the experience, establish trust, or help a potential client take the next step.\n\n## Six Campaign Pillars\n\n| Pillar | Share [A] | Purpose [I] | Example topics |\n|---|---:|---|---|\n| **1. Real Bridal Beauty** | 30% | Show results and signature style | Natural bridal makeup, hairstyles, genuine moments |\n| **2. Bridal Education** | 20% | Address concerns before inquiry | Trials, Texas weather, timelines, hair textures |\n| **3. Meet Elsa & the Team** | 15% | Build personal trust | Founder story, team approach, preparation |\n| **4. Reviews & Client Experience** | 15% | Establish credibility | Genuine reviews, client feedback, real experiences |\n| **5. Packages & Booking** | 15% | Generate qualified inquiries | Radiant, Timeless, Royal, booking steps |\n| **6. Classes & Special Events** | 5% | Support secondary revenue | Self Makeup Masterclass, styling classes |\n\n**[A] Shares are editorial targets, not requirements for every four-week period.** Small content calendars will not match the percentages exactly.\n\n### Priority order\n\n**[I] Real bridal work should remain the largest pillar.**\n\nElsa should not turn her Instagram feed into an advertisement catalog or a collection of generic beauty advice.\n\n### Content-to-business connection\n\n| Customer concern | Content response | Business outcome [I] |\n|---|---|---|\n| \"Will I still look like myself?\" | Natural bridal close-ups and genuine results | Bridal inquiries |\n| \"How does the process work?\" | Inquiry and booking explanation | More complete inquiries |\n| \"Can the team handle everyone?\" | Service-count and timeline education | Larger, better-planned bookings |\n| \"Why does the package cost more?\" | Complete package comparison | Better-qualified inquiries |\n| \"Can I trust the team?\" | Genuine reviews and team information | Greater booking confidence |\n| \"What about Texas weather?\" | Hairstyle and preparation education | Relevant service discussions |\n| \"Can Elsa teach me?\" | Real class information | Additional non-wedding revenue |\n\n---\n\n# 4. POSTING CADENCE BY PLATFORM\n\n**Bottom line:** [I] Create content once and adapt it across platforms. Instagram should be the primary visual portfolio, Google Business Profile should support local discovery, Facebook should reinforce credibility, and TikTok should test discovery through short videos.\n\n## 4.1 Recommended Weekly Cadence\n\n| Platform | Frequency [A] | Content | Primary goal [I] | Owner |\n|---|---|---|---|---|\n| **Instagram Feed** | 3 posts/week | 1 Reel + 2 carousels | Bridal discovery, trust, inquiries | Aaron prepares; Elsa approves |\n| **Instagram Stories** | 4 days/week | 1–2 frames per day | Maintain relationships and explain services | Elsa / Aaron |\n| **Facebook** | 3 posts/week | Adapt Instagram content | Website visits and inquiries | Aaron |\n| **Google Business Profile** | 1 post/week | Services, real bridal work, booking information | Local search inquiries | Aaron |\n| **Google Photos** | 2–4 approved additions/week | Authentic bridal portfolio | Strengthen listing content | Aaron |\n| **TikTok** | 1 video/week | Adapt original Reel footage | Reach potential new audiences | Aaron |\n| **Review invitations** | After each eligible completed booking | Approved neutral email sequence | Increase authentic review coverage | Elsa / Bot drafts |\n| **Vendor outreach** | 5 personalized contacts/week | Planners, venues, photographers | Referral relationships | Elsa / Aaron |\n\n### Monthly output\n\n| Platform | Four-week output [E/A] |\n|---|---:|\n| Instagram feed | 12 posts |\n| Instagram Stories | 16 active days |\n| Facebook | 12 posts |\n| Google Business Profile | 4 posts |\n| Google photos | 8–16 additions |\n| TikTok | 4 videos |\n| Vendor introductions | Up to 20 |\n\n**[I] These are production targets, not evidence that this frequency is optimal.** Review actual results and workload before increasing output.\n\n## 4.2 Platform-Specific Rules\n\n### Instagram\n\n**[I] Role:** Primary visual discovery and trust platform.\n\nEvery post should direct interested brides toward one of three actions:\n\n1. Explore the portfolio.\n2. Understand the bridal packages.\n3. Inquire about their date.\n\n**Primary destination:** `/contact/` [V]\n\n**Secondary destinations:** `/services/` and `/portfolio/` [V]\n\nUse genuine portfolio images, natural editing, readable typography, and a clear opening.\n\n### Facebook\n\n**[I] Role:** Reinforce credibility and provide an additional contact path.\n\nAdapt Instagram posts rather than duplicating all creative work.\n\nUse fuller captions where useful and link directly to the relevant website page.\n\n**[Q] Confirm the Facebook contact button and current page settings before relying on them.**\n\n### Google Business Profile\n\n**[I] Role:** Convert local discovery into website visits and qualified inquiries.\n\nPrioritize:\n\n- Accurate business information.\n- Verified service prices.\n- Authentic photos.\n- Genuine reviews.\n- Clear inquiry links.\n- Useful service-related posts.\n\n[V] The existing profile has 21 five-star reviews and 83 photos.\n\n**[I] Do not create a fake public salon location or encourage customers to request directions to a non-public address.**\n\n### TikTok\n\n**[I] Role:** Test whether short, authentic bridal videos generate meaningful discovery.\n\nUse the same approved footage as Instagram, but prepare a platform-appropriate version without embedded Instagram interface graphics.\n\nKeep the opening immediately understandable.\n\n**[I] Do not create a separate TikTok production operation until actual results justify it.**\n\n---\n\n# 5. COMPLETE FOUR-WEEK CAMPAIGN CALENDAR\n\n**Bottom line:** [I] The first month should progress from reintroducing Elsa to demonstrating expertise, building trust, and introducing engagement-season planning. This creates a recognizable campaign rather than twelve unrelated posts.\n\n**Campaign period:** November 9–December 6, 2026 [A].\n\nAll content topics, formats, and publishing dates below are proposed [A/I]. Verified service claims and prices are marked [V].\n\n## WEEK 1 — NOVEMBER 9–15\n### Theme: A New Chapter\n\n**Objective:** [I] Reintroduce Elsa and clarify what the business offers today.\n\n| Date [A] | Platform | Content | Hook / headline [I] | CTA |\n|---|---|---|---|---|\n| Mon, Nov 9 | IG Reel + FB + TikTok | Back-from-baby relaunch | \"A new chapter. The same love for what I do.\" | Explore our work |\n| Tue, Nov 10 | IG Stories | Founder introduction | \"Meet Elsa.\" | Visit About |\n| Wed, Nov 11 | IG Carousel + FB | Three bridal packages | \"Your bridal beauty experience starts here.\" | View packages |\n| Thu, Nov 12 | GBP | Mobile bridal beauty introduction | \"Natural bridal beauty, brought to you.\" | Inquire |\n| Thu, Nov 12 | IG Stories | Package comparison | \"Radiant, Timeless, or Royal?\" | Explore Services |\n| Fri, Nov 13 | IG Carousel + FB | How booking works | \"Inquire. Plan. Reserve.\" | Check your date |\n| Sat, Nov 14 | IG Stories | Approved bridal portfolio | \"Beautifully you.\" | View portfolio |\n| Sun, Nov 15 | IG Stories | Inquiry reminder | \"Planning your wedding?\" | Contact |\n\n**Weekly deliverables [E/A]:** Three Instagram posts, three Facebook adaptations, one TikTok, one Google post, and four active Story days.\n\n### Essential content details\n\n**Monday:** Use the relaunch caption from Section 2.\n\n**Wednesday:** Show verified prices—Radiant $1,125, Timeless $1,365, Royal $1,685 [V]—and explain that travel is additional.\n\n**Friday:** Explain the existing inquiry, quote, contract, and deposit process [V].\n\n**[I] End-of-week action:** Pin the relaunch, package, and booking-process posts if Elsa approves them.\n\n---\n\n## WEEK 2 — NOVEMBER 16–22\n### Theme: Bridal Beauty That Feels Like You\n\n**Objective:** [I] Reinforce natural beauty and answer practical client concerns.\n\n| Date [A] | Platform | Content | Hook / headline [I] | CTA |\n|---|---|---|---|---|\n| Mon, Nov 16 | IG Carousel + FB | Natural bridal looks | \"You should still recognize yourself.\" | Save inspiration |\n| Tue, Nov 17 | IG Stories | Makeup preference poll | \"Soft glam or barely-there makeup?\" | Respond |\n| Wed, Nov 18 | IG Carousel + FB | Bridal trial explained | \"What is your bridal trial for?\" | View Services |\n| Thu, Nov 19 | GBP | Bridal trials | \"Explore your wedding-day beauty options.\" | View trial details |\n| Thu, Nov 19 | IG Stories | Trial information | \"Your bridal trial: $475.\" [V] | Explore Services |\n| Fri, Nov 20 | IG Reel + FB + TikTok | French twist / Texas weather | \"Texas wedding weather? Let's talk hair.\" | Inquire |\n| Sat, Nov 21 | IG Stories | Hairstyle detail | \"An elegant bridal updo.\" | View portfolio |\n| Sun, Nov 22 | Internal only | Weekly review | Review inquiries, saves, clicks, and workload | Adjust plan |\n\n### Essential content details\n\n**Monday:** Use approved authentic images demonstrating Elsa's natural bridal style.\n\n**Wednesday:** Explain the trial without inventing unconfirmed steps or deliverables.\n\n**Friday:** Reuse genuine French-twist work when media permission is confirmed.\n\n**[I] Avoid describing a style as guaranteed to survive extreme heat or humidity.**\n\n---\n\n## WEEK 3 — NOVEMBER 23–29\n### Theme: Confidence, Comfort & Trust\n\n**Objective:** [I] Help potential clients understand the experience beyond makeup application.\n\n| Date [A] | Platform | Content | Hook / headline [I] | CTA |\n|---|---|---|---|---|\n| Mon, Nov 23 | IG Carousel + FB | Genuine client feedback | \"What matters most on your wedding morning?\" | Read reviews |\n| Tue, Nov 24 | IG Stories | Review excerpt | `{paste real review}` | View review source |\n| Wed, Nov 25 | IG Carousel + FB | Wedding-morning timeline |  Inquire |\n| Fri, Dec 4 | IG Reel + FB + TikTok | Newly engaged bridal beauty | \"Just engaged? Save this before choosing your beauty team.\" | Explore Services |\n| Sat, Dec 5 | IG Stories | Authentic bridal portrait | \"Your next chapter, beautifully you.\" | View portfolio |\n| Sun, Dec 6 | Internal only | Campaign review | Compare first four weeks against targets | Decide next cycle |\n\n### Essential content details\n\n**Monday:** Timeless is $1,365 [V] and includes engagement-session hair and makeup in addition to the Radiant package inclusions [V].\n\n**Wednesday:** Explain the information already requested on Elsa's contact form.\n\n**Friday:** Offer a useful planning checklist, not a fictional discount.\n\n**[I] Do not claim that specific 2027 dates are available without checking the booking calendar.**\n\n---\n\n# 6. ENGAGEMENT-SEASON CAMPAIGN: DECEMBER–FEBRUARY\n\n**Bottom line:** [I] Treat December through February as a focused period for content aimed at newly engaged couples. This is a campaign hypothesis to test, not a verified seasonal sales pattern for Elsa.\n\n## 6.1 Seasonal Campaign Message\n\n### **JUST ENGAGED? LET'S TALK BRIDAL BEAUTY.**\n\nSupporting copy:\n\n*From engagement photos to your wedding morning, your beauty experience should feel like you.*\n\n### Monthly Themes\n\n| Month | Campaign theme [I] | Main service focus | Primary CTA |\n|---|---|---|---|\n| **December 2026** | \"A Beautiful New Chapter\" | Timeless package, bridal trials, inquiries | Explore bridal packages |\n| **January 2027** | \"Your Wedding Beauty Starts With a Plan\" | Bridal timelines, party services, trials | Inquire about your date |\n| **February 2027** | \"Timeless Beauty, Every Step of the Way\" | Engagement-session glam, bridal beauty, classes | Request availability |\n\n**[I] These themes should be repeated across Instagram, Facebook, Google, and TikTok using adapted versions of the same approved creative.**\n\n## 6.2 Seasonal Content Hooks\n\n| Hook [I] | Format | Business connection |\n|---|---|---|\n| \"Just engaged? Here's where to start.\" | Reel | Inquiry process |\n| \"Your wedding date is set. What about your beauty timeline?\" | Carousel | Planning support |\n| \"Engagement photos deserve a look that feels like you.\" | Reel | Timeless package |\n| \"Your bridal trial: what to know before you inquire.\" | Carousel | Bridal trials |\n| \"Don't forget the people getting ready with you.\" | Reel | Attendant services |\n| \"One wedding day. Two bridal looks.\" | Reel | Royal package |\n| \"Natural bridal makeup is a personal choice.\" | Carousel | Signature positioning |\n| \"Planning a Texas wedding?\" | Reel | Mobile services and styling |\n| \"Your engagement photos and wedding beauty can be planned together.\" | Carousel | Timeless package |\n| \"A beauty class can be a thoughtful gift.\" | Carousel | Existing giftable classes [V] |\n\n## 6.3 Seasonal Offers — No Invented Discounts\n\n**[I] Lead with existing services rather than introducing a price cut before Elsa has profitability data.**\n\n| Offer | Price | Positioning [I] |\n|---|---:|---|\n| **Radiant Bridal Experience** | $1,125 [V] | Bridal trial and wedding-day beauty with additional inclusions |\n| **Timeless Bridal Experience** | $1,365 [V] | Engagement-session beauty and wedding-day preparation together |\n| **Royal Bridal Experience** | $1,685 [V] | Extended touch-ups and a second look |\n| **Bridal Trial** | $475 [V] | Individual makeup and hair trial |\n| **Wedding-Day Bridal Hair + Makeup** | $700 [V] | À la carte bridal services |\n| **Wedding-Party Hair + Makeup** | $280 per attendant [V] | Coordinated beauty for additional party members |\n| **Self Makeup Masterclass** | $250 [V] | Private four-hour makeup instruction |\n\nTravel fees are additional where specified in the published pricing [V].\n\n### Recommended featured offer by month\n\n**December — Timeless**\n\n[I] Lead with the engagement-session inclusion. This connects directly with the proposed newly engaged audience.\n\n**January — Radiant and Bridal Trials**\n\n[I] Focus on planning the bridal look and understanding the process.\n\n**February — Royal and Classes**\n\n[I] Use the second-look concept for brides exploring different wedding-day styles. Promote classes separately as a giftable beauty experience.\n\n### What not to advertise\n\n**[I] Avoid these claims without additional evidence or Elsa's approval:**\n\n- \"Only three dates left.\"\n- \"Book today and save 20%.\"\n- \"Most popular bridal artist in Dallas.\"\n- \"Guaranteed 16-hour flawless results.\"\n- \"Free trial with every booking.\"\n- \"Every bride gets Elsa personally.\"\n- \"Instantly book your wedding date.\"\n\n**[I] Scarcity, discounts, availability, guarantees, and free inclusions must come from actual approved business terms—not marketing assumptions.**\n\n---\n\n# 7. REELS & TIKTOK VIDEO PLAN\n\n**Bottom line:** [I] Use short videos to show authentic bridal work and answer one useful question at a time. Reels should make sense without audio, introduce the subject immediately, and end with one clear next step.\n\n## 7.1 Video Production Standards\n\n| Element | Recommendation |\n|---|---|\n| Length | 10–15 seconds [A] |\n| Format | Vertical 9:16 [A] |\n| Opening | [I] Show the main subject immediately |\n| Text | [I] Large, readable, minimal wording |\n| Footage | [I] Authentic, approved client or artist work |\n| Audio | [I] Licensed or appropriately permitted music |\n| Editing | [I] Clean cuts, minimal effects, no misleading beauty filters |\n| Final screen | [I] Makeup and Hair by Elsa + relevant CTA |\n| Instagram | [I] Direct viewers to the profile's inquiry link |\n| TikTok | [I] Use an accurate profile or website CTA supported by the account's available features |\n| Approval | [I] Elsa reviews every finished video before publishing |\n\n**[Q] Confirm TikTok's current link and business-profile functionality for Elsa's account before directing viewers to an n\n**TikTok adaptation [I]:** Keep the story personal and concise. Avoid requiring viewers to know the previous maternity announcement.\n\n### REEL 2 — Texas Wedding Hair\n\n**Duration:** 12 seconds [A]\n\n| Time [A] | Visual | On-screen text |\n|---|---|---|\n| 0–2 sec | Finished French twist | \"Texas wedding weather?\" |\n| 2–5 sec | Authentic hair preparation | \"Your hairstyle needs a plan.\" |\n| 5–8 sec | Close-up from another angle | \"Let's talk about your hair.\" |\n| 8–10 sec | Finished hairstyle | \"Natural. Elegant. Timeless.\" |\n| 10–12 sec | Brand end card | \"Inquire about your date.\" |\n\n**[I] The goal is to introduce a practical planning concern, not guarantee weather resistance.**\n\n### REEL 3 — Curly-Hair Bridal Inspiration\n\n**Duration:** 12 seconds [A]\n\n| Time [A] | Visual | On-screen text |\n|---|---|---|\n| 0–2 sec | Authentic bridal curls | \"Your texture matters.\" |\n| 2–5 sec | Styling detail | \"Your hair. Your vision.\" |\n| 5–8 sec | Approved second angle | \"Natural beauty is personal.\" |\n| 8–10 sec | Complete hairstyle | \"Beautifully you.\" |\n| 10–12 sec | Brand end card | \"Explore our bridal work.\" |\n\n**[Q] Confirm actual footage and consent before production.**\n\n### REEL 4 — Just Engaged?\n\n**Duration:** 15 seconds [A]\n\n| Time [A] | Visual | On-screen text |\n|---|---|---|\n| 0–2 sec | Approved bridal portrait | \"Just engaged?\" |\n| 2–5 sec | Simple text card | \"Start with your wedding date.\" |\n| 5–8 sec | Genuine bridal preparation | \"Know your getting-ready location.\" |\n| 8–11 sec | Authentic makeup or hair detail | \"Explore your beauty options.\" |\n| 11–13 sec | Package overview | \"Radiant. Timeless. Royal.\" |\n| 13–15 sec | Brand end card | \"Inquire about your date.\" |\n\n**[I] This should be the first video in the December engagement-season phase.**\n\n---\n\n# 8. INSTAGRAM STORIES & HIGHLIGHTS\n\n**Bottom line:** [I] Stories should provide lightweight interaction and answers to common questions. Highlights should make the profile useful to a bride who discovers Elsa for the first time.\n\n## 8.1 Weekly Stories Routine\n\n**[A] Four active Story days per week, with one or two frames per active day.**\n\n| Day | Theme | Example |\n|---|---|---|\n| Monday | Bridal inspiration | Approved natural makeup or hairstyle |\n| Tuesday | Preference poll | \"Soft glam or a natural finish?\" |\n| Thursday | Service education | Package inclusion or booking FAQ |\n| Saturday | Portfolio or review | Authentic bridal work or a verified review excerpt |\n\n**[I] On other days, share content only when Elsa has something useful and approved.**\n\nDo not create unnecessary daily obligations.\n\n### Ready-to-Use Story Prompts\n\n| Theme | Frame 1 | Frame 2 |\n|---|---|---|\n| Bridal inspiration | \"You should still feel like yourself.\" | \"Explore our natural bridal beauty portfolio.\" |\n| Pricing | \"Bridal packages from $1,125.\" [V] | \"Travel additional. Full details on our website.\" |\n| Wedding party | \"Getting ready with your favorite people?\" | \"Ask about wedding-party beauty services.\" |\n| Trials | \"Wondering about a bridal trial?\" | \"Makeup + hair trial: $475.\" [V] |\n| Reviews | `{paste real review}` | \"Read more genuine client feedback.\" |\n| Booking | \"Planning your wedding?\" | \"Tell us your date and location.\" |\n| Classes | \"Learn makeup techniques for yourself.\" | \"Explore our Self Makeup Masterclass.\" |\n\n### Story interaction ideas\n\n**[I] Use simple questions that help understand what viewers are interested in.**\n\n- \"Hair up or down?\"\n- \"Natural makeup or soft glam?\"\n- \"Getting ready at a hotel or venue?\"\n- \"Are you planning engagement photos?\"\n- \"Which bridal hairstyle are you saving?\"\n\n**[I] These responses are engagement signals, not verified sales leads.** A follower becomes a qualified inquiry only when they provide sufficient information about a genuine service need.\n\n---\n\n## 8.2 Highlights Structure\n\n[V] Elsa currently has Brides, Client's Love, Published Work, Shop, About me, and Office Hours.\n\n**[I] Reorganize them around what a potential bride needs to know.**\n\n| Order [A] | Highlight | Content |\n|---|---|---|\n| 1 | **Start Here** | Elsa, mobile service, DFW coverage, inquiry CTA |\n| 2 | **Brides** | Authentic bridal portfolio |\n| 3 | **Packages** | Radiant, Timeless, Royal, published pricing |\n| 4 | **Reviews** | Genuine client feedback and review links |\n| 5 | **Meet Elsa** | Founder story and approved team content |\n| 6 | **How to Book** | Inquiry, quote, agreement, deposit |\n| 7 | **Classes** | Existing makeup and hair lessons |\n| 8 | **Features** | Actual published work and authorized credits |\n\n**[Q] Verify what the existing Shop Highlight promotes.**\n\n**[Q] Confirm current business hours before republishing Office Hours content.**\n\n### Highlight maintenance\n\n**[A] Monthly review checklist:**\n\n- Confirm prices are current.\n- Remove obsolete availability statements.\n- Verify all links.\n- Remove expired offers.\n- Check review accuracy.\n- Confirm media permissions.\n- Ensure no outdated booking instructions remain.\n\n**[I] Highlights are persistent sales information. Treat them like miniature website pages rather than an archive of random Stories.**\n\n---\n\n# 9. REVIEW-GENERATION CAMPAIGN\n\n**Bottom line:** [I] Elsa already has a useful public review foundation. The opportunity is to request genuine feedback consistently from every eligible completed client, not to manipulate ratings or generate artificial testimonials.\n\n## 9.1 Starting Review Baseline\n\n| Platform | Verified status |\n|---|---|\n| Google | 5.0 stars, 21 reviews [V] |\n| The Knot | 5.0 stars, 15 reviews [V] |\n| WeddingWire | 5.0 stars, 9 reviews [V] |\n| Facebook | 100% recommend, 5 reviews [V] |\n| Zola | 5.0 stars, 4 reviews [V] |\n\n**[E] Platform counts total 54, but the research describes approximately 50 public reviews.**\n\n**[I] Do not present this
