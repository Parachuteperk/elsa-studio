g | Source |\n|---|---|---|\n| CMS | WordPress 7.1.4 | `<meta name=\"generator\">` on homepage HTML |\n| Page builder | Elementor 4.3.6 | Same |\n| Theme | Lilou (wp-content/themes/lilou) | Asset paths |\n| Also present | WooCommerce 11.2.2, Contact Form 7, WPForms (contact), Smash Balloon Instagram Feed, Jetpack (image CDN i0.wp.com), Mauve Elementor plugins | Asset paths in HTML |\n| Viewport | Present: `width=device-width, initial-scale=1` | Homepage |\n| robots.txt / sitemap.xml | Both returned HTTP **406 Mod_Security** to curl with simple UA (blocked); not verified | curl 2026-11-05 |\n| Homepage HTML weight | ~380 KB HTML alone (before CSS/JS/images) | curl size |\n| Image CDN | Jetpack Photon’s i0.wp.com | HTML |\n| Booking | No Calendly/Acuity/GlossGenius/etc. Inquiry → WPForms on /contact/ → contract + 50% deposit | FAQ + contact HTML |\n| Screenshots saved | `/workspace/elsa/screens/` — home, services, about, portfolio, faq, contact, makeup-and-hair-classes × desktop 1280×900 and phone 390×844 | Headless Chrome `--screenshot` (viewport capture, **not** full-page scroll) |\n\n### 2.2 Pages crawled (live HTTP status)\n\n| URL | Status | Notes |\n|---|---|---|\n| https://makeupandhairbyelsa.com/ | 200 | Current homepage |\n| https://makeupandhairbyelsa.com/home/ | 200 | **Older/alternate homepage** still live (different title, meta description literally `\"1.\"`) |\n| https://makeupandhairbyelsa.com/about/ | 200 | |\n| https://makeupandhairbyelsa.com/services/ | 200 | Pricing live here |\n| https://makeupandhairbyelsa.com/portfolio/ | 200 | Large gallery (~53 `<img>` tags in HTML) |\n| https://makeupandhairbyelsa.com/faq/ | 200 | |\n| https://makeupandhairbyelsa.com/contact/ | 200 | Inquiry form |\n| https://makeupandhairbyelsa.com/makeup-and-hair-classes/ | 200 | Classes pricing |\n| /booking/, /book/, /pricing/, /blog/, /reviews/, /testimonials/, /faqs/, /classes/ | **404** (custom 404 still ~218 KB branded page) | |\n\nNav destinations in use: Home, About, Services, Portfolio, FAQ, Makeup and Hair Classes, Contact.\n\n### 2.3 Titles, meta, headings (selected)\n\n| Page | Title | Meta description | H1 |\n|---|---|---|---|\n| / | Homepage - Makeup and Hair by Elsa | “Dallas-Fort Worth bridal makeup and hair team with 13+ years…” | **None** (content uses H2s) |\n| /home/ | Long “premier Dallas Wedding…” title | **Broken:** content = `1.` | Multiple H1s (overuse) |\n| /about/ | About - … | Mentions Elsa Delgado Perkins, 13+ years | None |\n| /services/ | Services - … | Bridal packages/pricing, comes to you | None |\n| /portfolio/ | Portfolio - … | Bridal portfolio DFW | “Portfolio” + “Welcome to our Bridal Beauty Portfolio!” |\n| /faq/ | FAQs - … | Starts with booking FAQ text (odd for meta) | “FAQs” |\n| /contact/ | Contact - … | Inquiry within 24 hours | “Contact” |\n| /makeup-and-hair-classes/ | Makeup and Hair Classes - … | Private/group classes DFW | “Makeup and Hair Classes” |\n\n**SEO / structured data notes:**\n- JSON-LD on homepage: `@graph` with `BeautySalon` + `Organization`, `WebSite`, `WebPage`, `Person` (author slug `elsa.mdh`), `Article`. **No `LocalBusiness` address, geo, telephone, `aggregateRating`, or `Offer`/`PriceSpecification`.** Opening hours only.\n- Homepage has **0 H1** tags; marketing copy lives in H2/H3.\n- Alt text: homepage ~25 `<img>`, ~13 with non-empty alt, ~12 missing/empty (**partial** coverage).\n- Homepage `og:image` was null in parse; `/home/` still has an og:image.\n- Canonical set on pages checked.\n\n### 2.4 Homepage content & CTAs (from live /)\n\n- Hero themes: “I want to feel like myself” / “Timeless beauty” / DFW + beyond.\n- Introduces Elsa as founder; team trained to her standard.\n- “How to reserve your wedding day?” with INQUIRE CTA → contact.\n- Experience bullets: mobile; 5-star team; celebrity trained; 13+ years; 16-hour airbrush/photogenic makeup; extensions; tattoo concealment; custom quotes.\n- Testimonials quotes on site (names: Madison/Angie/Joy/Brooklyn variants appear across pages).\n- Instagram embed section (“Connect with me on Instagram”).\n- Primary CTA language: **Inquire** / **Inquire now** (not “Book online”).\n- **No prices on homepage.**\n\n### 2.5 Services & pricing (from https://makeupandhairbyelsa.com/services/ — Elementor price tables)\n\n**Bridal packages** (team artist; **+\\$175** to request Elsa personally, subject to availability):\n\n| Package | Price | Stated “value” / savings | Includes (as listed) |\n|---|---|---|---|\n| Radiant | **\\$1,125** | Value \\$1,325 — save \\$200 | Trial; Mini facial & massage; Wedding day MU&H; Body glow; 1-hr touch-up; Luxury bridal kit (\\$50 gift) |\n| Timeless | **\\$1,365** | Value \\$1,605 — save \\$240 | Radiant items + Engagement session MU&H (“choice most of our brides make”) |\n| Royal | **\\$1,685** | Value \\$1,980 — save \\$295 | Timeless items + 2-hr touch-up + Second Look after ceremony |\n\n**Travel (packages):** “Travel fee of \\$100 per artist not included.” Additional artists on request.\n\n**À la carte bridal (same page):**\n\n| Service | Price | Notes |\n|---|---|---|\n| Bridal trial (MU + hair) | **\\$475** | Just MU \\$295 / Just hair \\$295; 3 hrs; travel \\$25 per 15 min round trip |\n| Wedding day bride MU + hair | **\\$700** | Just MU \\$350 / Just hair \\$350; mini facial; veil/accessory; body glow; 3 hrs; travel **\\$100/hour per artist** |\n| Second Look | **\\$175** | 15–30 min |\n| Attendants / pre-wedding glam | **\\$280** | Just MU \\$140 / Just hair \\$140 |\n| Junior (ages 8–12) | **\\$220** | Just MU \\$110 / Just hair \\$110 |\n| Flower girl (≤7) | **\\$90** | Age-appropriate MU + hair choice |\n\n**Social / non-bridal glam:** also listed at **\\$280** (MU \\$140 / hair \\$140); same \\$25/15-min travel rule.\n\n**Bride extras called out:** email/Zoom consult; 5+ tip emails; personal phone; timeline; touch-up kit; party touch-ups after services.\n\n**Deposit / cancel (Services + FAQ):**\n- 50% non-refundable deposit to hold date (with signed contract).\n- Balance due **30 days** before event.\n- Payments: debit/credit, PayPal, Venmo, Zelle (FAQ); later FAQ line also says remaining via Venmo or Zelle — **wording inconsistency** worth clarifying.\n- Cancel/reschedule: ≥48 hours notice; deposit non-refundable; may apply to future with notice; no-show fee otherwise.\n- Headcount finalization: no later than **8 weeks** before wedding.\n- Artist capacity guidance: ~5–6 services per additional artist.\n\n### 2.6 Classes (https://makeupandhairbyelsa.com/makeup-and-hair-classes/)\n\n| Class | Price | Duration |\n|---|---|---|\n| Self Makeup Masterclass | \\$250 | 4 hrs 1:1 |\n| Self Hair Styling Masterclass | \\$250 | 4 hrs 1:1 |\n| Hair-for-Days | \\$150 | 4 hrs 1:1 |\n| Full Glam Combo | \\$450 (saves \\$50) | 7 hrs |\n| Glam Night | \\$325 | 4 hrs 1:1 |\n| Group classes | from \\$100/person | Groups 2–6; custom quote |\n\nMobile to client in DFW; giftable; deposit to secure.\n\n### 2.7 Contact / booking flow\n\nContact form fields (WPForms labels): First, Last, Email*, Phone, Services interested, Event date, Ready-by time, Location, Bridal preview/trial?, Estimate makeup services excl. bride, Estimate hair excl. bride, Photographer (opt), Planner (opt), Additional info, How heard (radios listed above).  \nResponse promise: **24–48 hours** (FAQ / Contact).  \nNo online calendar checkout observed.\n\n### 2.8 Website strengths (factual)\n\n- Clear package architecture with price transparency (rare vs “inquire only” peers).\n- Strong story (Ecuador → DFW; “feel like yourself”).\n- Dedicated Classes revenue line with public prices.\n- FAQ depth (travel math, policies, timeline).\n- Portfolio page with many images.\n- Mobile viewport tag present; modern WP/Elementor stack.\n- Social + marketplace discovery channels linked or listed in form.\n\n### 2.9 Website gaps / improvement-ready facts (observations only; examples for later review)\n\n1. **Duplicate homepage** `/` vs `/home/` — `/home/` has broken meta description `\"1.\"` and H1 spam → SEO/canonical risk.\n2. **Homepage lacks H1** and **lacks any price or starting-at number** (competitors and The Knot show \\$530 starting).\n3. **Schema incomplete** for local SEO (no street address, phone, geo, reviews aggregate).\n4. **robots/sitemap blocked** to simple crawlers (406) — may hurt indexing or tooling (**needs browser verify**).\n5. **Heavy pages** (~300–400 KB HTML) + many images — performance risk on phone (**not Lighthouse-tested this turn**).\n6. **Alt text incomplete** on homepage.\n7. **Two travel-fee formulas** (\\$25/15 min vs \\$100/hr wedding day) — clear in FAQ but easy to confuse on Services skim.\n8. **Payment method wording** differs between FAQ answers.\n9. **No dedicated Reviews page**; social proof scattered.\n10. **Booking is inquiry-only** — friction vs competitors with retainers + clear day-of minimums published.\n\n---\n\n## 3. Instagram\n\n**URL:** https://www.instagram.com/makeupandhairbyelsa/  \n**Linked from:** site footer consistently.\n\n### Accessed\n- Profile URL confirmed via site + public post URLs embedded on `/home/` Smash Balloon feed (examples: `/p/DCJ6bLxOmbj/`, multiple reels/posts with shortcodes C8…–DC…).\n- DuckDuckGo HTML search snippets citing Instagram (2026-11-05 fetch):\n  - Profile: **1,603 Followers · 1,114 Following · 631 Posts** — snippet for https://www.instagram.com/makeupandhairbyelsa/\n  - Reels URL snippet: **1,626 Followers · 1,137 Following · 638 Posts** — https://www.instagram.com/makeupandhairbyelsa/reels/\n  - These are **third-party search index numbers**, not a live logged-in scrape; treat as **approximate / possibly stale**.\n\n### Could **not** access (needs browser / login)\n- Live follower/following/post counts from Instagram HTML (login wall / empty og tags in curl).\n- Bio text, link-in-bio destination, highlight titles, exact recent captions/dates/engagement, Story highlights grid.\n- Instagram API `web_profile_info` → 404 without proper app headers/session.\n- Social Blade → Cloudflare challenge.\n- Picuki mirror redirected to TikTok viewer, **not** Instagram.\n\n### Themes visible from public post titles/snippets & site feed labels (qualitative)\n- Bridal tips (“TOP SECRET” prep tips).\n- Curly-haired bride content, ponytail wedding looks, glam reactions, client reviews, open-house / venue collab (@oneprestonevents mentioned in search snippet), sunset/sunrise wedding days.\n- **Inferred:** mix of education + portfolio + soft CTA — **not** quantified without live grid.\n\n---\n\n## 4. Facebook\n\n**URL:** https://www.facebook.com/makeupandhairbyelsa  \n**Also:** Facebook story/post references under page id `100044558457261` (e.g. story about reviews).\n\n### Accessed\n- URL presence on every major site page.\n- Public story title snippet: “Reviews are definitely an… - Makeup and Hair by Elsa”.\n\n### Could **not** access\n- Page likes / followers.\n- Recommendations / star rating / review count.\n- About text, hours, CTA button, recent posts.\n- curl to facebook.com/makeupandhairbyelsa → **HTTP 400** (blocked).\n\n**Needs browser look** for full Facebook audit.\n\n---\n\n## 5. Other listings / reviews\n\n| Platform | URL | Rating / counts | Notes | Source |\n|---|---|---|---|---|\n| The Knot | https://www.theknot.com/marketplace/makeup-and-hair-by-elsa-bedford-tx-2069058 | **5.0 / 15 reviews**; 100% 5-star in distribution shown | **2024 Best of Weddings** (1×); starting price **\\$530**; DFW / Bedford; Woman-owned + Hispanic/Latinx-owned attributes | WebFetch 2026-11-05 |\n| WeddingWire | https://www.weddingwire.com/biz/makeup-hair-by-elsa/9908f7273df157f7.html | Search index: **5.0 Fantastic, 9 reviews**; page lists multiple couple reviews (dates into 2025) | Starting price **\\$530** on listing; FAQ on lashes/hair/makeup types; Bedford / Dallas | WebSearch + WebFetch |\n| Zola | https://www.zola.com/wedding-vendors/wedding-hair-makeup/makeup-and-hair-by-elsa | **5.0 (4 reviews)** | Styles Classic (+others); edding-day \\$700 sits high vs many DFW \\$350–\\$425 bride HMU offers — packaging/communication will matter for conversion.  \n10. **Classes line (\\$150–\\$450 + groups)** is a clear non-Saturday revenue path already productized on the site.\n\n---\n\n*End of dossier. No recommendations fabricated as “completed work”; improvement examples belong in the upcoming Gemini/ChatGPT/Claude business review fed by this file.*\n\n---\n\n## 10. Live browser check (Nov 5, 2026, ~9:20 PM CT, logged-out box browser)\n\n**Facebook** (facebook.com/makeupandhairbyelsa): Page · Makeup Artist; 495 followers, following 1; likes not shown; 100% recommend (5 reviews). Intro only says \"Instagram: @makeupandhairbyelsa\". Location listed **Colleyville, TX** (site/The Knot say Bedford — NAP inconsistency). Email info@…, website listed; no business CTA visible. Recent posts: Oct 17 2026 \"I'M BACK, B…EAUTIES!\" (back after baby; 3 reactions); Jun 12 French twist for heat (1 reaction); Jun 3 realtor Tracy Higgins brand shoot (3 reactions, 2 comments); Jun 1 personal note (3/3); Jan 28 bridal artist intro (7/1). **~4-month posting gap Jun–Oct 2026; very low engagement.**\n\n**Instagram** (@makeupandhairbyelsa): name \"DALLAS Makeup and Hair Artist | Elsa Perkins\"; **1,626 followers / 1,117 following**; post count not displayed. Bio: \"✨ Because your Natural Beauty is Timeless 📍DFW/DALLAS High End Bridal Specialist 🚗 Mobile Service 🏆 Award winner Bridal team 👇🏼 Book Here 👇🏼\" → link makeupandhairbyelsa.com/contact. Highlights: Brides; Client's Love; Published Work; Shop; About me; Office Hours. No pinned posts. Last 12 grid: mostly Reels — Oct 17 2026 (back after baby Apollo), Jun 18 (collab w/ Hair & Makeup by Susy), Jun 12 (French twist; mentions fall 2026/2027 booking), Jun 3 (realtor shoot), Jun 1 (artist statement), Apr 18 photo (spring wedding, vendor credits), Mar 19 carousel, Mar 10 carousel \"Pretty Mary\", Jan 28 reel, Jan 26 reel (artist humor collab), Jan 9 reel (\"The moment vs The photo\", Emma & Brad), Jan 8 reel (makeup-shy mothers). **Cadence ≈ 12 posts in 10 months; gap Jun 18–Oct 17.**\n\n**Google Business Profile**: exists — \"Makeup and Hair by Elsa\", category Make-up artist, **5.0 ★, 21 reviews (all 5-star)**, phone **(682) 292-8407** (differs from WeddingWire's 832-305-1450; site lists no phone), website, **Book online** CTA, hours 8 AM–5 PM daily, **83 photos**, no street address shown. Recent reviews: 3 months ago wedding client; 9 months ago bridal boutique (fashion show); ~1 year ago bride.\n\n**Total public reviews ≈ 50** (Google 21, Knot 15, WeddingWire 9, FB 5, Zola 4) — all 5-star.\n\nContext (inferred from posts): Elsa had a baby (Apollo) and returned to booking Oct 17, 2026.\n"},{"id":"chatgpt-review-1","name":"chatgpt-review-1.md","content":"# MAKEUP AND HAIR BY ELSA\n## Complete Business, Website & Marketing Review\n**REPLY 1 OF 5 — Executive Strategy, Website, Local SEO & Business Listings**\n\n**Research date:** November 5, 2026 [V]  \n**Business:** Makeup and Hair by Elsa [V]  \n**Founder:** Elsa Delgado Perkins [V]  \n**Market:** Dallas–Fort Worth, Texas, and destination weddings [V]\n\n**Evidence key**\n\n| Label | Meaning |\n|---|---|\n| **[V]** | Verified in the supplied fact sheet |\n| **[E]** | Calculated from verified facts; formula provided |\n| **[A]** | Assumption or proposed test value requiring confirmation |\n| **[I]** | Analysis, recommendation, or inference |\n| **[Q]** | Question Elsa must answer before implementation |\n\nThe supplied fact sheet is the authority for this review. The supporting research dossier provides additional context. No new live-web findings have been added.\n\n---\n\n# SECTION 1. EXECUTIVE SUMMARY & 90-DAY PLAN\n\n**Bottom line:** [I] Elsa should focus on converting more of the interest her business already generates before spending money on advertising. The first priorities are removing confusion from her website, improving how inquiries are handled, and building a repeatable referral system.\n\n## 1.1 What We Cannot Verify Yet\n\nFive limitations affect the recommendations:\n\n1. **[Q] No financial records:** Annual revenue, profit, wedding volume, average booking value, and artist compensation are unknown.\n2. **[Q] No private analytics:** Website visitors, inquiry volume, inquiry-to-booking conversion, Instagram reach, and advertising results are unavailable.\n3. **[Q] No confirmed capacity:** Current artist availability, Elsa's working schedule, and her desired workload after returning from maternity leave are unknown.\n4. **[V] No completed performance benchmark:** Lighthouse and Core Web Vitals testing have not been performed. Slow performance is a risk, not a measured finding.\n5. **[Q] No backend access:** Contract software, payment workflows, email automation, and actual booking-process response times have not been confirmed.\n\n**[I] Consequence:** The business has visible strengths, but there is not enough evidence to forecast revenue responsibly without testing operating assumptions. The revenue models in Reply 4 will separate assumptions from verified prices.\n\n## 1.2 Five-Line Executive Summary\n\n**1. Position:** [V] Makeup and Hair by Elsa is a premium-positioned, fully mobile bridal beauty business offering natural, timeless makeup and hairstyling through a team selected and trained by Elsa.\n\n**2. Three biggest strengths:** [V] Strong public reviews, transparent bridal packages, and a differentiated founder story supported by an established portfolio.\n\n**3. Three biggest bottlenecks:** [I] An inquiry process with unnecessary uncertainty, inconsistent public business information, and limited recent social publishing.\n\n**4. Immediate opportunity:** [I] Make existing website traffic and referrals more valuable by improving pricing clarity, trust signals, inquiry follow-up, and booking communication.\n\n**5. Growth direction:** [I] Build around profitable bridal bookings, additional team capacity, repeatable vendor referrals, and classes—not an ever-expanding personal workload for Elsa.\n\nThese findings draw on the documented services, booking flow, review profiles, website audit, and social activity. final-prompt\n\n## 1.3 The Core Business Strategy\n\n### Recommendation: Sell a managed bridal experience, not just makeup and hair.\n\n[I] Elsa's strongest positioning is not simply that she can create beautiful makeup. It is that a bride can receive coordinated, on-location beauty services while still looking and feeling like herself.\n\nThe business already has evidence supporting this positioning:\n\n| Existing advantage | Evidence | What it means commercially |\n|---|---|---|\n| Natural bridal beauty | [V] Signature positioning: natural, flawless, timeless | [I] Differentiate from clients seeking heavier glam |\n| Experienced founder | [V] Career began in 2013; site claims 13+ years | [I] Reduce concern about artist experience |\n| Professional team | [V] Artists selected and trained by Elsa | [I] Make team bookings feel credible even when Elsa is unavailable |\n| Mobile convenience | [V] Services at homes, hotels, and venues | [I] Emphasize convenience and reduced wedding-day coordination |\n| Bridal planning support | [V] Consultations, timelines, tip emails, touch-up kits | [I] Explain value beyond makeup application |\n| Public reputation | [V] Approximately 50 public reviews across platforms, with strong ratings | [I] Provide proof early in the buying journey |\n| Multiple service categories | [V] Bridal, special events, and classes | [I] Build revenue outside peak wedding dates |\n\n### Proposed brand promise\n\n[I] **\"Timeless bridal beauty that feels like you, with an experienced team that comes to you.\"**\n\nThis communicates the desired result, positioning, and convenience without introducing unsupported claims.\n\n### What should NOT happen first\n\n| Avoid | Reason |\n|---|---|\n| [I] Increasing advertising spend immediately | [Q] No known lead conversion rate or acquisition cost |\n| [I] Reducing prices to match budget competitors | [V] Elsa's packages include services beyond a single wedding-day appointment |\n| [I] Hiring artists before reviewing utilization | [Q] Current booking volume and capacity are unknown |\n| [I] Buying a complicated customer management platform | [Q] Existing software and administrative workload are unknown |\n| [I] Requiring Elsa to personally perform every premium booking | [V] The business already uses a trained team; [I] owner dependency could restrict growth |\n\n---\n\n## 1.4 The 10 Highest-Impact Moves\n\n**[A] Effort estimates are proposed labor hours, not measured project durations.** They assume Elsa or Aaron can access the relevant accounts. [I] Expected effects are directional; they are not guaranteed increases in revenue or traffic.\n\n| Rank | Move | Why | Effort [A] | Expected effect [I] | Owner |\n|---|---|---|---|---|---|\n| 1 | Simplify homepage and booking path | [V] Homepage lacks prices and uses generic inquiry CTAs | 4–8 hrs | More visitors reaching the inquiry form | Aaron / Cursor; Elsa approves |\n| 2 | Standardize pricing, fees, and policies | [V] Travel, payment, and directory pricing contain inconsistencies | 2–4 hrs | Fewer confused inquiries and pricing objections | Elsa + Aaron |\n| 3 | Build an inquiry tracking and follow-up system | [V] Existing process is inquiry → quote/contract → deposit | 4–8 hrs | Faster responses and fewer forgotten leads | Aaron; Elsa approves messages |\n| 4 | Fix search-engine technical issues | [V] Duplicate homepage, missing H1s, crawler 406 results | 4–10 hrs | Better crawlability and fewer technical conflicts | Cursor / Aaron |\n| 5 | Put review proof near every major CTA | [V] Strong reviews are spread across outside platforms | 3–5 hrs | Greater confidence before inquiry | Aaron |\n| 6 | Align Google and wedding-directory listings | [V] Phone, location, hours, and starting-price inconsistencies | 3–6 hrs | More trustworthy and consistent discovery profiles | Elsa / Aaron |\n| 7 | Rebuild the Services page around package value | [V] Packages contain multiple appointments and extras | 4–8 hrs | Better understanding of premium pricing | Aaron / Cursor |\n| 8 | Establish a sustainable Instagram/Facebook cadence | [V] Social publishing had a substantial recent gap | 3–5 hrs setup; 2–3 hrs/week [A] | More consistent visibility and reusable marketing assets | Elsa / Aaron |\n| 9 | Build a referral process for wedding vendors | [V] Inquiry form already collects planner and photographer details | 3–5 hrs setup; 1–2 hrs/week [A] | More qualified referral opportunities | Elsa; Aaron drafts |\n| 10 | Build a weekly business scorecard | [Q] Revenue, booking, and funnel performance are unknown | 3–5 hrs setup; 30 min/week [A] | Better pricing, staffing, and marketing decisions | Aaron / Elsa |\n\n### Priority rule\n\n[I] Complete moves 1–7 before increasing paid advertising.\n\nThe reason is simple: an advertisement can generate an inquiry, but it cannot fix an unclear price, inconsistent policy, or slow response process.\n\n---\n\n## 1.5 The 90-Day Action Plan\n\n### MONTH 1 — FOUNDATION & FIXES\n\n**Goal:** [I] Remove obvious customer-facing confusion and create reliable business tracking.\n\n| Done | Action | Completion requirement | Owner |\n|---|---|---|---|\n| ☐ | Confirm business information | [Q] Approved primary phone, service-area location, hours, contact preferences | Elsa |\n| ☐ | Confirm working capacity | [Q] Elsa's available dates, team roster, artist limits, and booking restrictions | Elsa |\n| ☐ | Fix conflicting pricing information | [V] Replace the unexplained $530 directory starting price with confirmed matching service prices | Aaron / Elsa |\n| ☐ | Publish updated homepage | [I] Clear headline, pricing preview, reviews, service area, inquiry CTA | Cursor |\n| ☐ | Rewrite Services and FAQ language | [I] Packages, à la carte, travel, deposit, cancellation, and payment terms align | Aaron / Elsa |\n| ☐ | Fix duplicate homepage | [I] `/home/` redirects permanently to `/` | Cursor |\n| ☐ | Investigate 406 errors | [I] Test robots and sitemap endpoints and confirm search-engine access | Cursor / Host |\n| ☐ | Fix search metadata | [I] Appropriate page titles, descriptions, and H1 headings | Cursor |\n| ☐ | Create lead tracker | [I] Record every inquiry, source, quote, follow-up, and outcome | Aaron |\n| ☐ | Establish inquiry review routine | [A] Check new inquiries during business hours and aim for an initial reply within 2–4 business hours | Elsa / Aaron |\n\n**[A] Month 1 operating target:** Capture 100% of incoming inquiries in the tracking system.\n\nThis is a proposed internal target. The current capture rate is unknown.\n\n### MONTH 2 — CONVERSION\n\n**Goal:** [I] Increase the share of inquiries that become confirmed bookings.\n\n| Done | Action | Completion requirement | Owner |\n|---|---|---|---|\n| ☐ | Publish dedicated Reviews page | [I] Verified platform links, authentic review excerpts, inquiry CTA | Cursor / Aaron |\n| ☐ | Create standard inquiry replies | [I] Separate available-date and unavailable-date templates | Aaron; Elsa approves |\n| ☐ | Create follow-up sequence | [A] Follow-ups at 48 hours and 7 days, subject to inquiry status | Aaron |\n| ☐ | Standardize quote presentation | [I] Each quote clearly identifies services, travel, total cost, deposit, and next step | Elsa |\n| ☐ | Explain package differences visually | [I] Radiant, Timeless, and Royal comparison visible on mobile | Cursor |\n| ☐ | Improve inquiry-form experience | [I] Form loads correctly, confirmation is visible, submissions are received | Cursor |\n| ☐ | Prepare review request templates | [I] Every completed client receives a neutral request without incentives | Aaron |\n| ☐ | Launch regular social publishing | [A] Three feed posts weekly, with a reduced schedule available | Elsa / Aaron |\n| ☐ | Review first conversion data | [I] Calculate response time, inquiry-to-booking rate, and booked revenue | Aaron |\n\n**[A] Month 2 test target:** A 35% inquiry-to-booking conversion rate.\n\n**Definition:** Inquiry-to-booking conversion = confirmed bookings ÷ qualified inquiries × 100.\n\nThe 35% figure is a test assumption, not Elsa's existing performance or a market benchmark.\n\n### MONTH 3 — LOCAL OUTREACH & SCALE\n\n**Goal:** [I] Build more dependable lead sources and establish whether additional capacity is financially justified.\n\n| Done | Action | Completion requirement | Owner |\n|---|---|---|---|\n| ☐ | Build vendor contact list | [A] Start with 20 relevant planners, photographers, and venues | Aaron |\n| ☐ | Send personalized introductions | [A] Five tailored messages per week | Elsa approves; Aaron drafts |\n| ☐ | Improve business listings | [I] Consistent brand name, location, phone policy, photos, and pricing | Aaron |\n| ☐ | Publish portfolio features | [I] Authentic bridal work with permission and appropriate vendor credits | Elsa / Aaron |\n| ☐ | Test class promotion | [V] Use existing class prices and formats, not newly invented offers | Elsa |\n| ☐ | Review booking sources | [I] Determine whether Google, Instagram, directories, or referrals generate valuable inquiries | Aaron |\n| ☐ | Review artist utilization | [I] Compare booked services with confirmed team capacity | Elsa |\n| ☐ | Review profitability by package | [I] Separate service revenue, artist payouts, travel, and other costs | Elsa / Aaron |\n| ☐ | Decide whether to scale | [I] Add marketing or artists only when conversion, demand, and margins support it | Elsa |\n\n**[A] Month 3 operating target:** Contact 20 qualified wedding vendors and track replies, meetings, referrals, and resulting bookings.\n\nA referral relationship should never be represented publicly as a partnership without the vendor's agreement.\n\n### The 90-day decision\n\n[I] At the end of the plan, Elsa should have enough tracked information to answer three questions:\n\n1. Are new inquiries converting into profitable bookings?\n2. Can the existing team accommodate additional weddings without compromising service?\n3. Which sources produce the most valuable clients?\n\n**[I] If these answers are unknown, additional advertising or expansion is premature.**\n\n---\n\n# SECTION 2. WEBSITE, LOCAL SEO & BUSINESS LISTINGS\n\n**Bottom line:** [I] Elsa's website should make it easy for a bride to understand three things: what the experience includes, what it costs, and how to check availability. Fix those elements before pursuing an expensive redesign.\n\n[V] The website already has published pricing, a substantial portfolio, detailed FAQs, and an established inquiry form. [I] The priority is making those assets easier to find and more persuasive.\n\n## 2.1 Homepage — Complete Recommended Rewrite\n\n### A. New hero section\n\n**[I] Recommended H1 — the main page headline:**\n\n> Dallas–Fort Worth Bridal Hair & Makeup That Feels Like You\n\n**[I] Hero subheadline:**\n\n> Your wedding day deserves beauty that feels effortless, natural, and completely you. Our mobile bridal beauty team brings timeless makeup and hairstyling to your home, hotel, or venue throughout Dallas–Fort Worth and beyond.\n\n**Primary CTA:**\n\n**INQUIRE ABOUT YOUR DATE**\n\nLink: `/contact/`\n\n**Secondary CTA:**\n\n**EXPLORE BRIDAL PACKAGES**\n\nLink: `/services/`\n\n**[I] Pricing line directly beneath the buttons:**\n\n> Bridal packages starting at **$1,125** [V]. Wedding-day bridal hair and makeup also available à la carte for **$700** [V]. Travel fees are additional [V].\n\n**Why this is important:** [I] A visitor should not need to read the entire Services page to learn whether Elsa's offerings are in her budget.\n\nThe published package and service prices support these statements. final-prompt\n\n### B. Trust signals directly below the hero\n\n**[I] Recommended order:**\n\n| Order | Trust signal | Exact approved fact or treatment |\n|---|---|---|\n| 1 | Google reviews | [V] 5.0 rating from 21 reviews |\n| 2 | The Knot | [V] 5.0 rating from 15 reviews |\n| 3 | Industry recognition | [V] The Knot Best of Weddings 2024 |\n| 4 | Real bridal work | [V] Existing portfolio; use actual client photos with permission |\n| 5 | Founder and team | [V] Elsa's career began in 2013; artists selected and trained by her |\n| 6 | Client testimonials | [I] Feature authentic excerpts only: `{paste real review}` |\n\nDo not create one combined star rating by averaging different platforms.\n\n### C. About preview — publish-ready copy\n\n**Heading:**\n\n> Meet Elsa. Beauty That Still Feels Like You.\n\n**Body:**\n\n> Hi, I'm Elsa Delgado Perkins, founder of Makeup and Hair by Elsa.\n>\n> My beauty journey began in 2013 and has taken me from Ecuador to Houston and Dallas–Fort Worth.\n>\n> I believe beautiful makeup should enhance what makes you uniquely you—not hide it.\n>\n> Today, I work with a hand-selected team of artists trained to bring that same natural, timeless approach to your wedding day.\n>\n> Whether you're getting ready at home, in a hotel, or at your wedding venue, we're here to help you feel comfortable, confident, and beautiful.\n\n**CTA:** MEET ELSA & THE TEAM\n\nLink: `/about/`\n\n[V] The biographical and team details above come from the supplied business facts. The conversational wording is proposed copy [I].\n\n### D. Bridal package preview\n\n**Heading:**\n\n> Your Day. Your Beauty Experience.\n\n**Supporting copy:**\n\n> Every bride's plans are different. Choose a bridal experience that fits the moments you want to celebrate, from your trial to your wedding day and beyond.\n\n| Package | Published price [V] | Main value |\n|---|---:|---|\n| **Radiant** | $1,125 | Trial, wedding-day makeup and hair, bridal preparation extras, and touch-up time |\n| **Timeless** | $1,365 | Radiant experience plus engagement-session makeup and hair |\n| **Royal** | $1,685 | Timeless experience plus extended touch-ups and a second look |\n\n**Below the cards:**\n\n> All packages are priced with a team artist. Request Elsa personally for an additional $175, subject to availability. Travel fees are additional.\n\n[V] Prices and inclusions follow the published Services page.\n\n**CTA:** COMPARE ALL PACKAGES\n\n### E. Booking-process preview\n\n**Heading:**\n\n> A Beautifully Simple Way to Begin\n\n| Step | Publish-ready copy |\n|---|---|\n| **01 — Tell us about your day** | Share your wedding date, location, ready-by time, and the services you're considering. |\n| **02 — Receive your personalized quote** | We'll review your details and help you understand the services and pricing for your celebration. |\n| **03 — Reserve your date** | Your date is secured once your signed agreement and required deposit are received. |\n\n**Footer beneath steps:**\n\n> We respond to inquiries within 24–48 hours.\n\n[V] This matches the currently published booking process and FAQ response window.\n\n---\n\n## 2.2 Mobile-First Website Wireframes\n\n[I] These are proposed structures, not claims about the site's current visual layout.\n\n### Homepage wireframe\n\n**PHONE VIEW — FROM TOP TO BOTTOM**\n\n```text\n┌──────────────────────────────────┐\n│ MAKEUP AND HAIR BY ELSA      ☰   │\n├──────────────────────────────────┤\n│ MOBILE BRIDAL BEAUTY • DFW       │\n│                                  │\n│ Dallas–Fort Worth Bridal         │\n│ Hair & Makeup                    │\n│ That Feels Like You              │\n│                                  │\n│ Natural, timeless bridal beauty  │\n│ delivered to your location.      │\n│                                  │\n│ [ INQUIRE ABOUT YOUR DATE ]      │\n│ [ EXPLORE BRIDAL PACKAGES ]      │\n│                                  │\n│ Packages from $1,125             │\n│ Travel additional                │\n├──────────────────────────────────┤\n│ REAL BRIDAL PORTFOLIO IMAGE      │\n│ [Approved client photograph]     │\n├──────────────────────────────────┤\n│ GOOGLE ★ 5.0 • 21 REVIEWS        │\n│ THE KNOT ★ 5.0 • 15 REVIEWS      │\n│ BEST OF WEDDINGS 2024            │\n├──────────────────────────────────┤\n│ YOUR BRIDAL EXPERIENCE           │\n│                                  │\n│ Radiant                 $1,125   │\n│ [ VIEW DETAILS ]                 │\n│                                  │\n│ Timeless                $1,365   │\n│ [ VIEW DETAILS ]                 │\n│                                  │\n│ Royal                   $1,685   │\n│ [ VIEW DETAILS ]                 │\n├──────────────────────────────────┤\n│ BRIDAL WORK                      │\n│ Real photos / approved images    │\n│ [ VIEW PORTFOLIO ]               │\n├──────────────────────────────────┤\n│ MEET ELSA                        │\n│ Founder photo + short story      │\n│ [ READ OUR STORY ]               │\n├──────────────────────────────────┤\n│ HOW BOOKING WORKS                │\n│ Inquire → Quote → Reserve        │\n├──────────────────────────────────┤\n│ KIND WORDS                       │\n│ {paste real review}              │\n│ [ READ MORE REVIEWS ]            │\n├──────────────────────────────────┤\n│ QUESTIONS?                       │\n│ Travel | Trials | Deposits       │\n│ [ READ FAQs ]                    │\n├──────────────────────────────────┤\n│ READY TO FEEL LIKE YOU?          │\n│ [ INQUIRE ABOUT YOUR DATE ]      │\n├──────────────────────────────────┤\n│ Contact | Social | Policies      │\n└──────────────────────────────────┘\n```\n\n**[I] Implementation details:**\n\n- Use one main headline, known as an **H1**, for the page.\n- Make both hero buttons large enough for comfortable mobile tapping.\n- Keep published pricing visible without requiring a swipe through multiple images.\n- Use authentic bridal photos, not AI-generated depictions of real client work.\n- Ensure the most important contact button leads directly to the actual inquiry form.\n- Avoid automatic video playback in the hero if it significantly affects mobile loading performance.\n\n### Services / Packages wireframe\n\n** e older page if doing so does not break the redirect.\n\n**[I] Do not use a temporary 302 redirect for this permanent consolidation.**\n\n**[Q] Check whether the hosting platform already has a redirects feature before installing another plugin.** Avoid duplicate redirect rules.\n\n### B. Fix the HTTP 406 issue on robots.txt and sitemap.xml\n\n**Verified observation:** [V] Both endpoints returned HTTP 406 to a basic crawler, apparently through Mod_Security.\n\n**Important distinction:** [I] This does not establish that Google is blocked. A security system may respond differently depending on the requester.\n\n**ModSecurity:** A web-server security system that can block requests matching suspicious patterns.\n\n**robots.txt:** A file that tells cooperating search-engine crawlers which areas they may access.\n\n**XML sitemap:** A machine-readable list of site URLs that can help search engines discover pages.\n\n#### Troubleshooting procedure\n\n| Step | Exact action | Pass condition |\n|---|---|---|\n| 1 | [I] Open `/robots.txt` in a normal browser | Correct text displays |\n| 2 | [I] Request `/robots.txt` using `curl -I` | HTTP status is recorded |\n| 3 | [I] Test `/sitemap.xml` | Confirm whether this is actually the site's configured sitemap |\n| 4 | [I] Test `/wp-sitemap.xml` | Identify whether native WordPress sitemap output is available |\n| 5 | [I] Check any SEO plugin's sitemap setting | Identify the canonical sitemap URL |\n| 6 | [I] Review host/WAF security logs | Locate the rule producing 406 responses |\n| 7 | [I] Ask the host to allow legitimate requests to the affected endpoints | Security rules adjusted narrowly |\n| 8 | [I] Retest from different networks and user agents | Legitimate clients receive appropriate content |\n| 9 | [I] Inspect the URLs using Google Search Console | Google can access and interpret the URLs |\n| 10 | [I] Submit the working XML sitemap in Search Console | Submission accepted and discovery monitored |\n\n**WAF = web application firewall:** A system that filters requests before they reach a website.\n\n**Recommended hosting-support message:**\n\n> Our WordPress website is returning HTTP 406 responses when certain clients request `/robots.txt` and `/sitemap.xml`.\n>\n> Please review the ModSecurity or WAF logs for those requests and identify the triggering security rule.\n>\n> We would like legitimate search-engine crawlers and ordinary browsers to access our robots file and active XML sitemap.\n>\n> Please apply the narrowest safe rule adjustment to the affected endpoints rather than disabling website security globally.\n>\n> Once updated, please confirm the URLs return the appropriate status and content.\n\n**[I] Success criterion:** Google Search Console confirms access to the real sitemap and relevant pages.\n\n**[Q] Google Search Console access and current indexing status remain unverified.**\n\n### C. Replace page titles, descriptions, and H1s\n\n**Title tag:** The title used by browsers and often displayed in search results.\n\n**Meta description:** A short page summary that search engines may use in results.\n\n**H1:** The page's primary visible heading.\n\n[I] The recommended metadata below has been checked against the specified limits: titles under 60 characters and descriptions under 155 characters.\n\n#### Recommended title tags and H1 headings\n\n| Live page | New title tag [I] | New H1 [I] |\n|---|---|---|\n| `/` | Dallas Bridal Hair & Makeup \\| Makeup and Hair by Elsa | Dallas–Fort Worth Bridal Hair & Makeup That Feels Like You |\n| `/about/` | Meet Elsa \\| Makeup and Hair by Elsa | Meet Elsa and Her Bridal Beauty Team |\n| `/services/` | Bridal Hair & Makeup Packages \\| Elsa | Bridal Hair & Makeup Packages and Pricing |\n| `/portfolio/` | Bridal Hair & Makeup Portfolio \\| Elsa | Bridal Hair & Makeup Portfolio |\n| `/faq/` | Bridal Beauty FAQs \\| Makeup and Hair by Elsa | Bridal Beauty Frequently Asked Questions |\n| `/contact/` | Request Bridal Availability \\| Elsa | Inq  optimize images, and test performance | Elsa |\n\n## Release Criteria\n\n**[I] Do not consider the website cleanup complete until all of the following pass:**\n\n- ☐ The homepage displays an accurate published starting package price.\n- ☐ Bridal packages and à la carte services are clearly distinguished.\n- ☐ Travel charges are explained without conflicting formulas.\n- ☐ Payment and cancellation terms match Elsa's approved contract.\n- ☐ Every inquiry CTA reaches the correct form.\n- ☐ A successful test inquiry reaches the intended inbox.\n- ☐ The obsolete `/home/` page redirects permanently.\n- ☐ Every live core page has the intended title, description, and H1.\n- ☐ The active XML sitemap is accessible to Google.\n- ☐ Google Search Console is checked for indexing or access problems.\n- ☐ Business hours and approved public contact details are consistent.\n- ☐ Directory starting prices match the services they describe.\n- ☐ Reviews are authentic and accurately attributed.\n- ☐ Structured data validates without fabricated addresses, ratings, or contact information.\n- ☐ Mobile performance and form behavior have been tested after deployment.\n\n## What Success Looks Like\n\n[I] The goal is a business website that explains Elsa's premium experience clearly, turns interested visitors into qualified inquiries, and creates less administrative work.\n\n**[I] The biggest opportunity is not proving that Elsa can do beautiful work. Her existing portfolio and public reviews already provide evidence of that. The opportunity is helping the right customers understand what they are buying, feel confident in the team, and take the next step.**\n\n---\n\n### NEXT: REPLY 2 — INSTAGRAM & FACEBOOK\n\nThe next section covers the Instagram profile rewrite, three bio options, a complete Highlights structure, pinned posts, twelve content concepts, six publish-ready captions, three detailed Reel scripts, a sustainable four-week calendar, and a plan for interpreting private social analytics.\n\n**Reply CONTINUE for Reply 2.**"},{"id":"chatgpt-review-2","name":"chatgpt-review-2.md","content":"# MAKEUP AND HAIR BY ELSA\n## Complete Business, Website & Marketing Review\n**REPLY 2 OF 5 — Instagram, Facebook & Social Media Growth**\n\n**Research date:** November 5, 2026 [V]  \n**Accounts:** @makeupandhairbyelsa [V]  \n**Primary objective:** [I] Turn social media into a dependable source of qualified bridal inquiries without requiring Elsa to spend hours creating content every day.\n\n**Evidence labels:** [V] Verified fact · [E] Calculation from verified facts · [A] Assumption or test value · [I] Recommendation or inference · [Q] Question requiring Elsa's confirmation.\n\n---\n\n# SECTION 3. INSTAGRAM & FACEBOOK\n\n**Bottom line:** [I] Elsa does not need to become a full-time content creator. She needs a consistent, recognizable social presence that shows her work, explains her value, and encourages brides to inquire about availability. The immediate priorities are improving her profiles, publishing consistently, and making authentic client work generate more inquiries.\n\n## 3.1 Current Social Media Audit\n\n### Instagram — Verified Starting Point\n\n| Metric | Current finding |\n|---|---|\n| Account | [V] @makeupandhairbyelsa |\n| Display name | [V] DALLAS Makeup and Hair Artist \\| Elsa Perkins |\n| Followers | [V] 1,626 as observed November 5, 2026 |\n| Following | [V] 1,117 |\n| Total posts | [V] Approximately 630+, based on search-index estimates |\n| Recent posting | [V] Approximately 12 posts during the first 10 months of 2026 |\n| Posting interruption | [V] June 18–October 17, 2026 |\n| Most recent documented post | [V] October 17 return announcement |\n| Content formats | [V] Recent grid primarily includes Reels, with some photographs and carousels |\n| Pinned posts | [V] None observed |\n| Bio link | [V] `/contact/` |\n| Private performance analytics | [Q] Not available |\n\n**Current bio, as observed [V]:**\n\n> ✨ Because your Natural Beauty is Timeless  \n> 📍 DFW/DALLAS High End Bridal Specialist  \n> 🚗 Mobile Service  \n> 🏆 Award winner Bridal team  \n> 👇🏼 Book Here 👇🏼\n\n### Facebook — Verified Starting Point\n\n| Metric | Current finding |\n|---|---|\n| Followers | [V] 495 |\n| Recommendations | [V] 100% recommend, five reviews |\n| Introduction | [V] Only references Instagram |\n| Location | [V] Colleyville, Texas |\n| Booking CTA | [V] No visible business CTA button |\n| Recent engagement | [V] Approximately 1–7 reactions on observed recent posts |\n| Posting interruption | [V] Similar June–October gap |\n| Private analytics | [Q] Not available |\n\nThe observations are based on the supplied research, including the logged-out social profile checks performed on November 5, 2026. dossier\n\n### TikTok and Pinterest\n\n| Platform | Current finding | Recommendation |\n|---|---|---|\n| TikTok | [V] 120 followers, 108 videos, 2,264 likes | [I] **Repurpose.** Publish suitable existing Reels here without creating a separate production workload. |\n| Pinterest | [V] Account exists, content not reviewed | [I] **Keep, but limit effort.** Repurpose approved bridal portfolio images into useful hairstyle and makeup inspiration pins after checking the existing profile. |\n\n---\n\n## 3.2 Adversarial Review — What's Wrong\n\n**[I] Benchmark:** A conversion-ready premium mobile bridal beauty social profile should communicate its service, location, differentiation, evidence, and next action immediately. It should also publish often enough to remain useful to prospective clients.\n\n**Current estimated score: 4/10 [I].**\n\nThis is an editorial assessment against that defined benchmark, not an externally measured industry ranking.\n\n**Verdict: NO-SHIP for paid social traffic until the primary conversion defects are fixed.** Organic publishing can proceed once the profile wording is corrected.\n\n| # | Severity | Location | Problem | Exact fix |\n|---|---|---|---|---|\n| 1 | **High** | Instagram bio | [V] Says \"Book Here,\" but the link leads to an inquiry form rather than an instant booking system | [I] Change to \"Inquire about your date\" |\n| 2 | **High** | Posting cadence | [V] Approximately 12 posts across 10 months | [I] Implement a manageable recurring content calendar |\n| 3 | **High** | Facebook | [V] Introduction doesn't explain the services; no visible booking CTA | [I] Rewrite About information and add a Contact Us action pointing to `/contact/` |\n| 4 | **High** | Facebook location | [V] Says Colleyville while the business is based in Bedford | [I] Correct to Bedford, subject to Elsa's confirmation |\n| 5 | **Medium** | Instagram grid | [V] No pinned posts | [I] Pin a brand introduction, package guide, and service-process explanation |\n| 6 | **Medium** | Instagram bio | [V] Uses broad terms such as \"High End\" and \"Award winner\" | [I] Replace them with concrete differentiation and the specific verified award |\n| 7 | **Medium** | Highlights | [V] \"Shop\" and \"Office Hours\" exist, but the former's actual offering is unknown | [Q] Verify what Shop sells and whether published hours are accurate before retaining them |\n| 8 | **Medium** | Content mix | [I] Existing work is not consistently organized to answer pricing, planning, and booking questions | [I] Establish recurring content categories tied to actual customer concerns |\n| 9 | **Medium** | Conversion measurement | [Q] No private data showing profile visits, link clicks, DMs, or booked weddings | [I] Track inquiries by source and evaluate which posts contribute to them |\n| 10 | **Low** | Cross-platform production | [I] Producing different creative for every platform would create unnecessary work | [I] Start with one approved content asset and adapt its caption for Facebook, TikTok, or Pinterest |\n\n### What the social strategy should accomplish\n\n[I] The content should repeatedly answer five customer questions:\n\n| Customer question | Content that answers it |\n|---|---|\n| Will I still look like myself? | Natural bridal transformations, close-up details, real client feedback |\n| Can this team handle my wedding morning? | Timeline tips, team process, bridal-party preparation |\n| What makes Elsa different? | Founder story, training approach, bridal service inclusions |\n| Can I trust the result? | Authentic portfolio work and properly attributed public reviews |\n| What does it cost, and how do I start? | Package explanations, trial information, and inquiry instructions |\n\n**[I] The profile should be a small, always-available sales presentation—not merely a photo gallery.**\n\n---\n\n## 3.3 Instagram Profile Rewrite\n\n### Recommended display name\n\n**[I] Primary recommendation:**\n\n**Elsa | DFW Bridal Hair & Makeup**\n\nThis puts the business's service and location near its identity.\n\n**[I] Alternative if she prefers a more personal presentation:**\n\n**Elsa Perkins | Dallas Bridal Beauty**\n\nThe username should remain **@makeupandhairbyelsa** [V] unless Elsa has a separate, deliberate rebranding reason.\n\n### Three complete Instagram bios\n\nEach proposed bio is under Instagram's 150-character limit, including spaces and line breaks [E].\n\n### INSTAGRAM BIO — OPTION 1: Conversion First\n\nNatural, timeless bridal hair + makeup  \nMobile in DFW + beyond  \nBridal packages from $1,125  \nInquire about your date ↓\n\n### INSTAGRAM BIO — OPTION 2: Emotional Brand\n\nLook like you. Feel like you.  \nBridal hair + makeup, brought to you  \nDFW • Texas • destination weddings  \nExplore packages ↓\n\n### INSTAGRAM BIO — OPTION 3: Reputation First\n\nThe Knot Best of Weddings 2024  \nNatural bridal hair + makeup  \nDFW mobile team  \nExplore packages + inquire ↓\n\n### FACEBOOK INTRO\n\nMobile bridal hair & makeup in Dallas–Fort Worth and beyond. Natural, timeless beauty that feels like you. Explore packages and inquire about your date.\n\n### FACEBOOK ABOUT DESCRIPTION\n\nMakeup and Hair by Elsa is a fully mobile bridal hair and makeup team based in Bedford, Texas.\n\nFounded by Elsa Delgado Perkins, whose beauty career began in 2013, our team specializes in natural, flawless beauty that helps you feel like yourself.\n\nOur artists are hand-selected and trained by Elsa. We travel to homes, hotels, and wedding venues throughout Dallas–Fort Worth, across Texas, and for destination weddings.\n\nWe offer bridal makeup and hairstyling, wedding-party services, engagement-session beauty, trials, touch-ups, second looks, special-event beauty, and private makeup and hairstyling classes.\n\nExplore our bridal packages, browse our work, and tell us about your wedding or special occasion.\n\nBecause your Natural Beauty is Timeless.\n\nWebsite: https://makeupandhairbyelsa.com/\n\nInquiries: https://makeupandhairbyelsa.com/contact/\n\nEmail: info@makeupandhairbyelsa.com\n\n**[I] Use Option 1 first.** It communicates the service, geography, price, and next step without making the visitor interpret vague marketing language.\n\n**Bio lengths [E]:**\n\n| Option | Characters, including line breaks | Limit |\n|---|---:|---:|\n| 1 | 115 | 150 |\n| 2 | 120 | 150 |\n| 3 | 104 | 150 |\n\n### Bio implementation\n\n| Item | Exact instruction |\n|---|---|\n| Name | [I] Replace the current display name with \"Elsa \\| DFW Bridal Hair & Makeup\" |\n| Bio | [I] Use Option 1 |\n| Website link | [V] Keep `/contact/` as the primary inquiry destination |\n| Category | [Q] Verify the currently selected professional category; [I] use an accurate beauty-service category |\n| Contact options | [Q] Confirm whether Elsa wants email, phone, or both visible |\n| Profile picture | [I] Keep a recognizable founder image or consistent brand image; verify the current picture before replacing it |\n| First pinned content | [I] Create the introduction and process posts described below |\n\n---\n\n## 3.4 Link-in-Bio Structure\n\n**Recommendation:** [I] Keep the path to inquiry as short as possible. Use the current direct contact link initially, then test a simple website landing page only if it helps visitors find packages, portfolio images, and reviews without reducing inquiries.\n\n### Recommended future landing page\n\n**[A] Proposed URL:** `/start/`\n\nThis is a new page concept, not an existing verified webpage.\n\n```text\n┌──────────────────────────────────┐\n│ MAKEUP AND HAIR BY ELSA          │\n│                                  │\n│ Because your Natural Beauty      │\n│ is Timeless.                     │\n│                                  │\n│ [ INQUIRE ABOUT YOUR DATE ]      │\n│                                  │\n│ [ VIEW BRIDAL PACKAGES ]         │\n│                                  │\n│ [ SEE OUR BRIDAL PORTFOLIO ]     │\n│                                  │\n│ [ READ REAL CLIENT REVIEWS ]     │\n│                                  │\n│ [ EXPLORE MAKEUP CLASSES ]       │\n│                                  │\n│ Questions?                       │\n│ info@makeupandhairbyelsa.com     │\n└──────────────────────────────────┘\n```\n\n### Destination map\n\n| Button | Destination | Priority |\n|---|---|---|\n| Inquire About Your Date | [V] `/contact/` | Highest |\n| View Bridal Packages | [V] `/services/` | High |\n| See Our Bridal Portfolio | [V] `/portfolio/` | High |\n| Read Real Client Reviews | [I] `/reviews/`, after the page is created | High |\n| Explore Makeup Classes | [V] `/makeup-and-hair-classes/` | Secondary |\n\n**[I] Avoid a link page crowded with unrelated offers or social network links.**\n\n### Tracking\n\n**UTM = Urchin Tracking Module:** A short set of tags added to a URL so website analytics can identify where visits came from.\n\n**[A] Proposed tracked Instagram URL:**\n\n```text\nhttps://makeupandhairbyelsa.com/contact/?utm_source=instagram&utm_medium=social&utm_campaign=profile\n```\n\n**[A] Proposed tracked Facebook URL:**\n\n```text\nhttps://makeupandhairbyelsa.com/contact/?utm_source=facebook&utm_medium=social&utm_campaign=profile\n```\n\n**[Q] Confirm website analytics can capture these tags.**\n\n[I] Tracking link clicks does not by itself prove bookings. The inquiry tracker must also record which leads actually become customers.\n\n---\n\n## 3.5 Instagram Highlights — Full Restructure\n\n**Recommendation:** [I] Use Highlights as a simple introduction for brides visiting the profile for the first time.\n\n[V] Current Highlights are Brides, Client's Love, Published Work, Shop, About me, and Office Hours.\n\n### Proposed order\n\n| Order [A] | Highlight | Current source | Exact change |\n|---|---|---|---|\n| 1 | **Start Here** | New | [I] Explain mobile service, service area, and inquiry process |\n| 2 | **Brides** | Existing | [I] Keep; curate approved bridal looks |\n| 3 | **Packages** | New | [I] Show verified prices and inclusions |\n| 4 | **Reviews** | Client's Love | [I] Rename; use authentic client feedback |\n| 5 | **Meet Elsa** | About me | [I] Rename; share founder story and team approach |\n| 6 | **How to Book** | New | [I] Explain inquiry → quote → agreement/deposit |\n| 7 | **Classes** | New | [I] Feature published class offerings |\n| 8 | **Features** | Published Work | [I] Rename; show genuine published work with accurate attribution |\n\n**Treatment of existing Shop:** [Q] Confirm what the Highlight and WooCommerce store actually sell. If the offering is inactive, archive the Highlight rather than directing customers to products they cannot buy.\n\n**Treatment of Office Hours:** [Q] Confirm actual customer-contact hours. If useful and accurate, move that information into How to Book or Start Here rather than presenting conflicting hours.\n\n### Exact Story content for the new Highlights\n\n#### START HERE\n\n| Frame | On-screen copy |\n|---|---|\n| 1 | \"Welcome to Makeup and Hair by Elsa\" |\n| 2 | \"Natural. Timeless. Beautifully you.\" |\n| 3 | \"Bridal hair + makeup, wherever you're getting ready.\" |\n| 4 | \"Based in Bedford. Serving DFW and beyond.\" |\n| 5 | \"Explore our work and packages.\" |\n| 6 | \"Ready to begin? Inquire through the link in our bio.\" |\n\n#### PACKAGES\n\n| Frame | On-screen copy |\n|---|---|\n| 1 | \"Your bridal beauty experience\" |\n| 2 | \"Radiant — $1,125\" [V] |\n| 3 | \"Timeless — $1,365\" [V] |\n| 4 | \"Royal — $1,685\" [V] |\n| 5 | \"Prefer individual services? We offer those, too.\" |\n| 6 | \"Travel additional. Explore full details on our website.\" |\n\n#### HOW TO BOOK\n\n| Frame | On-screen copy |\n|---|---|\n| 1 | \"Your wedding beauty starts here.\" |\n| 2 | \"Tell us your date, location, and service needs.\" |\n| 3 | \"We'll review your inquiry and prepare a quote.\" |\n| 4 | \"Reserve with a signed agreement and 50% deposit.\" [V] |\n| 5 | \"We'll help you prepare for your appointment.\" |\n| 6 | \"Inquire about your date through our website.\" |\n\n### Highlight cover design\n\n**[I] Recommended style:** Soft neutral backgrounds, elegant readable type, and restrained color variation.\n\nAvoid overcrowded covers or elaborate decorative icons. Simple text labels can work if readable at Instagram's small display size.\n\n**[A] Proposed visual palette:**\n\n| Role | Suggested color |\n|---|---|\n| Warm ivory | `#F7F2EB` |\n| Deep charcoal | `#292623` |\n| Muted taupe | `#AB9888` |\n| Soft blush | `#E9D5CF` |\n\nThese are new design recommendations, not verified brand colors.\n\n**[I] Ask Claude to review covers at actual mobile display size before publishing.**\n\n---\n\n## 3.6 The Three Posts to Pin\n\n**[I] Pinning should make the profile useful even if a visitor sees no other posts.** The content below assumes Elsa can supply approved, authentic footage and images.\n\n### PIN 1 — Meet Elsa and the Team\n\n**Format:** [I] Carousel or short Reel.\n\n**Cover headline:**\n\n> BEAUTY THAT FEELS LIKE YOU.\n\n**Content sequence:**\n\n| Frame | Content |\n|---|---|\n| 1 | \"Beauty that feels like you.\" |\n| 2 | Authentic photo of Elsa |\n| 3 | \"A beauty journey that began in 2013.\" [V] |\n| 4 | \"A hand-selected bridal beauty team.\" [V] |\n| 5 | Authentic work showing natural bridal beauty |\n| 6 | \"Mobile bridal hair + makeup across DFW and beyond.\" [V] |\n| 7 | \"We'd love to hear about your wedding.\" |\n\n**CTA:** Inquire through the link in our bio.\n\n**Purpose [I]:** Establish identity and credibility immediately.\n\n### PIN 2 — Bridal Packages Explained\n\n**Format:** [I] Carousel.\n\n**Cover headline:**\n\n> YOUR BRIDAL BEAUTY OPTIONS.\n\n| Frame | Content |\n|---|---|\n| 1 | \"Your bridal beauty options\" |\n| 2 | \"Radiant — $1,125\" [V] |\n| 3 | Trial, wedding-day services, touch-up time, and extras [V] |\n| 4 | \"Timeless — $1,365\" [V] |\n| 5 | Adds engagement-session makeup and hair [V] |\n| 6 | \"Royal — $1,685\" [V] |\n| 7 | Extended touch-ups and a second look [V] |\n| 8 | \"Prefer à la carte? Explore our Services page.\" |\n| 9 | \"Travel additional. Inquire about your date.\" |\n\n**Purpose [I]:** Address pricing before a bride needs to ask.\n\n### PIN 3 — How It Works\n\n**Format:** [I] Carousel using simple photography and typography.\n\n**Cover headline:**\n\n> BRIDAL BEAUTY, MADE SIMPLE.\n\n| Frame | Content |\n|---|---|\n| 1 | \"Bridal beauty, made simple.\" |\n| 2 | \"Tell us about your date.\" |\n| 3 | \"Share your getting-ready location.\" |\n| 4 | \"Let us know your beauty-service needs.\" |\n| 5 | \"We'll prepare a personalized quote.\" |\n| 6 | \"Reserve with your signed agreement and deposit.\" |\n| 7 | \"We'll help you plan your beauty experience.\" |\n| 8 | \"Inquire through the link in our bio.\" |\n\n**Purpose [I]:** Explain the real inquiry and reservation process without implying instant booking.\n\n---\n\n## 3.7 Facebook — Specific Fixes\n\n**Bottom line:** [I] Facebook should support the same bridal inquiry process as Instagram and Google, without requiring its own complicated content strategy. Fix the incomplete business information first, then republish suitable Instagram content with Facebook-specific captions.\n\n### A. Page information changes\n\n| Field | Current state | Required change |\n|---|---|---|\n| Page name | [V] Makeup and Hair by Elsa | [I] Keep |\n| Introduction | [V] Instagram handle only | [I] Use the complete intro provided above |\n| Business description | [Q] Current full description not confirmed | [I] Use the About copy provided above |\n| Category | [V] Makeup Artist | [I] Keep an accurate primary category |\n| Location | [V] Colleyville | [Q] Confirm Bedford; [I] correct the page to match the business base |\n| Website | [V] Website listed | [I] Confirm it points to the active domain |\n| Email | [V] Business email is published | [I] Confirm `info@makeupandhairbyelsa.com` is used |\n| Phone | [Q] Official public number unresolved | [I] Add only after Elsa approves |\n| Hours | [Q] Conflicting published hours | [I] Align with Elsa's confirmed communication hours |\n| Services | [Q] Completeness unknown | [I] Add current bridal and special-event categories where supported |\n| CTA button | [V] None visible | [I] Add **Contact Us** pointing to `/contact/`, if available |\n\n**CTA = call to action:** A button or instruction encouraging someone to take the next step.\n\nIf Facebook does not offer Contact Us in the relevant page interface, choose the closest available website-contact action.\n\n### B. Facebook cover\n\n**[I] Recommended cover design:**\n\nUse an authentic bridal portrait or a simple composition of approved portfolio images.\n\n**Headline:**\n\n> Natural Beauty Is Timeless.\n\n**Supporting text:**\n\n> Mobile Bridal Hair & Makeup  \n> Dallas–Fort Worth & Beyond\n\n**[I] Avoid tiny text, complicated collages, or unverified awards.**\n\n### C. Facebook content strategy\n\n**Recommendation [I]:** Adapt the same three weekly Instagram posts for Facebook rather than creating three additional posts from scratch.\n\nFor each publication:\n\n- Use the same approved photograph or video.\n- Write a slightly more informative caption for Facebook.\n- Include a direct link to the appropriate website page when useful.\n- Use genuine client feedback only.\n- Respond to inquiries through the correct business channel.\n- Avoid promising immediate replies outside verified business hours.\n\n**[A] Initial publishing target:** Three adapted posts weekly, matching Instagram's schedule.\n\n**[I] Facebook engagement should be evaluated by relevant inquiries and bookings, not only reactions.**\n\n---\n\n# 3.8 Twelve Instagram Post & Reel Concepts\n\n**Bottom line:** [I] The strongest content combines authentic work with answers to questions brides already have. Use the existing portfolio and verified review themes instead of inventing transformations, testimonials, or wedding-day experiences.\n\n### Recommended content categories\n\n**[A] Initial test mix across 12 monthly feed posts:**\n\n| Category | Monthly posts [A] | Share [A] | Purpose [I] |\n|---|---:|---:|---|\n| Real bridal work | 4 | 33.3% | Show finished results |\n| Education and preparation | 3 | 25% | Address planning concerns |\n| Trust and team credibility | 3 | 25% | Reduce uncertainty |\n| Packages, classes, and inquiries | 2 | 16.7% | Explain services and prompt inquiries |\n| **Total** | **12** | **100% [A, rounded]** | |\n\nThis is a starting experiment, not a proven optimal content distribution.\n\n### Complete content concept table\n\n| # | Format | Hook / cover headline [I] | Content and evidence | CTA |\n|---|---|---|---|---|\n| 1 | Reel | **\"The best bridal look still looks like you.\"** | [V] Brand positioning and authentic natural bridal work. Show approved close-ups and finished looks. | \"Inquire about your date.\" |\n| 2 | Carousel | **\"Three bridal experiences. One timeless approach.\"** | [V] Radiant $1,125, Timeless $1,365, Royal $1,685. Explain inclusions and travel. | \"Explore packages.\" |\n| 3 | Carousel | **\"What happens after you inquire?\"** | [V] Form, quote, agreement, 50% deposit, preparation support. | \"Check your date.\" |\n| 4 | Reel | **\"Texas heat? Your hairstyle deserves a plan.\"** | [V] Previous French-twist content and reviews discussing heat/humidity. Use genuine hairstyle footage. Avoid guarantees. | \"Tell us about your wedding.\" |\n| 5 | Carousel | **\"What is a bridal trial really for?\"** | [V] Trial available; makeup + hair $475. [I] Explain consultation and discussing preferences without promising specific unverified steps. | \"Explore bridal trials.\" |\n| 6 | Reel | **\"For the moms who don't wear makeup.\"** | [V] Previous makeup-shy mother content. Show an approved real example or artist discussing the approach. | \"Share this with someone getting ready with you.\" |\n| 7 | Carousel | **\"Curly-haired brides: your texture matters.\"** | [V] Curly-hair bridal content is an established theme. Show actual curly-hair work with permission. | \"Save your inspiration.\" |\n| 8 | Reel | **\"Tattoo coverage is a conversation, not an assumption.\"** | [V] Tattoo concealment is an offered service and appears in review themes. Show genuine work only if available and authorized. | \"Ask about your options.\" |\n| 9 | Reel | **\"The moment. Then the photograph.\"** | [V] Existing moment-versus-photo theme. Pair genuine preparation footage with an authorized final photograph from the same event. | \"Save your favorite look.\" |\n| 10 | Carousel | **\"Your wedding timeline starts with one question.\"** | [V] Inquiry form collects ready-by time and makeup/hair counts; timeline support is included. | \"Plan your beauty services.\" |\n| 11 | Carousel | **\"What brides have shared about their experience.\"** | [V] Genuine review themes: feeling like themselves, punctuality, longevity, and communication. Use actual attributed review excerpts only. | \"Read real reviews.\" |\n| 12 | Reel / Carousel | **\"Learn to do your makeup with more confidence.\"** | [V] Self Makeup Masterclass, $250, four hours, one-to-one. Use genuine class footage if available, otherwise approved instructional images. | \"Explore our classes.\" |\n\n### Detailed creative directions\n\n#### Concept 1 — Natural Bridal Beauty\n\n**[I] Primary selling point:** The bride should recognize herself in her finished look.\n\n**Visual treatment:** Close-ups of eyes, skin, hair, and the complete bridal look.\n\n**Avoid:** Filters that noticeably change skin appearance, synthetic client images, and exaggerated before-and-after editing.\n\n**Best use:** First pinned post or an introductory Reel.\n\n#### Concept 2 — Packages Explained\n\n**[I] Primary selling point:** Show why the packages are more than a wedding-day appointment.\n\n**Visual treatment:** Minimal typography over approved portfolio photography.\n\n**Required facts [V]:**\n\n| Package | Price | Main difference |\n|---|---:|---|\n| Radiant | $1,125 | Trial, wedding-day services, extras, touch-up |\n| Timeless | $1,365 | Adds engagement beauty |\n| Royal | $1,685 | Extended touch-ups and second look |\n\n**Avoid:** Using the advertised savings totals until the underlying calculations are confirmed.\n\n#### Concept 3 — How to Inquire\n\n**[I] Primary selling point:** Make the booking process feel understandable.\n\n**Visual treatment:** Real team images and simple numbered steps.\n\n**Important:** The caption must distinguish an inquiry from a confirmed booking.\n\n#### Concept 4 — Texas Heat\n\n**[I] Primary selling point:** Wedding conditions matter when planning a hairstyle.\n\n**Visual treatment:** Genuine French-twist footage or approved hairstyle photographs.\n\n**Avoid:** \"Guaranteed sweatproof,\" \"heatproof,\" or other promises not established by the fact sheet.\n\n#### Concept 5 — Bridal Trial\n\n**[I] Primary selling point:** A trial creates an opportunity to discuss the bride's preferences.\n\n**Visual treatment:** Authentic preparation images, makeup details, hair references, and completed trial work.\n\n**Avoid:** Claiming the trial includes a specific deliverable or number of look changes unless Elsa confirms it.\n\n#### Concept 6 — Makeup-Shy Mothers\n\n**[I] Primary selling point:** Bridal-party beauty can respect different comfort levels.\n\n**Visual treatment:** An artist explaining how natural makeup can be adapted for someone who rarely wears it.\n\n**Avoid:** Assuming the subject wants makeup or making age-based appearance claims.\n\n#### Concept 7 — Curly Hair\n\n**[I] Primary selling point:** Bridal styles should reflect the client's actual hair texture and preferences.\n\n**Visual treatment:** Authentic textured-hair work showing shape and detail.\n\n**Avoid:** Inventing expertise in specific techniques that Elsa has not confirmed offering.\n\n#### Concept 8 — Tattoo Coverage\n\n**[I] Primary selling point:** Brides should know the service is available and can be discussed before the event.\n\n**Visual treatment:** Approved portfolio imagery or a direct explanation of the service.\n\n**Avoid:** Faked concealment demonstrations, fabricated transformations, or guarantees about coverage.\n\n#### Concept 9 — Moment vs. Photograph\n\n**[I] Primary selling point:** Connect the getting-ready experience with the finished result.\n\n**Visual treatment:** Genuine preparation footage followed by an authentic wedding photograph from the same event.\n\n**Avoid:** Matching footage from different weddings and presenting it as one event.\n\n#### Concept 10 — Wedding-Day Timeline\n\n**[I] Primary selling point:** Bridal beauty is part of a larger wedding schedule.\n\n**Visual treatment:** A simple sequence built around service count, getting-ready location, and ready-by time.\n\n**Avoid:** Claiming every wedding requires the same number of artists or preparation hours.\n\n#### Concept 11 — Real Client Feedback\n\n**[I] Primary selling point:** Let genuine clients explain the experience.\n\n**Visual treatment:** Real bridal photograph with an accurately attributed review excerpt.\n\n**Required placeholder until approved:**\n\n`{paste real review}`\n\n**Avoid:** Invented reviews, AI-generated client quotes, or combining unrelated reviews into a single testimonial.\n\n#### Concept 12 — Makeup Classes\n\n**[I] Primary selling point:** Show an existing service that is not limited to wedding dates.\n\n**Visual treatment:** Authentic class materials, hands-on makeup examples, or genuine instruction footage.\n\n**Published details [V]:**\n\n- Self Makeup Masterclass: $250.\n- Duration: Four hours.\n- Format: One-to-one.\n- Mobile within DFW.\n\n**Avoid:** Advertising unverified appointment availability.\n\n---\n\n# 3.9 Six Publish-Ready Instagram Captions\n\n**Bottom line:** [I] Every caption should connect an emotional concern or practical question to a real service. The first sentence should work without the video playing, and the final instruction should make the next step obvious.\n\nThe following captions are written for approved authentic portfolio content. They do not imply that new customer footage exists or that a particular client has consented to publication.\n\n**[I] Recommended approach:** Use a small set of relevant hashtags rather than a long, repetitive hashtag wall.\n\n### CAPTION 1 — NATURAL BRIDAL BEAUTY\n\nYour wedding-day makeup should still feel like YOU.\n\nNot a completely different person. Not a look you feel you have to live up to.\n\nJust your natural beauty, thoughtfully enhanced for one of your most meaningful days.\n\nAt Makeup and Hair by Elsa, natural and timeless beauty is at the heart of what we do.\n\nBecause your Natural Beauty is Timeless.\n\nPlanning your wedding? Explore our bridal packages and inquire about your date through the link in our bio.\n\n#DFWBridalMakeup #DallasBridalHair #NaturalBridalMakeup #DFWBrides\n\n---\n\n### CAPTION 2 — BRIDAL TRIAL\n\nYour bridal trial is about more than choosing a lipstick.\n\nIt's an opportunity to talk about how you want to look and feel on your wedding day.\n\nSoft and natural? A little more definition around the eyes? A hairstyle that feels comfortable and true to your personal style?\n\nYour preferences matter.\n\nOur bridal makeup and hair trial is $475, with travel fees additional.\n\nWant to explore your bridal beauty options?\n\nVisit the Services page through the link in our bio.\n\n#BridalMakeupTrial #DFWBrides #DallasWeddingMakeup #BridalHairInspiration\n\n---\n\n### CAPTION 3 — TEXAS HEAT & BRIDAL HAIR\n\nTexas wedding weather deserves a little extra thought.\n\nYour hairstyle is part of your whole wedding-day experience, especially when you're planning an outdoor ceremony, photographs, or a long celebration.\n\nA French twist is one beautiful option to explore if you love an elegant, timeless updo.\n\nThe right style should reflect your hair, your preferences, and your wedding plans.\n\nGetting married in Dallas–Fort Worth?\n\nTell us about your date and the look you're imagining through the link in our bio.\n\n#TexasBrides #DFWBridalHair #FrenchTwist #DallasWeddingHair\n\n---\n\n### CAPTION 4 — MAKEUP-SHY MOTHERS\n\nFor the moms who say, \"I don't really wear makeup.\"\n\nWe hear you.\n\nNot everyone wants dramatic eyeshadow, bold lipstick, or a completely different look for a special occasion.\n\nSometimes the goal is simply to feel polished, comfortable, and like yourself.\n\nThat matters just as much as the finished photograph.\n\nOur mobile beauty team offers makeup and hairstyling for wedding-party members, too.\n\nHave someone getting ready with you who loves a natural look? Share this with them.\n\n#MotherOfTheBrideMakeup #NaturalMakeup #DFWWeddings #DallasMakeupArtist\n\n---\n\n### CAPTION 5 — TATTOO COVERAGE\n\nYour wedding-day beauty should reflect your choices.\n\nSome brides want their tattoos to be part of their look. Others prefer coverage for certain photographs or moments.\n\nBoth are personal decisions.\n\nTattoo concealment is among the beauty services we offer, and we're happy to discuss your preferences when planning your appointment.\n\nIf coverage is something you're considering, mention it in your inquiry so we can talk through your needs.\n\nBecause your Natural Beauty is Timeless.\n\n#BridalBeauty #DFWMakeupArtist #DallasBridalMakeup #WeddingBeautyPlanning\n\n---\n\n### CAPTION 6 — SELF MAKEUP MASTERCLASS\n\nWish you felt more confident doing your own makeup?\n\nYou don't need to be a makeup artist to want a routine that works for you.\n\nOur Self Makeup Masterclass is a private, one-to-one experience designed around learning more about makeup application.\n\nFour hours. $250. A beauty experience focused on you.\n\nWe offer mobile classes in Dallas–Fort Worth.\n\nInterested in learning more or giving a class as a gift?\n\nExplore our classes through the link in our bio.\n\n#SelfMakeupClass #DFWMakeupArtist #DallasMakeupClass #MakeupLessons\n\n### Caption deployment notes\n\n| Caption | Recommended asset [I] | Main objective [I] | Verification before publishing |\n|---|---|---|---|\n| 1 | Genuine bridal close-up or Reel | Profile visits and inquiries | [Q] Image rights and client permission |\n| 2 | Real trial work or preparation image | Services-page visits | [V] Price $475; [Q] confirm appointment availability |\n| 3 | Authentic French-twist content | Saves and relevant inquiries | [Q] Right to reuse footage |\n| 4 | Approved wedding-party image or educational Reel | Shares and inquiries | [Q] Permission to feature participants |\n| 5 | Real coverage example or elegant text-led post | Qualified questions about coverage | [Q] Confirm current service availability and limitations |\n| 6 | Approved makeup-class material | Class inquiries | [V] Four hours and $250; [Q] confirm scheduling availability |\n\n**[I] Do not publish Caption 5 over a fabricated tattoo-concealment transformation.** The caption works with an informational carousel if real example footage is unavailable.\n\n**[I] All six captions are ready as written, subject to approval of the accompanying media and confirmation that the advertised services are currently available.**\n\n---\n\n# 3.10 Three Complete Instagram Reel Scripts\n\n**Bottom line:** [I] Elsa's Reels should be short, visually clear, and built from actual work rather than complicated productions. Focus on a relatable opening, useful information, and a single next step.\n\n**[A] Proposed Reel length:** 12–15 seconds.\n\n**Production requirement [I]:** Use real, approved photos and videos. Do not invent client reactions, alter before-and-after results, or depict an appointment that did not occur.\n\nThe scripts below are production-ready directions. Elsa must supply or approve the actual media.\n\n## REEL 1 — THE MOMENT VS. THE PHOTOGRAPH\n\n**Objective:** Show the natural, timeless bridal aesthetic.\n\n**Duration:** 12 seconds.\n\n**Visual style:** Warm, elegant, authentic bridal footage.\n\n**Required media:** Approved getting-ready footage and a genuine finished bridal photograph. If both depict the same client, verify permission for both.\n\n| Time | Shot | On-screen text |\n|---|---|---|\n| 0:00–0:02 | Close-up of an authentic bridal makeup application | \"Still look like you.\" |\n| 0:02–0:04 | Detail of eyes, skin, or hairstyle | \"Just beautifully enhanced.\" |\n| 0:04–0:07 | Genuine getting-ready moment | \"For your moments...\" |\n| 0:07–0:10 | Finished bridal portrait from the same session | \"...and your memories.\" |\n| 0:10–0:12 | Final bridal image and simple branded end card | \"Makeup and Hair by Elsa\" / \"Inquire about your date\" |\n\n**Audio direction:** Licensed soft piano or a gentle instrumental with a clear transition when the finished image appears.\n\n**Voice-over:** Optional. The Reel must make sense without sound.\n\n**Caption:**\n\nThe moment matters. So does how you feel in it.\n\nOur approach to bridal beauty is natural, timeless, and always centered on helping you feel like yourself.\n\nPlanning your wedding? Explore our bridal packages and inquire about your date through the link in our bio.\n\n#NaturalBridalMakeup #DFWBrides #DallasWeddingMakeup\n\n---\n\n## REEL 2 — TEXAS HEAT & THE FRENCH TWIST\n\n**Objective:** Connect an actual hairstyle offering with a practical wedding concern.\n\n**Duration:** 15 seconds.\n\n**Visual style:** Close-up hairstyling details, natural motion, clean typography.\n\n**Required media:** Authentic French-twist footage or approved photographs of Elsa's bridal hairstyling work.\n\n| Time | Shot | On-screen text |\n|---|---|---|\n| 0:00–0:02 | Finished French-twist hairstyle | \"Texas wedding weather?\" |\n| 0:02–0:05 | Hair being carefully styled | \"Your hairstyle needs a plan.\" |\n| 0:05–0:08 | Side or back detail of the updo | \"Elegant. Timeless. Considered.\" |\n| 0:08–0:11 | Another genuine angle of the same hairstyle | \"Love a French twist?\" |\n| 0:11–0:13 | Completed style | \"Let's talk about your look.\" |\n| 0:13–0:15 | Branded end card | \"Makeup and Hair by Elsa\" / \"Inquire about your date\" |\n\n**Audio direction:** Licensed understated instrumental with a gentle rhythmic beat. Music should complement the styling rather than overpower it.\n\n**Voice-over:** None required.\n\n**Caption:**\n\nPlanning a Texas wedding?\n\nYour hair, your venue, and your personal style all deserve consideration when choosing your bridal look.\n\nA French twist is one timeless option to explore.\n\nOur mobile bridal beauty team serves Dallas–Fort Worth and beyond.\n\nTell us about your wedding through the link in our bio.\n\n#DFWBridalHair #FrenchTwist #TexasBrides #DallasWeddingHair\n\n---\n\n## REEL 3 — YOUR WEDDING MORNING TIMELINE\n\n**Objective:** Show that bridal beauty involves planning and coordination, not just the finished look.\n\n**Duration:** 15 seconds.\n\n**Visual style:** Real preparation footage combined with simple text cards.\n\n**Required media:** Approved bridal-party preparation images, hairstyling footage, makeup work, and an optional generic schedule graphic. Do not show private client schedules.\n\n| Time | Shot | On-screen text |\n|---|---|---|\n| 0:00–0:02 | Authentic bridal-party preparation footage | \"Planning your wed
