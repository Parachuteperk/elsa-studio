ding morning?\" |\n| 0:02–0:05 | Makeup application | \"How many makeup services?\" |\n| 0:05–0:08 | Hairstyling footage | \"How many hair services?\" |\n| 0:08–0:11 | Simple visual of a clock or schedule | \"What's your ready-by time?\" |\n| 0:11–0:13 | Real team preparation image | \"We'll help plan your timeline.\" |\n| 0:13–0:15 | Final branded screen | \"Inquire about your wedding date.\" |\n\n**Audio direction:** Licensed light instrumental with a steady rhythm. Use simple cuts aligned with the music.\n\n**Voice-over:** Optional.\n\n**Caption:**\n\nYour wedding morning deserves a thoughtful plan.\n\nWhen you inquire with Makeup and Hair by Elsa, we'll ask about your event date, getting-ready location, ready-by time, and the makeup and hair services your party needs.\n\nThose details help us prepare your personalized beauty experience.\n\nStart planning with us through the link in our bio.\n\n#WeddingMorning #DFWBrides #BridalBeautyPlanning #DallasWeddingHair\n\n## Reel Production Checklist\n\n| Check | Requirement |\n|---|---|\n| ☐ | [I] The opening communicates the subject immediately |\n| ☐ | [I] Every text card is readable on a phone |\n| ☐ | [I] Main text stays clear of Instagram interface overlays |\n| ☐ | [I] Music and footage are properly licensed or authorized |\n| ☐ | [I] The finished look represents actual work |\n| ☐ | [I] The client has granted any required permissions |\n| ☐ | [I] No fictional testimonial or reaction is added |\n| ☐ | [I] The final frame includes Makeup and Hair by Elsa |\n| ☐ | [I] The CTA matches the real inquiry process |\n| ☐ | [I] Elsa approves the final video before publishing |\n\n**[I] Production recommendation:** Record and save appropriate short clips during real appointments, but only with permission and without disrupting the service.\n\nThis creates a reusable library of authentic content.\n\n---\n\n# 3.11 Four-Week Instagram & Facebook Calendar\n\n**Bottom line:** [I] The right schedule is one Elsa can maintain while balancing her business and family. Start with a manageable publishing rhythm, reuse approved work, and reduce output rather than sacrificing consistency when time is limited.\n\n### Planning assumptions\n\n| Variable | Starting assumption |\n|---|---|\n| Feed publishing | [A] Three Instagram posts per week |\n| Facebook | [A] Adapt the same three posts |\n| Stories | [A] One or two simple Story frames per day |\n| Reels | [A] One to two per week, included in the three feed posts |\n| Production | [A] One weekly batch session |\n| Elsa's involvement | [A] Content selection, fact checks, and final approval |\n| Aaron's involvement | [A] Drafting, organizing, editing coordination, and scheduling preparation |\n| Publishing | [I] Human approval required before anything is posted |\n\nThe calendar assumes access to a sufficient library of approved real media. [Q] Available content and permissions have not been audited.\n\n## Week 1 — Reintroduce the Brand\n\n**Theme:** [I] Establish who Elsa is, what the business offers, and how to inquire.\n\n| Day | Feed post | Format | Purpose |\n|---|---|---|---|\n| Monday | Natural bridal beauty — Concept 1 | Reel | [I] Communicate brand positioning |\n| Wednesday | Bridal packages explained — Concept 2 | Carousel | [I] Explain pricing and inclusions |\n| Friday | How to inquire — Concept 3 | Carousel | [I] Reduce booking uncertainty |\n\n**Story prompts:**\n\n| Day | Suggested Story |\n|---|---|\n| Monday | Share the new bridal Reel with a portfolio detail |\n| Tuesday | \"Natural or soft glam?\" preference poll |\n| Wednesday | Share the package comparison |\n| Thursday | Answer a common question about mobile services |\n| Friday | Share the inquiry-process post |\n| Saturday | Approved archival bridal photograph with a short caption |\n| Sunday | Simple inquiry reminder linking to the contact page |\n\n**[I] End-of-week action:** Pin the three introductory posts after confirming that their content and links are accurate.\n\n## Week 2 — Address Common Concerns\n\n**Theme:** [I] Show that bridal beauty is personal and practical.\n\n| Day | Feed post | Format | Purpose |\n|---|---|---|---|\n| Monday | Texas heat and French-twist styling — Concept 4 | Reel | [I] Reach brides thinking about weather and hairstyles |\n| Wednesday | What happens at a bridal trial? — Concept 5 | Carousel | [I] Explain the value of a trial |\n| Friday | Makeup for makeup-shy mothers — Concept 6 | Reel | [I] Encourage wedding-party inquiries |\n\n**Story prompts:**\n\n| Day | Suggested Story |\n|---|---|\n| Monday | French-twist Reel and close-up image |\n| Tuesday | Poll: \"Wedding hair up or down?\" |\n| Wednesday | Bridal trial FAQ |\n| Thursday | Authentic makeup detail from an approved image |\n| Friday | Share the makeup-shy mothers Reel |\n| Saturday | A real wedding-party portfolio image |\n| Sunday | Answer one submitted question, with identifying details removed |\n\n**[I] End-of-week action:** Compare which post generated meaningful saves, replies, or website visits.\n\nDo not judge success solely by views.\n\n## Week 3 — Demonstrate Range and Trust\n\n**Theme:** [I] Show different client needs while reinforcing the quality of existing work.\n\n| Day | Feed post | Format | Purpose |\n|---|---|---|---|\n| Monday | Bridal styles for curly hair — Concept 7 | Carousel | [I] Show relevant portfolio variety |\n| Wednesday | Tattoo concealment — Concept 8 | Reel or informational post | [I] Educate potential clients about a published service |\n| Friday | The moment vs. the photograph — Concept 9 | Reel | [I] Connect preparation with the finished bridal look |\n\n**Story prompts:**\n\n| Day | Suggested Story |\n|---|---|\n| Monday | Share the curly-hair carousel |\n| Tuesday | Poll: \"Defined curls or an updo?\" |\n| Wednesday | Explain that tattoo coverage inquiries are welcome |\n| Thursday | Share an approved hair detail |\n| Friday | Share the moment-versus-photo Reel |\n| Saturday | Feature a real review excerpt with accurate attribution |\n| Sunday | Invite followers to explore the bridal portfolio |\n\n**[I] End-of-week action:** Save the strongest reusable content and record which posts prompted service-specific questions.\n\n## Week 4 — Booking Confidence & Additional Services\n\n**Theme:** [I] Explain planning support and introduce classes without distracting from bridal bookings.\n\n| Day | Feed post | Format | Purpose |\n|---|---|---|---|\n| Monday | Wedding-morning timeline — Concept 10 | Carousel or Reel adaptation | [I] Address planning concerns |\n| Wednesday | What clients have shared — Concept 11 | Review carousel | [I] Strengthen confidence using real feedback |\n| Friday | Self Makeup Masterclass — Concept 12 | Reel or carousel | [I] Promote an existing non-bridal service |\n\n**Story prompts:**\n\n| Day | Suggested Story |\n|---|---|\n| Monday | Timeline checklist |\n| Tuesday | Poll: \"Getting ready at home, hotel, or venue?\" |\n| Wednesday | Link to verified client reviews |\n| Thursday | A short introduction to the team |\n| Friday | Makeup-class information |\n| Saturday | Approved bridal portfolio photograph |\n| Sunday | Answer a booking question and link to the contact page |\n\n**[I] End-of-week action:** Review the month's tracked results and use them to choose the next month's topics.\n\n---\n\n## 3.12 Daily Stories — A Low-Effort Routine\n\n**Recommendation:** [I] Use Stories to stay visible and answer questions without producing a polished Reel every day.\n\n**[A] Daily time allowance:** Approximately 5–10 minutes when using prepared images and prompts.\n\n### Simple recurring Story system\n\n| Day | Theme | Example |\n|---|---|---|\n| Monday | Bridal inspiration | An approved natural makeup look |\n| Tuesday | Preference question | \"Wedding hair: up or down?\" |\n| Wednesday | Service education | Explain one package inclusion |\n| Thursday | Behind the scenes | Approved work or preparation detail |\n| Friday | Real client feedback | `{paste real review}` with attribution |\n| Saturday | Bridal portfolio | Share a genuine wedding image |\n| Sunday | Inquiry reminder | \"Planning your wedding? We'd love to hear about your date.\" |\n\n### Three ready-to-use Story sequences\n\n#### STORY SET A — Availability\n\n**Frame 1:**\n\n> Planning your wedding beauty?\n\n**Frame 2:**\n\n> Natural, timeless hair and makeup—brought to your getting-ready location.\n\n**Frame 3:**\n\n> Tell us your date and location.  \n> Inquire through the link in our bio.\n\n**[I] Do not say that dates are available unless Elsa has confirmed current capacity.**\n\n#### STORY SET B — Bridal Packages\n\n**Frame 1:**\n\n> Your bridal experience, your way.\n\n**Frame 2:**\n\n> Radiant: $1,125  \n> Timeless: $1,365  \n> Royal: $1,685\n\n**Frame 3:**\n\n> Each package offers a different experience.  \n> Travel fees additional.  \n> Explore the full details on our website.\n\nAll prices are [V].\n\n#### STORY SET C — Natural Bridal Beauty\n\n**Frame 1:**\n\n> You can love makeup and still want to look like yourself.\n\n**Frame 2:**\n\n> Soft. Natural. Timeless.\n\n**Frame 3:**\n\n> Because your Natural Beauty is Timeless.  \n> Explore our bridal portfolio.\n\n### How to avoid content fatigue\n\n**[I] Stories do not need to be new footage every day.** Reuse genuine portfolio images, answer relevant questions, and share the week's feed posts.\n\nAvoid creating artificial urgency, such as claiming only one appointment remains when no availability information supports that statement.\n\n---\n\n## 3.13 The Lighter Schedule for Busy Weeks\n\n**[Q] Elsa's available work hours after returning from maternity leave are unknown.**\n\nThe content plan must not assume she can personally create and publish daily marketing material.\n\n### Reduced operating plan\n\n| Activity | Standard plan [A] | Lighter fallback [A] |\n|---|---|---|\n| Instagram feed posts | 3 per week | 1–2 per week |\n| Facebook posts | 3 adapted posts per week | Match Instagram |\n| Reels | 1–2 per week | 1 every two weeks |\n| Stories | Daily | 3 days per week |\n| New portfolio editing | Weekly | Every two weeks |\n| Comments and messages | Check during business hours | Check during business hours |\n| Analytics review | Weekly | Every two weeks |\n\n**[I] The lighter plan is preferable to publishing a large batch followed by another prolonged gap.**\n\n### Suggested division of labor\n\n| Task | Elsa | Aaron | AI assistant |\n|---|---|---|---|\n| Select client work | Approves | Organizes | — |\n| Confirm service details | Approves | Checks against website | Draft assistance |\n| Draft captions | Reviews | Manages | Creates drafts |\n| Edit Reels | Final approval | Coordinates | Script and editing guidance |\n| Review brand visuals | Final approval | Coordinates | Claude critique |\n| Schedule content | Approves | Handles publishing workflow | Prepares suggested schedule |\n| Reply to client inquiries | Approves or handles | Supports if authorized | Drafts only |\n| Review performance | Sets priorities | Tracks results | Summarizes data provided |\n\n**[I] No external account access is assumed. AI tools may prepare drafts, but they must not independently publish posts, send client messages, or take payments.**\n\n### Proposed weekly production routine\n\n**[A] Initial workload estimate:**\n\n| Activity | Time |\n|---|---:|\n| Select approved photos and clips | 15 minutes |\n| Draft three posts | 20 minutes |\n| Create or edit visuals | 45 minutes |\n| Review and approve captions | 15 minutes |\n| Prepare posts and Story templates | 20 minutes |\n| Review basic performance | 15 minutes |\n| **Total weekly production and review** | **130 minutes [A]** |\n\nDaily Stories and message handling are additional.\n\nThese times are planning assumptions, not measured performance.\n\n**[I] Keep Elsa's involvement concentrated on selecting real work, approving claims, and preserving her voice.** Aaron can handle most preparation and coordination.\n\n### Protecting the business's personal boundaries\n\n[V] Elsa publicly announced her return after having a baby.\n\n[I] The content strategy should acknowledge her return only to the extent she chooses. It should not depend on repeatedly sharing her child, private family experiences, or personal life to generate engagement.\n\nHer business already has a clear subject: bridal beauty.\n\n---\n\n# 3.14 How to Measure Social Media Results\n\n**Bottom line:** [I] Followers, reactions, and views do not automatically translate into profitable bridal bookings. Elsa needs to know which content produces profile visits, inquiries, and confirmed revenue.\n\n**[Q] Private Instagram, Facebook, and Google Business Profile analytics were not available in the supplied research.**\n\nThe table below is a decision guide, not a claim about current performance.\n\n## PASTE ADDITIONAL LIVE INSTAGRAM/FACEBOOK/GOOGLE INSIGHTS HERE (reach, saves, profile visits, DMs, link clicks, demographics, watch time, GBP calls/directions/search terms)\n\n**DM = direct message.**  \n**GBP = Google Business Profile.**\n\nFor the first reporting period, collect actual data before setting performance expectations.\n\n**[A] Initial comparison period:** Four weeks.\n\nAfter that, compare new results with Elsa's own previous results and similar post types.\n\n| Metric | If high | If low | What changes in this plan |\n|---|---|---|---|\n| Instagram reach | [I] More people are seeing the content; check whether they fit the target market | [I] Distribution may be limited | Test different opening frames, topics, and posting formats |\n| Instagram saves | [I] Educational or inspirational content may be useful | [I] Post may lack information people want to revisit | Create more practical bridal guides and hairstyle inspiration |\n| Instagram shares | [I] Content may be resonating with brides and their social circles | [I] The post may be too generic | Test useful planning content and relatable bridal questions |\n| Profile visits | [I] Posts are creating curiosity | [I] Content may not make the business identity clear | Improve openings, visual branding, and relevance |\n| Website link clicks | [I] Profile is encouraging the next step | [I] Bio or link destination may not be compelling | Test profile wording and the landing-page structure |\n| Instagram DMs | [I] People are starting conversations; assess lead quality | [I] Questions may be answered elsewhere or CTA is unclear | Use clearer service and inquiry prompts |\n| Qualified bridal inquiries | [I] Content is reaching potential customers | [I] Social activity may not be translating to demand | Emphasize service details, area served, pricing, and contact path |\n| Instagram follower demographics | [I] Audience aligns with target booking regions and interests | [I] Audience may not fit the business | Adjust location signals and content topics |\n| Reel watch time | [I] Viewers are staying engaged | [I] Opening or pacing may be weak | Shorten openings and show the main result sooner |\n| Reel completion | [I] The video holds attention | [I] Viewers may lose interest before the CTA | Reduce unnecessary footage and simplify the message |\n| Story views | [I] Existing followers are viewing updates | [I] Stories may lack relevance or consistency | Test a smaller set of useful recurring Story topics |\n| Story replies | [I] Followers are engaging in conversations | [I] Prompts may not invite useful responses | Ask specific, simple questions |\n| Facebook reach | [I] Adapted content is reaching an audience | [I] Posts may have low distribution | Test more locally relevant descriptions and authentic images |\n| Facebook messages | [I] The page is generating potential inquiries | [I] Contact path or content may be unclear | Improve the page CTA and service explanation |\n| Facebook website clicks | [I] The page encourages further consideration | [I] Users may not know what to do next | Make links and next steps more visible |\n| GBP calls | [I] Google is generating direct contact | [I] Users may favor the website or need clearer details | Verify the phone and service information |\n| GBP directions requests | [I] Review whether they represent useful customer intent | [I] May be irrelevant for a mobile business | Do not optimize for directions to a nonexistent public salon |\n| GBP website clicks | [I] Local search visibility is producing website visits | [I] Listing may not communicate enough value | Improve service descriptions, authentic photos, and website destination |\n| GBP search terms | [I] Relevant bridal-service searches appear | [I] Searches may be unrelated to the core offering | Refine service and category descriptions |\n| Lead-to-booking conversion | [I] More inquiries are becoming clients | [I] Investigate response times, quote clarity, pricing objections, and availability | Improve the inquiry process before increasing content volume |\n| Revenue from social leads | [I] Content contributes to measurable bookings | [I] Marketing effort may not be financially justified | Shift effort toward higher-performing formats and lead sources |\n\n### Important interpretation rule\n\n**[I] A post with fewer views but several qualified wedding inquiries may be more useful than a post with many views and no attributable inquiries.**\n\nFor this business, useful social media should ultimately support booked services, not just activity.\n\n---\n\n## 3.15 Simple Social Media Scorecard\n\n**[I] Recommendation:** Aaron should maintain one weekly tracking table.\n\n### Definitions\n\n| Metric | Formula |\n|---|---|\n| Engagement rate by reach | (Likes + comments + saves + shares) ÷ reach × 100 |\n| Profile visit rate | Profile visits ÷ accounts reached × 100 |\n| Link-click rate | Website link clicks ÷ profile visits × 100 |\n| Inquiry conversion rate | Qualified inquiries ÷ attributable website visits × 100 |\n| Lead-to-booking rate | Confirmed bookings ÷ qualified inquiries × 100 |\n| Social booking revenue | Total contracted service revenue from bookings attributed to social media |\n\n**[I] These calculations require actual underlying data.** Avoid calculating rates from public follower counts alone.\n\n### Four-week scorecard template\n\n| Metric | Week 1 | Week 2 | Week 3 | Week 4 |\n|---|---|---|---|---|\n| Instagram reach | {actual} | {actual} | {actual} | {actual} |\n| Instagram profile visits | {actual} | {actual} | {actual} | {actual} |\n| Instagram link clicks | {actual} | {actual} | {actual} | {actual} |\n| Instagram DMs | {actual} | {actual} | {actual} | {actual} |\n| Facebook reach | {actual} | {actual} | {actual} | {actual} |\n| Facebook website clicks | {actual} | {actual} | {actual} | {actual} |\n| Google website clicks | {actual} | {actual} | {actual} | {actual} |\n| Qualified inquiries from social | {actual} | {actual} | {actual} | {actual} |\n| Confirmed bookings from social | {actual} | {actual} | {actual} | {actual} |\n| Contracted social booking revenue | {actual} | {actual} | {actual} | {actual} |\n\n### How to interpret the results\n\n**Scenario A — Views increase, but inquiries do not.**\n\n[I] Check whether the content attracts people interested in bridal services in Elsa's coverage area. Improve pricing explanations, location signals, and inquiry CTAs before producing more of the same content.\n\n**Scenario B — Profile visits increase, but link clicks do not.**\n\n[I] Test the biography and primary link. Visitors may be unsure about pricing or how to proceed.\n\n**Scenario C — Inquiries increase, but bookings do not.**\n\n[I] Investigate response time, availability, quote presentation, and pricing objections. More social posting may not address the problem.\n\n**Scenario D — Inquiries and bookings both increase.**\n\n[I] Identify which content and lead sources contributed. Confirm that artist capacity and margins can support more bookings before increasing production or advertising.\n\n---\n\n# 3.16 How Social Media Should Connect to Revenue\n\n**Bottom line:** [I] Social media should guide visitors through a clear path from discovering Elsa to making an informed inquiry. Every step needs to work before paid promotion is justified.\n\n### Recommended customer journey\n\n```text\nINSTAGRAM REEL / FACEBOOK POST\n                │\n                ▼\n      VISITOR SEES REAL WORK\n                │\n                ▼\n        VISITS ELSA'S PROFILE\n                │\n                ▼\n        SEES PACKAGES / REVIEWS\n                │\n                ▼\n       CLICKS CONTACT LINK\n                │\n                ▼\n       COMPLETES INQUIRY FORM\n                │\n                ▼\n        RECEIVES PERSONAL REPLY\n                │\n                ▼\n          REVIEWS QUOTE\n                │\n                ▼\n      SIGNS AGREEMENT + DEPOSIT\n                │\n                ▼\n         CONFIRMED BOOKING\n```\n\n**[V]** Elsa's existing process requires an inquiry, quote or agreement, and deposit before a date is reserved.\n\n**[I]** Social media must reinforce that process rather than suggesting a completed booking happens with one click.\n\n### Where prospects may be lost\n\n| Stage | Risk [I] | Fix |\n|---|---|---|\n| First exposure | Content does not explain what the business offers | Show clear bridal services and authentic work |\n| Profile visit | Bio uses unclear language | Use the revised bio |\n| Pricing research | Packages are hard to compare | Pin the package carousel |\n| Trust evaluation | Reviews are not easy to access | Create the Reviews Highlight and website page |\n| Website visit | Visitor is unsure what happens next | Explain the inquiry process |\n| Inquiry submission | Slow or inconsistent response | Use the response system in Reply 3 |\n| Quote stage | Client does not understand total cost | Itemize services, travel, and payment terms |\n| Decision | Client forgets to respond | Use appropriate follow-ups with human approval |\n\n### Paid advertising decision\n\n**[I] Recommendation: Do not start paid Instagram or Facebook campaigns solely because organic engagement is low.**\n\nBefore launching paid campaigns, require:\n\n- ☐ [Q] A reliable baseline for inquiries and bookings.\n- ☐ [I] A functioning and tested website inquiry process.\n- ☐ [I] Consistent package and travel pricing.\n- ☐ [I] A confirmed inquiry-response owner.\n- ☐ [Q] Available capacity for the weddings the ads would target.\n- ☐ [I] A way to attribute paid leads to resulting bookings.\n- ☐ [Q] A confirmed advertising budget and acceptable customer acquisition cost.\n\n**CAC = customer acquisition cost:** Advertising and related acquisition expenses divided by the number of new customers acquired.\n\nSpecific spending limits and economic thresholds will be addressed in the revenue and business-operation sections after cost assumptions are established.\n\n---\n\n# 3.17 Social Media Implementation Checklist\n\n## Immediate Fixes\n\n| Priority | Action | Owner |\n|---|---|---|\n| ☐ High | [I] Replace Instagram bio with Option 1 | Elsa |\n| ☐ High | [I] Correct \"Book Here\" language | Elsa |\n| ☐ High | [I] Update Instagram display name | Elsa |\n| ☐ High | [I] Rewrite Facebook introduction and About details | Elsa / Aaron |\n| ☐ High | [Q] Confirm Bedford versus Colleyville before changing Facebook location | Elsa |\n| ☐ High | [I] Add a Facebook contact CTA | Aaron |\n| ☐ High | [I] Prepare three pinned Instagram posts | Aaron |\n| ☐ Medium | [I] Reorganize Highlights | Aaron / Elsa |\n| ☐ Medium | [Q] Confirm what the Shop Highlight promotes | Elsa |\n| ☐ Medium | [Q] Confirm client photo and video permissions | Elsa |\n\n## First Publishing Cycle\n\n| Priority | Action | Owner |\n|---|---|---|\n| ☐ High | [I] Select approved real bridal portfolio assets | Elsa |\n| ☐ High | [I] Produce the introduction Reel | Aaron |\n| ☐ High | [I] Produce the package carousel | Aaron |\n| ☐ High | [I] Produce the inquiry-process carousel | Aaron |\n| ☐ High | [I] Obtain Elsa's approval before publishing | Elsa |\n| ☐ Medium | [I] Adapt posts for Facebook | Aaron |\n| ☐ Medium | [I] Prepare reusable Story templates | Aaron |\n| ☐ Medium | [I] Organize approved media by service and subject | Aaron |\n\n## Measurement\n\n| Priority | Action | Owner |\n|---|---|---|\n| ☐ High | [Q] Obtain Instagram Insights | Elsa |\n| ☐ High | [Q] Obtain Facebook Insights | Elsa |\n| ☐ High | [Q] Obtain Google Business Profile performance data | Elsa |\n| ☐ High | [I] Track social-origin inquiries | Aaron |\n| ☐ High | [I] Record resulting confirmed bookings | Aaron |\n| ☐ Medium | [I] Review performance weekly | Aaron / Elsa |\n| ☐ Medium | [I] Adjust the following month's topics based on results | Aaron / Elsa |\n\n---\n\n# REPLY 2 — FINAL RECOMMENDATION\n\n### The strategy to use\n\n**[I] Recommendation: Build a consistent, high-trust bridal portfolio that converts—not an influencer-style content operation.**\n\nElsa already has verified assets to work with:\n\n- [V] An established Instagram profile with 1,626 followers at the research date.\n- [V] A mobile bridal beauty team with a clear natural-beauty positioning.\n- [V] Published bridal packages and individual service prices.\n- [V] Authentic bridal work and an established portfolio.\n- [V] Approximately 50 public reviews across the identified platforms.\n- [V] Bridal preparation, hairstyle, makeup, and special-event content themes.\n- [V] Makeup and hairstyling classes that can be promoted separately.\n\n### The biggest improvement\n\n**[I] Stop treating every post as an isolated piece of content.**\n\nUse a repeatable sequence:\n\n**Show the work → explain the value → establish trust → invite the inquiry.**\n\nThis is the organizing principle for the calendar, captions, Highlights, pinned posts, and profile.\n\n### What must be true before increasing effort\n\n[I] The first complete publishing cycle should establish whether Elsa can maintain the schedule and whether the resulting inquiries are worthwhile.\n\n**[A] Start with three weekly posts and simple Stories.** Reduce the frequency if necessary rather than sacrificing service quality or family time.\n\n**[I] Do not recommend additional social media spending until the business can measure inquiries, confirmed bookings, and acquisition costs.**\n\n---\n\n## NEXT: REPLY 3 — BUSINESS AUDIT, PRICING & SALES FUNNEL\n\nThe next reply covers the business SWOT, competitor pricing comparisons, package-value analysis, pricing improvement options, booking-funnel defects, and complete client communication templates.\n\nIt will include inquiry responses for available and unavailable dates, follow-ups, review requests, and outreach messages for planners, venues, and photographers.\n\n**Reply CONTINUE for Reply 3.**"},{"id":"chatgpt-review-3","name":"chatgpt-review-3.md","content":"# MAKEUP AND HAIR BY ELSA\n## Complete Business, Website & Marketing Review\n**REPLY 3 OF 5 — Business Audit, Pricing & Sales Funnel**\n\n**Research date:** November 5, 2026 [V]  \n**Primary objective:** [I] Increase profitable bookings without forcing Elsa to personally perform more appointments.\n\n**Evidence labels:** [V] Verified in the supplied fact sheet · [E] Calculated from verified figures · [A] Assumption or proposed test value · [I] Inference or recommendation · [Q] Question requiring Elsa's confirmation.\n\n---\n\n# SECTION 4. BUSINESS AUDIT, PRICING & FUNNEL\n\n**Bottom line:** [I] Elsa has the foundations of a premium bridal beauty business, but premium pricing needs a premium booking experience. The highest-priority improvements are explaining package value, responding consistently to inquiries, and measuring profitability before expanding the team or increasing advertising.\n\n## 4.1 Business SWOT Analysis\n\n**SWOT = Strengths, Weaknesses, Opportunities, and Threats.** It separates what is working, what needs improvement, where the business could grow, and what could undermine that growth.\n\n### Strengths\n\n- **[V] Established experience:** Elsa's beauty career began in 2013, and her website claims more than 13 years of experience.\n- **[V] Consistent positioning:** Natural, flawless, timeless bridal beauty, with an emphasis on helping brides feel like themselves.\n- **[V] Strong public reputation:** Approximately 50 reviews across identified platforms, with five-star ratings or positive recommendations.\n- **[V] Recognized wedding-directory presence:** The Knot lists Best of Weddings 2024.\n- **[V] Existing trained team:** Artists are hand-selected and trained by Elsa.\n- **[V] Mobile business model:** Services take place at clients' homes, hotels, and wedding venues.\n- **[V] Transparent pricing:** Published bridal packages, individual services, and classes.\n- **[V] Multiple revenue categories:** Weddings, special events, makeup lessons, hairstyling classes, and other services.\n- **[I] Premium positioning provides a possible path to higher revenue per wedding without competing primarily on price.**\n\n### Weaknesses\n\n- **[V] Inconsistent public pricing:** The Knot and WeddingWire display an unexplained $530 starting price.\n- **[V] Conflicting payment information:** Published payment methods differ between FAQ statements.\n- **[V] Multiple travel-fee calculations:** Customers must distinguish between package, trial, and individual wedding-day rules.\n- **[V] Inquiry-only booking process:** Customers must request a quote before reserving a date.\n- **[V] Limited recent social activity:** Approximately 12 Instagram posts during the first 10 months of 2026.\n- **[V] Website technical issues:** Missing H1 headings, duplicate homepage, and crawler responses requiring investigation.\n- **[I] Package value is insufficiently explained when compared with individual services.**\n- **[Q] Booking conversion, profits, team utilization, and lead response times are not measured in the supplied research.**\n- **[Q] Elsa's personal working capacity following her return from maternity leave is unknown.**\n\n### Opportunities\n\n- **[I] Increase average booking value by serving more members of wedding parties.**\n- **[I] Improve conversion by following up consistently with inquiries.**\n- **[I] Generate referrals through relationships with wedding planners, venues, and photographers.**\n- **[I] Use the trained team to expand booking capacity without requiring Elsa at every wedding.**\n- **[I] Promote makeup and hairstyling classes during periods with fewer wedding appointments.**\n- **[I] Use authentic reviews and portfolio work more prominently across the website and social media.**\n- **[I] Standardize administrative tasks to reduce repetitive correspondence.**\n- **[I] Improve local discovery through accurate Google and wedding-directory listings.**\n\n### Threats\n\n- **[V] Lower-priced competitors:** Several identified DFW businesses publish lower wedding-day bridal hair and makeup prices.\n- **[I] Price comparisons may be misleading when brides compare a complete package against a competitor's single appointment.**\n- **[I] Inconsistent communication could result in lost inquiries.**\n- **[I] Unclear travel fees could create disputes or reduce profit.**\n- **[I] Artist availability could limit expansion during popular wedding periods.**\n- **[I] Dependence on Elsa personally could restrict capacity as the business grows.**\n- **[I] Revenue could increase without corresponding profit if additional artist payouts, travel, and administrative costs are not controlled.**\n- **[I] Paid advertising could become expensive if the inquiry-to-booking process is not measured.**\n\n### Strategic conclusion\n\n**[I] Elsa should not try to be the lowest-priced bridal artist in Dallas–Fort Worth.**\n\nHer stated business model supports a different proposition:\n\n**Natural bridal beauty + professional team coordination + on-location convenience + a complete preparation experience.**\n\nThat combination should be reflected in the pricing presentation, quote process, and client communication.\n\n---\n\n# 4.2 Pricing Analysis — What Elsa Actually Charges\n\n**Bottom line:** [I] The published pricing is consistent with a premium positioning, but the customer needs to understand what is included before judging the cost. Compare individual appointments with individual appointments, and complete experiences with comparable bundles.\n\n## A. Elsa's Current Pricing\n\n### Bridal packages\n\n| Package | Price [V] | Published inclusions [V] |\n|---|---:|---|\n| Radiant | $1,125 | Trial, mini facial and massage, wedding-day makeup and hair, body glow, one-hour touch-up, luxury bridal kit |\n| Timeless | $1,365 | Radiant inclusions plus engagement-session makeup and hair |\n| Royal | $1,685 | Timeless inclusions, two-hour touch-up, second look after ceremony |\n\n**Additional charges [V]:** Requesting Elsa personally costs $175, subject to availability. Package travel is $100 per artist.\n\n### Individual bridal services\n\n| Service | Price [V] |\n|---|---:|\n| Wedding-day bridal makeup and hair | $700 |\n| Bridal makeup and hair trial | $475 |\n| Attendant makeup and hair | $280 |\n| Junior makeup and hair | $220 |\n| Flower girl | $90 |\n| Second look | $175 |\n\n## B. Compare Wedding-Day Services Like for Like\n\nThe following comparison uses the published price for one wedding-day bridal makeup-and-hair appointment, not a full wedding package.\n\n| Business | Wedding-day bridal makeup + hair [V] | Difference compared with Elsa [E] |\n|---|---:|---:|\n| **Makeup and Hair by Elsa** | **$700** | — |\n| 2Girls1Brush | $350 | Elsa +$350 |\n| Katy Reddell | $425 for one session | Elsa +$275 |\n| Paige Anderson — team | From $500 | Elsa +$200 versus starting price |\n| Paige Anderson — Paige personally | From $750 | Elsa $50 below starting price |\n| BBWellington | $350 | Elsa +$350 |\n| Classy Monae | $300 | Elsa +$400 |\n\n**[E] Formula:** Elsa's $700 wedding-day price minus each competitor's published price.\n\nFor example:\n\n$700 − $425 = **$275 more than Katy Reddell's published single-session price.**\n\nThese figures come from the supplied competitor research. final-prompt\n\n### What the comparison actually establishes\n\n**[V]** Elsa's $700 wedding-day bridal makeup-and-hair price is higher than several identified competitors' published single-session prices.\n\n**[I]** This establishes a price difference, not necessarily a difference in quality or value.\n\nThe comparison does not normalize every provider's appointment duration, included preparation, team structure, travel, or other conditions.\n\n**[I] Recommendation:** Keep the premium positioning for now, but clearly explain what the bridal service includes.\n\nDo not reduce the price simply because other businesses charge less.\n\n---\n\n## C. Compare Trial + Wedding-Day Pricing\n\nA more useful comparison combines a bridal trial and a wedding-day appointment.\n\n| Business | Trial [V] | Wedding-day service [V] | Combined price [E] |\n|---|---:|---:|---:|\n| Elsa à la carte | $475 | $700 | **$1,175** |\n| 2Girls1Brush | $350 | $350 | $700 |\n| BBWellington | $265 | $350 | $615 |\n| Classy Monae | $300 with hair | $300 | $600 |\n| Paige Anderson — team | From $450 | From $500 | From $950, if the quoted services can be combined |\n| Paige Anderson — owner | From $550 with Paige | From $750 with Paige | From $1,300, subject to availability and package terms |\n\n**[E] Calculation:** Trial price + wedding-day price = combined published price.\n\nExamples:\n\n- Elsa: $475 + $700 = **$1,175**\n- 2Girls1Brush: $350 + $350 = **$700**\n- BBWellington: $265 + $350 = **$615**\n\n**Important qualification:** [I] These are arithmetic comparisons of listed services, not verified all-inclusive wedding quotes. Travel, minimums, appointment requirements, and other inclusions differ.\n\n### Katy Reddell's published session bundles\n\n[V] The fact sheet identifies $425 for one session, $825 for two, and $1,200 for three.\n\n[I] The two-session price is useful context, but it should not automatically be called a bridal trial plus wedding-day package without verifying the exact terms.\n\n### What about Elsa's Radiant package?\n\n**Radiant: $1,125 [V]**\n\nSeparate trial and wedding-day services:\n\n$475 + $700 = $1,175 [E]\n\nDifference:\n\n$1,175 − $1,125 = **$50 [E]**\n\nThe package also includes additional benefits.\n\n**[I] That is an important distinction.**\n\nThe package's visible discount against these two separately priced services is only $50. Its larger appeal must come from the additional inclusions and the convenience of purchasing a coordinated experience.\n\n---\n\n## D. Radiant's Advertised Savings Need Verification\n\n[V] The website advertises:\n\n**Radiant — $1,125. Value $1,325. Save $200.**\n\nThe verified individual prices establish:\n\n| Component | Published price |\n|---|---:|\n| Bridal trial | $475 [V] |\n| Wedding-day makeup and hair | $700 [V] |\n| Combined | $1,175 [E] |\n| Radiant package | $1,125 [V] |\n| Difference | $50 [E] |\n\n### Where does the remaining advertised value come from?\n\nThe fact sheet identifies additional benefits, including a one-hour touch-up period and a luxury bridal kit described as a $50 gift [V].\n\nHowever, it does not establish independent prices for all additional inclusions.\n\n**[E] $1,325 advertised value − $1,175 separately priced services = $150 not explained by the two standalone prices.**\n\n**[Q] Elsa must verify the itemized values behind the stated $1,325 total.**\n\nThis does not prove the published savings claim is incorrect. It means the claim cannot be fully verified from the available pricing information.\n\n### Recommended correction\n\n**[I] Lead with included experiences rather than the savings figure.**\n\nProposed package presentation:\n\n> **Radiant — $1,125**\n>\n> Your bridal trial, wedding-day makeup and hair, mini facial and massage, body glow, one-hour touch-up, and luxury bridal kit—all brought together in one thoughtfully planned bridal experience.\n>\n> Travel fees are additional.\n\nUse the same approach for Timeless and Royal.\n\n---\n\n## E. Are Timeless and Royal Properly Differentiated?\n\n### Timeless\n\n[V] Timeless costs $1,365 and includes the Radiant experience plus engagement-session makeup and hair.\n\n**[E] $1,365 − $1,125 = $240 incremental package price.**\n\n**[I] This is a strong difference to communicate visually because the bride receives an additional beauty appointment.**\n\nRecommended headline:\n\n> **Timeless — Your Bridal Beauty, From Engagement to Wedding Day**\n\nThe site says Timeless is the choice most brides make [V], but actual sales mix is unknown [Q].\n\n**[I] Do not turn that statement into a percentage or bestseller statistic without booking records.**\n\n### Royal\n\n[V] Royal costs $1,685 and adds extended touch-up time and a second look.\n\n**[E] $1,685 − $1,365 = $320 incremental package price.**\n\n[V] A second look alone is listed at $175.\n\n**[E] $320 − $175 = $145 remaining price difference.**\n\n[I] That remaining difference should not be automatically assigned to touch-up time because package pricing and standalone services may have different structures.\n\nRecommended headline:\n\n> **Royal — Two Beautiful Looks, One Wedding Day**\n\n**[I] Royal should be visually positioned around the second look and additional touch-up coverage.**\n\n---\n\n## F. Compare Wedding-Party Pricing\n\n[V] Elsa charges $280 for an attendant's combined makeup and hair.\n\n| Business | Attendant / party makeup + hair | Comparison |\n|---|---:|---|\n| **Elsa** | $280 [V] | Baseline |\n| 2Girls1Brush | $250 [V] | Elsa +$30 [E] |\n| Katy Reddell | $280 [V] | Equal [E] |\n| BBWellington | $200 [V] | Elsa +$80 [E] |\n| Classy Monae | $220 [V] | Elsa +$60 [E] |\n| Paige Anderson | $125–$150 per service [V] | [E] Two such services would total $250–$300, if both apply at those rates |\n\n### Important commercial implication\n\n**[I] Wedding-party services can materially change the value of each booking.**\n\nFor example, using published Elsa prices:\n\n| Booking | Calculation | Service revenue |\n|---|---|---:|\n| Bride only, wedding-day à la carte | $700 | $700 [V] |\n| Bride + 2 attendants | $700 + 2 × $280 | $1,260 [E] |\n| Bride + 4 attendants | $700 + 4 × $280 | $1,820 [E] |\n| Bride + 6 attendants | $700 + 6 × $280 | $2,380 [E] |\n\nTravel and optional services are not included in these examples.\n\n**[I] The best opportunity may be to increase the number of appropriately staffed wedding-party services per booking, rather than changing bridal prices immediately.**\n\nHowever, [V] Elsa's website advises roughly five to six services per additional artist. Each larger booking must be checked against the available preparation window and the distinction between makeup and hair service counts.\n\n---\n\n# 4.3 Three Pricing Strategy Options\n\n**Bottom line:** [I] Start by presenting current prices more clearly, not changing them. Then use real inquiry and booking data to decide whether package restructuring or minimum booking requirements would improve profitability.\n\n## Option 1 — Reframe Existing Packages\n\n**Recommendation: Implement first.**\n\nKeep all verified prices unchanged.\n\n| Package | Current price [V] | Positioning [I] |\n|---|---:|---|\n| Radiant | $1,125 | The essential bridal experience |\n| Timeless | $1,365 | Engagement and wedding beauty together |\n| Royal | $1,685 | Complete bridal beauty with a second look |\n\n### Exact changes\n\n1. [I] Publish a clear side-by-side package comparison.\n2. [I] Explain the additional appointment included in Timeless.\n3. [I] Highlight Royal's second look.\n4. [I] Show travel and Elsa's personal-service fee separately.\n5. [I] Show à la carte pricing without making it look equivalent to the complete packages.\n6. [Q] Verify advertised savings before repeating them.\n\n**Risk [I]:** Better presentation may not solve underlying price sensitivity or limited market demand.\n\n**Test [A]:** Track the next 30 qualified bridal inquiries after the revised page launches, comparing results with a similar prior period if records exist.\n\n**Success measures:**\n\n- Percentage requesting each package.\n- Percentage proceeding to a contract.\n- Average contracted wedding value.\n- Number of inquiries requiring clarification about inclusions.\n\n**Decision [I]:** Keep the revised presentation if it improves qualified conversion or reduces confusion without weakening profitability.\n\n---\n\n## Option 2 — Restructure the Package Ladder\n\n**Recommendation: Test only after actual booking data is available.**\n\n[I] If clients consistently choose Radiant while showing interest in Timeless or Royal inclusions, Elsa could test a revised package structure.\n\nPossible changes include:\n\n- Clarifying what is exclusive to each package.\n- Making optional upgrades easier to understand.\n- Reconsidering the pricing difference between tiers.\n- Replacing unsupported savings language with itemized value.\n- Testing whether particular extras are more valuable as optional additions.\n\n### Hypothetical price test\n\n**[A] Illustration only, not a recommended price increase today:**\n\nTest Radiant at $1,200 rather than $1,125.\n\n**[A] Proposed price change: $75.**\n\n**[E/A] $1,200 − $1,125 = $75 additional gross revenue per booking if booking volume is unchanged.**\n\nThis assumes the same included services.\n\n**Risk [I]:** Higher prices could reduce conversion enough to outweigh the additional revenue per booking.\n\n**Required test [A]:**\n\n1. Record at least 30 comparable qualified inquiries at existing prices.\n2. Calculate actual booking conversion and average booking value.\n3. Confirm artist compensation and contribution margin.\n4. Introduce any approved new prices prospectively, honoring existing contracts and quotes.\n5. Track another comparable inquiry group.\n6. Compare total contribution profit, not only revenue per booking.\n\n**Contribution profit = revenue remaining after directly attributable costs, before general business overhead and taxes.**\n\n**[I] Do not raise prices solely because competitors charge more or because the brand is positioned as premium.**\n\n---\n\n## Option 3 — Publish a Wedding-Day Booking Minimum\n\n**Recommendation: Consider when utilization and travel economics support it.**\n\n[V] Katy Reddell lists a five-service wedding-day minimum, while BBWellington lists a $750 wedding-day minimum.\n\n[Q] The fact sheet does not establish an existing minimum for Elsa.\n\n### Why a minimum might help\n\n[I] A small appointment can use a valuable wedding date, involve travel, and require administrative work that may not be adequately covered by its service revenue.\n\n### Proposed test\n\n**[A] Example minimum for evaluation only: $1,000 in wedding-day services.**\n\nThis is not an existing Elsa policy.\n\nUnder that hypothetical minimum:\n\n- [E/A] A $700 bride-only service would fall $300 below the minimum.\n- [E/A] A $700 bride service plus two $280 attendants would total $1,260 and exceed the proposed minimum.\n\n**Risks [I]:**\n\n- Losing smaller weddings.\n- Reducing inquiries from brides with limited budgets.\n- Confusing customers if exceptions are inconsistent.\n- Blocking otherwise profitable weekday bookings.\n\n### Safer implementation path\n\n**[I] First calculate actual profit per booked wedding date.**\n\nThen consider a minimum only for specific dates or booking types where the economics support it.\n\n**[Q] Elsa must confirm:**\n\n- Whether minimums already exist privately.\n- Which dates typically have high demand.\n- The lowest profitable service total.\n- Whether travel and owner involvement affect the minimum.\n- Whether minimums should differ for weekends and weekdays.\n\n### Final pricing recommendation\n\n**[I] Choose Option 1 immediately.**\n\nDo not implement Options 2 or 3 until Elsa has reliable booking, capacity, and margin data.\n\n---\n\n# 4.4 Sales Funnel Audit\n\n**Bottom line:** [I] The booking process should feel personal without depending on Elsa remembering every follow-up. Every inquiry needs a clear owner, a next action, and a recorded outcome.\n\n## A. Current Booking Process\n\nThe verified process is:\n\n**Inquiry → Quote/Contract → 50% Deposit → Reserved Date** [V]\n\nAdditional facts:\n\n- [V] The inquiry form collects the date, location, ready-by time, requested services, estimated makeup and hair counts, planner, photographer, and lead source.\n- [V] The published response window is 24–48 hours.\n- [V] The remaining balance is due 30 days before the event.\n- [V] Final headcount is required eight weeks before the wedding.\n- [V] Consultations and bridal trials are available, but the supplied research does not establish that every bride completes both.\n- [Q] Actual inquiry response times, follow-up practices, and conversion rates are unknown.\n\n## B. Recommended Funnel\n\n[I] Preserve the personalized booking experience while making the administrative stages consistent.\n\n```text\n              NEW INQUIRY\n                   │\n                   ▼\n       RECORD LEAD + EVENT DATE\n                   │\n                   ▼\n         CHECK TEAM AVAILABILITY\n                   │\n             ┌─────┴─────┐\n             │           │\n         AVAILABLE   UNAVAILABLE\n             │           │\n             ▼           ▼\n       PERSONAL REPLY  POLITE REPLY\n             │        + REFERRAL\n             ▼\n      OPTIONAL CONSULT\n             │\n             ▼\n      PERSONALIZED QUOTE\n             │\n             ▼\n      CLIENT DECISION\n             │\n      ┌──────┴───────┐\n      │              │\n   ACCEPTS       NO RESPONSE\n      │              │\n      ▼              ▼\n   CONTRACT      FOLLOW-UP\n   + DEPOSIT     SEQUENCE\n      │\n      ▼\n   DATE RESERVED\n      │\n      ▼\n   TRIAL / PREPARATION\n   IF APPLICABLE\n      │\n      ▼\n   8-WEEK HEADCOUNT CHECK\n      │\n      ▼\n   30-DAY BALANCE DEADLINE\n      │\n      ▼\n   FINAL TIMELINE\n      │\n      ▼\n   WEDDING-DAY SERVICES\n      │\n      ▼\n   REVIEW REQUESTS\n      │\n      ▼\n   REFERRAL RELATIONSHIPS\n```\n\n**Important:** [I] A bridal trial should not be forced before contract and deposit simply to fit a diagram. Trial timing depends on the actual service agreement and should be confirmed with Elsa.\n\n## C. Stage-by-Stage Audit\n\n**KPI = key performance indicator:** A measurable result used to evaluate whether a process is working.\n\n| Stage | Current [V] | Leak risk [I] | Exact fix | KPI |\n|---|---|---|---|---|\n| Inquiry | WPForms collects detailed event information | Leads may be missed or duplicated | Record each inquiry in one lead tracker | Inquiries recorded ÷ inquiries received |\n| Response | 24–48-hour public response promise | Another vendor may reply first | [A] Aim for an initial response within 2–4 business hours when staffed | Median and maximum response time |\n| Availability | Team capacity exists, but current calendar access is unknown [Q] | A date may be promised without verification | Check the authoritative booking calendar before responding | Availability errors |\n| Consultation | Consultation support is offered | The purpose or next step may be unclear | Offer a consultation when it helps resolve scope or preferences | Consultations completed ÷ consultations scheduled |\n| Trial | Bridal trials are offered | Trial timing may be confused with date reservation | Explain when the trial occurs under the selected service | Trial completion rate for bookings that include one |\n| Quote | Custom quotes are provided | Package value and travel charges may be unclear | Send an itemized quote with services, travel, and total | Quote-to-contract rate |\n| Contract/deposit | Signed agreement and 50% deposit required | Clients may assume inquiry or agreement alone holds the date | Clearly state the reservation requirements | Signed-and-paid bookings ÷ accepted quotes |\n| Reminders | Eight-week headcount and 30-day balance deadlines | Manual reminders may be overlooked | Schedule reminders tied to each confirmed wedding date | On-time headcount and payment rates |\n| Wedding day | Mobile team provides services | Schedule, staffing, or communication errors | Use an approved final service and timeline checklist | On-time service completion; incident count |\n| Review | Public reviews exist | Completed clients may not be consistently invited to review | Send neutral review requests to all eligible clients | New reviews ÷ completed weddings |\n| Referral | Planner and photographer details are collected | Vendor connections may never be developed | Maintain a permission-aware vendor outreach tracker | Qualified referrals and referral bookings |\n\n### The most important missing measurement\n\n**[Q] What percentage of qualified inquiries become confirmed bookings?**\n\nUntil that is known, Elsa cannot reliably distinguish among three very different problems:\n\n1. [I] Not enough people inquire.\n2. [I] Enough people inquire, but too few book.\n3. [I] Enough people book, but the booking value or profitability is insufficient.\n\nEach problem requires a different solution.\n\n---\n\n# 4.5 The 10 Booking-Funnel Defects\n\n**[I] Benchmark:** A professionally managed premium bridal booking process should provide accurate pricing, timely communication, verified availability, transparent terms, dependable follow-up, and measurable booking outcomes.\n\n**Provisional score: 5/10 [I].**\n\nThis evaluates the documented customer-facing process. It is not an audit of Elsa's unobserved internal systems.\n\n**Verdict: NO-SHIP for scaling paid lead acquisition until critical tracking and communication gaps are resolved.** Existing bookings and ordinary operations need not stop.\n\n| # | Severity | Location | Problem | Exact fix |\n|---|---|---|---|---|\n| 1 | **High** | Lead tracking | [Q] No verified central system or funnel metrics | [I] Establish one inquiry tracker with source, status, value, and next action |\n| 2 | **High** | Booking communication | [V] Public response promises differ | [I] Publish one 24–48-hour promise and test a faster internal target |\n| 3 | **High** | Pricing | [V] Directory starting price conflicts with the website | [I] Correct service-specific directory pricing |\n| 4 | **High** | Travel | [V] Different service types use different calculations | [I] Itemize the applicable rule and amount in every quote |\n| 5 | **High** | Payment terms | [V] Payment-method wording conflicts | [Q] Confirm actual policy, then update site, quote, and agreement |\n| 6 | **High** | Follow-ups | [Q] No verified systematic follow-up process | [I] Create scheduled drafts and assign a human owner |\n| 7 | **Medium** | Packages | [I] The value beyond individual appointments is not sufficiently explicit | [I] Show inclusions and differences side by side |\n| 8 | **Medium** | Availability | [Q] Current calendar and team allocation procedures are unknown | [I] Verify availability before any date confirmation |\n| 9 | **Medium** | Post-event communication | [Q] No verified standard review-request process | [I] Establish consistent, neutral review invitations |\n| 10 | **Medium** | Vendor relationships | [Q] No verified system for following up with relevant planners and photographers | [I] Build a permission-aware referral tracker |\n\n---\n\n# 4.6 The Minimum Lead-Tracking System\n\n**Bottom line:** [I] A simple spreadsheet is enough to begin. The important requirement is that every inquiry has a recorded status and a next action.\n\n## Recommended columns\n\n| Column | Example or permitted value |\n|---|---|\n| Lead ID | `{lead_id}` |\n| Inquiry date | `{inquiry_date}` |\n| First name | `{first_name}` |\n| Event date | `{event_date}` |\n| Location / venue | `{venue}` |\n| Service requested | `{services}` |\n| Makeup service count | `{makeup_count}` |\n| Hair service count | `{hair_count}` |\n| Lead source | `{lead_source}` |\n| Team availability | Available / Unavailable / Unconfirmed |\n| Lead status | See below |\n| Quote services | `{service_subtotal}` |\n| Quote travel | `{travel_total}` |\n| Total quoted | `{quoted_total}` |\n| Package | Radiant / Timeless / Royal / À la carte / Other |\n| First response sent | `{timestamp}` |\n| Last contact | `{timestamp}` |\n| Next action date | `{date}` |\n| Assigned owner | Elsa / Aaron |\n| Agreement signed | Yes / No |\n| Deposit received | Yes / No |\n| Confirmed booking value | `{contracted_total}` |\n| Reason not booked | `{documented_reason}` |\n| Final outcome | Booked / Lost / Closed |\n\n**[I] Protect the spreadsheet using appropriate account permissions.** Avoid unnecessary client personal details when passing records to AI assistants.\n\n### Recommended statuses\n\n| Status | Meaning |\n|---|---|\n| New | Inquiry received, not yet reviewed |\n| Checking Availability | Calendar or team capacity needs verification |\n| Responded | Initial response sent |\n| Quote Sent | Client received a personalized quote |\n| Awaiting Decision | Client has not accepted or declined |\n| Follow-up Due | Next scheduled response is ready |\n| Contract Pending | Client intends to book; agreement not completed |\n| Deposit Pending | Payment required to reserve the date |\n| Booked | Signed agreement and required deposit received |\n| Unavailable | Requested date cannot be accommodated |\n| Lost | Client declined or booked elsewhere |\n| Closed | No current active inquiry; can be reopened on request |\n\n**[I] Never mark an inquiry as Booked simply because the bride says she wants the date.**\n\n[V] The reservation requires a signed agreement and deposit.\n\n---\n\n# 4.7 Complete Inquiry & Follow-Up Templates\n\n**Bottom line:** [I] Elsa's messages should sound personal, calm, and confident—not automated or pushy. Use templates to reduce repetitive writing, but verify the date, services, price, and recipient before sending.\n\n## Rules for every inquiry\n\n| Rule | Requirement |\n|---|---|\n| First response | [A] Internal goal of 2–4 business hours when staffed |\n| Public commitment | [V] 24–48 hours |\n| Availability | [I] Check the calendar before claiming the team is available |\n| Quotes | [I] Use actual confirmed prices and travel charges |\n| Date reservations | [V] Signed agreement plus 50% deposit |\n| Personalization | [I] Use event details already collected; do not ask clients to repeat them unnecessarily |\n| Referrals | [I] Refer only to a genuinely trusted, approved artist |\n| Automation | [I] Draft and queue messages automatically if appropriate; send only after human approval |\n\n### Follow-up timing\n\n**[A] Proposed sequence:**\n\n| Stage | When | Action |\n|---|---|---|\n| Initial inquiry | Within 2–4 business hours when possible | Personalized response |\n| First follow-up | 48 hours after the relevant unanswered message | Gentle check-in |\n| Second follow-up | Seven days after that message or initial quote, according to the chosen workflow | Offer help with remaining questions |\n| Final note | 14 days after the initial quote, if still unanswered | Close the active inquiry politely |\n| Reopening | Anytime the client responds | Recheck availability and restart the conversation |\n\n**[I] Suppress follow-ups if the client declines, opts out, confirms a booking, or receives a more recent response requiring a different next step.**\n\n## Ready-to-Send Inquiry Emails\n\nEach labeled template below is a separate email. Follow-ups can remain in the original inquiry thread.\n\n### TEMPLATE 1 — NEW INQUIRY: DATE AVAILABLE\n\nHi {first_name},\n\nThank you so much for reaching out to Makeup and Hair by Elsa!\n\nWe're excited to hear about your wedding on {event_date} at {event_location}.\n\nI've reviewed your inquiry, and our team currently has availability for your date.\n\nBased on the services you've requested, I'd love to help you choose the bridal beauty experience that best fits your plans.\n\n{personalized_service_recommendation}\n\nI'm reviewing your service details and travel information so I can provide an accurate quote. I'll follow up with your pricing details by {confirmed_quote_delivery_time}.\n\nPlease know that your date remains available to other inquiries until your signed agreement and required deposit are received.\n\nWe're so grateful you're considering us for your wedding!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa  \nBecause your Natural Beauty is Timeless.  \ninfo@makeupandhairbyelsa.com\n\n---\n\n### TEMPLATE 2 — NEW INQUIRY: DATE UNAVAILABLE\n\nHi {first_name},\n\nThank you so much for thinking of Makeup and Hair by Elsa for your wedding on {event_date}.\n\nI truly appreciate you reaching out.\n\nUnfortunately, our team isn't available for your requested date.\n\nI know how important it is to find someone you feel comfortable with for your wedding day.\n\nIf it would be helpful, I'd be happy to recommend {trusted_artist_name}, a beauty professional I know and trust.\n\nYou can reach them at {approved_artist_contact_information}. I haven't confirmed their availability, so I recommend contacting them directly.\n\nThank you again for considering us, and I hope you have a beautiful wedding celebration!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa  \ninfo@makeupandhairbyelsa.com\n\n---\n\n### TEMPLATE 3 — FIRST FOLLOW-UP: 48 HOURS\n\nHi {first_name},\n\nI wanted to follow up on your inquiry for {event_date}.\n\nI know wedding planning comes with a lot of decisions, so I wanted to make sure you received my previous message.\n\nIf you have any questions about our bridal packages, wedding-party services, or travel fees, I'm happy to help.\n\nIf you're still considering our team, just reply here and we can continue discussing your plans.\n\nThank you again for thinking of us!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n---\n\n### TEMPLATE 4 — SECOND FOLLOW-UP: 7 DAYS\n\nHi {first_name},\n\nI hope wedding planning is going smoothly!\n\nI wanted to check in once more about your hair and makeup plans for {event_date}.\n\nIf you're still exploring your options, I'd be happy to answer any questions about our services or the quote we discussed.\n\nAnd if you've already made other arrangements, I completely understand.\n\nEither way, thank you for considering Makeup and Hair by Elsa.\n\nWishing you a wonderful planning experience!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n---\n\n### TEMPLATE 5 — FINAL FOLLOW-UP: CLOSING YOUR INQUIRY\n\nHi {first_name},\n\nI wanted to send one final note regarding your wedding beauty inquiry for {event_date}.\n\nSince I haven't heard back, I'll close your inquiry for now so we can keep our booking records organized.\n\nThere's absolutely no problem if your plans have changed.\n\nIf you'd like to reconnect, you're always welcome to reply to this message. We'd be happy to review your plans again and check our current availability.\n\nThank you for considering Makeup and Hair by Elsa.\n\nWishing you a beautiful wedding day!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n### Required approval checks\n\n**Before Template 1:**\n\n- [Q] Is the date actually available?\n- [Q] Can the requested artist or team accommodate the services?\n- [Q] Is the quote-delivery time achievable?\n- [I] Is the service recommendation based on the bride's actual inquiry?\n\n**Before Template 2:**\n\n- [Q] Has Elsa approved the specific recommended artist?\n- [Q] Is the contact information accurate and appropriate to share?\n- [I] Remove the referral paragraph if no approved referral exists.\n\n**Before Templates 3–5:**\n\n- [I] Check whether the client has replied, booked, declined, or opted out.\n- [I] Do not imply the date is still available without rechecking.\n- [I] Do not send a follow-up after the customer has requested no further contact.\n\n---\n\n# 4.8 Post-Wedding Review Request Templates\n\n**Bottom line:** [I] Every completed client should have an equal opportunity to provide an honest review. Review requests must never depend on whether Elsa believes the client was happy, and they should never offer rewards for positive feedback.\n\nThe supplied prompt specifies a rotating sequence using Google, The Knot, and WeddingWire, with no incentives or selective requests. final-prompt\n\n## Proposed review sequence\n\n| Timing [A] | Platform | Goal |\n|---|---|---|\n| Day 2 after service | Google | Invite honest feedback |\n| Day 7 after service | The Knot | Follow up if no review was submitted |\n| Day 21 after service | WeddingWire | Final gentle invitation if still appropriate |\n\n**[I] These are proposed outreach dates, not current practices.**\n\n### Important safeguards\n\n- **[I] Invite every eligible client, not only clients believed to be satisfied.**\n- **[I] Never offer discounts, gifts, money, or benefits in exchange for reviews.**\n- **[I] Do not request a particular rating or favorable wording.**\n- **[I] Do not discourage negative feedback.**\n- **[I] Do not create or submit reviews on a client's behalf.**\n- **[I] Stop further requests if the client has already reviewed, declined, or opted out.**\n- **[I] Avoid unnecessarily requesting multiple reviews from the same client.**\n- **[Q] Confirm that each review link is the correct, active business profile.**\n\n## Three Complete Review Request Emails\n\nEach is a separate message. Use the appropriate verified review link before sending.\n\n### TEMPLATE 1 — DAY 2: GOOGLE\n\nHi {first_name},\n\nThank you so much for allowing our team to be part of your special day!\n\nIt was a pleasure helping with your hair and makeup, and we're grateful you chose Makeup and Hair by Elsa.\n\nWhen you have a moment, we'd love to hear about your experience.\n\nYour honest feedback helps us continue improving our services and helps other clients learn what to expect.\n\nYou can leave a Google review here:\n\n{verified_google_review_link}\n\nThank you again for trusting our team.\n\nWishing you all the best!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n---\n\n### TEMPLATE 2 — DAY 7: THE KNOT\n\nHi {first_name},\n\nI hope you're doing wonderfully!\n\nI wanted to thank you again for choosing Makeup and Hair by Elsa for your celebration.\n\nIf you have a moment and haven't already shared your experience, we'd appreciate an honest review on The Knot.\n\nReviews help other couples make informed decisions when choosing their wedding vendors, and every perspective is valuable to us.\n\nHere's our review link:\n\n{verified_the_knot_review_link}\n\nThank you again for including our team in your day!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n---\n\n### TEMPLATE 3 — DAY 21: WEDDINGWIRE\n\nHi {first_name},\n\nI hope you've been enjoying all the memories from your special day.\n\nI wanted to send one final thank-you for choosing Makeup and Hair by Elsa.\n\nIf you haven't already left a review and would like to share your experience, you're welcome to leave your honest feedback on WeddingWire.\n\nHere's the link:\n\n{verified_weddingwire_review_link}\n\nYour time and feedback are sincerely appreciated.\n\nThank you again, and wishing you all the best!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n### How to prevent excessive review requests\n\n**[I] Recommendation:** Maintain a single review-request status for each completed booking.\n\n| Status | Next action |\n|---|---|\n| Not requested | Prepare Day 2 email |\n| Day 2 sent, no known response | Consider Day 7 email |\n| Day 7 sent, no known response | Consider Day 21 email |\n| Review submitted | Stop reminders |\n| Client declines | Stop reminders |\n| Client opts out | Stop reminders |\n| Delivery failure | Verify contact information; do not repeatedly resend |\n\n**[I] If a client reviews on Google, do not automatically ask that same client to post additional reviews on The Knot and WeddingWire.**\n\nThe objective is authentic feedback, not maximizing the number of platform reviews per person.\n\n### Suggested neutral internal response to a negative review\n\nBefore replying publicly:\n\n1. [I] Verify that the reviewer corresponds to an actual client when possible.\n2. [I] Review the documented service details.\n3. [I] Avoid disclosing private appointment or payment information.\n4. [I] Respond respectfully without debating the reviewer's feelings.\n5. [I] Do not condition a resolution on changing or removing the review.\n\nA complete public review-response template will be included in the AI workflow discussion in Reply 5.\n\n---\n\n# 4.9 Wedding Vendor Referral Strategy\n\n**Bottom line:** [I] Wedding planners, venues, and photographers are a logical referral opportunity because they repeatedly interact with brides planning similar services. Elsa should pursue genuine professional relationships rather than generic mass outreach.\n\n[V] Her inquiry form already collects optional wedding planner and photographer information.\n\n**[I] That information can help identify relevant professionals, but it does not establish a relationship or authorize sharing a couple's private details.**\n\n## A. Which vendors to approach first?\n\n| Priority | Vendor type | Opportunity [I] |\n|---|---|---|\n| 1 | Wedding planners | They help couples coordinate vendors and wedding-day schedules |\n| 2 | Wedding venues | Their staff may be asked for local bridal beauty recommendations |\n| 3 | Wedding photographers | They can encounter brides looking for hair and makeup recommendations |\n| 4 | Other bridal vendors | Potential introductions after genuine relationships are established |\n\n### How to build the initial list\n\n**[A] Proposed starting target:** 20 relevant vendor contacts.\n\nUse:\n\n1. [V] Planner names already captured on inquiry forms, where appropriately used.\n2. [V] Photographer names already captured on inquiry forms, where appropriately used.\n3. [I] Vendors who publicly work in the DFW wedding market.\n4. [I] Existing professional relationships Elsa confirms.\n5. [I] Verified wedding venues serving the type of brides Elsa wants to reach.\n\n**[Q] Elsa should identify which vendors she has actually worked with and which are only prospective contacts.**\n\nDo not write outreach claiming a past collaboration unless it genuinely occurred.\n\n## B. Vendor Outreach Rules\n\n| Rule | Requirement |\n|---|---|\n| Personalization | [I] Refer to the professional's actual public work or a verified connection |\n| False relationships | [I] Never imply Elsa has worked at a venue or with a photographer unless confirmed |\n| Client privacy | [I] Do not disclose wedding details or client identities without appropriate permission |\n| Referral promises | [I] Do not guarantee referrals, payments, preferred status, or reciprocal promotion |\n| Portfolio | [I] Share genuine work with appropriate usage rights |\n| Follow-up | [A] Send one follow-up after five business days if appropriate |\n| Approval | [I] Elsa approves each external email before sending |\n\n---\n\n## C. Six Complete Vendor Outreach Emails\n\nThe following are separate messages. Each follow-up should remain in its corresponding introduction thread.\n\n### TEMPLATE 1 — WEDDING PLANNER INTRODUCTION\n\nHi {planner_first_name},\n\nI hope you're doing well!\n\nI'm Elsa, the founder of Makeup and Hair by Elsa, a mobile bridal hair and makeup team based in Bedford and serving Dallas–Fort Worth and beyond.\n\nI came across {specific_verified_detail_about_planner_or_work} and wanted to introduce myself.\n\nOur team specializes in natural, timeless bridal beauty, and we work with brides and wedding parties at homes, hotels, and venues.\n\nI know how important thoughtful timing and communication are to a wedding day.\n\nI'd love to connect, learn more about your planning services, and see whether we might be a good resource for each other's clients.\n\nYou can explore our work here:\n\nhttps://makeupandhairbyelsa.com/portfolio/\n\nThank you for your time!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa  \ninfo@makeupandhairbyelsa.com\n\n---\n\n### TEMPLATE 2 — WEDDING PLANNER FOLLOW-UP\n\nHi {planner_first_name},\n\nI wanted to follow up on my introduction.\n\nI know wedding planners have a lot to coordinate, so I'll keep this brief.\n\nIf you're ever looking for a mobile bridal hair and makeup team to consider for a client, I'd be happy to share our current services and availability.\n\nI'd also love to learn more about the couples you work with.\n\nThank you again!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n---\n\n### TEMPLATE 3 — WEDDING VENUE INTRODUCTION\n\nHi {venue_contact_first_name},\n\nI hope you're having a wonderful week!\n\nMy name is Elsa, and I'm the founder of Makeup and Hair by Elsa.\n\nWe're a mobile bridal hair and makeup team based in Bedford, serving weddings throughout Dallas–Fort Worth and beyond.\n\nI was interested in connecting after learning about {specific_verified_venue_detail}.\n\nOur approach is centered on natural, timeless bridal beauty, and we bring our services directly to the bride's getting-ready location.\n\nI'd love to introduce our team and learn whether there may be opportunities to connect with couples who are looking for bridal beauty services.\n\nYou can view our portfolio here:\n\nhttps://makeupandhairbyelsa.com/portfolio/\n\nThank you for your time.\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa  \ninfo@makeupandhairbyelsa.com\n\n---\n\n### TEMPLATE 4 — WEDDING VENUE FOLLOW-UP\n\nHi {venue_contact_first_name},\n\nI wanted to follow up on my introduction.\n\nIf your team maintains a list of bridal beauty professionals or receives questions about local hair and makeup services, I'd be happy to provide information about our mobile team.\n\nWe offer bridal hair and makeup, wedding-party services, and customized quotes.\n\nI'd welcome the opportunity to learn more about your venue and how you work with wedding vendors.\n\nThank you again!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n---\n\n### TEMPLATE 5 — WEDDING PHOTOGRAPHER INTRODUCTION\n\nHi {photographer_first_name},\n\nI hope you're doing well!\n\nI'm Elsa, the founder of Makeup and Hair by Elsa.\n\nWe're a mobile bridal beauty team serving Dallas–Fort Worth and beyond, with a focus on natural, timeless makeup and hairstyling.\n\nI came across {specific_verified_detail_about_photographer_work} and wanted to introduce myself.\n\nWe know how important the getting-ready portion of a wedding day can be, especially when couples are planning their photography timeline.\n\nI'd love to connect, learn more about your work, and see whether our businesses might be a good resource for each other.\n\nYou can explore our bridal portfolio here:\n\nhttps://makeupandhairbyelsa.com/portfolio/\n\nThank you for your time!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa  \ninfo@makeupandhairbyelsa.com\n\n---\n\n### TEMPLATE 6 — WEDDING PHOTOGRAPHER FOLLOW-UP\n\nHi {photographer_first_name},\n\nI wanted to follow up and say hello again.\n\nIf you ever have clients looking for natural bridal hair and makeup, I'd be happy to share our service information and check availability.\n\nI'd also love to learn more about your photography business and the types of weddings you enjoy working on.\n\nThank you again for your time, and I hope we have a chance to connect.\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa\n\n### What these emails deliberately avoid\n\n**[I] None of the templates claims:**\n\n- That Elsa has previously worked with the recipient.\n- That the recipient has endorsed Elsa.\n- That either business has agreed to a partnership.\n- That Elsa has availability on an unspecified date.\n- That referrals will be paid or reciprocated.\n- That a particular couple recommended the recipient.\n- That Elsa has visited a venue she has not actually visited.\n\nThe placeholder `{specific_verified_detail_about_planner_or_work}` must be replaced with a genuine, relevant detail before sending.\n\n---\n\n# 4.10 Referral Tracking\n\n**Recommendation:** [I] Use a small vendor tracker rather than trying to manage relationships from memory.\n\n### Spreadsheet fields\n\n| Column | Purpose |\n|---|---|\n| Vendor name | Business identity |\n| Vendor category | Planner / Venue / Photographer / Other |\n| Public website | Reference |\n| Contact person | Verified professional contact |\n| Business email | Public or appropriately provided contact |\n| Existing relationship | Past collaborator / Introduced / New prospect |\n| Source | Existing network / Public research / Inquiry vendor field |\n| Initial contact date | Outreach history |\n| Last contact date | Prevent excessive follow-ups |\n| Status | Not Contacted / Contacted / Replied / Connected / Closed |\n| Follow-up date | Next appropriate action |\n| Referrals received | Attributable leads |\n| Bookings received | Confirmed referrals |\n| Contracted booking revenue | Revenue from resulting bookings |\n| Notes | Relevant professional context |\n\n### Proposed outreach schedule\n\n**[A] Initial test: Five personalized introductions weekly.**\n\n| Week [A] | New introductions | Follow-ups |\n|---|---:|---|\n| 1 | 5 | 0 |\n| 2 | 5 | Up to 5 |\n| 3 | 5 | Up to 5 |\n| 4 | 5 | Up to 5 |\n| **Total** | **20 [A]** | **Up to 15 [A] during this period** |\n\n**[I] Send follow-ups only to contacts where they are appropriate.** Do not continue contacting professionals who decline or request no further messages.\n\n### How to evaluate vendor outreach\n\n| Metric | Formula |\n|---|---|\n| Outreach response rate | Replies ÷ delivered introductions × 100 |\n| Connection rate | Meaningful professional connections ÷ delivered introductions × 100 |\n| Referral lead rate | Qualified referred inquiries ÷ active referral relationships |\n| Referral booking rate | Confirmed bookings ÷ qualified referred inquiries × 100 |\n| Referral revenue | Total contracted revenue from attributable referral bookings |\n\n**[Q] No current vendor outreach or referral conversion rates are available.**\n\n**[I] Track results before increasing outreach volume.**\n\n---\n\n# 4.11 Operational Improvements That Support Conversion\n\n**Bottom line:** [I] A strong sales process cannot promise more than the team can deliver. Every confirmed booking should have verified staffing, service counts, travel calculations, and a clear responsibility for client communication.\n\n## A. Quote checklist\n\nBefore Elsa sends a quote, confirm:\n\n| Check | Required information |\n|---|---|\n| ☐ | [V] Event date |\n| ☐ | [V] Getting-ready location |\n| ☐ | [V] Ready-by time |\n| ☐ | [V] Requested bridal services |\n| ☐ | [V] Estimated makeup services |\n| ☐ | [V] Estimated hair services |\n| ☐ | [Q] Artist availability |\n| ☐ | [I] Required number of artists |\n| ☐ | [V] Applicable published service prices |\n| ☐ | [V] Applicable travel-fee rule |\n| ☐ | [I] Itemized travel charge |\n| ☐ | [V] Optional $175 Elsa personal-service fee when requested and available |\n| ☐ | [V] 50% reservation deposit |\n| ☐ | [V] Remaining balance due 30 days before the event |\n| ☐ | [I] Clear next step for accepting the quote |\n\n### Recommended quote presentation\n\n```text\nMAKEUP AND HAIR BY ELSA\n\nPrepared for: {first_name}\nWedding date: {event_date}\nGetting-ready location: {location}\n\nSERVICES\n{service_1_description}       ${service_1_price}\n{service_2_description}       ${service_2_price}\n{additional_services}         ${additional_total}\n\nService subtotal:             ${service_subtotal}\n\nTRAVEL\n{approved_travel_description} ${travel_total}\n\nOTHER APPROVED CHARGES\n{applicable_charges}          ${other_total}\n\nTOTAL QUOTED:                ${quoted_total}\n\nRESERVATION\nRequired deposit:            ${deposit_amount}\nRemaining balance:           ${remaining_balance}\n\nBalance due:\n{balance_due_date}\n\nYour date is reserved after your signed\nagreement and required deposit are received.\n\nQUESTIONS?\ninfo@makeupandhairbyelsa.com\n```\n\n**[I] Quote math:**\n\n`Service subtotal + travel charges + other applicable approved charges = total quoted`\n\n**[Q] Confirm whether the 50% deposit applies to service charges only or to the entire quoted amount.**\n\nDo not calculate deposits automatically until that rule is established.\n\n---\n\n## B. Eight-Week Wedding-Party Confirmation\n\n[V] Final headcount is required eight weeks before the wedding.\n\n**[I] Recommended workflow:**\n\n1. Generate a reminder based on the confirmed event date.\n2. Verify the current makeup and hairstyling counts.\n3. Ask the bride to confirm whether anything has changed.\n4. Recalculate staffing needs.\n5. Update the service agreement or invoice if required by the actual contract.\n6. Confirm the final preparation timeline.\n7. Record who approved any changes.\n\n**[I] Do not silently assume that one person receiving makeup and hair requires only one service slot.** The actual staffing calculation must account for the requested work and time available.\n\n### Capacity reminder\n\n[V] Elsa's website advises approximately five to six services per additional artist.\n\n[Q] The fact sheet does not establish how quickly a given artist performs every combination of makeup and hair, or whether all artists provide both services.\n\n**[I] Use the published guidance as a preliminary capacity check, not a substitute for an artist-by-artist schedule.**\n\n---\n\n## C. Thirty-Day Balance Reminder\n\n[V] The remaining balance is due 30 days before the event.\n\n**[I] Recommended workflow:**\n\n- Prepare the payment reminder before the contractual deadline.\n- Verify the approved payment method.\n- Confirm the amount due against the actual invoice.\n- Do not mark an invoice paid until payment is verified.\n- Escalate overdue balances to Elsa for review.\n- Follow the signed agreement rather than inventing late fees or cancellation penalties.\n\n**[Q] The exact payment options and any contractual remedies for nonpayment still need Elsa's confirmation.**\n\n---\n\n# 4.
