":"videos/the-power-of-a-small-post.mp4"},{"category":"Inspiration","slug":"beautifully-you-not-a-trend","title":"Beautifully you, not a trend","length":30,"purpose":"Reinforce the brand approach without fake transformations.","scenes":[{"seconds":7,"visual":"Neutral textured fabric and a row of soft shade swatches.","text":"Your taste first.","voiceover":"Your bridal look should start with your own preferences."},{"seconds":8,"visual":"A small collection of varied hair accessories and neutral ribbons.","text":"Choose the details","voiceover":"Maybe softly swept hair. Maybe a polished twist. There is no single right answer."},{"seconds":8,"visual":"A sketchbook with simple abstract lines, no portrait.","text":"Talk it through","voiceover":"Use your trial to explore what feels comfortable and confident."},{"seconds":7,"visual":"Warm still life with a small handwritten-style empty card.","text":"Still yourself.","voiceover":"Timeless does not mean identical. It means recognizably you."}],"prompt":"Beautiful contemporary bridal still life, 9:16 vertical video, styled ribbons, minimal pearl hairpins, neutral swatches, sketchbook of abstract nonhuman shapes, soft daylight. No real clients, faces, before/after comparisons, brand names, or claims of actual Elsa work. Four quiet visual movements totaling 30 seconds, no embedded lettering, subtitle-safe negative space.","location":"videos/beautifully-you-not-a-trend.mp4"},{"category":"Studio rhythm","slug":"protect-your-weekends","title":"Protect the dates that matter","length":32,"purpose":"Help Elsa set booking boundaries before accepting requests.","scenes":[{"seconds":8,"visual":"A blank monthly calendar in warm ivory with a few empty squares.","text":"Choose your days","voiceover":"Start by deciding which dates you truly want to work."},{"seconds":8,"visual":"A few calendar squares receive soft rose marks.","text":"Block personal time","voiceover":"Protect time for family and rest before other commitments fill it."},{"s y rose. No logos, readable text, fabricated user interface, real clients or product results. Four ten-second beats totaling 40 seconds. Leave space for overlay text and separate voiceover.","location":"videos/batch-content-in-one-hour.mp4"},{"category":"Studio rhythm","slug":"you-can-say-no","title":"A graceful no protects your yes","length":30,"purpose":"Provide gentle language for declining unsuitable work.","scenes":[{"seconds":7,"visual":"Blank inquiry card rests beside a calendar with no empty weekends.","text":"Not every date fits.","voiceover":"Saying no to an inquiry can be an act of care for the work you accept."},{"seconds":8,"visual":"Hands write a short reply on cream stationery without legible words.","text":"Be warm and direct","voiceover":"Thank them for reaching out, then explain that you cannot take that date."},{"seconds":8,"visual":"A neat card with open decorative margin appears.","text":"No invented promises","voiceover":"Offer an alternative only if it is real and verified."},{"seconds":7,"visual":"Calendar and beauty kit on a peaceful desk.","text":"Protect your best work","voiceover":"You can be kind, professional, and clear at the same time."}],"prompt":"Elegant gentle 9:16 short film with an anonymous warm ivory inquiry card, calendar showing fully booked slots as abstract marks, clean stationery and an unbranded makeup kit. No real bride, names, dates, client information, fake referral partners, or generated words. Four restrained beats totaling 30 seconds; premium muted rose and taupe, subtitle-safe space.","location":"videos/you-can-say-no.mp4"}]}</script><script>'use strict';
const DATA=JSON.parse(document.getElementById('data-payload').textContent);
const POSTS=DATA.posts, VIDEOS=DATA.videos, FIN=DATA.financial, DOCS=DATA.documents;
const KEY='elsa_dashboard_v1';
const TABS=['Home','Posts','Leads','Progress','Strategy'];
const ICON={Today:'<path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/>',Posts:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',Leads:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-6 8-6s8 2 8 6"/>',Progress:'<path d="M4 20V12M10 20V5M16 20v-9M22 20V8"/>',Strategy:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',Learn:'<path d="M5 5h14v14H5zM10 8l6 4-6 4z"/>',back:'<path d="m15 18-6-6 6-6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',check:'<path d="m4 12 5 5L20 6"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',play:'<path d="m9 6 10 6-10 6z"/>',plus:'<path d="M12 5v14M5 12h14"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||ICON.menu}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=q=>document.querySelector(q);
const USD=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
const DATE=(n=new Date())=>{let p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(n).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`;};
const dateDisplay=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Not set';
const DOW=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
const plusDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const validISO=s=>/^\d{4}-\d\d-\d\d$/.test(s||'');
const CAMPAIGN_START='2026-11-09',CAMPAIGN_END='2027-02-06',CAMPAIGN_WEEKS=13;
const daysBetween=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000);
const thisWeekDay=s=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)};
const operationalDay=()=>DATE()<CAMPAIGN_START?CAMPAIGN_START:DATE();
const campaignDayNumber=(d=DATE())=>d<CAMPAIGN_START?1:d>CAMPAIGN_END?90:daysBetween(CAMPAIGN_START,d)+1;
const campaignWeekNumber=(w)=>Math.min(CAMPAIGN_WEEKS,Math.max(1,Math.floor(daysBetween(CAMPAIGN_START,w)/7)+1));
const currentCampaignWeek=()=>DATE()<CAMPAIGN_START?CAMPAIGN_START:DATE()>CAMPAIGN_END?'2027-02-01':thisWeekDay(DATE());
const campaignWeekStart=n=>plusDays(CAMPAIGN_START,(n-1)*7);
const weekLabel=w=>w>=CAMPAIGN_START&&w<=CAMPAIGN_END?'Week '+campaignWeekNumber(w):'Other week';
const campaignWeekEnd=w=>{const x=plusDays(w,6);return w>=CAMPAIGN_START&&w<=CAMPAIGN_END&&x>CAMPAIGN_END?CAMPAIGN_END:x};
const campaignMode=()=>DATE()<CAMPAIGN_START?'preview':DATE()>CAMPAIGN_END?'finished':'active';
const PHASES=[{id:'Foundation',start:CAMPAIGN_START,end:'2026-12-06',title:'Get the foundation right'},{id:'Conversion',start:'2026-12-07',end:'2027-01-03',title:'Improve inquiries and booking'},{id:'Growth',start:'2027-01-04',end:CAMPAIGN_END,title:'Measure and prepare to grow'}];
const inWeek=(date,week)=>date>=week&&date<=plusDays(week,6);
function defaultState(){return {version:1,posts:{},leads:[],tasks:[],daily:{},decisions:{},milestones:{},milestoneEvidence:{},metrics:[],transactions:[],settings:{financialTier:'$100K',scenario:'Base',annualGoal:100000,scenarioWeddingCount:null,scenarioAov:null,scenarioOther:null},notes:'',lastSaved:null}}
let storageOK=true,storageNote='';let state=defaultState();
try{localStorage.setItem('_elsa_storage_check','ok');localStorage.removeItem('_elsa_storage_check');const raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);state={...defaultState(),...x,settings:{...defaultState().settings,...x.settings}};}}catch(e){storageOK=false;storageNote=String(e.message||e)}
function save(){if(window.__EXAMPLE_MODE){refreshSaveLabel();return}state.lastSaved=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;storageNote=String(e.message||e);notify('Storage unavailable — export a backup before closing.')}refreshSaveLabel();}
function refreshSaveLabel(){const el=$('#save-label');if(el)el.textContent=storageOK?'Saved on this device':'Not saving — storage unavailable'}
let tab='Home',panel=null,previousTab='Today',filters={scope:'week',platform:'all',type:'all',source:'all',status:'all',day:'all',search:''},weekStart=currentCampaignWeek(),scorecardWeek=currentCampaignWeek(),videoFilter='All',strategySection='Overview',leadFilter='attention';
let platformSelected={};
const PO=p=>({date:p.date,time:p.time,scheduled:!!p.scheduled,status:'Draft',platforms:{},assetReady:false,claimsOk:false,overrides:{},approvedFingerprint:null,...(state.posts[p.id]||{})});
const postPlatforms=p=>p.platforms;
function setPO(p,overrides){state.posts[p.id]={...PO(p),...overrides};save()}
function tag(t,kind='gray'){return `<span class="pill ${kind}">${esc(t)}</span>`}
function btn(text,action,variant='',extras=''){return `<button type="button" class="btn ${variant}" data-action="${esc(action)}" ${extras}>${text}</button>`}
function labelField(name,key,value,type='text',attrs=''){return `<div class="field"><label for="${esc(key)}">${esc(name)}</label><input id="${esc(key)}" name="${esc(key)}" type="${type}" value="${esc(value??'')}" ${attrs}></div>`}
function currentBadge(post){let po=PO(post),posted=post.platforms.filter(p=>po.platforms[p]==='Posted').length;return posted?`${po.status} · ${posted}/${post.platforms.length} platforms`:po.status}
function shortDay(d){return DOW(d)+', '+dateDisplay(d)}
function todayLeads(){const today=DATE();return state.leads.filter(l=>!['Booked','Lost','Declined','Unavailable'].includes(l.stage)&&(!l.firstRepliedAt || leadDue(l)?.date<=today));}
function leadDue(l){if(!l.firstRepliedAt)return {date:l.createdAt||DATE(),label:'Reply needed',tier:0}; if(['Booked','Lost','Declined','Unavailable'].includes(l.stage))return null;if(l.stage==='Pending Booking')return {date:l.quoteSentAt?plusDays(l.quoteSentAt,3):DATE(),label:'Check contract / deposit',tier:0};if(l.follow10At)return null; if(l.follow3At)return {date:plusDays(l.firstRepliedAt,10),label:'Final follow-up',tier:2};return {date:plusDays(l.firstRepliedAt,3),label:'First follow-up',tier:1}}
function openPanel(kind,id){panel={kind,id};renderPanel();}
function closePanel(){panel=null;$('#detail-root').innerHTML='';}
function goTab(t){if(!TABS.includes(t))return;closePanel();tab=t;render();window.scrollTo(0,0)}
function goLearn(from=tab){previousTab=from;tab='Learn';closePanel();render();window.scrollTo(0,0)}
function navButton(t){return `<button data-action="tab" data-id="${t}" class="${tab===t||(tab==='Learn'&&t===previousTab)?'active':''}" aria-label="${t}" aria-current="${tab===t?'page':'false'}">${ico(t)}<span>${t}</span></button>`}
function layout(){let count=DECISIONS.filter(d=>!state.decisions[d.id]?.value).length;return `<div class="app"><aside class="sidebar"><div class="logo"><span>THE STUDIO</span><br>Makeup &amp;<br>Hair by Elsa</div><nav class="side-nav" aria-label="Primary">${TABS.map(t=>navButton(t)).join('')}</nav><div class="side-foot"><span id="save-label">${storageOK?'Saved on this device':'Not saving'}</span><br><button class="text-action" data-action="settings">Settings &amp; backup →</button></div></aside><div class="main"><div class="topline"><div class="brand-small mobile-only">Elsa’s Studio</div><div class="top-actions"><button class="icon-btn" data-action="learn" title="Learn & videos" aria-label="Learn & videos">${ico('Learn')}</button><button class="icon-btn" data-action="decisions" title="Questions for Elsa" aria-label="Questions for Elsa">${ico('Strategy')}${count?`<span class="bubble">${count}</span>`:''}</button><button class="icon-btn" data-action="settings" title="Settings and data notes" aria-label="Settings and data notes">ⓘ</button></div></div>${storageOK?'':`<div class="notice rose"><strong>Storage warning:</strong> this browser cannot save reliably. Export your data before closing. ${esc(storageNote)}</div>`}<main id="content"></main></div><nav class="nav-bottom" aria-label="Mobile navigation">${TABS.map(t=>navButton(t)).join('')}</nav></div>`}
function render(){if(!$('#content'))document.body.innerHTML=layout();document.querySelectorAll('nav button[data-action="tab"]').forEach(x=>{x.classList.toggle('active',x.dataset.id===tab||(tab==='Learn'&&x.dataset.id===previousTab));x.setAttribute('aria-current',x.dataset.id===tab?'page':'false')});const root=$('#content');const expanded=Array.from(root.querySelectorAll('details[open][id]')).map(x=>x.id);root.innerHTML=tab==='Today'?renderToday():tab==='Posts'?renderPosts():tab==='Leads'?renderLeads():tab==='Progress'?renderProgress():tab==='Strategy'?renderStrategy():renderLearn();expanded.forEach(id=>{const d=document.getElementById(id);if(d?.tagName==='DETAILS')d.open=true});refreshSaveLabel()}
function titleBlock(eye,title,desc=''){return `<header class="calm-heading"><h1>${esc(title)}</h1>${desc?`<p class="muted">${esc(desc)}</p>`:''}</header>`}
const ROUTINE=['Check new inquiries','Review follow-ups due','Review scheduled content','Check booking deadlines','Review tomorrow’s priorities'];
function openTasks(){return (state.tasks||[]).filter(t=>!t.completed).sort((a,b)=>(a.priority==='Urgent'?-1:0)-(b.priority==='Urgent'?-1:0)||(a.date||'9999').localeCompare(b.date||'9999'));}
function taskCard(t){return `<div class="row start task-item"><label class="check-row stretch" style="border:0;min-height:55px;padding:8px 0"><input type="checkbox" data-action="task-toggle" data-id="${esc(t.id)}" ${t.completed?'checked':''}><span><strong class="${t.completed?'checked':''}">${esc(t.title)}</strong><br><small>${t.date?dateDisplay(t.date):'No due date'} · ${esc(t.owner||'Elsa')} · ${esc(t.priority||'Normal')}${t.completed?' · Completed':''}</small></span></label>${btn('Edit','task','small soft',`data-id="${esc(t.id)}"`)}</div>`;}
function renderTasksPanel(){let open=openTasks(),done=(state.tasks||[]).filter(t=>t.completed).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));return `<div class="eyebrow">Personal task tracker</div><h1>My studio tasks</h1><p class="muted">Manual tasks live on this device. Inquiries and posts are managed in their own sections.</p><div class="buttons">${btn('Add task +','add-task','primary')}</div><div class="section-row"><h2 class="section-title">Open · ${open.length}</h2></div><div class="card">${open.length?open.map(taskCard).join(''):'<p>No open personal tasks.</p>'}</div><details><summary>Completed tasks · ${done.length}</summary><div class="inside">${done.length?done.map(taskCard).join(''):'No completed tasks yet.'}</div></details>`;}
function detailTask(t){let x=t||{id:'',title:'',date:operationalDay(),owner:'Elsa',priority:'Normal',notes:''};return `<div class="eyebrow">${t?'Edit':'New'} studio task</div><h1>${t?'Update task':'Add a personal task'}</h1><form id="task-form" data-id="${esc(x.id)}"><div class="field"><label for="task-title">Task</label><input id="task-title" name="title" value="${esc(x.title)}" required maxlength="180" placeholder="e.g. Review Friday's bridal Reel"></div><div class="form-grid">${labelField('Due date','task-date',x.date,'date')}<div class="field"><label for="task-priority">Priority</label><select id="task-priority"><option ${x.priority==='Normal'?'selected':''}>Normal</option><option ${x.priority==='Urgent'?'selected':''}>Urgent</option></select></div><div class="field"><label for="task-owner">Owner</label><select id="task-owner"><option ${x.owner==='Elsa'?'selected':''}>Elsa</option><option ${x.owner==='Aaron'?'selected':''}>Aaron</option></select></div></div><div class="field"><label for="task-notes">Optional short notes</label><textarea id="task-notes" maxlength="1200">${esc(x.notes||'')}</textarea></div><div class="buttons">${btn('Save task','save-task','primary wide')}</div></form>${t?`<div class="buttons">${btn('Delete task','delete-task','small',`data-id="${esc(t.id)}"`)}</div>`:''}`;}
const DAY_ONE_TASKS=[
 'Confirm public wording and current availability with Elsa',
 'Confirm permission for genuine bridal photos and video',
 'Review posts for this week before anything is published',
 'Publish only after Elsa approves; record each platform separately',
 'Confirm this device saves and export a backup'
];
function renderDayOneChecklist(){
 const d=state.daily[CAMPAIGN_START]||{},locked=DATE()<CAMPAIGN_START;
 return `<div class="section-row"><h2 class="section-title">Day 1 · Launch checks</h2>${tag('Mon, Nov 9','v')}</div>
 <div class="card">${locked?'<p class="notice">This is your Monday launch plan. Completion checkboxes unlock November 9; you can review the posts and Elsa’s decisions now.</p>':''}
 ${DAY_ONE_TASKS.map((s,i)=>`<label class="check-row"><input type="checkbox" data-check-launch="${i}" ${d['launch'+i]?'checked':''} ${locked?'disabled title="Available from November 9"':''}><span class="${d['launch'+i]?'checked':''}">${esc(s)}</span></label>`).join('')}
 <div class="buttons">${btn('Open posts →','tab','small soft','data-id="Posts"')} ${btn('Needs Elsa’s answers →','decisions','small')}</div></div>`;
}
function renderToday(){
 const day=operationalDay(),preview=campaignMode()==='preview',isLaunch=day===CAMPAIGN_START,daily=state.daily[day]||{};
 const items=isLaunch?["Review inquiries & confirm booking availability","Check follow-ups and approved photo permissions","Review posts and approve only what is ready","Publish approved content; note each platform","Check wedding deadlines, next steps & backup"]:ROUTINE;
 const completed=items.filter((_,i)=>!!(daily[i]||(isLaunch&&daily['launch'+i]))).length,pct=Math.round(completed/items.length*100);
 const due=todayLeads();
 const nextPosts=POSTS.filter(p=>PO(p).scheduled&&PO(p).date>=day&&!p.platforms.every(pl=>PO(p).platforms[pl]==='Posted')).sort((a,b)=>PO(a).date.localeCompare(PO(b).date));
 const upcoming=nextPosts[0];
 const open=openTasks().filter(t=>!t.date||t.date<=day);
 const dayLabel=preview?'Monday, November 9, 2026':new Date(day+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 return `<header class="today-greeting"><div class="today-date">${esc(dayLabel)}${preview?' · Day 1':''}</div><h1>${preview?'Your studio is ready, Elsa.':'Good '+getGreeting()+', Elsa.'}</h1></header>
 <section class="card today-checklist" aria-label="Today checklist"><div class="check-head"><div><h2>Today</h2><div class="micro muted">${preview?'Your first-day plan':completed===items.length?'All done for today':`${items.length-completed} small steps left`}</div></div><div class="ring" role="img" aria-label="${completed} of ${items.length} completed" style="--done:${pct}"><div><strong>${completed}/${items.length}</strong></div></div></div>
 ${items.map((item,i)=>`<label class="check-row"><input data-check-day="${i}" type="checkbox" ${daily[i]||(isLaunch&&daily['launch'+i])?'checked':''} ${preview?'disabled title="Starts November 9"':''}><span class="${daily[i]?'checked':''}">${esc(item)}</span></label>`).join('')}</section>
 <section class="calm-section"><div class="section-row"><h2>Next post</h2><button class="text-action" data-action="tab" data-id="Posts">All posts →</button></div>
 ${upcoming?`<article class="card compact-card"><div class="row start"><div class="stretch"><div class="micro muted">${esc(shortDay(PO(upcoming).date))} · ${esc(upcoming.platforms.join(' / '))}</div><h3>${esc(upcoming.title)}</h3><p class="micro muted">${esc(currentBadge(upcoming))}</p></div><button class="subtle-arrow" data-action="post" data-id="${esc(upcoming.id)}" aria-label="Open ${esc(upcoming.title)}">›</button></div></article>`:`<div class="card compact-card muted">No selected posts ahead. <button class="text-action" data-action="tab" data-id="Posts">Browse the library →</button></div>`}</section>
 <section class="calm-section"><div class="section-row"><h2>Brides to follow up</h2><button class="text-action" data-action="tab" data-id="Leads">Open leads →</button></div>
 ${due.length?`<div class="card compact-card">${due.slice(0,2).map(l=>`<div class="row brief-lead"><div class="stretch"><strong>${esc(l.name||'Inquiry')}</strong><div class="micro muted">${esc(leadDue(l)?.label||'Next step')} · ${dateDisplay(l.eventDate)}</div></div><button class="subtle-arrow" data-action="lead" data-id="${esc(l.id)}" aria-label="Open inquiry">›</button></div>`).join('')}${due.length>2?`<button class="text-action" data-action="tab" data-id="Leads">${due.length-2} more needing attention →</button>`:''}</div>`:`<div class="card compact-card"><p class="muted" style="margin:0">No follow-ups due${state.leads.length?' right now.':'.'}</p>${!state.leads.length?`<button class="text-action" data-action="add-lead">Add an inquiry →</button>`:''}</div>`}</section>
 <details class="calm-more" id="today-more"><summary>More for your studio <span class="micro muted">Tasks · Learn · Plan</span></summary><div class="inside">
 <div class="quiet-list"><div class="row"><strong>My studio tasks${open.length?` · ${open.length}`:''}</strong><button class="text-action" data-action="add-task">Add task +</button></div>${open.length?open.slice(0,3).map(taskCard).join(''):'<p class="muted micro">Nothing extra due.</p>'}${open.length>3?`<button class="text-action" data-action="tasks">See the rest →</button>`:''}<button class="text-action" data-action="tasks">Manage tasks →</button></div>
 <div class="quiet-list"><strong>90-day plan</strong><div class="micro muted">Nov 9, 2026 – Feb 6, 2027 · ${preview?'Starts Monday':`Day ${campaignDayNumber(day)} of 90`}</div><button class="text-action" data-action="tab" data-id="Progress">Open progress →</button></div>
 <div class="quiet-list"><strong>A little support</strong><div class="micro muted">Short video lessons and practical guidance.</div><button class="text-action" data-action="learn">Explore Learn →</button></div>
 ${renderUpcomingBookings()}
 <button class="text-action" data-action="settings">Backup &amp; settings →</button>
 </div></details>`;
}
function renderUpcomingBookings(){const today=DATE(),up=state.leads.filter(l=>l.stage==='Booked'&&validISO(l.eventDate)&&l.eventDate>=today).sort((a,b)=>a.eventDate.localeCompare(b.eventDate)).slice(0,2);if(!up.length)return '';return `<div class="section-row"><h2 class="section-title">Upcoming weddings</h2></div><div class="stack">${up.map(l=>`<div class="card"><div class="row"><div><h3>${esc(l.name||'Confirmed booking')} · ${dateDisplay(l.eventDate)}</h3><p class="subtle">Published policy deadlines for reference—confirm against the signed contract.</p><div class="subline">Headcount: ${dateDisplay(plusDays(l.eventDate,-56))} · Balance: ${dateDisplay(plusDays(l.eventDate,-30))}</div></div>${btn('Open','lead','small soft',`data-id="${esc(l.id)}"`)}</div></div>`).join('')}</div>`}

// Escaped, small Markdown renderer: preserves original content without loading any external script.
function inlineMd(t){let e=esc(t);e=e.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');e=e.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" rel="noreferrer noopener" target="_blank">$1</a>');return e;}
function renderMarkdown(input){let lines=String(input||'').replace(/\r/g,'').split('\n'),h='',buf=[],type='';function flush(){if(!buf.length)return;if(type==='para')h+='<p>'+buf.map(inlineMd).join('<br>')+'</p>';if(type==='ul')h+='<ul>'+buf.map(x=>`<li>${inlineMd(x)}</li>`).join('')+'</ul>';if(type==='quote')h+='<blockquote>'+buf.map(inlineMd).join('<br>')+'</blockquote>';if(type==='code')h+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';if(type==='table'){h+='<div class="table-wrap"><table>'+buf.filter(x=>!/^\s*\|\s*:?-+:?/.test(x)).map((s,i)=>`<tr>${s.replace(/^\||\|$/g,'').split('|').map(v=>`<${i===0?'th':'td'}>${inlineMd(v.trim())}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')+'</table></div>';}buf=[];type=''}
for(let ln of lines){if(ln.startsWith('```')){if(type==='code')flush();else{flush();type='code'}continue}if(type==='code'){buf.push(ln);continue}if(/^\s*---\s*$/.test(ln)){flush();h+='<hr>';continue}const hd=ln.match(/^(#{1,6})\s+(.*)$/);if(hd){flush();h+=`<h${Math.min(3,hd[1].length)}>${inlineMd(hd[2])}</h${Math.min(3,hd[1].length)}>`;continue}if(!ln.trim()){flush();continue}const row=ln.match(/^\s*[-*]\s+(.*)$/);if(row){if(type!=='ul'){flush();type='ul'}buf.push(row[1]);continue}if(ln.startsWith('>')){if(type!=='quote'){flush();type='quote'}buf.push(ln.replace(/^>\s?/,''));continue}if(/^\|.*\|\s*$/.test(ln)){if(type!=='table'){flush();type='table'}buf.push(ln);continue}if(type!=='para'){flush();type='para'}buf.push(ln.trim())}flush();return h;}

 <div class="section-row"><h2 class="section-title">Approval &amp; publishing</h2></div><div class="card"><label class="check-row"><input id="assets-ok" type="checkbox" ${po.assetReady?'checked':''}><span>Real assets, rights, consent and identities confirmed</span></label><label class="check-row"><input id="claims-ok" type="checkbox" ${po.claimsOk?'checked':''}><span>Current claims, fees, reviews and availability checked</span></label><div class="buttons">${btn('Save review checks','save-review-checks','small soft',`data-id="${p.id}"`)}</div><p class="subtle">Approval requires the current caption and media checks. All external publishing is manual.</p>${blockers.length?`<div class="notice rose"><strong>Before approval:</strong><ul style="margin-bottom:0">${blockers.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:`<div class="notice green">Current selected-platform copy passes the tracked checks. Human approval is still required.</div>`}<div class="buttons">${btn('Ready for review','post-ready','small',`data-id="${p.id}"`)}${btn('Approve exact copy','post-approve','primary small',`data-id="${p.id}" data-platform="${esc(plat)}"`)}${btn('Skip draft','post-skip','small',`data-id="${p.id}"`)}</div><div class="label-divider">Publication by platform</div>${p.platforms.map(pl=>`<div class="row" style="min-height:49px;border-top:1px solid var(--line)"><span>${esc(pl)}</span><span>${tag(po.platforms[pl]||'Not posted',po.platforms[pl]==='Posted'?'v':'gray')}</span>${btn(po.platforms[pl]==='Posted'?'Undo posted':'Mark posted','post-publish','small soft',`data-id="${p.id}" data-platform="${esc(pl)}"`)}</div>`).join('')}</div>

function notify(message){let old=$('#toast');if(old)old.remove();const t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');t.textContent=message;document.body.appendChild(t);setTimeout(()=>t.remove(),3100)}
async function copyToClipboard(value){if(!value){notify('No source caption is supplied. Use the storyboard or write one first.');return}try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const a=document.createElement('textarea');a.value=value;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();if(!document.execCommand('copy'))throw new Error('Clipboard denied');a.remove()}notify('Copied to clipboard')}catch(e){try{const a=document.createElement('textarea');a.value=value;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();let ok=document.execCommand('copy');a.remove();if(!ok)throw Error();notify('Copied to clipboard')}catch(x){notify('Copy unavailable here. Select and copy the visible text instead.')}}}

function loadPrefs(){try{const p=JSON.parse(localStorage.getItem(UI_KEY)||'{}');return {lang:p.lang==='es'?'es':'en',plain:p.plain!==false,chosen:!!p.chosen};}catch(e){return {lang:'en',plain:true,chosen:false};}}
function savePrefs(){try{localStorage.setItem(UI_KEY,JSON.stringify({lang:prefs.lang,plain:prefs.plain,chosen:prefs.chosen}));}catch(e){notify(tr('status.unsaved'));}}
function tr(id,map){const row=STR[id];if(!row){window.__missingStrings.push(id);return id;}let s=row[prefs.lang]||row.en;if(!row[prefs.lang])window.__missingStrings.push(id);if(map)Object.keys(map).forEach(k=>{s=s.replaceAll('{'+k+'}',String(map[k]));});return s;}
function langTag(){return prefs.lang==='es'?'es-US':'en-US';}
function money(n){if(n==null||Number.isNaN(Number(n)))return '—';return new Intl.NumberFormat(langTag(),{style:'currency',currency:'USD',maximumFractionDigits:Number(n)%1?2:0}).format(Number(n));}
function formatISO(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return '—';return new Intl.DateTimeFormat(langTag(),{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));}
function chicagoYear(){return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric'}).format(new Date());}
function chicagoHour(){return Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',hourCycle:'h23'}).format(new Date()));}
function numOrNull(v){if(v===''||v==null)return null;const n=Number(v);return Number.isFinite(n)?n:null;}
function isBooked(l){return l&&l.stage==='Booked';}
function openStages(l){return l&&['New','Contacted','Quoted','Pending Booking'].includes(l.stage);}
function captureFields(root){if(!root)return [];return Array.from(root.querySelectorAll('input,textarea,select')).map(el=>({id:el.id,name:el.name,type:el.type,value:el.value,checked:el.checked}));}
function restoreFields(root,data){if(!root||!data)return;data.forEach(f=>{let el=f.id?root.querySelector('#'+CSS.escape(f.id)):null;if(!el&&f.name)el=root.querySelector('[name="'+CSS.escape(f.name)+'"]');if(!el)return;if(el.type==='checkbox'||el.type==='radio')el.checked=f.checked;else el.value=f.value;});}
function setLang(lang){const focus=document.getElementById('focus-note');if(focus)state.settings.focusNote=focus.value.slice(0,180);const main=document.getElementById('content');const det=document.getElementById('detail-root');const snap={main:captureFields(main),det:captureFields(det),focus:document.activeElement&&document.activeElement.id};prefs.lang=lang;prefs.chosen=true;savePrefs();const gate=document.getElementById('lang-gate');if(gate)gate.remove();render();if(panel)renderPanel();restoreFields(document.getElementById('content'),snap.main);restoreFields(document.getElementById('detail-root'),snap.det);if(snap.focus){const el=document.getElementById(snap.focus);if(el)el.focus();}}
function greeting(){const h=chicagoHour();if(h<12)return tr('greeting.morning');if(h<18)return tr('greeting.afternoon');return tr('greeting.evening');}
function photoAlt(id){const p=BRAND_PHOTOS.find(x=>x.id===id);if(!p)return '';return prefs.lang==='es'?p.alt_es:p.alt_en;}
function metricBooked(){const rows=state.leads.filter(l=>isBooked(l)&&String(l.eventDate||'').startsWith('2027'));if(!rows.length)return {id:'booked',state:'empty',value:null,have:0,of:0,rows};const withAmt=rows.filter(l=>numOrNull(l.contracted)!=null);const sum=withAmt.reduce((a,l)=>a+numOrNull(l.contracted),0);return {id:'booked',state:!withAmt.length?'partial':withAmt.length===rows.length?'complete':'partial',value:withAmt.length?sum:null,have:withAmt.length,of:rows.length,rows};}
function metricCash(){const year=chicagoYear();const rows=(state.transactions||[]).filter(t=>t.kind==='Cash collected'&&String(t.date||'').startsWith(year));if(!rows.length)return {id:'cash',state:'empty',value:null,have:0,of:0,rows,year};const withAmt=rows.filter(t=>numOrNull(t.amount)!=null);const sum=withAmt.reduce((a,t)=>a+numOrNull(t.amount),0);return {id:'cash',state:withAmt.length===rows.length?'complete':'partial',value:withAmt.length?sum:null,have:withAmt.length,of:rows.length,rows,year};}
function metricDue(){const rows=state.leads.filter(isBooked);if(!rows.length)return {id:'due',state:'empty',value:null,have:0,of:0,rows};const ready=rows.filter(l=>numOrNull(l.contracted)!=null&&numOrNull(l.collected)!=null);const sum=ready.reduce((a,l)=>a+numOrNull(l.contracted)-numOrNull(l.collected),0);return {id:'due',state:!ready.length?'partial':ready.length===rows.length?'complete':'partial',value:ready.length?sum:null,have:ready.length,of:rows.length,rows:ready};}
function metricOpen(){if(!state.leads.length)return {id:'open',state:'empty',value:null,have:0,of:0,rows:[]};const rows=state.leads.filter(openStages);return {id:'open',state:'complete',value:rows.length,have:rows.length,of:state.leads.length,rows};}
function metricValueText(m){if(m.state==='empty'||m.value==null)return '—';if(m.id==='open')return String(m.value);return money(m.value);}

function ownerClick(action,node){const id=node&&node.dataset?node.dataset.id:'';if(action==='lang'){setLang(id==='es'?'es':'en');return true;}if(action==='pricing-filter'){priceFilter=id;render();return true;}if(action==='open-pricing'){tab='Strategy';strategySection='Pricing';closePanel();setOwnerHash();render();return true;}if(action==='strategy-section'&&id==='Pricing'){strategySection='Pricing';setOwnerHash();render();return true;}if(action==='strategy-section'&&strategySection==='Pricing'){strategySection=id;if(location.hash==='#pricing')history.pushState(null,'','#strategy');}if(action==='metric'){openPanel('metric',id);return true;}if(action==='edit-goal'){openPanel('goal');return true;}if(action==='edit-capacity'){openPanel('capacity');return true;}if(action==='glossary'){openPanel('glossary');return true;}if(action==='save-goal-owner'){const t=Number(document.getElementById('goal-target')&&document.getElementById('goal-target').value);if(!t||t<=0){notify(tr('saveGoalNeed'));return true;}writeGoal(t,document.getElementById('goal-basis').value,document.getElementById('goal-note').value);closePanel();render();return true;}if(action==='use-legacy-goal'){writeGoal(state.settings.annualGoal,'booked_2027','');render();return true;}if(action==='save-capacity'){const raw=document.getElementById('cap-max').value;if(raw===''){delete state.settings.capacity;save();closePanel();render();return true;}const n=Number(raw);if(!n||n<=0){notify(tr('saveGoalNeed'));return true;}state.settings.capacity={year:2027,maxEvents:n};save();closePanel();render();return true;}if(action==='adopt-scenario'){writeGoal(Number(id),'booked_2027',tr('scenario.tag'));render();return true;}if(action==='use-public-example'){state.settings.scenarioAssumptions={...(state.settings.scenarioAssumptions||{}),brideValue:2805,brideSource:'public_example'};save();render();return true;}if(action==='clear-assumptions'){state.settings.scenarioAssumptions={};save();render();return true;}if(action==='confirm-import'){if(!pendingImport)return true;if(!snapshotDevice())return true;applyImported(pendingImport);notify(tr('status.saved'));return true;}if(action==='cancel-import'){pendingImport=null;closePanel();return true;}if(action==='restore-snap'){const raw=localStorage.getItem(KEY+'_snap_1');if(!raw){notify(tr('snap.none'));return true;}if(!snapshotDevice())return true;try{adoptState(JSON.parse(raw));save();render();notify(tr('snap.saved'));}catch(e){notify(tr('import.bad'));}return true;}if(action==='glossary'){openPanel('glossary');return true;}return false;}
function importState(){const file=document.getElementById('import-file')&&document.getElementById('import-file').files[0];if(!file){notify(tr('import'));return;}file.text().then(txt=>{let data;try{data=JSON.parse(txt);}catch(e){notify(tr('import.bad'));return;}if(!data||(data.schemaVersion!==1&&data.schemaVersion!==2)||!data.state||!Array.isArray(data.state.leads)){notify(tr('import.bad'));return;}pendingImport=data;openPanel('import-preview');});}
