ribution, and media | **5–15 min [A]** |\n| **Vendor collaboration content** | Grok tracks prospective collaborators. ChatGPT drafts joint concepts. Claude checks final presentation when needed. | As relationships develop | Elsa and the collaborator approve any shared claims or content | **10–25 min [A]** |\n| **Weekly social performance** | Grok collects available metrics. ChatGPT analyzes changes. Claude is used only if a creative redesign is warranted. | Sunday; weekly | Aaron approves conclusions and next actions | **15–25 min [A]** |\n\n### Important production distinction\n\n**[I] These tools can reduce planning, writing, organization, and repetitive editing work.**\n\nThey do not eliminate:\n\n- Choosing real client photos.\n- Editing authentic footage into a finished video.\n- Checking music and image rights.\n- Confirming client permission.\n- Publishing through approved accounts.\n- Responding personally when a customer needs Elsa.\n\n**[I] The savings estimates overlap and must not be added together as independent guaranteed reductions.** For example, drafting a caption and preparing a carousel may occur in the same ChatGPT session.\n\n### Revised Five-Step Content Workflow\n\n**Use this instead of the original nine-step process.**\n\n| Step | Owner | Action |\n|---|---|---|\n| **1** | Elsa | Selects approved real photos and video clips |\n| **2** | Grok Bot + ChatGPT | Prepares captions, Reel scripts, carousel copy, and platform variations |\n| **3** | Claude | Reviews the weekly batch for tone, accuracy, and visual presentation |\n| **4** | Elsa | Approves the completed content |\n| **5** | Aaron | Schedules or publishes the approved content; Grok records results |\n\n**[I] After templates are established, Claude can be skipped for routine posts that do not introduce new claims or designs.**\n\n---\n\n# 4. Booking and Client Administration Automation\n\n**Bottom line:** [I] This is more valuable than automating additional Instagram content. Missing a wedding inquiry, overlooking a deposit, or creating a scheduling conflict has direct business consequences.\n\n**[A] Estimates assume roughly six to ten qualified inquiries per month and two to four weddings completed per month.** Those are planning volumes, not verified current results.\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (labelled estimate) |\n|---|---|---|---|---|\n| **New website inquiries** | Grok detects WPForms/email inquiries, logs a lead, and identifies missing details. ChatGPT prepares a response if needed. | On new inquiry; daily review | Elsa approves the reply and availability statement | **10–20 min [A]** |\n| **Availability checks** | Grok compares event dates with the authorized booking calendar and flags conflicts. | Every new inquiry and relevant change | Elsa confirms actual artist availability | **5–15 min [A]** |\n| **First inquiry reply** | ChatGPT drafts a warm response. Grok provides verified event details and queues approval. | Each new qualified inquiry | Elsa approves recipient, content, and any commitment | **10–25 min [A]** |\n| **DM-to-lead conversion** | Grok flags service inquiries in DMs. ChatGPT drafts a reply directing the client to the official inquiry process. | Daily | Elsa approves the DM | **10–20 min [A]** |\n| **Inquiry follow-ups** | Grok detects unanswered eligible inquiries. ChatGPT prepares approved-template responses. | At 48 hours, seven days, and final closure when appropriate [A] | Elsa approves each message | **10–20 min [A]** |\n| **Custom quotes** | Grok gathers verified service requirements. ChatGPT calculates an itemized draft using approved prices and rules. | Each quote request | Elsa approves price, travel, staffing, total, and actual quote | **15–30 min [A]** |\n| **Contracts and deposits** | Grok checks authorized status records and flags missing signatures or deposits. ChatGPT drafts reminders. | Daily review | Elsa approves communication and confirms booking status | **5–15 min [A]** |\n| **Eight-week headcount reminder** | Grok calculates the deadline and prepares an internal task. ChatGPT drafts the client message. | Eight weeks before each wedding [V] | Elsa approves the outgoing reminder and any service changes | **5–15 min [A]** |\n| **Thirty-day balance reminder** | Grok checks verified invoice status and prepares a reminder. ChatGPT drafts the message. | Before the 30-day deadline [V] | Elsa verifies amount, payment details, and sending | **5–15 min [A]** |\n| **Wedding-day timeline draft** | ChatGPT proposes a timetable using service counts and available artist times. Grok checks calendar conflicts. | After service counts are confirmed; update on changes | Elsa approves the actual schedule and artist allocation | **15–30 min [A]** |\n| **Bridal preparation emails** | ChatGPT creates reusable messages. Grok tracks which applicable approved messages are due. Claude reviews new templates. | According to each booking's agreed communication schedule | Elsa approves every outgoing message | **10–20 min [A]** |\n| **Client questions and FAQs** | Grok identifies recurring questions. ChatGPT drafts responses from confirmed policies. Claude checks new public FAQ copy. | Daily; template review monthly | Elsa approves responses and policy language | **10–20 min [A]** |\n| **Post-wedding review requests** | Grok tracks completed weddings and whether a client has reviewed, declined, or opted out. ChatGPT drafts the request. | Day 3, optional Day 10 reminder [A] | Elsa approves both messages | **5–15 min [A]** |\n| **Public review responses** | Grok identifies new reviews. ChatGPT prepares replies. Claude checks sensitive or negative responses. | When new reviews appear | Elsa approves every public response | **5–15 min [A]** |\n| **Lead-source tracking** | Grok records website, Google, Instagram, Facebook, TikTok, directory, or referral sources where known. ChatGPT analyzes trends. | Each inquiry; weekly summary | Aaron reviews uncertain attribution | **10–20 min [A]** |\n\n## The Most Valuable Booking Automation\n\n**[I] Prioritize these five processes:**\n\n| Priority | Process | Reason |\n|---|---|---|\n| **1** | New inquiry capture | Prevents missing opportunities |\n| **2** | First response drafting | Reduces response effort |\n| **3** | Follow-up reminders | Prevents leads from being forgotten |\n| **4** | Wedding deadlines | Reduces operational mistakes |\n| **5** | Quote preparation | Improves pricing consistency |\n\n### A Practical Example\n\n**[A] Hypothetical incoming inquiry:**\n\nA bride submits an inquiry requesting Timeless, hair and makeup for four attendants, and services on a specified wedding date.\n\n**Grok Bot:**\n- Detects the inquiry.\n- Creates a lead record.\n- Checks the authorized calendar.\n- Marks availability as unconfirmed if the calendar is incomplete.\n- Sends the relevant details to ChatGPT.\n\n**ChatGPT:**\n- Drafts a personalized reply.\n- Lists the relevant published prices.\n- Flags travel and staffing information that needs confirmation.\n- Avoids promising the date.\n\n**Grok Bot:**\n- Adds the response to Elsa's approval queue.\n- Schedules the next internal check.\n\n**Elsa:**\n- Confirms availability.\n- Approves or adjusts the response.\n- Authorizes the exact message.\n\n**Aaron or an authorized, approval-controlled workflow:**\n- Sends the approved reply.\n- Records the result.\n\n**[I] The client gets a personal response while Elsa avoids assembling every message from scratch.**\n\n---\n\n# 5. Automation by Revenue Goal: $100K → $200K → $300K+\n\n**Bottom line:** [I] The business should not run the same operating system at every revenue level. At $100K, focus on handling leads reliably. At $200K, focus on capacity and profitability. At $300K+, focus on coordinating multiple artists and simultaneous weddings without losing service quality.\n\n## $100K Tier — Reliable Administration\n\n**[A] Base planning model:**\n- 32 weddings annually.\n- Approximately 92 qualified inquiries annually at 35% conversion [E/A].\n- $2,948.75 modeled wedding AOV [E/A].\n- $100,360 modeled gross annual revenue [E/A].\n\n### Automation Priorities\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (labelled estimate) |\n|---|---|---|---|---|\n| **Lead management** | Grok logs inquiries; ChatGPT drafts replies | Every inquiry | Elsa approves replies and availability | **15–30 min [A]** |\n| **Follow-up management** | Grok tracks unanswered leads; ChatGPT prepares messages | Daily deadline check | Elsa approves outgoing messages | **10–20 min [A]** |\n| **Basic social campaign** | Grok coordinates; ChatGPT drafts; Claude reviews weekly creative batches | Two posts/week | Elsa approves content; Aaron publishes | **30–60 min [A]** |\n| **Booking reminders** | Grok tracks deadlines; ChatGPT drafts notices | Daily | Elsa approves client notices | **10–20 min [A]** |\n| **Weekly business report** | Grok assembles data; ChatGPT checks calculations and flags missing information | Weekly | Aaron verifies financial results | **15–25 min [A]** |\n\n### What to build first\n\n**[I] One lead tracker, one calendar, one approval queue, and one weekly report.**\n\nDo not add a paid customer management platform unless the existing systems cannot support these functions.\n\n**[A] Estimated overall net time saving:** Approximately **2–4 hours per week** after successful setup, depending on actual inquiry and content volume.\n\nThis is a scenario estimate, not a measured saving. It should not be calculated by simply summing every overlapping table row.\n\n---\n\n## $200K Tier — Profitability and Artist Capacity\n\n**[A] Base planning model:**\n- 64 weddings annually.\n- Approximately 183 qualified inquiries annually at 35% conversion [E/A].\n- $200,720 modeled annual gross revenue [E/A].\n- One-team calendar utilization becomes tight under the earlier capacity assumptions [I].\n\n### Additional Automations\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (labelled estimate) |\n|---|---|---|---|---|\n| **Artist scheduling support** | Grok checks availability and calendar overlaps. ChatGPT proposes assignments and identifies missing service-time information. | Every new booking; weekly calendar review | Elsa approves every artist assignment and final timeline | **15–30 min [A]** |\n| **Wedding profitability** | Grok gathers verified revenue and expense records. ChatGPT calculates contribution profit and identifies discrepancies. | After each event; weekly rollup | Aaron verifies costs; Elsa approves financial decisions | **15–30 min [A]** |\n| **Quote checking** | ChatGPT independently recalculates services, travel, and proposed totals. Grok flags inconsistencies. | Every quote | Elsa approves the final price and agreement | **10–20 min [A]** |\n| **Vendor referral management** | Grok tracks outreach. ChatGPT prepares personalized introductions and follow-ups. Claude reviews new templates. | Three appropriate contacts/week [A] | Elsa approves recipients, relationship claims, and sending | **15–30 min [A]** |\n| **Conversion analysis** | Grok organizes inquiry results. ChatGPT analyzes booking rates and lost-lead reasons. | Weekly; deeper monthly review | Aaron verifies data; Elsa approves changes | **10–20 min [A]** |\n| **Package performance review** | ChatGPT compares actual package revenue, direct costs, and booking frequency. Grok prepares the report. | Monthly | Elsa approves pricing or service changes | **10–20 min [A]**, averaged across active weeks |\n\n### What changes at $200K\n\n**[I] Stop optimizing only for the number of bookings.**\n\nTrack:\n\n- Revenue per wedding.\n- Artist payouts.\n- Direct costs.\n- Profit contribution.\n- Elsa's personal hours.\n- Artist capacity.\n- Revenue per available wedding date.\n\n**[A] Estimated overall net time saving:** Approximately **4–6 hours weekly**, assuming booking and financial records are accessible and accurate.\n\n**[I] The larger value is preventing mistakes and making better decisions, not just saving minutes.**\n\n---\n\n## $300K+ Tier — Multiple-Team Operations\n\n**[A] Base planning model:**\n- 96 weddings annually.\n- Approximately 275 qualified inquiries annually at 35% conversion [E/A].\n- $301,080 modeled annual gross revenue [E/A].\n- Additional independent team capacity is needed under the previous calendar assumptions [I].\n\n### Additional Automations\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (labelled estimate) |\n|---|---|---|---|---|\n| **Simultaneous-wedding conflict checks** | Grok compares dates, locations, artist assignments, and preparation timelines. ChatGPT identifies potential conflicts. | Every booking change; daily upcoming-event check | Elsa approves staffing and schedule changes | **20–40 min [A]** |\n| **Team-level profitability** | Grok collects event-level records. ChatGPT compares revenue and direct costs across teams. | Weekly | Aaron verifies accounting; Elsa makes staffing decisions | **15–30 min [A]** |\n| **Exception monitoring** | Grok flags missing agreements, overdue balances, unconfirmed headcounts, and unresolved tasks. | Scheduled daily checks | Elsa resolves consequential exceptions | **15–30 min [A]** |\n| **Forecasting and capacity** | ChatGPT models upcoming revenue, demand, staffing, and scenarios using verified inputs. Grok maintains the reporting schedule. | Weekly, with monthly forecast review | Elsa approves operational decisions | **15–30 min [A]** |\n| **Quality-control analysis** | Grok organizes actual client feedback and service issues. ChatGPT identifies recurring themes. Claude reviews sensitive proposed responses. | After events; weekly summary | Elsa approves client resolutions and artist feedback | **10–20 min [A]** |\n| **Marketing investment analysis** | Grok compiles spending, attributed inquiries, and bookings. ChatGPT calculates customer acquisition cost and contribution after acquisition. | Weekly during campaigns | Aaron verifies numbers; Elsa approves spending | **10–25 min [A]** |\n| **Process documentation** | ChatGPT drafts procedures from Elsa-approved operating rules. Claude simplifies instructions. Grok tracks version changes. | When processes change; monthly review | Elsa approves the official procedures | **10–20 min [A]**, averaged across active weeks |\n\n### What changes at $300K+\n\n**[I] Elsa should no longer be the only person who knows every booking's status.**\n\nEvery confirmed wedding needs:\n\n- An assigned responsible person.\n- Verified artist availability.\n- An approved service timeline.\n- A complete contract and payment record.\n- A documented communication owner.\n- A process for handling exceptions.\n\nAI can monitor the records, but it cannot replace the responsible human.\n\n**[A] Estimated overall net time saving:** Approximately **6–9 hours weekly**, conditional on reliable integrations and higher activity volume.\n\n**[I] This does not mean Elsa should stop supervising quality. It means repetitive record-checking and reporting should require less of her attention.**\n\n---\n\n# 6. Daily Routine — Approximately 20 Minutes\n\n**Bottom line:** [I] Grok Bot should prepare the work before Elsa or Aaron opens the approval queue. The daily routine should focus on decisions and actions, not preparing reports.\n\n## Recommended Daily Schedule\n\n**[A] Target: 20 minutes of combined Elsa/Aaron administrative triage per operating day.**\n\nThis does not include client appointments, urgent issues, or creative production.\n\n| Minutes | Person / AI | Action |\n|---|---|---|\n| **Before the review** | **Grok Bot** | Checks authorized inboxes and trackers; prepares inquiry drafts, outstanding approvals, reminders, and exceptions |\n| **0–4** | **Aaron** | Checks Grok's summary, duplicate leads, missing information, and integration failures |\n| **4–11** | **Elsa** | Reviews and approves inquiry replies, availability statements, and client follow-ups |\n| **11–15** | **Elsa** | Checks upcoming weddings, deposits, headcounts, and staffing questions |\n| **15–18** | **Aaron** | Executes or queues specifically approved messages and social content through authorized systems |\n| **18–20** | **Aaron** | Confirms completed actions are logged and assigns unresolved exceptions |\n\n**[E/A] 4 + 7 + 4 + 3 + 2 = 20 minutes.**\n\n### Grok Bot's Daily Checklist\n\nBefore the human review, Grok should prepare:\n\n```text\nMAKEUP AND HAIR BY ELSA\nDAILY ACTION SUMMARY\n\nNEW INQUIRIES\n{lead IDs and short summaries}\n\nREPLIES NEEDING APPROVAL\n{drafts}\n\nFOLLOW-UPS DUE\n{eligible leads}\n\nUPCOMING WEDDING DEADLINES\n{headcount, payment, timeline}\n\nSTAFFING ISSUES\n{unconfirmed assignments or conflicts}\n\nSOCIAL CONTENT\n{approved items ready for execution}\n\nREVIEWS\n{new reviews and eligible requests}\n\nURGENT ISSUES\n{items requiring immediate attention}\n\nSYSTEM ERRORS\n{failed integrations or uncertain records}\n```\n\n### Important timing rule\n\n**[I] Do not make clients wait until the next scheduled review if an urgent wedding issue arises.**\n\nGrok should flag urgent situations for Elsa or Aaron to handle promptly.\n\n**[Q] Confirm which alerts Grok can deliver reliably and which require an additional authorized notification system.**\n\n### Practical inquiry response standard\n\nKeep the existing public **24–48-hour response promise [V]** until Elsa confirms a sustainable alternative.\n\n**[A] Internal target:** Same-business-day response when staffed.\n\nFor situations where Elsa cannot respond immediately, Grok can prepare the draft and flag it for approval.\n\nIt must not send an unapproved reply merely to meet the target.\n\n---\n\n# 7. Weekly Routine — Approximately 45 Minutes\n\n**Bottom line:** [I] The weekly meeting should decide what to change, not reconstruct what happened. Grok prepares the numbers, ChatGPT analyzes them, and Claude checks the next week's important creative material.\n\n## Recommended Weekly Review\n\n**[A] Target: 45 minutes with Elsa and Aaron together.**\n\n| Minutes | Topic | AI preparation | Human decision |\n|---|---|---|---|\n| **0–8** | Leads and bookings | Grok compiles data; ChatGPT checks conversion calculations | Elsa and Aaron identify follow-up or conversion problems |\n| **8–16** | Upcoming weddings and artist capacity | Grok identifies deadlines and conflicts; ChatGPT prepares schedule options | Elsa confirms staffing and priorities |\n| **16–24** | Revenue and profit | ChatGPT calculates AOV, direct costs, and contribution using verified records | Aaron validates numbers; Elsa approves operational changes |\n| **24–34** | Next week's campaign | ChatGPT drafts content; Claude reviews the batch; Grok prepares publishing tasks | Elsa approves topics, captions, and media |\n| **34–40** | Reviews and vendor outreach | Grok provides status; ChatGPT prepares eligible requests and introductions | Elsa approves specific communications |\n| **40–45** | Assignments | Grok prepares the action list | Aaron and Elsa confirm owners and deadlines |\n\n**[E/A] 8 + 8 + 8 + 10 + 6 + 5 = 45 minutes.**\n\n### Weekly AI Report\n\n**Grok Bot should prepare a single dashboard:**\n\n| Business area | Primary metric |\n|---|---|\n| **Marketing** | Qualified inquiries by source |\n| **Sales** | Confirmed bookings and conversion rate |\n| **Revenue** | Contracted revenue and completed-service revenue, separately |\n| **Profitability** | Contribution per completed wedding |\n| **Capacity** | Available dates and unresolved staffing issues |\n| **Client experience** | Reviews, feedback, and open client issues |\n| **Administration** | Overdue tasks and missed deadlines |\n\n### Weekly Decision Rules\n\n**[I] Use a small number of decisions:**\n\n| If this happens | Take this action |\n|---|---|\n| Inquiries are low | Review content relevance, local discovery, and vendor outreach |\n| Inquiries are high but bookings are low | Examine response time, availability, quotes, and objections |\n| Bookings increase but profit declines | Review artist payouts, travel, supplies, and service mix |\n| Elsa is overloaded | Reduce content production and review delegation |\n| Two weddings create staffing conflicts | Reevaluate actual team capacity before accepting additional work |\n| Content consistently produces qualified inquiries | Reuse the successful topic or format |\n| AI creates repeated errors | Stop the affected workflow and correct its source data or instructions |\n\n## What the 45 Minutes Does Not Include\n\n**[I] Claude was correct that the original workload estimate understated the actual effort.**\n\nThe weekly review does not include every production task.\n\n**[A] Additional operating time to budget:**\n\n| Work | Estimated time |\n|---|---:|\n| Aaron: media preparation, one Reel, one carousel, and platform scheduling | 2–3 hours/week |\n| Aaron: vendor research, outreach preparation, and operational maintenance | 45–90 minutes/week |\n| Elsa: selecting authentic assets and reviewing creative outside the meeting | 15–30 minutes/week |\n| Client appointments, travel, and exceptional communications | Actual time required; not estimated |\n\n**[I] The 20-minute daily and 45-minute weekly routines are management windows, not a claim that the entire business or campaign can be operated in those minutes.**\n\n---\n\n# 8. What Should NOT Be Automated\n\n**Bottom line:** [I] AI should reduce repetitive preparation, not take responsibility for decisions that affect clients, payments, contracts, or service quality. Some tasks can be monitored automatically, but execution must remain human-controlled.\n\n| Process | Why it should not be fully automated | Required human responsibility |\n|---|---|---|\n| **Confirming wedding availability** | [I] Calendar availability may not reflect actual artist or personal capacity | Elsa confirms before promising a date |\n| **Final quotes** | [I] Travel, staffing, additional appointments, and special requests can affect pricing | Elsa approves the complete price |\n| **Contract changes** | [I] Changes can create financial and legal obligations | Elsa reviews and authorizes |\n| **Deposits and payments** | [I] Incorrect transactions can cause financial harm | Elsa or an explicitly authorized person controls payment actions |\n| **Refunds and cancellations** | [I] Require contract interpretation and judgment | Elsa decides |\n| **Artist assignments** | [I] Scheduling is not enough to assess skills, reliability, or client needs | Elsa assigns artists |\n| **Handling unhappy clients** | [I] Sensitive situations require empathy, context, and judgment | Elsa communicates personally |\n| **Public responses to negative reviews** | [I] Incorrect wording can expose private information or escalate a dispute | Elsa approves the response |\n| **Client consultations** | [I] Preferences, expectations, and suitability require professional judgment | Elsa or a qualified artist |\n| **Bridal look design** | [I] Authentic beauty decisions belong to the client and artist | Elsa and the client |\n| **Client photographs and transformations** | [I] AI-generated bridal results cannot be presented as actual work | Use genuine approved photography |\n| **Vendor partnerships** | [I] A drafted introduction does not create professional trust or a partnership | Elsa manages the relationship |\n| **Price changes** | [I] Need actual margin, demand, and capacity information | Elsa approves after reviewing data |\n| **Hiring and dismissing artists** | [I] Employment, compensation, and quality decisions have serious consequences | Elsa decides |\n| **Advertising spending** | [I] Poor assumptions can lead to wasted money | Elsa approves budgets and campaigns |\n| **Personal motherhood content** | [I] Elsa should control how much of her family life is public | Elsa chooses what to share |\n| **Spanish-language service claims** | [Q] Actual service capability is unconfirmed | Elsa confirms before advertising |\n| **Customer data sharing** | [I] Unnecessary disclosure creates privacy risks | Aaron manages permissions; Elsa authorizes appropriate access |\n\n### One additional rule: AI must not invent certainty.\n\nIf Grok cannot confirm availability, it should report **Availability unconfirmed**.\n\nIf ChatGPT cannot calculate travel from approved rules, it should report **Travel quote requires Elsa**.\n\nIf Claude cannot substantiate a marketing claim, it should recommend removing or verifying the claim.\n\n**[I] Never allow one AI to treat another AI's unsupported statement as a verified business fact.**\n\n---\n\n# 9. Implementation Order — Build the Minimum Useful System\n\n**Bottom line:** [I] Do not build every automation at once. Start with the processes most likely to prevent missed inquiries and administrative errors, then introduce marketing and financial workflows.\n\n## Phase 1 — Immediate Priorities\n\n| Priority | System | Exact implementation |\n|---|---|---|\n| **1 — Critical** | Business facts | [Q] Elsa confirms the phone, hours, $530 listing price, $175 personal-service fee, current artist capacity, and 2027 availability |\n| **2 — Critical** | Lead tracker | [I] Establish one authoritative spreadsheet for inquiries, bookings, and next actions |\n| **3 — Critical** | Grok inbox monitoring | [Q] Verify access and test that every WPForms inquiry is captured |\n| **4 — High** | Inquiry drafts | [I] ChatGPT prepares replies using approved templates; Grok queues them |\n| **5 — High** | Approval system | [I] Elsa reviews exact messages before sending |\n| **6 — High** | Booking reminders | [I] Grok calculates internal deadlines from confirmed event dates |\n| **7 — High** | Campaign production | [I] Begin two weekly Instagram posts and reuse them across platforms |\n| **8 — Medium** | Claude review | [I] Review new templates and weekly creative batches |\n| **9 — Medium** | Weekly dashboard | [I] Track inquiries, bookings, revenue, and outstanding tasks |\n\n### Phase 2 — After Reliable Operation\n\n**[A] Proposed checkpoint: 30 days after the first workflows are functioning.**\n\nAdd:\n\n- Wedding-level profitability calculations.\n- More detailed artist scheduling.\n- Vendor outreach tracking.\n- Review-request preparation.\n- Lead-source analysis.\n- Class inquiries and marketing.\n- Improved reporting from connected systems.\n\n**[I] Do not advance merely because 30 days have passed.** Advance when existing workflows are reliable.\n\n### Phase 3 — When Growth Justifies It\n\nAdd advanced staffing, forecasting, and multi-team coordination only when actual bookings require those capabilities.\n\nThe revenue tier is a planning guide, not a software purchasing trigger.\n\n---\n\n# 10. Final Assessment\n\n**Benchmark:** A reliable, approval-controlled AI operating system for a premium bridal beauty business, supporting social marketing, booking administration, and profitable growth.\n\n### Revised Scores\n\n| Area | Score [I] | Remaining gap |\n|---|---:|---|\n| Social campaign strategy | **8.5/10** | Needs Elsa's capacity and media approval |\n| Social production workflow | **8.5/10** | Actual editing workload must be tested |\n| Inquiry and booking automation design | **8/10** | Account connections and authoritative records unverified |\n| Financial automation readiness | **6/10** | Actual revenue, artist pay, costs, and booking mix unknown |\n| Overall implementation readiness | **6/10** | Permissions, source data, and workflow testing incomplete |\n\nThese are assessments of the proposed system against the named benchmark, not independently measured business performance.\n\n## Final Decision\n\n**SHIP — the lighter social campaign.**\n\nUse:\n- [A] Two Instagram posts weekly.\n- [A] Three Story days weekly.\n- [A] Two adapted Facebook posts weekly.\n- [A] One TikTok video weekly.\n- [A] One Google Business Profile post weekly.\n- [A] Three personalized vendor introductions weekly.\n\n**SHIP — Grok Bot as the administrative coordinator**, beginning with verified inquiry capture, internal reminders, and approval queues.\n\n**SHIP — ChatGPT for production and analysis.**\n\n**SHIP — Claude for weekly quality control and sensitive communications, not every routine action.**\n\n**NO-SHIP — autonomous customer communications, payments, booking confirmations, price changes, or artist assignments.**\n\n**NO-SHIP — financial expansion decisions until the actual business numbers are available.**\n\n### Recommended Division of Responsibility\n\n| Person / Tool | Responsibility |\n|---|---|\n| **Elsa** | Clients, bridal services, quality, availability, and final approvals |\n| **Aaron** | Business systems, marketing operations, account execution, and financial tracking |\n| **Grok Bot** | Scheduled routines, inbox monitoring, coordination, reminders, and internal records |\n| **ChatGPT** | Writing, creative development, calculations, and analysis |\n| **Claude** | Final copy polish, visual critique, and quality review |\n\n**[I] The biggest opportunity is not saving Elsa a few minutes on Instagram. It is building a system that prevents missed inquiries, keeps weddings organized, and makes the business's actual profitability visible.**\n\nAt $100K, that creates a reliable foundation. At $200K, it supports delegation and profitability. At $300K+, it becomes essential for managing multiple artists and weddings.\n\n**Final recommendation: Build the lead-handling and approval system first. Run the lighter campaign alongside it. Add the more complex automations only when real booking volume justifies them.**"},{"id":"claude-automation","name":"claude-automation.md","content":"**My recommendation:** automate the paperwork around Elsa's work (watching inboxes, logging leads, drafting replies and posts, reminders, reports) and keep a person on every message, price and photo that reaches a client. At the $100K level this saves about 7–9 hours a week (estimate). Automation won't get her to $200K or $300K on its own, though. Those levels depend on hiring artists.\n\n## Three changes before you build\n\n1. **Don't let Grok Bot drive Instagram or Facebook through a browser.** Meta's terms prohibit automated access outside its approved tools, and a business account that gets flagged or locked would be worse than any time saved. Have Grok Bot write drafts into a queue, then schedule them in Meta Business Suite (free). Use Google's own app or tools for her Google listing.\n2. **Don't rely on Grok Bot driving ChatGPT and Claude in a browser.** It breaks whenever their sites change, and as far as I know both consumer services restrict automated access outside their paid APIs (I haven't re-checked the current terms). Use the APIs, or have the bot prepare a ready-to-paste prompt that Aaron runs himself.\n3. **Use a wedding-vendor booking system for contracts, invoices and deposits.** HoneyBook and Dubsado are the usual choices, and they're the benchmark here. They already send automatic payment reminders, take e-signatures and log every payment. Grok Bot should watch that system and flag problems, not try to replace it. Building the connections (contact form → lead sheet → booking system) is Cursor's job.\n\n## Who does what\n\n- **Grok Bot:** the organizer. It runs on a schedule, watches inboxes, writes first drafts, keeps the lead sheet up to date and sends reminders to Elsa and Aaron.\n- **ChatGPT:** writes captions and scripts, makes graphics, and double-checks quotes and calculations.\n- **Claude:** final polish on anything a client will read, and a visual check of posts.\n\n**Nothing reaches a client, a vendor or a public page without a person approving it.**\n\nAll time-saved figures are my estimates at the $100K level (about 32 weddings and 8 inquiries a month). They have not been measured.\n\n### Marketing\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (estimate) |\n|---|---|---|---|---|\n| Weekly content batch | Grok Bot gathers the photos and clips Elsa picked and the week's topics. ChatGPT drafts captions, Reel scripts and carousel graphics. Claude polishes the copy and checks the visuals. | Sunday 6 p.m., weekly | Elsa approves every photo, claim, price and caption | 1.5 hrs |\n| Publishing | Grok Bot puts approved posts into Meta Business Suite (Instagram + Facebook) and prepares the TikTok and Google versions | When Elsa approves, weekly | Aaron makes the final click to schedule; no bot posts directly | 0.5 hr |\n| Comments and DMs | Grok Bot checks every 2 hours from 8 a.m. to 8 p.m., sorts messages into lead / question / spam, drafts replies and alerts Elsa when a likely bride writes in | Every 2 hrs | Elsa sends every reply herself | 1.5 hrs |\n| Google listing and directory upkeep | Grok Bot checks once a month that Google, Facebook, The Knot, WeddingWire and Zola all show the same name, city, phone, hours and prices, and drafts the Google post | Monthly check, weekly post | Aaron makes the edits; Elsa confirms any price or policy change | 0.25 hr |\n| Vendor outreach | Grok Bot researches 3 planners, venues or photographers, logs them and drafts personal intros. Claude polishes them. | Monday, weekly | Elsa approves and sends each one from her own email | 0.75 hr |\n| Weekly report | Grok Bot pulls the numbers for the report, and ChatGPT spots the trends and flags anything that looks unusual | Sunday, weekly | Elsa and Aaron decide what to change | 0.75 hr |\n\n### Sales\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (estimate) |\n|---|---|---|---|---|\n| Logging inquiries | Grok Bot copies each contact-form or DM inquiry into the lead sheet: date, location, ready-by time, number of makeup and hair services, where they found Elsa. It marks any date conflict and starts a 24-hour reply timer. | Each new inquiry, right away | Elsa confirms whether the date is actually open | 0.5 hr |\n| Quote draft | Grok Bot fills in the quote from the published prices and travel rules: $100 per artist for packages, $100 per hour per artist on the wedding day, $25 per 15 minutes for trials and events. It adds one extra artist for every 5–6 services. ChatGPT re-checks the totals. | After the inquiry is logged | Elsa approves every quote; no price goes out automatically | 0.33 hr |\n| Follow-up after no reply | Grok Bot drafts one polite follow-up on day 3 and a last one on day 10, then marks the lead closed | Day 3 and day 10 | Elsa sends them | 0.25 hr |\n| Contract and deposit | The booking system sends the contract and the 50% deposit invoice. Grok Bot watches for unsigned contracts after 72 hours. | When Elsa marks a lead \"booking\" | Elsa sends the contract. Any exception, discount or refund is her decision. | 0.25 hr |\n| Classes and gift certificates | Grok Bot logs class inquiries, drafts replies and tracks when gift certificates are used | Each inquiry | Elsa approves dates and replies | 0.25 hr |\n\n### Serving booked brides\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (estimate) |\n|---|---|---|---|---|\n| Payment and headcount reminders | The booking system sends the balance reminder 30 days before the wedding. Grok Bot reminds Elsa to confirm the final headcount 8 weeks before. | Based on each wedding date | Elsa handles any late payment personally | 0.25 hr |\n| Prep emails (5+ tips over the year) | Claude writes the standard prep emails once. Grok Bot schedules them by wedding date and adds the bride's first name and date. | Based on each wedding date | Elsa approves the templates once, plus any personal note | 0.5 hr |\n| Wedding-day schedule | Grok Bot works backward from the ready-by time to draft the order of services and the artist count, and plans the drive | 8 weeks out, then 1 week out | Elsa checks the timing; service lengths need her real numbers | 0.5 hr |\n| Review requests | Grok Bot drafts a personal thank-you with the Google link on day 3 and one reminder offering The Knot on day 10, then stops | After each wedding | Elsa sends both | 0.25 hr |\n| Replying to reviews | Claude drafts a short, warm reply with no private details | Each new review | Elsa posts it | 0.1 hr |\n\n### Back office, and what changes at $200K and $300K+\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (estimate) |\n|---|---|---|---|---|\n| Expenses and mileage | Grok Bot sorts receipts from email and logs wedding mileage | Weekly | Aaron reviews; the accountant decides how expenses are categorized for tax | 0.5 hr |\n| Artist schedule ($200K+) | Grok Bot matches booked weddings to artist availability and drafts assignments and call times | Each booking, plus weekly | Elsa assigns artists | 1+ hr |\n| Artist pay ($200K+) | Grok Bot works out pay from each wedding's services and drafts the pay sheet | After each wedding | Aaron or Elsa approves every payment | 0.5 hr |\n| Hiring artists ($300K+) | Grok Bot screens applications against Elsa's checklist and books trial sessions | Each application | Elsa makes every hiring decision | 1+ hr |\n| Profit check per wedding ($200K+) | ChatGPT compares each wedding's revenue with artist pay, travel and products | Monthly | Elsa decides on price changes | 0.5 hr |\n\n**What each level depends on** (calculated from the business review's $2,948.75 average wedding value, which I haven't verified):\n\n- **$100K:** about 32 weddings a year. Elsa can manage this mostly alone, so the point of automation is giving her hours back.\n- **$200K:** about 66 weddings, which means more than one wedding on many Saturdays. She needs at least one lead artist who can run a wedding without her.\n- **$300K+:** about 100 weddings, usually two or more every Saturday. She needs a team of artists and becomes mainly the manager. The automation here is scheduling, pay and quality control. At this point an inquiry should be answered within hours, so a part-time human coordinator is likely to pay off more than another AI tool.\n\n## Daily routine (about 20 minutes)\n\n**7:30 a.m. — Grok Bot sends one morning summary to both of them:**\n- New inquiries, with the date check and a draft reply\n- DMs and comments, with draft replies\n- Reminders due today (payments, headcounts, review requests)\n- Posts scheduled for today\n\n| Who | Time | Task |\n|---|---|---|\n| Elsa | 10 min | Approve or edit the inquiry and DM replies and send them. Confirm whether dates are open. Post a Story if it's a Story day. |\n| Aaron | 8 min | Check the lead sheet is right, approve any reminders to Elsa, check today's post went out cleanly. |\n| Both | 2 min | Anything the bot flagged as unusual: a complaint, a refund request, an unclear date, a minor in a photo. A person handles it. |\n\n**Evening:** Grok Bot checks for any inquiry that hasn't had a reply in 20 hours and alerts Elsa.\n\n## Weekly routine (Sunday, about 45 minutes)\n\n**Before 6 p.m.:** Grok Bot builds the weekly report, the content plan, three vendor drafts and next week's reminders. ChatGPT drafts the captions and graphics. Claude polishes them.\n\n| Time | Who | Task |\n|---|---|---|\n| 10 min | Both | Weekly report: inquiries, bookings, reply times, where leads came from, reviews. Decide one change for next week. |\n| 15 min | Elsa | Pick next week's photos and clips. Approve the whole content batch at once. |\n| 10 min | Aaron | Schedule the approved posts in Meta Business Suite, the Google post and the TikTok. |\n| 5 min | Elsa | Approve and send the 3 vendor intros. |\n| 5 min | Both | Look at the next 8 weeks: weddings, headcount deadlines, artist needs, and dates that are close to full. |\n\n## What should not be automated\n\n- **Sending anything to a client, vendor or public page.** Every message and post is drafted, never sent automatically.\n- **Prices, quotes, discounts, refunds and exceptions to the deposit rule.**\n- **Confirming that a date is available.** A wrong \"yes\" means two brides on one day.\n- **Complaints, unhappy clients and negative reviews.** Claude can draft a reply, but Elsa handles it personally.\n- **Contact on the wedding day.** Elsa or the lead artist talks to the bride.\n- **Anything posted with a client's face**, and any photo of a minor (junior bridesmaids, flower girls, quinceañeras, prom).\n- **Mass DMs, follow/unfollow bots, and automatic comments.** They break Meta's rules and look cheap for a premium brand.\n- **Personal posts and anything about the baby.** That's Elsa's call each time.\n- **Hiring, pay and artist performance decisions.**\n\n## Privacy rules\n\n1. **Give the AI tools only what they need.** When asking ChatGPT or Claude to draft something, use the bride's first name and the event details only. Leave out phone numbers, emails, home addresses and hotel room numbers.\n2. **Turn off training on chat history** in both ChatGPT and Claude. Both have a setting for this; check where it is now.\n3. **Limit Grok Bot's inbox access.** It can read, label and draft. It cannot send, delete or forward outside the business.\n4. **Keep client information in one place:** the booking system plus one lead sheet. Delete details of people who never booked after 12 months (suggested policy).\n5. **Get photo permission in writing.** Add a media-release line to the contract. For anyone under 18, get a parent's written permission, and don't show faces by default.\n6. **Never post a client's location in real time.** Post after the event, and never show a home address, street or room number.\n7. **Texts:** marketing texts need the client's written opt-in under the federal TCPA rules. Reminders about a booking are fine once the client agrees to texts at booking.\n8. **Marketing emails, including vendor outreach,** need an unsubscribe line and a mailing address under federal CAN-SPAM rules. A PO box works and keeps her home address private.\n\n## Review rules\n\nThese are from my knowledge as of mid-2026. I didn't re-check the current wording tonight.\n\n- **The FTC's 2024 fake-review rule** bans fake reviews (including AI-written ones), buying reviews, rewards offered only for positive reviews, and hiding negative ones. Breaking it can bring civil fines.\n- **Google bans any reward for a review**, even for an honest one: no discounts, free touch-ups or gifts. It also bans asking only the happy clients.\n- **Ask everyone, the same way:** one request and one reminder, then stop.\n- **AI never writes a review for a client to post,** and never rewrites one. When quoting a review in a post, use it word for word and with the client's permission.\n- **No reviews from family or staff.** Aaron, relatives and artists must not review the business, and if anyone connected to the business does post a review, they have to disclose the connection.\n- **Public replies to reviews** never include private details: no dates, venues, prices or complaint specifics beyond what the client wrote.\n- **The Knot, WeddingWire and Zola** have their own review rules. Check each one before sending their links (unverified).\n\n## Score\n\nAgainst a standard wedding-vendor booking-system setup (HoneyBook or Dubsado) with a person approving everything, this plan scores 8/10. The 2 points missing are because the time savings are estimates and the Meta and Google connections haven't been tested. **PASS**, provided items 1–3 at the top are followed.\n\n```\nTO: Cursor\nGOAL: Build the lead pipeline: WPForms contact form + Instagram/Facebook DMs → lead sheet → booking system, plus Grok Bot's read-and-draft access and the morning summary.\nCONTEXT: The process tables above. Prices and travel rules from dossier.md section 2.5.\nFILES: dossier.md, this plan\nDONE-WHEN: A test inquiry shows up in the lead sheet within 5 minutes, with a date check and a draft reply in the morning summary; nothing can be sent without a person's click.\nOPEN RISKS: Which booking system Elsa picks, Meta's rules for DM access, actual service lengths for the wedding-day schedule, whether ChatGPT and Claude are used through their APIs or by hand.\n```"},{"id":"chatgpt-week-posts","name":"chatgpt-week-posts.md","content":"# MAKEUP AND HAIR BY ELSA\n## Week 1: A New Chapter\n**November 9–15, 2026 | All times Central**\n\n**[I] Recommendation:** Use one personal relaunch Reel, one educational carousel, one testimonial, one Google Business Profile update, three Story sequences, and one repurposed TikTok. This covers all seven days without returning to the heavier posting schedule Claude rejected.\n\n### Weekly publishing targets\n\n| Platform | Posts [A] |\n|---|---:|\n| Instagram feed | 2: one Reel, one carousel |\n| Instagram Stories | 3 sequences: Tuesday, Thursday, Saturday |\n| Facebook | 2: one Reel, one single-photo testimonial |\n| Google Business Profile | 1 single-photo update |\n| TikTok | 1 adapted Reel |\n| **Total** | **9 platform-specific publications [E/A]** |\n\n**[A] All publishing times are starting points for testing, not verified optimal times.**\n\n**Response-time rule:** [V] Elsa's website currently promises 24–48 hours. [A] The campaign's proposed internal goal is to respond the same business day, preferably within 24 hours. Public posts should not promise 24-hour replies until Elsa confirms she can maintain that standard and the website is updated.\n\n**Pre-launch requirements:** [Q] Confirm media permissions, current availability, and whether the $530 directory-price discrepancy has been corrected. No post below invents availability or advertises a new discount.\n\n---\n\n# 1. Seven-Day Publishing Calendar\n\n| Day & time [A] | Platform(s) | Type | Goal [I] | Hook / on-screen text | Visual | CTA |\n|---|---|---|---|---|---|---|\n| **Mon 9:30 AM** | Instagram + Facebook | **Relaunch Reel** | Reintroduce Elsa after maternity leave | \"A new chapter. The same love for what I do.\" | Real Elsa footage + bridal work | Explore portfolio |\n| **Tue 12:30 PM** | Instagram Stories | **Education tip** | Help brides understand how to plan beauty services | \"What's your ready-by time?\" | Simple text cards + genuine bridal photo | Inquire |\n| **Wed 11:00 AM** | Google Business Profile | **Single-photo update** | Convert local discovery into inquiries | \"Natural bridal beauty, brought to you.\" | Authentic completed bridal look | Contact |\n| **Thu 6:00 PM** | Instagram | **Educational carousel + service offer** | Explain the Timeless package | \"Engagement photos AND wedding-day beauty?\" | Real portfolio + clean typography | Explore Timeless |\n| **Thu 7:00 PM** | Instagram Stories | **Carousel promotion** | Bring viewers to the package explanation | \"Two special moments. One bridal experience.\" | Share approved carousel | View post |\n| **Fri 12:00 PM** | Facebook | **Single-photo testimonial spotlight** | Establish trust using genuine client feedback | \"What means the most to me...\" | Approved bridal portrait + exact real review | Read reviews |\n| **Sat 10:00 AM** | Instagram Stories | **Behind the scenes + previous vendor collab** | Make the business feel personal and show genuine industry connections | \"A little behind the scenes.\" | Real working photo + approved prior collaboration | View portfolio |\n| **Sun 5:00 PM** | TikTok | **Repurposed personal Reel** | Test a new audience without new filming | \"Back to doing what I love.\" | Monday Reel, adapted for TikTok | Visit profile |\n\n**[I] Friday's testimonial must use a genuine, accurately attributed review. Saturday's collaboration content must use an approved asset from a real collaboration.**\n\n---\n\n# 2. Complete Publish-Ready Copy\n\nThe following copy is written in Elsa's first-person voice. Evidence labels stay in the campaign notes, not in customer-facing captions.\n\n\n# MONDAY, NOVEMBER 9\n## Back From Baby — Personal Relaunch Reel\n\n**Time:** 9:30 AM CT  \n**Platforms:** Instagram Reels + Facebook Reels  \n**Type:** Personal Reel  \n**Goal:** Reintroduce Elsa and reconnect with prospective brides.\n\n### Opening hook\n\n\"A new chapter. The same love for what I do.\"\n\n### Shot list — 15 seconds\n\n| Time | Visual | On-screen text |\n|---|---|---|\n| 0–3 sec | [VIDEO: Elsa smiling or working, with permission to use] | \"A new chapter.\" |\n| 3–6 sec | [VIDEO: Elsa applying bridal makeup] | \"The same love for what I do.\" |\n| 6–10 sec | [PHOTO/VIDEO: Genuine bridal makeup and hairstyle] | \"Natural. Timeless. Beautifully you.\" |\n| 10–13 sec | [PHOTO: Finished bridal look] | \"Bridal hair + makeup in DFW.\" |\n| 13–15 sec | Simple branded end card | \"Makeup and Hair by Elsa\" |\n\n**Audio:** Licensed warm, elegant instrumental. No dramatic transition or sentimental baby montage required.\n\n### Instagram caption\n\nA new chapter, and the same love for this work.\n\nAfter welcoming our little one, I'm back doing what I love: helping brides feel confident, radiant, and completely themselves.\n\nMy approach hasn't changed. Bridal makeup and hair should bring out your natural beauty, never hide it.\n\nI'm grateful for everyone who has supported me along the way, and I'm excited to continue sharing my work with you.\n\nIf you're planning your wedding, I'd love to hear about it.\n\nExplore my bridal portfolio and inquire about your date through the link in my bio.\n\nBecause your Natural Beauty is Timeless.\n\n### Instagram hashtags\n\n#MakeupAndHairByElsa #DFWBrides #DallasBridalMakeup #NaturalBridalBeauty\n\n### Facebook caption\n\nA little personal update.\n\nAfter welcoming our baby, I'm happy to be back sharing the bridal beauty work I love.\n\nI've always believed that bridal makeup should enhance your natural features and help you feel like yourself.\n\nThat hasn't changed.\n\nI'm grateful for the clients and people who continue to support Makeup and Hair by Elsa.\n\nIf you're planning a wedding in Dallas–Fort Worth or beyond, I'd love to hear about your plans.\n\nYou can explore my work here:\n\nhttps://makeupandhairbyelsa.com/portfolio/\n\nAnd inquire about your date here:\n\nhttps://makeupandhairbyelsa.com/contact/\n\n### Facebook hashtags\n\n#MakeupAndHairByElsa #DFWWeddings\n\n**CTA:** Explore my bridal portfolio.\n\n**Approval check:** [PHOTO/VIDEO PERMISSION CONFIRMED], [ELSA APPROVES PERSONAL WORDING].\n\n---\n\n# TUESDAY, NOVEMBER 10\n## Wedding Morning Planning Tip\n\n**Time:** 12:30 PM CT  \n**Platform:** Instagram Stories  \n**Type:** Three-frame educational Story sequence  \n**Goal:** Help brides understand why their ready-by time matters.\n\n### Story 1\n\n**Visual:** [PHOTO: Authentic bridal preparation]\n\n**On-screen text:**\n\n\"Planning your wedding morning?\"\n\n\"Here's one detail to think about early.\"\n\n### Story 2\n\n**Visual:** Clean ivory background with a simple clock illustration.\n\n**On-screen text:**\n\n\"What time do you need to be ready?\"\n\n\"Your ready-by time helps us plan your hair and makeup services.\"\n\n### Story 3\n\n**Visual:** [PHOTO: Genuine completed bridal look]\n\n**On-screen text:**\n\n\"When you inquire, tell me:\"\n\n\"Your date. Your location. Your ready-by time. Your beauty-service needs.\"\n\n\"Let's plan your look.\"\n\n**Link sticker:**  \nhttps://makeupandhairbyelsa.com/contact/\n\n### Full Story caption\n\n\"Your wedding morning deserves a thoughtful plan. Start with your ready-by time.\"\n\n### Hashtags\n\nNone required.\n\n### Visual rules\n\n- Use genuine bridal imagery.\n- Do not show a client's private schedule.\n- Keep text large and readable.\n- Use the same warm, minimal styling across all frames.\n\n**CTA:** Inquire about your wedding date.\n\n---\n\n# WEDNESDAY, NOVEMBER 11\n## Google Business Profile — Single-Photo Feature\n\n**Time:** 11:00 AM CT  \n**Platform:** Google Business Profile  \n**Type:** Single photograph + business update  \n**Goal:** Encourage local search visitors to explore Elsa's services.\n\n### Headline\n\n\"Natural Bridal Beauty, Brought to You\"\n\n### Visual\n\n[PHOTO: Genuine completed bridal makeup and hairstyle, approved for business marketing]\n\n**Image requirements:**\n- Authentic work.\n- Clear view of the finished makeup or hairstyle.\n- No heavy beauty filters.\n- No fake testimonial overlays.\n- Client permission confirmed.\n\n### Full Google Business Profile copy\n\nYour wedding-day beauty should feel like you.\n\nI'm Elsa, founder of Makeup and Hair by Elsa.\n\nI specialize in natural, timeless bridal makeup and hairstyling, with mobile services throughout Dallas–Fort Worth and beyond.\n\nWhether you're getting ready at home, at a hotel, or at your venue, I'd love to hear about your plans.\n\nExplore bridal packages, trials, wedding-party services, and individual beauty options on my website.\n\nReady to begin? Send an inquiry with your wedding date and location.\n\n### Hashtags\n\nNone.\n\n### Button\n\n**Contact**\n\n**Destination:**  \nhttps://makeupandhairbyelsa.com/contact/\n\n**CTA:** Inquire about your wedding date.\n\n---\n\n# THURSDAY, NOVEMBER 12\n## Timeless Bridal Experience — Educational Carousel\n\n**Time:** 6:00 PM CT  \n**Platform:** Instagram  \n**Type:** Six-slide carousel  \n**Goal:** Explain the difference between purchasing a complete bridal experience and booking individual services.\n\n### Cover hook\n\n\"Engagement photos AND wedding-day beauty?\"\n\n### Slide 1 — Cover\n\n**Text:**\n\n\"Engagement photos AND wedding-day beauty?\"\n\n\"Meet the Timeless Bridal Experience.\"\n\n**Visual:** [PHOTO: Authentic engagement or bridal portrait]\n\n### Slide 2 — The Engagement Session\n\n**Text:**\n\n\"Your engagement photos matter, too.\"\n\n\"Timeless includes engagement-session makeup and hair.\"\n\n**Visual:** [PHOTO: Genuine engagement-session beauty work, if available]\n\n### Slide 3 — Your Bridal Trial\n\n**Text:**\n\n\"Explore your bridal look.\"\n\n\"Your makeup and hair trial is included.\"\n\n**Visual:** [PHOTO: Genuine bridal trial or makeup preparation]\n\n### Slide 4 — Your Wedding Day\n\n**Text:**\n\n\"Beauty that feels like you.\"\n\n\"Wedding-day makeup and hairstyling are included.\"\n\n**Visual:** [PHOTO: Genuine bridal makeup and hairstyle]\n\n### Slide 5 — Thoughtful Extras\n\n**Text:**\n\n\"More than a single appointment.\"\n\n\"Bridal preparation extras, body glow, touch-up time, and a bridal kit.\"\n\n**Visual:** [PHOTO: Genuine makeup kit or beauty preparation details]\n\n### Slide 6 — The Offer and CTA\n\n**Text:**\n\n\"Timeless Bridal Experience\"\n\n\"Explore the complete package.\"\n\n\"Travel fees are additional.\"\n\n\"Inquire about your date.\"\n\n**Visual:** Clean typography with an authentic bridal detail.\n\n### Instagram caption\n\nYour engagement photos deserve a beauty look that feels like you, too.\n\nThat's one reason I love the Timeless Bridal Experience.\n\nIt brings together your engagement-session makeup and hair, bridal trial, wedding-day beauty, and thoughtful extras.\n\nThe goal is simple: help you feel confident and comfortable throughout some of your most meaningful moments.\n\nIf you're planning engagement photos and your wedding, take a look at what Timeless includes.\n\nYou can explore the full package and inquire about your date through the link in my bio.\n\nTravel fees are additional.\n\nBecause your Natural Beauty is Timeless.\n\n### Hashtags\n\n#DFWBrides #DallasBridalMakeup #BridalHairAndMakeup #EngagementPhotoMakeup\n\n### Visual and approval requirements\n\n- Use only authentic images.\n- If engagement photos are unavailable, use bridal portfolio images without implying they are from engagement sessions.\n- Do not invent package savings.\n- Do not imply the client receives a personally performed appointment with Elsa unless confirmed.\n- Show package pricing only after the directory starting-price conflict is resolved.\n\n**CTA:** Explore the Timeless package.\n\n---\n\n## THURSDAY STORY — Share the Carousel\n\n**Time:** 7:00 PM CT  \n**Platform:** Instagram Stories  \n**Type:** Two-frame Story\n\n### Frame 1\n\n**Visual:** Share the approved Timeless carousel cover.\n\n**Text:**\n\n\"Planning engagement photos?\"\n\n\"Your beauty experience can include more than your wedding day.\"\n\n### Frame 2\n\n**Visual:** Approved bridal portrait.\n\n**Text:**\n\n\"See what's included in Timeless.\"\n\n\"Tap to explore the post.\"\n\n### Full Story caption\n\n\"Your engagement photos and wedding-day look deserve thoughtful planning.\"\n\n### Hashtags\n\nNone required.\n\n**CTA:** View the Timeless carousel.\n\n---\n\n# FRIDAY, NOVEMBER 13\n## Client Testimonial Spotlight\n\n**Time:** 12:00 PM CT  \n**Platform:** Facebook  \n**Type:** Single-photo testimonial post  \n**Goal:** Build trust using an actual client experience.\n\n### Opening hook\n\n\"What means the most to me...\"\n\n### Visual\n\n[PHOTO: Authentic bridal portrait with confirmed usage permission]\n\nOptional text overlay:\n\n\"Kind words from a bride.\"\n\n\"[PASTE EXACT REAL REVIEW EXCERPT]\"\n\n### Full Facebook caption\n\nOne of the things I value most about my work is knowing how a client felt during her beauty experience.\n\nEvery bride has her own preferences, and I believe those preferences deserve to be heard.\n\nI'm grateful when someone takes a moment to share her experience.\n\nHere's what [CLIENT NAME OR VERIFIED REVIEW DISPLAY NAME] shared:\n\n\"[PASTE EXACT REAL REVIEW]\"\n\n— [VERIFIED REVIEW PLATFORM]\n\nThank you to everyone who has trusted me with their bridal beauty.\n\nIf you're planning your wedding and would like to learn more about my approach, you can explore my portfolio and reviews on my website.\n\nhttps://makeupandhairbyelsa.com/portfolio/\n\n### Hashtags\n\n#MakeupAndHairByElsa #DFWBrides #DallasWeddingBeauty\n\n### Visual requirements\n\n- Use the client's exact authentic review.\n- Verify permission or appropriate rights to republish the excerpt.\n- Do not associate the review with a different bride's photo in a way that implies they are the same person.\n- Confirm that the review still exists at the attributed source.\n- Do not change the meaning of the quote.\n\n**CTA:** Explore my bridal portfolio and genuine client reviews.\n\n**Fallback:** If no suitable review is approved, do not invent one. Replace the post with a genuine bridal portrait and a short explanation of Elsa's natural-beauty approach.\n\n---\n\n# SATURDAY, NOVEMBER 14\n## Behind the Scenes + Previous Collaboration\n\n**Time:** 10:00 AM CT  \n**Platform:** Instagram Stories  \n**Type:** Three-frame Story sequence  \n**Goal:** Show Elsa's real work and highlight an existing professional connection.\n\n### Story 1 — Behind the Scenes\n\n**Visual:** [PHOTO/VIDEO: Elsa preparing tools or working at an actual bridal appointment]\n\n**On-screen text:**\n\n\"A little behind the scenes.\"\n\n\"One of my favorite parts of bridal beauty is seeing a look come together.\"\n\n### Story 2 — Previous Collaboration\n\n**Visual:** [REPOST: Approved June 18 collaboration post with Hair & Makeup by Susy]\n\n**On-screen text:**\n\n\"Looking back at a creative collaboration.\"\n\n\"Sharing work and inspiration with fellow beauty artists.\"\n\n**Tag:** [CONFIRMED COLLABORATOR HANDLE]\n\n### Story 3 — Bridal Portfolio CTA\n\n**Visual:** [PHOTO: Authentic finished bridal look]\n\n**On-screen text:**\n\n\"Natural beauty. Thoughtful details.\"\n\n\"Explore more bridal looks.\"\n\n**Link sticker:**  \nhttps://makeupandhairbyelsa.com/portfolio/\n\n### Full Story caption\n\n\"Sharing a little of the work, preparation, and creative connections behind bridal beauty.\"\n\n### Hashtags\n\nNone required.\n\n### Collaboration safeguards\n\n- Confirm that the June collaboration post may be reused.\n- Verify the collaborator's handle.\n- Do not claim a current partnership without agreement.\n- Do not imply the collaborator is currently part of Elsa's team.\n- Do not promise referrals or appointment availability.\n\n**CTA:** View the bridal portfolio.\n\n---\n\n# SUNDAY, NOVEMBER 15\n## TikTok — Personal Relaunch Adaptation\n\n**Time:** 5:00 PM CT  \n**Platform:** TikTok  \n**Type:** Repurposed Reel  \n**Goal:** Introduce Elsa's work to viewers who may not follow her on Instagram.\n\n### Opening hook\n\n\"Back to doing what I love.\"\n\n### Shot list — 12 seconds\n\n| Time | Visual | On-screen text |\n|---|---|---|\n| 0–2 sec | [VIDEO: Elsa at work] | \"Back to doing what I love.\" |\n| 2–5 sec | [VIDEO: Bridal makeup application] | \"Natural bridal beauty.\" |\n| 5–8 sec | [PHOTO/VIDEO: Genuine finished bridal look] | \"Makeup and hair that feels like you.\" |\n| 8–10 sec | [PHOTO: Additional authentic bridal look] | \"DFW + beyond.\" |\n| 10–12 sec | Branded end card | \"Makeup and Hair by Elsa\" |\n\n**Audio:** Licensed or platform-permitted instrumental. Check that the sound is authorized for the account's commercial use.\n\n### TikTok caption\n\nAfter welcoming our little one, I'm back sharing the bridal beauty work I love.\n\nMy approach has always been about enhancing natural beauty and helping brides feel like themselves.\n\nFrom bridal makeup to hairstyling, I'm excited to keep sharing the details and moments behind my work.\n\nPlanning your wedding in Dallas–Fort Worth or beyond?\n\nExplore Makeup and Hair by Elsa and send an inquiry through my website.\n\nBecause your Natural Beauty is Timeless.\n\n### Hashtags\n\n#DFWBrides #DallasMakeupArtist #BridalMakeup #MakeupAndHairByElsa\n\n### Production notes\n\n- Reuse Monday's authentic footage.\n- Export without an Instagram watermark.\n- Adjust the opening text for TikTok.\n- Confirm music usage rights.\n- Do not imply available dates that Elsa hasn't confirmed.\n\n**CTA:** Visit the website listed on my profile, if that feature is available; otherwise search for Makeup and Hair by Elsa.\n\n---\n\n# 3. One Optional Upgrade: Price Transparency\n\n**[I] Keep the Thursday carousel focused on what Timeless includes until the unexplained $530 starting prices on The Knot and WeddingWire are resolved.**\n\nOnce those listings are corrected and Elsa approves the pricing:\n\n**[V] Add this to the final carousel slide:**\n\n> Timeless Bridal Experience — $1,365  \n> Engagement-session makeup and hair, bridal trial, wedding-day beauty, and additional inclusions.  \n> Travel fees are additional.\n\n**[V]** The separate $175 fee to request Elsa personally remains published on the website.\n\n**[Q]** Elsa needs to clarify that fee's current applicability before deciding how prominently to market it.\n\n**[I] Do not leave applicable charges out of an actual quote.**\n\n---\n\n# 4. Weekly Production and Approval Plan\n\n**Bottom line:** [I] Produce the entire week from a small number of approved assets. Elsa should not have to create a fresh shoot or new video every day.\n\n## Required Asset List\n\n| Asset | Used for | Status |\n|---|---|---|\n| [VIDEO: Elsa at work] | Monday Reel, Sunday TikTok | [Q] Need approved footage |\n| [PHOTO: Elsa portrait] | Relaunch introduction | [Q] Need approved photo |\n| [PHOTO: Completed bridal makeup] | Reel, Google, carousel | [Q] Need approved work |\n| [PHOTO: Bridal hairstyle] | Reel or carousel | [Q] Need approved work |\n| [PHOTO: Bridal preparation] | Tuesday Stories | [Q] Need approved photo |\n| [PHOTO: Engagement beauty] | Thursday carousel | [Q] Use only if authentic and appropriately described |\n| [REVIEW: Exact real client quote] | Friday Facebook | [Q] Need verified review and appropriate permission |\n| [PHOTO: Review-related bridal portrait] | Friday Facebook | [Q] Confirm identity association or avoid implying one |\n| [PHOTO/VIDEO: Elsa behind the scenes] | Saturday Stories | [Q] Need genuine footage |\n| [POST: June 18 collaboration] | Saturday Stories | [V] Previous collaboration documented; [Q] reuse permission |\n\n## Who Does What?\n\n| Step | Owner | Task |\n|---|---|---|\n| **1** | Elsa | Select real photos, videos, and a review |\n| **2** | Grok Bot | Organize assets, schedule, and approval tasks |\n| **3** | ChatGPT | Prepare captions, scripts, and carousel text |\n| **4** | Claude | Review the complete weekly batch for tone and visual quality |\n| **5** | Aaron | Assemble the assets and prepare publishing |\n| **6** | Elsa | Approve the finished content |\n| **7** | Aaron | Publish or schedule approved posts |\n| **8** | Grok Bot | Track performance and prepare the weekly report |\n\n**[I] No AI assistant should publish automatically without approval.**\n\n---\n\n# 5. What to Measure After the Week\n\n**[A] Weekly targets are based on this corrected, lighter schedule.**\n\n| Metric | Weekly target | Why |\n|---|---:|---|\n| Instagram feed posts | 2 [A] | Consistency |\n| Instagram Story days | 3 [A] | Maintain audience contact |\n| Facebook posts | 2 [A] | Extend reach with minimal extra creative |\n| Google Business Profile posts | 1 [A] | Local discovery |\n| TikTok posts | 1 [A] | Test an additional audience |\n| Qualified inquiries | Record actual [Q] | Measure commercial relevance |\n| Confirmed bookings | Record actual [Q] | Measure business results |\n| Content-related website visits | Record actual [Q] | Evaluate customer action |\n| Inquiry response time | Same business day when staffed [A] | Monitor service quality |\n| Client-review activity | Record actual [Q] | Track reputation-building |\n| Publishing workload | Record actual minutes [Q] | Verify that the cadence is sustainable |\n\n### Grok Bot's Sunday Report\n\n```text\nMAKEUP AND HAIR BY ELSA\nWEEK 1 CAMPAIGN REPORT\n\nCONTENT\nInstagram posts:\nFacebook posts:\nTikTok videos:\nGoogle Business posts:\nInstagram Story days:\n\nRESULTS\nInstagram reach:\nInstagram profile visits:\nWebsite clicks:\nGoogle website clicks:\nQualified inquiries:\nConfirmed bookings:\nContracted revenue:\n\nTOP POST\nContent:\nWhy it performed well:\nEvidence:\n\nISSUES\nMissing assets:\nUnanswered inquiries:\nScheduling problems:\nApproval delays:\n\nNEXT WEEK\nKeep:\nChange:\nStop:\n```\n\n**[I] Do not assume that the post with the most views produced the most valuable leads.** Use attributable inquiries and bookings whenever possible.\n\n---\n\n# Final Review\n\n**Benchmark:** A sustainable, premium bridal beauty campaign that Elsa can maintain while remaining focused on clients and family.\n\n**Provisional plan score: 8.5/10 [I].**\n\n| Severity | Remaining issue | Exact fix |\n|---|---|---|\n| **High** | [Q] Relaunch media and permissions not verified | Elsa approves authentic assets |\n| **High** | [Q] Current 2027 availability unknown | No availability claims until confirmed |\n| **High** | [V] $530 listing-price conflict | Fix before package-price promotion |\n| **Medium** | [Q] Review excerpt not selected | Use an exact verified review |\n| **Medium** | [Q] Previous collaboration reuse not confirmed | Obtain approval or replace with a solo behind-the-scenes Story |\n| **Medium** | [V] Website response promise is 24–48 hours | Use same-day/24-hour language as an internal goal until Elsa confirms a public change |\n\n### Verdict: **SHIP WITH ASSET APPROVAL**\n\n**[I] This schedule meets the request for a full Monday–Sunday campaign while keeping the underlying workload light.** It features a Reel, carousel, single photographs, educational Stories, a testimonial, a personal relaunch, behind-the-scenes content, a previous collaboration, a service offer, Facebook, Google Business Profile, and TikTok—without requiring seven new feed posts.\n\nThe immediate priorities are approving the actual media, verifying the testimonial and collaboration, and keeping the inquiry process accurate."},{"id":"claude-week-posts","name":"claude-week-posts.md","content":"Below is the full week of Nov 9–15, 2026: 13 pieces covering every post type you listed. Every price, review count and award comes from the dossier, and anything that needs a real asset or Elsa's confirmation is in [BRACKETS]. Times are Central and are only starting points to test. They haven't been proven to be the best times for her account.\n\n**This week is heavier than the plan we agreed.** It has six Instagram feed posts, against the lighter schedule of two a week. If Elsa wants the lighter week, post only the ★ items now. The Tuesday, Thursday-evening and Sunday posts already match the calendar for weeks 2–3, so they can wait until then.\n\n**One correction to my earlier review.** I said \"50+ five-star reviews,\" which isn't right. Facebook shows recommendations, not stars, so the star reviews add up to 49. The WeddingWire count of 9 also came from a search snippet, not her live listing. These posts only quote Google (21) and The Knot (15), which were both checked.\n\n## The week at a glance\n\n| | Day and time | Platform(s) | Type | Goal | CTA |\n|---|---|---|---|---|---|\n| ★1 | Mon Nov 9, 7:00 pm | IG + FB | Single photo, back-from-baby post | Announce she's back and booking | Check your date |\n| ★2 | Mon Nov 9, 7:30 pm | IG Stories | Story sequence, \"Meet Elsa\" | Personal trust | Check your date |\n| 3 | Tue Nov 10, 11:30 am | IG + FB | Carousel, tips | Explain the bridal trial | Inquire |\n| ★4 | Wed Nov 11, 7:00 pm | IG Reel + FB + TikTok | Reel | Reach new brides | Inquire |\n| ★5 | Thu Nov 12, 10:00 am | Google | Google update | Local search | Learn more |\n| 6 | Thu Nov 12, 7:00 pm | IG + FB | Review spotlight | Credibility | See reviews |\n| ★7 | Fri Nov 13, 12:00 pm | Facebook only | Facebook post | Reach mothers of the bride | Message us |\n| ★8 | Fri Nov 13, 7:00 pm | IG + FB | Carousel, offer/CTA | Package inquiries | Check your date |\n| ★9 | Sat Nov 14, 10:00 am | TikTok | Native talking-to-camera tip video | Reach new people on TikTok | Link in profile |\n| ★10 | Sat Nov 14, all day | IG Stories | Behind-the-scenes Story sequence | Show the real work | See classes / inquire |\n| 11 | Sun Nov 15, 4:00 pm | IG Collab + FB | Vendor collab | Win vendor referrals | See the wedding |\n\nTwo more pieces don't need a slot of their own: the TikTok version of the Reel (part of #4) and Story reposts of each feed post on the day it goes up.\n\n---\n\n## ★1 · Mon Nov 9, 7:00 pm · Instagram + Facebook · Single photo · Back-from-baby post\n\n**Goal:** Tell people Elsa is back and taking bookings, and do it without making the baby the subject.\n\n**Text on the image:** None. Keep the photo clean.\n\n**Caption:**\n> A new chapter, and the same love for this work.\n>\n> After welcoming our little one, I'm back doing what I love most: helping brides feel confident, radiant, and completely themselves.\n>\n> Thirteen years into this career, my approach hasn't changed. Your makeup and hair should bring out your natural beauty, never hide it.\n>\n> I'm now booking 2027 weddings across Dallas–Fort Worth and beyond. If you're planning yours, I'd love to hear about it. Tap the link in my bio to check your date.\n>\n> Thank you to everyone who has supported me along the way.\n>\n> Because your Natural Beauty is Timeless.\n\n**Hashtags:** #MakeupAndHairByElsa #DFWBride #DallasBride #DallasWedding #DallasMakeupArtist #NaturalBridalMakeup #2027Bride\n\n**Visual:** [PHOTO: Elsa in natural light, either at work or with her kit. Include the baby only if Elsa chooses to.]\n**Alt text:** \"Elsa, owner of Makeup and Hair by Elsa, smiling beside her makeup kit.\"\n**CTA:** Link in bio → /contact/\n**Confirm first:** that she's booking 2027 weddings, and whether to mention the baby at all.\n\n---\n\n## ★2 · Mon Nov 9, 7:30 pm · Instagram Stories · \"Meet Elsa\" Story sequence\n\n**Goal:** Give a new visitor the basics in five taps. Save it as the \"Start Here\" highlight afterward.\n\n| Frame | Visual | On-screen text |\n|---|---|---|\n| 1 | [PHOTO: Elsa close-up] | \"Hi, I'm Elsa.\" |\n| 2 | [PHOTO: Elsa working] | \"Born in Guayaquil, Ecuador. Doing bridal hair and makeup since 2013.\" |\n| 3 | [PHOTO: a DFW bride] | \"Houston in 2017. Dallas–Fort Worth since 2018.\" |\n| 4 | [VIDEO: walking into a hotel or venue with her kit] | \"I come to you: home, hotel, or venue.\" |\n| 5 | [PHOTO: finished bridal look] + link sticker | \"Now booking 2027 weddings. Tap to check your date.\" |\n\n**Hashtags:** none needed on Stories.\n**CTA:** Link sticker → /contact/\n\n---\n\n## 3 · Tue Nov 10, 11:30 am · Instagram + Facebook · Tip carousel\n\n**Goal:** Answer a question brides ask before they inquire, and show the trial price up front.\n\n| Slide | Text |\n|---|---|\n| 1 | \"What is your bridal trial actually for?\" |\n| 2 | \"It's where we plan your wedding-day look together, before there's any pressure.\" |\n| 3 | \"Bring photos of looks you love, and looks you don't.\" |\n| 4 | \"Wear a top with a neckline close to your dress.\" |\n| 5 | \"Take photos in daylight and with flash. That's how the camera will see you.\" |\n| 6 | \"Makeup + hair trial: $475, about 3 hours. Makeup or hair only: $295. Travel extra.\" |\n| 7 | \"Your trial is included in every bridal package. Link in bio to inquire.\" |\n\n**Caption:**\n> Your trial is the most useful hour of your bridal-beauty planning. We test your look, adjust it, and make sure it photographs the way you want, so the wedding morning holds no surprises.\n>\n> A makeup and hair trial is $475 (about 3 hours), or $295 for makeup or hair only. It's included in all three bridal packages: Radiant, Timeless, and Royal.\n>\n> Save this for your planning, and tap the link in my bio to check your date.\n\n**Hashtags:** #BridalTrial #DFWBride #DallasBride #BridalMakeupTips #WeddingPlanningTips #MakeupAndHairByElsa\n**Visual:** [PHOTO: a real trial, before/after taken in the same session, client permission on file] behind slides 1 and 7. Slides 2–6 use text on ivory with a bridal detail photo.\n**CTA:** Link in bio\n**Note:** \"About 3 hours\" is the time listed on the site's Services page. Trial travel is $25 per 15 minutes, round trip.\n\n---\n\n## ★4 · Wed Nov 11, 7:00 pm · Instagram Reel + Facebook Reel + TikTok · Reel\n\n**Goal:** Reach new brides through a problem every Texas bride knows.\n\n| Time | Shot | On-screen text |\n|---|---|---|\n| 0–2 s | [VIDEO: finished French twist, slow turn] | \"Texas wedding weather?\" |\n| 2–5 s | [VIDEO: pinning and sectioning] | \"Your hair needs a plan.\" |\n| 5–8 s | [VIDEO: close-up from the side] | \"Built to stay polished through your day.\" |\n| 8–10 s | [VIDEO: bride smiling, full look] | \"Natural. Elegant. Timeless.\" |\n| 10–12 s | End card | \"Makeup and Hair by Elsa · Inquire about your date\" |\n\n**Caption:**\n> Heat, humidity, an outdoor ceremony, a long reception. Texas weddings ask a lot of your hair.\n>\n> A French twist is one of my favorite answers: elegant, secure, and still soft enough to feel like you. Brides often tell me their look held up through the Texas heat, and that's exactly what we plan for at your trial.\n>\n> Planning a 2027 wedding? Tap the link in my bio to check your date.\n\n**Hashtags:** #TexasBride #BridalHair #FrenchTwist #DFWWedding #DallasBridalHair #WeddingHairInspo #MakeupAndHairByElsa\n**TikTok version:** Use the same clip, exported clean (no Instagram text or watermark). Shorter caption: \"Texas wedding weather? Your hair needs a plan. DFW bridal hair and makeup, booking 2027.\" Hashtags: #TexasBride #BridalHair #DFWWedding #WeddingTok\n**CTA:** \"Inquire about your date\" (Instagram: link in bio; TikTok: website link in profile, [CONFIRM the TikTok profile link works])\n**Assets:** [VIDEO: real French-twist footage, permission confirmed. The June 12 clip can be re-cut.]\n**Why the careful wording:** the copy deliberately avoids promising the style will survive any weather.\n\n---\n\n## ★5 · Thu Nov 12, 10:00 am · Google Business Profile · Update post\n\n**Goal:** Show up in local searches and send people to the inquiry page.\n\n**Text:**\n> **Now booking 2027 weddings**\n>\n
