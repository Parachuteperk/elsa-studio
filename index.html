exas weather.\n- Punctuality.\n- Wedding-party scheduling.\n- Helpful preparation communication.\n- Tattoo coverage.\n\n**[I] Select authentic reviews that address these concerns.** Do not create new client statements simply because a topic would be useful for marketing.\n\n---\n\n# 10. VENDOR & VENUE COLLABORATION CAMPAIGN\n\n**Bottom line:** [I] Vendor relationships can introduce Elsa to prospective clients through professionals they already trust. The objective is to establish genuine, mutually useful relationships—not collect tags, demand free promotion, or manufacture partnerships.\n\n## 10.1 Initial Outreach Targets\n\n**[A] Four-week outreach test: 20 personalized introductions.**\n\n| Vendor type | Proposed contacts [A] | Purpose [I] |\n|---|---:|---|\n| Wedding planners | 8 | Develop relationships with professionals coordinating weddings |\n| Wedding venues | 6 | Establish awareness with venue teams |\n| Wedding photographers | 6 | Connect with professionals working with similar clients |\n| **Total** | **20 [E/A]** | |\n\n**[I] These are outreach targets, not verified available prospects.**\n\nAaron should confirm each contact's relevance before drafting an introduction.\n\n## 10.2 Collaboration Formats\n\n| Format | Description | Requirements |\n|---|---|---|\n| **Vendor introduction** | Personalized email sharing Elsa's genuine portfolio | [I] Verified professional contact; no false relationship |\n| **Shared bridal portfolio feature** | Both professionals share approved imagery from an actual wedding | [I] Permission and accurate attribution |\n| **Joint educational Reel** | Planner, photographer, or Elsa explains a genuine planning issue | [I] Both parties approve content and claims |\n| **Venue preparation guide** | Explain general getting-ready logistics relevant to a venue | [Q] Confirm venue details and permission |\n| **Vendor spotlight** | Introduce a professional Elsa genuinely knows or has researched | [I] Do not imply endorsement or partnership without agreement |\n| **Approved Instagram collaboration post** | Mutually shared content where platform capabilities allow | [Q] Verify current collaboration features and obtain acceptance |\n| **Real wedding feature** | Showcase an actual wedding with appropriate vendor credits | [I] Verify photographer rights, client permission, and vendor identities |\n\n### Recommended first collaboration\n\n**[I] Start with a real wedding photographer or planner Elsa has already worked with, if an appropriate relationship exists.**\n\nWhy:\n\n- The work is authentic.\n- Both parties may already have useful media.\n- The wedding can be discussed accurately.\n- The collaboration does not need a fabricated relationship.\n\n**[Q] Elsa must identify suitable existing collaborators.**\n\n## 10.3 Four-Week Vendor Outreach Schedule\n\n| Week [A] | Activity | Expected output |\n|---|---|---|\n| Week 1 | Identify and verify five relevant contacts | Five approved introductions |\n| Week 2 | Contact five more; review prior replies | Five new introductions and appropriate follow-ups |\n| Week 3 | Contact five more; propose suitable content collaboration | Five new introductions |\n| Week 4 | Contact five more; review relationships and referrals | Five new introductions and an outreach report |\n\n### Initial collaboration goal\n\n**[A] Proposed 90-day test:** Secure agreement for two genuine collaborative content opportunities.\n\n**[I] This is an experimental target, not a guaranteed partnership result.**\n\n### Suggested vendor introduction\n\nHi {vendor_first_name},\n\nI hope you're doing well!\n\nI'm Elsa, founder of Makeup and Hair by Elsa, a mobile bridal hair and makeup team based in Bedford and serving Dallas–Fort Worth and beyond.\n\nI came across {specific_verified_detail_about_vendor_work} and wanted to introduce myself.\n\nOur team focuses on natural, timeless bridal beauty, and we work with brides and wedding parties at homes, hotels, and wedding venues.\n\nI'd love to learn more about your work and see whether we might be a good resource for each other's clients.\n\nYou can explore our portfolio here:\n\nhttps://makeupandhairbyelsa.com/portfolio/\n\nThank you for your time!\n\nWarmly,\n\nElsa  \nMakeup and Hair by Elsa  \ninfo@makeupandhairbyelsa.com\n\n**[I] Replace the personalized detail with genuine information.** Elsa should approve the email before it is sent.\n\n---\n\n# 11. GOOGLE BUSINESS PROFILE CAMPAIGN\n\n**Bottom line:** [I] Google Business Profile should help a nearby bride quickly understand Elsa's services, see authentic work, verify her reputation, and submit an inquiry. The campaign should prioritize accuracy and customer confidence over posting volume.\n\n## 11.1 Monthly Google Content Plan\n\n| Week [A] | Topic | Supporting material | CTA |\n|---|---|---|---|\n| 1 | Meet Makeup and Hair by Elsa | Approved founder or bridal photo | Contact |\n| 2 | Bridal trials | Genuine bridal preparation photo | Learn more |\n| 3 | Wedding-party beauty | Authentic bridal-party photograph | Request quote |\n| 4 | Engagement-session beauty | Genuine engagement or bridal work | Explore packages |\n\n### Ready-to-Publish Google Post\n\nNatural Bridal Beauty, Wherever Your Day Takes You\n\nYour wedding day deserves a beauty experience that feels like you.\n\nMakeup and Hair by Elsa is a fully mobile bridal hair and makeup team based in Bedford, Texas, serving Dallas–Fort Worth and beyond.\n\nOur approach is natural, flawless, and timeless.\n\nExplore bridal packages, wedding-party services, trials, and personalized beauty options.\n\nTravel fees are additional.\n\nPlanning your wedding? Tell us about your date and request a quote.\n\nhttps://makeupandhairbyelsa.com/contact/\n\n**[I] Publish only after Elsa confirms the current service details and approves the accompanying photograph.**\n\n## 11.2 Google Profile Fixes That Support the Campaign\n\n| Priority | Action |\n|---|---|\n| Critical | [Q] Confirm the phone number and opening hours |\n| High | [Q] Check the existing Book online destination |\n| High | [I] Ensure services display correct published prices |\n| High | [I] Maintain accurate mobile service-area information |\n| High | [I] Respond to real reviews with approved replies |\n| Medium | [I] Add authentic portfolio photographs |\n| Medium | [I] Publish useful weekly posts |\n| Medium | [I] Track available calls, website clicks, and discovery metrics |\n\n**[I] Google Business Profile performance metrics and interface features should be verified in the actual account.** Do not assume every reported action or posting feature is available.\n\n---\n\n# 12. SIMPLE WEEKLY CAMPAIGN METRICS\n\n**Bottom line:** [I] Use one short weekly report. The primary question is whether the campaign generates qualified inquiries and confirmed bookings—not whether every post receives high engagement.\n\n## 12.1 Weekly Scorecard\n\n**[A] Review once per week.**\n\n| Metric | How to calculate | Initial goal |\n|---|---|---|\n| Instagram posts published | Count | 3/week [A] |\n| Facebook posts published | Count | 3/week [A] |\n| TikTok videos published | Count | 1/week [A] |\n| Google posts published | Count | 1/week [A] |\n| Instagram reach | Actual platform report | Establish baseline [I] |\n| Instagram saves and shares | Actual platform report | Identify useful content [I] |\n| Instagram profile visits | Actual platform report | Establish baseline [I] |\n| Website link clicks | Actual tracked visits/clicks | Establish baseline [I] |\n| TikTok profile visits | Actual available analytics | Establish baseline [I] |\n| Google website clicks | Available Google performance data | Establish baseline [I] |\n| Qualified campaign inquiries | Count attributable qualified leads | 6 over 90 days [A] |\n| Confirmed campaign bookings | Count signed-and-paid bookings | 2 over 90 days [A] |\n| Campaign booking conversion | Bookings ÷ qualified leads × 100 | Test 35% [A] |\n| Campaign-attributed revenue | Sum contracted booking values | Track actual [I] |\n| Review requests | Eligible clients invited ÷ eligible completed clients | 100% coverage [A] |\n| New public reviews | Count verified new reviews | Track actual [I] |\n| Vendor introductions | Count personalized approved messages | 5/week [A] |\n| Vendor replies | Count meaningful responses | Establish baseline [I] |\n\n### What not to prioritize initially\n\n**[I] Do not establish arbitrary follower-growth or viral-view targets.** Without historical reach and engagement data, such goals would be guesses.\n\nFollower count should be monitored, but bookings are more important.\n\n## 12.2 Five-Minute Weekly Dashboard\n\n**[A] Proposed reporting format:**\n\n```text\nMAKEUP AND HAIR BY ELSA\nWEEKLY CAMPAIGN REPORT\n\nWEEK: {date_range}\n\nCONTENT\nInstagram: {posts_published}\nFacebook: {posts_published}\nTikTok: {videos_published}\nGoogle: {posts_published}\n\nDISCOVERY\nInstagram reach: {actual}\nInstagram profile visits: {actual}\nInstagram link clicks: {actual}\nTikTok profile visits: {actual}\nGoogle website clicks: {actual}\n\nSALES\nQualified inquiries: {actual}\nConfirmed bookings: {actual}\nContracted wedding revenue: {actual}\nAverage booking value: {actual}\n\nREVIEWS\nEligible clients: {actual}\nReview invitations: {actual}\nNew reviews: {actual}\n\nVENDORS\nIntroductions: {actual}\nReplies: {actual}\nReferral inquiries: {actual}\n\nTOP CONTENT\n{best_content_by_inquiries_or_useful_actions}\n\nPROBLEMS\n{missing_data_or_conversion_issues}\n\nNEXT WEEK\n{specific_adjustments}\n```\n\n## 12.3 How to Decide What to Change\n\n| Result | Interpretation [I] | Next action |\n|---|---|---|\n| High reach, few profile visits | Content attracts attention but little business interest | Clarify service and location |\n| Profile visits, few website clicks | Visitors may not understand the offer or next step | Improve bio, pinned posts, and package visibility |\n| Website clicks, few inquiries | Website or form may create friction | Audit landing page and form |\n| Qualified inquiries, few bookings | Sales process or offer needs attention | Review response time, quotes, availability, and objections |\n| More bookings, low profit | Marketing may be attracting unprofitable work | Review service mix and direct costs |\n| Positive vendor replies, few referrals | Relationships are developing but not yet producing measurable bookings | Maintain genuine contact without excessive outreach |\n| More reviews but few inquiries | Social proof may need better placement | Test reviews near package and contact CTAs |\n| Strong Reel engagement, no inquiries | Video may appeal to viewers outside the target audience | Adjust content toward relevant bridal needs |\n\n---\n\n# 13. CAMPAIGN OPERATIONS & APPROVALS\n\n**Bottom line:** [I] Elsa should spend her time approving quality and business decisions. Aaron should handle preparation, coordination, tracking, and implementation.\n\n## 13.1 Weekly Production Workflow\n\n| Step | Owner | Responsibility |\n|---|---|---|\n| 1 | Elsa | Select authentic images and videos |\n| 2 | Aaron / Grok Bot | Organize content assets and topics |\n| 3 | ChatGPT | Draft captions, scripts, and creative concepts |\n| 4 | Claude | Review client-facing tone and visual quality |\n| 5 | Aaron | Assemble platform-specific posts |\n| 6 | Elsa | Approve media, claims, captions, and publication |\n| 7 | Aaron | Publish or schedule the approved content through authorized tools |\n| 8 | Grok Bot / Aaron | Record available metrics and prepare reports |\n| 9 | Elsa / Aaron | Review inquiries, bookings, and next week's priorities |\n\n**[I] No AI assistant should post, send, or publish without specific human approval.**\n\n### Media rules\n\n- [I] Use authentic bridal work.\n- [I] Confirm client permission where required.\n- [I] Credit photographers accurately when appropriate.\n- [I] Do not invent client experiences.\n- [I] Do not use AI-generated beauty transformations as evidence of Elsa's results.\n- [I] Do not claim a venue collaboration that has not occurred.\n- [I] Do not publish private client information.\n- [I] Verify prices and availability before publication.\n\n## 13.2 Sustainable Weekly Workload\n\n**[A] Proposed initial production budget: approximately 130 minutes weekly, excluding some daily Story activity, inquiry handling, and vendor outreach.**\n\n| Activity | Time [A] |\n|---|---:|\n| Select approved content | 15 minutes |\n| Draft captions and scripts | 20 minutes |\n| Prepare graphics and Reel | 45 minutes |\n| Review and approve | 15 minutes |\n| Prepare publishing | 20 minutes |\n| Review performance | 15 minutes |\n| **Total** | **130 minutes [E/A]** |\n\n**[I] This assumes reusable media and a reasonably efficient editing process.** Actual workload may be higher.\n\n### Lighter Schedule\n\nIf Elsa's working capacity is constrained:\n\n| Platform | Reduced cadence [A] |\n|---|---|\n| Instagram | 1–2 posts weekly |\n| Facebook | Adapt the same posts |\n| TikTok | One video every two weeks |\n| Google Business Profile | One post every two weeks |\n| Stories | Three active days weekly |\n| Vendor outreach | Two personalized contacts weekly |\n\n**[I] A smaller, consistent campaign is preferable to a heavy schedule followed by months of inactivity.**\n\n---\n\n# 14. CAMPAIGN BUDGET & PAID ADVERTISING\n\n**Bottom line:** [I] Begin with organic content, existing assets, Google Business Profile improvements, review requests, and vendor outreach. Paid advertising should come after the business can measure conversion and profitability.\n\n## Initial Budget Recommendation\n\n| Category | First four weeks |\n|---|---|\n| Paid Instagram advertising | $0 [A] |\n| Paid Facebook advertising | $0 [A] |\n| Paid TikTok advertising | $0 [A] |\n| Additional review incentives | $0 [I] — do not incentivize reviews |\n| Content production | [Q] Depends on existing software, labor, and media |\n| Vendor outreach | [Q] Actual labor and related costs unknown |\n| Photography | [I] Reuse approved existing portfolio assets first |\n| Software | [Q] Audit existing subscriptions before buying more |\n\n**[I] This is a recommendation to defer new paid-media spending, not a claim that the campaign is cost-free.**\n\n### Gate Before Paid Ads\n\nUse the readiness conditions from Reply 4.\n\n**[A] Proposed requirements:**\n\n- At least 30 qualified inquiries tracked.\n- Conversion rate measured.\n- Reliable response handling.\n- Available wedding capacity.\n- Verified artist and delivery costs.\n- Attribution from advertising to confirmed bookings.\n- Acceptable customer acquisition cost.\n\n**[E/A] The earlier Base model illustrated a proposed acquisition-cost ceiling of approximately $268.63 per acquired wedding.**\n\n**[I] Do not use that figure as an actual advertising budget until real contribution profit is established.**\n\n---\n\n# 15. FOUR-WEEK LAUNCH CHECKLIST\n\n**Bottom line:** [I] Do not delay the campaign to build a complicated marketing system. Confirm the essential facts and permissions, prepare the first batch, and launch with measurable actions.\n\n## Before November 9 [A]\n\n| Done | Task | Owner |\n|---|---|---|\n| ☐ | [Q] Elsa approves the back-from-baby campaign angle | Elsa |\n| ☐ | [Q] Confirm current appointment availability | Elsa |\n| ☐ | [Q] Confirm all published prices are current | Elsa |\n| ☐ | [I] Approve selected authentic portfolio footage | Elsa |\n| ☐ | [I] Prepare the first Reel | Aaron |\n| ☐ | [I] Prepare package comparison carousel | Aaron |\n| ☐ | [I] Prepare booking-process carousel | Aaron |\n| ☐ | [I] Update Instagram bio | Elsa |\n| ☐ | [I] Fix Facebook contact CTA and location after verification | Aaron |\n| ☐ | [Q] Verify Google booking destination | Aaron |\n| ☐ | [I] Create lead-source tracking | Aaron |\n| ☐ | [I] Establish the weekly report | Aaron |\n\n## At the End of Week 2\n\n| Done | Task |\n|---|---|\n| ☐ | [I] Confirm the publishing schedule is manageable |\n| ☐ | [I] Review real reach, visits, and clicks |\n| ☐ | [I] Check whether any qualified inquiries arrived |\n| ☐ | [I] Review message response times |\n| ☐ | [I] Verify review-request workflow |\n| ☐ | [I] Review vendor outreach responses |\n\n## At the End of Week 4\n\n| Done | Task |\n|---|---|\n| ☐ | [I] Confirm actual publishing output |\n| ☐ | [I] Compare campaign inquiries with the initial target |\n| ☐ | [I] Identify content associated with qualified inquiries |\n| ☐ | [I] Record confirmed bookings and contracted revenue |\n| ☐ | [I] Review Elsa's production workload |\n| ☐ | [I] Select December and January content priorities |\n| ☐ | [I] Decide whether to continue, simplify, or change the campaign |\n\n---\n\n# 16. FINAL CAMPAIGN ASSESSMENT\n\n**Benchmark:** A conversion-ready, sustainable social acquisition campaign for a premium mobile bridal beauty business.\n\n**Proposed campaign design score: 8/10 [I].**\n\nThis is an editorial assessment of the plan, not a prediction of performance.\n\n## Remaining Defects and Risks\n\n| # | Severity | Location | Problem | Exact fix |\n|---|---|---|---|---|\n| 1 | **Critical** | Revenue attribution | [Q] Existing social-to-booking performance is unknown | Track inquiries, bookings, and contracted revenue by source |\n| 2 | **High** | Availability | [Q] Elsa's current working capacity and artist availability are unknown | Verify capacity before promoting specific dates |\n| 3 | **High** | Media production | [Q] The quantity of approved, reusable video footage is unknown | Audit the portfolio and permissions before finalizing the calendar |\n| 4 | **High** | Funnel | [V] The website uses an inquiry process, not instant booking | Use inquiry language consistently |\n| 5 | **High** | Google and Facebook details | [V] Phone, hours, and location information conflict | Correct information after Elsa confirms the authoritative values |\n| 6 | **Medium** | Measurement | [Q] Private platform analytics are unavailable | Establish four-week baselines |\n| 7 | **Medium** | Vendor collaborations | [Q] Existing active relationships are not fully identified | Start with verified contacts and obtain mutual approval |\n| 8 | **Medium** | Seasonal demand | [Q] Elsa's actual December–February inquiry patterns are unknown | Treat engagement season as a test and compare results with historical data |\n| 9 | **Medium** | Workload | [Q] Elsa's preferred working hours are unknown | Use the reduced cadence if necessary |\n| 10 | **Medium** | Advertising | [Q] Actual acquisition costs and contribution margins are unknown | Keep paid campaigns paused until financial gates are met |\n\n## SHIP / NO-SHIP Decision\n\n**SHIP — the four-week organic campaign**, once Elsa approves the personal relaunch wording, media permissions, service claims, and posting schedule.\n\n**NO-SHIP — paid advertising or aggressive scaling** until actual lead conversion, artist capacity, and contribution profit are established.\n\n---\n\n# THE CAMPAIGN IN ONE PAGE\n\n| Element | Final recommendation |\n|---|---|\n| **Campaign name** | Timeless Beauty. A New Chapter. [I] |\n| **Primary goal** | Generate qualified bridal inquiries and profitable bookings [I] |\n| **Revenue model** | $100,360 annual gross revenue [E/A] |\n| **Annual wedding target** | 32 weddings [A] |\n| **Campaign contribution target** | 8 weddings annually [A] |\n| **Campaign-attributed wedding revenue target** | $23,590 [E/A] |\n| **First 90-day inquiry target** | 6 qualified inquiries [A] |\n| **First 90-day booking target** | 2 confirmed weddings [A] |\n| **Instagram** | 3 posts/week + Stories on 4 days [A] |\n| **Facebook** | 3 adapted posts/week [A] |\n| **Google Business Profile** | 1 post/week + approved portfolio photos [A] |\n| **TikTok** | 1 video/week using approved footage [A] |\n| **Content focus** | Authentic bridal beauty, education, trust, packages, founder/team [I] |\n| **Relaunch message** | A new chapter, the same natural beauty philosophy [I] |\n| **Seasonal focus** | Newly engaged couples, December–February [A] |\n| **Featured seasonal package** | Timeless, $1,365 [V] |\n| **Review strategy** | Neutral invitations to all eligible completed clients [I] |\n| **Vendor outreach** | 5 personalized introductions/week [A] |\n| **Paid media** | Defer initially [I] |\n| **Primary CTA** | Inquire About Your Date [I] |\n| **Success metric** | Confirmed bookings and attributable revenue [I] |\n\n### Final recommendation\n\n**[I] Make natural bridal beauty the star, Elsa's return the introduction, and the website inquiry process the destination.**\n\nThe campaign should tell one consistent story across all four platforms:\n\n**Your beauty should feel like you. Our team comes to you. Let's plan your wedding-day look.**\n\nThe objective is not to make Elsa an influencer. It is to turn her established bridal beauty work, genuine reputation, and team capabilities into a repeatable source of profitable bookings.\n\n**COMPLETE SOCIAL MEDIA CAMPAIGN PLAN — READY FOR ELSA'S REVIEW AND APPROVAL.**"},{"id":"claude-campaign-proof","name":"claude-campaign-proof(1).md","content":"I'll read ChatGPT's campaign plan and check it line by line against the dossier.\n\n**Verdict: FAIL as written, 6/10. It passes at about 8.5/10 once the fixes below are in.** The facts are mostly right. ChatGPT copied the prices, review counts, highlights and booking flow correctly, and every calculation adds up. The real problem is workload. The plan has Elsa posting roughly 10 times more than she has been (about 12 posts in the last 10 months), three weeks after she came back from maternity leave. It also keeps saying \"team\" when you've told me she works mostly alone.\n\n## Scores\n\n| Benchmark | Score | Why |\n|---|---|---|\n| Accuracy against the dossier | 8/10 | Few factual errors. The main issues: it misses the $530 \"starting price\" conflict, and the business-model numbers come from a document I haven't seen. |\n| Realistic for a mostly solo artist who just had a baby | 4/10 | Three feed posts a week, Stories four days a week, five vendor emails a week, and replies within 2–4 hours. Then it estimates all that at 130 minutes a week. |\n| Copy vs. Glossier's warm, plain voice | 6/10 | The relaunch caption says she's \"finding my way back,\" which tells brides she isn't fully working yet. It switches between \"I\" and \"we,\" and repeats \"chapter\" and \"beautiful.\" |\n| Strategy | 7/10 | Good guardrails: no fake discounts, no fake reviews, no paid ads yet. But it skips holiday gift season for classes, runs \"Just engaged?\" before most Christmas proposals, and ignores collaborators already named in the dossier. |\n\n## What checked out\n- All prices: packages $1,125 / $1,365 / $1,685, trial $475, wedding-day bride $700, attendants $280, Self Makeup Masterclass $250 for 4 hours.\n- Review counts, the Instagram highlight names, the contact-form fields, and the inquiry → contract → 50% deposit flow.\n- All the arithmetic: 32 × $2,948.75 = $94,360; plus $6,000 = $100,360; 8 bookings ÷ 35% rounds up to 23 inquiries; 2 out of 6 is 33.3%.\n- The calendar dates. Nov 9 is a Monday and Nov 26 is Thanksgiving.\n\n## Fixes, ranked by impact\n\n| # | Issue | Type | Where | Fix |\n|---|---|---|---|---|\n| 1 | Posting schedule is far heavier than her history (she went silent Jun 18 to Oct 17). The plan itself says a small, steady schedule beats a heavy one that stalls, then makes the heavy one the default. | Unrealistic / contradictory | 4.1, 1.3, 13.2 | Start with the lighter schedule. Step up in January only if the Week 4 review shows it's working and manageable. |\n| 2 | \"Team\" runs through everything: \"Reintroduce the team\" stage, \"talented team,\" Google post, vendor email. You say she's mostly solo. | Possibly untrue / off-brand | 2.2, 10, 11, closing line | Lead with Elsa. Mention other artists only for big bridal parties, and only once she confirms who's available for 2027 (needs her answer). |\n| 3 | The Knot and WeddingWire both show \"starting at $530.\" The plan has Stories saying \"from $1,125.\" A bride who sees both will be confused. | Missed contradiction | 8.1, 6.3 | Before any price post, confirm what $530 refers to and fix the listings. |\n| 4 | Answering inquiries within 2–4 business hours isn't realistic with a newborn, and her own site only promises 24–48 hours. | Unrealistic | 1.3 | Same business day, never more than 24 hours. That still beats what the site promises. |\n| 5 | The $175 fee to \"request Elsa personally\" makes little sense if Elsa does nearly every wedding. | Missed | 6.3, checklist | Elsa decides whether to keep it. The plan should neither promote nor hide it until then. |\n| 6 | The relaunch caption says \"finding my way back.\" Brides read that as not fully working. \"Chapter\" appears 4 times, \"beautiful\" 3 times, and \"I\" mixes with \"our.\" | Copy | 2.2 | Rewritten below. |\n| 7 | Stories counts don't match. The cadence says 4 days a week (16 a month), but weeks 2–4 of the calendar only have 3. Section 8.1 uses Mon/Tue/Thu/Sat; the calendar uses Tue/Thu/Sat/Sun. | Contradiction | 4.1, 5, 8.1 | Make it 3 days a week, Tue/Thu/Sat, everywhere. |\n| 8 | Classes are pushed only in February. Late November through December is the main gift-buying season, and the site says classes are giftable. | Missed opportunity | 6.3, 5 | Post a class-gift carousel on Cyber Monday (Nov 30). Keep the Valentine's push in February. |\n| 9 | \"Just engaged?\" goes out Dec 4, before most Christmas and New Year's proposals. | Timing (my inference about when proposals happen) | 5, 7.3 | Move it to Sat Dec 26. Run the Timeless engagement-photos Reel on Dec 4 instead. |\n| 10 | The engagement-season phase (starting December) overlaps the first campaign (ending Dec 6). | Contradiction | Header, 6 | Engagement season runs Dec 7, 2026 – Feb 28, 2027. |\n| 11 | Says \"Elsa must identify collaborators,\" but the dossier already names some: One Preston Events (open house), the bridal boutique from her Google review (fashion show), Hair & Makeup by Susy (June collab), and vendors credited on the Apr 18 post. | Missed facts | 10.2 | Start outreach with these. |\n| 12 | Doesn't use the 2024 Best of Weddings award from The Knot, or the \"trained by celebrity artists\" claim on her site. Both are verified. | Missed trust signals | 3, Week 3 | Add both to the reviews carousel. |\n| 13 | Treats the 54-vs-50 review gap as a mystery. 21+15+9+5+4 = 54; the dossier's \"about 50\" is an addition mistake. Also, the WeddingWire count of 9 came from a search snippet, not her live page. | Wrong reasoning | 9.1 | \"50+ five-star reviews\" is accurate and safe to say publicly. Fix the dossier. Recheck WeddingWire. |\n| 14 | Up to three review requests per client (Google, The Knot, WeddingWire). That's too many emails to a new couple. | Unrealistic | 9.2 | One request and one reminder (below). |\n| 15 | The vendor email and Google post say \"based in Bedford,\" but her Facebook says Colleyville. | Contradiction | 10, 11 | Say \"Dallas–Fort Worth\" until Elsa picks one city, then make every listing match. |\n| 16 | \"Google Photos\" is a different Google product. It means photos on her Google Business listing. | Clarity | 4.1 | Rename to \"Google Business photos.\" |\n| 17 | Refers to \"Reply 3\" and \"Reply 4,\" which Elsa will never see. \"Elsa / Bot drafts\" doesn't say which bot. | Clarity | 9.2, 14, 4.1 | Paste in the actual templates or drop the references. Name the tool. |\n| 18 | The $2,948.75 average wedding value, $36,201 take-home and $268.63 cost-per-booking ceiling aren't in the dossier. The arithmetic is right, but I can't check where the inputs came from. | Unverified | 1.1, 14 | Mark them \"from the business review, unverified.\" Show how $2,948.75 was built (package plus about how many attendant services). |\n| 19 | The nine-step workflow uses four AI tools for an Instagram post. That's too much for a one-person business. | Overbuilt | 13.1 | Five steps (below). |\n| 20 | Spanish content and quinceañeras aren't mentioned, though she's a Hispanic/Latina-owned business and quinceañeras are on her services page. | Missed | 3 | Ask Elsa whether she wants occasional Spanish captions or quinceañera posts (needs her answer). |\n| 21 | Phone and hours details aren't spelled out. Google shows (682) 292-8407; WeddingWire shows 832-305-1450. 832 is a Houston area code and she lived there in 2017, so it's probably an old number (my inference). Google says 8–5; her site's code says 9–5. | Missing detail | 11.2 | List both values in the fix so Elsa can pick one. |\n| 22 | The [V]/[I]/[A] evidence tags make the copy hard for Elsa to read. | Clarity | Throughout | Remove them from the version Elsa reviews. |\n\n## Corrected sections\n\n### 1.3 First 90 days (Nov 9 – Feb 6), changed rows only\n\n| What | Target |\n|---|---:|\n| Reply to inquiries | Same business day, never over 24 hours |\n| Instagram feed posts | 24 (2 a week); 33 if she steps up to 3 a week in January |\n| Facebook | Same posts, cross-posted automatically |\n| TikTok | 12 (the same Reel each week) |\n| Google Business posts | 12 |\n| Vendor introductions | About 36 (3 a week) |\n\n### 2.1 Fix the ambiguous sentence\n> On October 17, 2026, Elsa posted that she was back after having baby Apollo.\n\nThe current wording reads as if Apollo was born on October 17. Also, the baby's name and the return are inferred from her posts.\n\n### 2.2 Relaunch caption\n\n> A new chapter, and the same love for this work.\n>\n> After welcoming our little one, I'm back doing what I love most: helping brides feel confident, radiant, and completely themselves.\n>\n> My approach hasn't changed. Bridal makeup and hair should bring out your natural beauty, never hide it.\n>\n> I'm now booking 2027 weddings across Dallas–Fort Worth and beyond. If you're planning yours, I'd love to hear about it. Tap the link in my bio to check your date.\n>\n> Thank you to everyone who has supported me along the way.\n>\n> Because your Natural Beauty is Timeless.\n>\n> #MakeupAndHairByElsa #DFWBrides #DallasBridalMakeup #NaturalBridalBeauty\n\nElsa confirms three things first: that she's booking 2027, how much she wants to say about the baby, and whether to name him.\n\n### 4.1 Weekly schedule (Nov 9 – Dec 6)\n\n| Platform | How often | Extra work |\n|---|---|---|\n| Instagram feed | 2 a week: 1 Reel + 1 carousel | Main production |\n| Instagram Stories | Tue / Thu / Sat, 1–2 frames | About 5 minutes each, done by Elsa |\n| Facebook | Cross-post the Instagram posts through Meta Business Suite | None |\n| TikTok | The same Reel, saved without Instagram's on-screen text or watermark before posting | About 2 minutes |\n| Google Business | 1 post + 2 photos a week | About 10 minutes |\n| Review requests | After each finished wedding | About 5 minutes |\n| Vendor emails | 3 a week | About 15 minutes each, drafted by Aaron, sent by Elsa |\n\nGo to 3 feed posts a week in January only if the Week 4 review shows the schedule held without strain.\n\n### 5. Four-week calendar\n\n| Date | Where | Post |\n|---|---|---|\n| **Week 1: A new chapter** | | |\n| Mon Nov 9 | Reel, all platforms | Relaunch (caption above) |\n| Tue Nov 10 | Story | Meet Elsa |\n| Thu Nov 12 | Carousel + Google | Three packages ($1,125 / $1,365 / $1,685; trial included; travel $100 per artist). Last slide: Inquire → contract → 50% deposit holds your date |\n| Sat Nov 14 | Story | Real bridal portfolio |\n| **Week 2: Still you** | | |\n| Tue Nov 17 | Story poll | \"Soft glam or barely-there?\" |\n| Wed Nov 18 | Carousel + Google | The bridal trial explained: $475 for makeup and hair, 3 hours, or $295 for one |\n| Fri Nov 20 | Reel, all platforms | Texas-weather hair (remake of the June French twist) |\n| Sat Nov 21 | Story | Hair detail shot |\n| **Week 3: Trust (Thanksgiving week, schedule everything ahead)** | | |\n| Mon Nov 23 | Carousel | Real reviews + 2024 Best of Weddings (The Knot) + \"50+ >\n> Portfolio: https://makeupandhairbyelsa.com/portfolio/\n> Reviews: {The Knot link}\n>\n> Thank you,\n> Elsa\n> info@makeupandhairbyelsa.com\n\n**First contacts:** One Preston Events, the bridal boutique from the fashion-show review on Google, and the vendors credited on the Apr 18 post. Treat Hair & Makeup by Susy as an overflow partner (an artist to call when Elsa is double-booked), not a source of referrals.\n\n### 11.1 Google post\n\n> **Now booking 2027 weddings**\n>\n> Natural, long-lasting bridal hair and makeup, done wherever you're getting ready (home, hotel, or venue) across Dallas–Fort Worth.\n>\n> Bridal packages start at $1,125 and include your trial. Travel is extra.\n>\n> Tap below to check your date.\n\nPut the link in the post's button and point it to /contact/, rather than typing the address in the text. Google may reject some posts with links or phone numbers in the text; I couldn't confirm the current rules.\n\n### 13. Workflow and realistic workload\n1. **Sunday, Elsa (15 min):** pick photos and clips for the week.\n2. **Aaron:** draft and edit everything, using whichever AI tool he prefers.\n3. **Claude:** final check on copy and visuals.\n4. **Elsa (15 min):** approve the whole week at once.\n5. **Aaron:** schedule Instagram and Facebook in Meta Business Suite, then post TikTok and Google.\n\n**Estimated time (my estimate, not tested):** Elsa about 1 hour a week plus replying to inquiries. Aaron about 3.5–4 hours a week, of which about 1 hour is the Reel, 45 minutes the carousel, 45 minutes vendor research and drafts, and the rest captions, scheduling, Google and the weekly report. The original 130-minute figure left out Stories, vendor outreach and inquiries, which are where the real hours go.\n\n### Add to the pre-launch checklist\n- Confirm what the $530 starting price on The Knot and WeddingWire is, and fix it.\n- Elsa decides whether to keep the $175 fee for booking her personally.\n- Confirm which artists are available for 2027, if any.\n- Pick one city (Bedford or Colleyville), one phone number, and one set of hours, then update Google, Facebook, The Knot, WeddingWire, Zola and her website.\n\n```\nTO: ChatGPT\nGOAL: Merge these corrections into chatgpt-campaign-1.md and produce a clean version for Elsa, with no evidence tags in anything she'll read.\nCONTEXT: Claude review, 6/10 FAIL as written; fixes 1–22 above.\nFILES: chatgpt-campaign-1.md, dossier.md, this review\nDONE-WHEN: Every fix 1–22 is applied or marked \"needs Elsa\"; post counts match in sections 1.3, 4.1, 5, 8.1 and 12; corrected dossier review total is 54.\nOPEN RISKS: Team size, what the $530 price is, the Elsa fee, 2027 availability, base city — all need Elsa's answer. Business-model inputs are still unverified.\n```"},{"id":"chatgpt-automation","name":"chatgpt-automation.md","content":"# MAKEUP AND HAIR BY ELSA\n## Claude Proofread Review + Three-AI Automation Plan\n\n**Recommendation:** Accept most of Claude's corrections. The original campaign was too ambitious for Elsa's recent posting history and uncertain working capacity. However, Claude introduces a few new assumptions that should not be accepted without verification.\n\n**My assessment:**\n- **17 fixes: Accept**\n- **5 fixes: Accept with modifications or push back**\n- **Biggest correction:** Start with two Instagram posts weekly, not three.\n- **Biggest operational opportunity:** Let Grok Bot coordinate the business, ChatGPT prepare the work, and Claude quality-check important outputs.\n\n**Evidence key:** [V] Verified · [E] Calculated · [A] Assumption/estimate · [I] Recommendation/inference · [Q] Needs confirmation.\n\n---\n\n# 1. Claude's 22 Fixes — Accept or Push Back\n\n**Bottom line:** [I] Claude correctly identified workload, copy, and consistency problems. I would adopt the lighter campaign, but reject any changes that introduce unverified business facts or weaken pricing and review accuracy.\n\nClaude's findings and proposed replacements appear in the attached proofread. claude-campaign-proof\n\n| # | Claude's proposed fix | Decision | My correction or reasoning |\n|---|---|---|---|\n| **1** | Reduce posting frequency | **ACCEPT** | [I] Start with two Instagram posts weekly. Consider three in January only if production and inquiries justify it. |\n| **2** | Lead with Elsa instead of the team | **ACCEPT, MODIFY** | [V] The website describes a trained team. [Q] The claim that Elsa works mostly alone needs confirmation. Lead with Elsa; verify active artist capacity before promising team availability. |\n| **3** | Resolve the $530 directory price conflict | **ACCEPT** | [V] The Knot and WeddingWire list $530. Confirm what it represents before publishing package-price promotions. |\n| **4** | Replace 2–4-hour response target | **PUSH BACK PARTIALLY** | [I] Aim for same-business-day replies when staffed, but don't promise \"never over 24 hours.\" Keep the published 24–48-hour commitment until Elsa approves a sustainable change. |\n| **5** | Reconsider the $175 Elsa fee | **ACCEPT** | [V] It's published. [Q] Elsa must determine whether it still makes sense. Continue accurately disclosing applicable fees in quotes; pause marketing emphasis until confirmed. |\n| **6** | Rewrite the relaunch caption | **ACCEPT** | [I] Claude's copy is clearer and more confident. Remove \"booking 2027\" unless current availability is confirmed. |\n| **7** | Fix inconsistent Story counts | **ACCEPT** | [I] Tuesday, Thursday, Saturday. Three Story days weekly. Add the missing Story entries to the calendar. |\n| **8** | Promote giftable classes in November/December | **ACCEPT** | [V] Classes are giftable. Feature them on November 30, without inventing a discount. |\n| **9** | Move \"Just engaged?\" to December 26 | **ACCEPT** | [I] Good seasonal positioning. However, claims about when most proposals occur remain unverified. |\n| **10** | Separate launch from engagement-season campaign | **ACCEPT** | [A] Relaunch November 9–December 6; engagement extension December 7–February 28. Seasonal teasers may appear earlier. |\n| **11** | Use identified vendor contacts | **ACCEPT** | [V] Existing research identifies leads. [I] Verify relationships and contact information before outreach. Do not assume Susy is available for overflow. |\n| **12** | Use the award and celebrity-training claims | **ACCEPT, MODIFY** | [V] The Knot Best of Weddings 2024 is documented. Celebrity training is a claim published on Elsa's site, not independently substantiated. Confirm it before promotional use. |\n| **13** | Advertise \"50+ five-star reviews\" | **PUSH BACK** | [E] Platform counts total 54, but Facebook uses recommendations, not stars. WeddingWire's count also needs rechecking. Use platform-specific ratings instead. \"About 50\" was an approximation, not necessarily an error. |\n| **14** | Reduce review requests | **ACCEPT** | [I] One request on Day 3, one reminder on Day 10 if eligible, then stop. No incentives or selective requests. |\n| **15** | Use DFW until location conflict is resolved | **ACCEPT** | [V] The site says Bedford; Facebook says Colleyville. Use DFW in campaign copy while confirming the actual business base. |\n| **16** | Rename \"Google Photos\" | **ACCEPT** | [I] Say \"Google Business Profile photos\" to avoid confusion with Google's photo-storage product. |\n| **17** | Remove references to earlier replies | **ACCEPT** | [I] Make the campaign independently usable. Name Grok Bot explicitly rather than saying \"Bot.\" |\n| **18** | Explain revenue assumptions | **ACCEPT** | [I] Show how AOV was constructed and label take-home and acquisition-cost estimates as unverified scenarios. |\n| **19** | Simplify content production | **ACCEPT** | [I] Grok coordinates, ChatGPT drafts, Claude reviews when useful, Elsa approves, Aaron publishes. Not every post needs every AI. |\n| **20** | Consider Spanish and quinceañera content | **ACCEPT** | [V] Quinceañera services are listed. [Q] Confirm whether Elsa wants to promote them and whether Spanish-language service is available. |\n| **21** | Show exact phone and hours conflicts | **ACCEPT** | [V] Google: 682-292-8407, 8–5. WeddingWire: 832-305-1450. Website schema: 9–5. [Q] Elsa confirms the correct information. |\n| **22** | Remove evidence tags | **PUSH BACK PARTIALLY** | [I] Remove tags from finished customer-facing captions and designs. Keep them in strategy, financial assumptions, and internal decisions, as requested. |\n\n### Decision\n\n**[I] Accept Claude's revised strategy with those safeguards.**\n\nThe strongest corrections are #1, #3, #6, #7, #14, and #19.\n\n## Additional Error: Claude's 90-Day Posting Math\n\nClaude proposes 24 Instagram posts, potentially increasing to 33 after a January expansion. Those totals do not consistently match the proposed weekly schedule. claude-campaign-proof\n\n**[E] November 9, 2026–February 6, 2027 contains 90 calendar days, covering 13 Monday-start publishing weeks.**\n\n### Corrected Targets\n\n| Activity | Four-week launch | Full 90 days |\n|---|---:|---:|\n| Instagram posts, 2/week | 8 [E/A] | **26 [E/A]** |\n| Facebook adaptations | 8 [E/A] | **26 [E/A]** |\n| Instagram Stories, 3 days/week | 12 days [E/A] | **39 days [E/A]** |\n| TikTok, 1/week | 4 [E/A] | **13 [E/A]** |\n| Google Business posts, 1/week | 4 [E/A] | **13 [E/A]** |\n| Vendor introductions, 3/week | 12 [E/A] | **39 [E/A]** |\n\n**[A] If Elsa increases to three feed posts weekly beginning January 4:** Eight weeks at two posts plus five weeks at three posts equals **31 Instagram posts [E/A]**, not 33.\n\nFacebook would match the Instagram count.\n\n### Calendar Corrections\n\nClaude's four-week calendar includes only eight Story days while specifying twelve.\n\n**[I] Add these four missing Story entries:**\n\n| Date | Story |\n|---|---|\n| November 12 | Bridal package comparison |\n| November 19 | Bridal trial FAQ |\n| November 26 | Approved, preprepared bridal portfolio or gratitude Story |\n| December 5 | Engagement-session  on stylistic preference |\n\n### The Simplest Workflow\n\n```text\nGROK BOT\nDetects work that needs attention\n           │\n           ▼\nCHATGPT\nDrafts the response, content, or analysis\n           │\n           ▼\nCLAUDE\nReviews important or batch-produced work\n           │\n           ▼\nGROK BOT\nCreates an approval task\n           │\n           ▼\nELSA / AARON\nApproves the specific action\n           │\n           ▼\nAUTHORIZED EXECUTION\n           │\n           ▼\nGROK BOT\nRecords the outcome and next action\n```\n\n**[I] Claude should not review every routine email.** That would recreate the overcomplicated workflow Claude criticized.\n\nUse Claude for new templates, weekly content batches, important communications, and exceptions.\n\nRoutine messages should use previously approved templates.\n\n### What Is Actually Available?\n\nAccording to your description, Grok Bot can run scheduled routines, monitor inboxes, prepare drafts, and operate ChatGPT and Claude through a browser.\n\n**[Q] The actual permissions and reliability of the following connections still need verification:**\n\n| System | Needed for | Verification |\n|---|---|---|\n| Elsa's business email | Read inquiries, prepare replies, track correspondence | [Q] Account access and permitted actions |\n| WPForms | Capture website inquiries | [Q] Notification or form-data access |\n| Booking calendar | Check wedding availability | [Q] Authoritative calendar and access |\n| Contracts and invoices | Confirm booking and payment status | [Q] Software and integration |\n| Instagram/Facebook | Prepare content, inspect DMs, queue publishing | [Q] Account permissions and workflow |\n| Google Business Profile | Draft posts, inspect reviews, collect available performance data | [Q] Business account permissions |\n| TikTok | Publish approved video and collect metrics | [Q] Account access and available features |\n| Business spreadsheet | Track leads, bookings, expenses, and content | [Q] Read/write permissions |\n\nGoogle supports Business Profile updates, offers, and event posts, subject to its posting policies. However, that does not establish that Grok Bot can publish to Elsa's profile. [Google Help](https://support.google.com/business/answer/7342169?hl=en-en\\&utm_source=chatgpt.com)\n\n**[I] Browser automation should be treated as an assisted workflow until each action has been tested.** Website interfaces can change, sessions can expire, and permissions can fail.\n\n---\n\n# 3. Social Media Campaign Automation\n\n**Bottom line:** [I] The biggest time savings will come from preparing one strong content asset and adapting it across Instagram, Facebook, Google, and TikTok. Grok should coordinate that workflow, not create four separate marketing departments.\n\n**[A] Time estimates below assume two Instagram feed posts weekly, including one Reel, three Story days, one Google update, and three vendor introductions.** Estimates are potential manual-work savings in an active week, not measured results.\n\n| Process | Which AI does what | Trigger and cadence | What a human must approve | Time saved per week (labelled estimate) |\n|---|---|---|---|---|\n| **Weekly content ideas** | Grok checks the calendar and approved content history. ChatGPT proposes relevant topics. Claude reviews only unusual or high-visibility ideas. | Sunday; weekly | Elsa selects topics and approves business claims | **15–25 min [A]** |\n| **Instagram captions** | Grok supplies approved facts and media descriptions. ChatGPT writes captions. Claude reviews the weekly batch. | Two posts/week | Elsa approves final captions and media | **15–30 min [A]** |\n| **Reel scripts** | ChatGPT creates hooks, shot lists, and text. Claude checks pacing and visual clarity. Grok tracks production. | One Reel/week | Elsa approves authentic footage and final edit | **15–25 min [A]** |\n| **Carousel creation** | ChatGPT drafts slides. Claude checks language and layout. Grok organizes approved assets. | One carou
